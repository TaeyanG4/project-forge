/* ============================================================
   TAG — 작은 브랜드의 온라인 스토어
   커머스 데모. 앞단(고객)과 뒷단(판매자)을 한 파일에 넣고,
   위쪽 전환기로 오가며 같은 주문을 양쪽에서 본다.

   이 데모가 하고 싶은 말은 하나다.
   주문 상태는 '주문' 이 아니라 '주문 품목' 에 붙는다.
   세 개를 시키면 하나는 취소되고 하나는 배송되고 하나는 반품될 수 있다.
   그래서 목록도, 환불 계산도, 정산도 전부 품목 단위로 돈다.

   앞단은 밝고 성글게, 뒷단은 좁고 각지게 —
   같은 파일 안에서 두 벌의 결을 쓴다.
   ============================================================ */
:root{
  /* 앞단 — 가게 */
  --bg:#FCFBF9;
  --paper:#FFFFFF;
  --tint:#F4F1EB;
  --shot:#EDEAE3;
  --line:#E7E3DB;
  --line-2:#D6D0C4;
  --ink:#16150F;
  --ink-2:#6C6760;
  --ink-3:#9A948B;
  --brand:#16150F;
  --clay:#B4482A;      --clay-soft:#FAEEE9;
  --leaf:#2E7050;      --leaf-soft:#E7F1EB;
  --gold:#9A7B22;      --gold-soft:#FAF3DF;

  /* 뒷단 — 작업대 */
  --sbg:#F1F2F4;
  --spanel:#FFFFFF;
  --sline:#DDE0E5;
  --sline-2:#C3C8D0;
  --sink:#151A21;
  --sink-2:#5A626E;
  --sink-3:#8A929E;
  --steel:#26313F;
  --steel-2:#33455A;
  --steel-soft:#E7ECF2;

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --maxw:1180px;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:15px;line-height:1.65;letter-spacing:-.014em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.032em;line-height:1.3;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px;}
img,svg{display:block;max-width:100%;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.035em;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

/* ============================================================
   맨 위 — 어느 쪽에서 볼지
   ============================================================ */
.side{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:7px 16px;background:#0F1116;color:#E9EBEF;font-size:12.5px;font-weight:600;
}
.side__t{display:flex;align-items:center;gap:7px;color:#9AA1AE;}
.side__t b{color:#E9EBEF;}
.side__sp{flex:1;}
.seg{display:flex;gap:2px;padding:2px;border-radius:100px;background:rgba(255,255,255,.08);}
.seg button{
  height:26px;padding:0 13px;border:0;border-radius:100px;background:transparent;cursor:pointer;
  color:#9AA1AE;font-size:12.5px;font-weight:700;letter-spacing:-.014em;display:flex;align-items:center;gap:6px;
}
.seg button[aria-pressed="true"]{background:#E9EBEF;color:#0F1116;}
.seg em{
  font-style:normal;font-size:10.5px;font-weight:800;line-height:1;padding:2px 6px;border-radius:100px;
  background:#E0533A;color:#fff;
}
.side a{color:#9AA1AE;text-decoration:underline;text-underline-offset:2px;}
.side a:hover{color:#E9EBEF;}
@media (max-width:720px){.side__t span{display:none;}}

/* ============================================================
   가게 — 머리
   ============================================================ */
.hd{position:sticky;top:40px;z-index:50;background:rgba(252,251,249,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.hd__in{display:flex;align-items:center;gap:18px;height:64px;}
.logo{font-size:22px;font-weight:800;letter-spacing:-.07em;cursor:pointer;background:none;border:0;padding:0;}
.logo span{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);display:block;margin-top:-4px;}
.menu{display:flex;gap:3px;flex:1;}
.menu button{
  border:0;background:none;cursor:pointer;padding:8px 12px;border-radius:100px;
  font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-.018em;
}
.menu button:hover{background:var(--tint);color:var(--ink);}
.menu button[aria-current="true"]{background:var(--ink);color:#fff;}
@media (max-width:800px){
  .hd__in{gap:9px;}
  .logo{font-size:19px;}
  .menu{overflow-x:auto;flex-wrap:nowrap;}
  .menu::-webkit-scrollbar{height:0;}
  .menu button{padding:8px 9px;font-size:13px;white-space:nowrap;}
}
.ico{
  position:relative;width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);
}
.ico:hover{background:var(--tint);}
.ico b{
  position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:100px;
  background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;line-height:1;
}

/* ============================================================
   가게 — 공통 조각
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:44px;padding:0 20px;border-radius:2px;cursor:pointer;white-space:nowrap;
  font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  transition:background .14s,color .14s,border-color .14s,opacity .14s;
}
.btn:hover{background:#000;}
.btn--o{background:transparent;color:var(--ink);}
.btn--o:hover{background:var(--tint);}
.btn--q{background:transparent;border-color:var(--line-2);color:var(--ink-2);}
.btn--q:hover{background:var(--tint);color:var(--ink);}
.btn--red{background:var(--clay);border-color:var(--clay);}
.btn--red:hover{background:#9E3D23;border-color:#9E3D23;}
.btn--sm{height:34px;padding:0 13px;font-size:13.5px;}
.btn--lg{height:52px;padding:0 26px;font-size:16px;}
.btn--full{width:100%;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.tag{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;
  font-size:11.5px;font-weight:700;letter-spacing:-.008em;white-space:nowrap;
  background:var(--tint);color:var(--ink-2);
}
.tag--clay{background:var(--clay-soft);color:var(--clay);}
.tag--leaf{background:var(--leaf-soft);color:var(--leaf);}
.tag--gold{background:var(--gold-soft);color:var(--gold);}
.tag--ink{background:var(--ink);color:#fff;}
.tag--out{background:#EEE;color:#9A948B;}

.fld{display:flex;flex-direction:column;gap:6px;}
.fld label{font-size:13px;font-weight:700;color:var(--ink-2);}
.fld input,.fld select,.fld textarea{
  height:44px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  font-size:15px;width:100%;
}
.fld textarea{height:auto;padding:11px 13px;min-height:76px;resize:vertical;line-height:1.6;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ink);}
.fld small{font-size:12.5px;color:var(--ink-3);}
.fld--e input{border-color:var(--clay);}

.card{background:var(--paper);border:1px solid var(--line);}
.sec{padding:44px 0 20px;}
.sec h2{font-size:26px;font-weight:800;letter-spacing:-.045em;}
.sec p{color:var(--ink-2);font-size:14.5px;margin-top:6px;}

/* ============================================================
   가게 — 첫 화면 · 목록
   ============================================================ */
.hero{
  display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;
  padding:46px 0 40px;border-bottom:1px solid var(--line);
}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:22px;padding:30px 0;}}
.hero h1{font-size:44px;font-weight:850;letter-spacing:-.055em;line-height:1.14;}
@media (max-width:820px){.hero h1{font-size:32px;}}
.hero p{margin-top:14px;color:var(--ink-2);font-size:16px;line-height:1.8;max-width:38ch;font-weight:350;}
.hero__k{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.hero__a{
  aspect-ratio:4/3;background:var(--shot);position:relative;overflow:hidden;
}
.hero__a img{width:100%;height:100%;object-fit:cover;}
.hero__a::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(400px 300px at 70% 20%,rgba(180,72,42,.10),transparent 62%);
}

.cats{display:flex;gap:7px;flex-wrap:wrap;padding:26px 0 18px;}
.cats button{
  height:34px;padding:0 15px;border:1px solid var(--line-2);border-radius:100px;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
}
.cats button:hover{border-color:var(--ink);color:var(--ink);}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 20px;padding-bottom:50px;}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 14px;}}
.pc{cursor:pointer;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:11px;}
.pc__a{aspect-ratio:4/5;background:var(--shot);position:relative;overflow:hidden;display:block;}
.pc__a img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.pc:hover .pc__a img{transform:scale(1.045);}
.pc__b{position:absolute;left:9px;top:9px;display:flex;gap:5px;}
.pc__o{position:absolute;inset:0;background:rgba(22,21,15,.52);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;letter-spacing:.06em;}
.pc__n{font-size:14.5px;font-weight:600;letter-spacing:-.022em;line-height:1.45;}
.pc__p{display:flex;align-items:baseline;gap:7px;}
.pc__p b{font-size:15.5px;font-weight:800;letter-spacing:-.035em;}
.pc__p s{font-size:12.5px;color:var(--ink-3);}
.pc__s{font-size:12px;color:var(--ink-3);}
.swat{display:flex;gap:4px;}
.swat i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}


/* ============================================================
   윗줄 유틸 · 로그인
   ============================================================ */
.util{border-bottom:1px solid var(--line);background:var(--paper);}
.util__in{display:flex;align-items:center;justify-content:flex-end;gap:2px;height:36px;}
.util__in button,.util__in a{
  border:0;background:none;cursor:pointer;padding:0 11px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);letter-spacing:-.018em;position:relative;
}
.util__in button:hover{color:var(--ink);}
.util__in .me{color:var(--ink);font-weight:700;}
.util__in em{
  position:absolute;top:-3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:100px;
  background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;
  display:grid;place-items:center;line-height:1;
}
.util__in .sep{width:1px;height:11px;background:var(--line-2);margin:0 4px;padding:0;}

.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--ink-3);}
.crumb{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13px;}
.crumb span{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:600;}
.crumb span b{font-size:11.5px;font-weight:800;letter-spacing:.02em;}
.crumb span[data-on="true"]{color:var(--ink);font-weight:700;}
.crumb i{font-style:normal;color:var(--line-2);}

.sect{border:1px solid var(--line);background:var(--paper);padding:26px 28px;margin-bottom:16px;}
@media (max-width:640px){.sect{padding:20px 16px;}}
.sect__h{display:flex;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:18px;}
.sect__h b{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.02em;}
.sect__h h3{font-size:19px;font-weight:800;letter-spacing:-.04em;}
.sect__h span{font-size:13px;color:var(--ink-3);font-weight:500;}
.sect__h .sp{flex:1;}

/* 주문상품 표 */
.otw{overflow-x:auto;}
.otw::-webkit-scrollbar{height:8px;}
.otbl{width:100%;min-width:660px;border-collapse:collapse;}
.otbl th{
  font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0 12px 13px;border-bottom:1px solid var(--line);
  text-align:center;white-space:nowrap;
}
.otbl th:first-child{text-align:left;}
.otbl td{padding:20px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;font-size:14px;}
.otbl td:first-child{text-align:left;}
.ot__p{display:flex;gap:16px;align-items:flex-start;}
.ot__a{width:76px;height:95px;flex:none;background:var(--shot);overflow:hidden;}
.ot__a img{width:100%;height:100%;object-fit:cover;}
.ot__b{min-width:0;padding-top:2px;}
.ot__br{font-size:12px;font-weight:700;color:var(--ink-3);}
.ot__n{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.024em;margin:3px 0 7px;line-height:1.45;}
.ot__o{font-size:12.5px;color:var(--ink-3);line-height:1.6;}
.ot__was{color:var(--ink-3);text-decoration:line-through;font-size:13px;}
.ot__dc{color:var(--clay);font-weight:700;}
.ot__pay{font-weight:800;font-size:15px;letter-spacing:-.03em;}
.ot__f{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  background:var(--tint);padding:16px 20px;font-size:14px;
}
.ot__f b{font-size:18px;font-weight:850;letter-spacing:-.04em;}
.ot__note{font-size:12px;color:var(--ink-3);line-height:1.7;text-align:right;margin-top:12px;}

/* 폼 */
.frow{display:flex;align-items:flex-start;gap:16px;padding:11px 0;}
.frow > label{flex:none;width:104px;font-size:13.5px;font-weight:700;color:var(--ink-2);padding-top:12px;}
.frow > div{flex:1;min-width:0;}
@media (max-width:640px){
  .frow{flex-direction:column;gap:6px;}
  .frow > label{width:auto;padding-top:0;}
}
.finp{
  height:44px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  font-size:14.5px;width:100%;
}
.finp:focus{outline:none;border-color:var(--ink);}
.finp[data-e="true"]{border-color:var(--clay);}
.fphone{display:flex;align-items:center;gap:7px;max-width:340px;}
.fphone select{width:96px;flex:none;}
.fphone i{font-style:normal;color:var(--ink-3);}
.fhint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.6;}
.ferr{font-size:12.5px;color:var(--clay);font-weight:600;margin-top:6px;}
.fchk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);}
.fchk input{width:16px;height:16px;accent-color:var(--ink);}

/* 오른쪽 합계 */
.sum2{background:var(--paper);border:1px solid var(--line);padding:24px;position:sticky;top:120px;}
@media (max-width:940px){.sum2{position:static;}}
.sum2 h3{font-size:16px;font-weight:800;letter-spacing:-.035em;padding-bottom:16px;border-bottom:1px solid var(--ink);}
.sum2__r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px;color:var(--ink-2);}
.sum2__r b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.sum2__r.dc b{color:var(--clay);}
.sum2__t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:18px;margin-top:8px;border-top:1px solid var(--line);}
.sum2__t span{font-size:15px;font-weight:800;}
.sum2__t b{font-size:30px;font-weight:850;letter-spacing:-.05em;font-variant-numeric:tabular-nums;}
.sum2__t b em{font-style:normal;font-size:16px;font-weight:700;margin-left:2px;}

/* ============================================================
   로그인 · 비회원 조회
   ============================================================ */
.auth{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;
  width:min(408px,calc(100vw - 28px));max-height:92vh;overflow-y:auto;
  background:#fff;border-radius:4px;box-shadow:0 30px 70px -18px rgba(0,0,0,.5);padding:34px 30px 28px;
}
.auth__lg{text-align:center;font-size:25px;font-weight:850;letter-spacing:-.06em;margin-bottom:22px;}
.auth__lg em{font-style:normal;color:var(--ink-3);font-weight:700;}
.auth__tb{display:flex;gap:0;background:var(--tint);border-radius:100px;padding:4px;margin-bottom:24px;}
.auth__tb button{
  flex:1;height:38px;border:0;border-radius:100px;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink-3);letter-spacing:-.02em;
}
.auth__tb button[aria-selected="true"]{background:var(--ink);color:#fff;}
.auth__f{display:flex;flex-direction:column;gap:2px;}
.auth__i{position:relative;}
.auth__i input{
  width:100%;height:52px;border:0;border-bottom:1px solid var(--line-2);background:none;
  font-size:15px;padding:0 30px 0 2px;
}
.auth__i input:focus{outline:none;border-bottom-color:var(--ink);}
.auth__i input::placeholder{color:var(--ink-3);}
.auth__i button{
  position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;
  color:var(--ink-3);padding:6px;
}
.auth__save{display:flex;align-items:center;gap:9px;margin:18px 0 6px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
.auth__save i{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;
  display:grid;place-items:center;
}
.auth__save i::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent;}
.auth__save[data-on="true"] i{border-color:var(--ink);}
.auth__save[data-on="true"] i::after{background:var(--ink);}
.auth__go{
  width:100%;height:52px;border:0;border-radius:2px;background:var(--tint);color:var(--ink);cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:-.02em;margin-top:12px;
}
.auth__go:hover{background:#EBE7DF;}
.auth__go--k{background:#FEE500;color:#191600;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:9px;}
.auth__go--k:hover{background:#F5DC00;}
.auth__go--d{background:var(--ink);color:#fff;}
.auth__go--d:hover{background:#000;}
.auth__links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;}
.auth__links button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;padding:0;}
.auth__links button:last-child{color:var(--ink);font-weight:700;}
.auth__or{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:var(--ink-3);font-size:12.5px;}
.auth__or::before,.auth__or::after{content:"";flex:1;height:1px;background:var(--line);}
.auth__soc{display:flex;justify-content:center;gap:14px;}
.auth__soc button{
  width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  font-size:17px;font-weight:800;color:#fff;
}
.auth__x{position:absolute;right:12px;top:12px;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:6px;}
.auth__note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
.auth__note b{color:var(--ink-2);}

/* ============================================================
   가게 — 상품 상세
   ============================================================ */
.pd{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:44px;padding:30px 0 60px;align-items:start;}
@media (max-width:940px){.pd{grid-template-columns:1fr;gap:26px;}}
.pd__a{background:var(--shot);aspect-ratio:4/5;overflow:hidden;position:sticky;top:120px;}
@media (max-width:940px){.pd__a{position:static;aspect-ratio:4/5;max-height:64vh;}}
.pd__a img{width:100%;height:100%;object-fit:cover;}
.pd h1{font-size:29px;font-weight:800;letter-spacing:-.045em;}
.pd__c{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;}
.pd__p{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px;}
.pd__p b{font-size:27px;font-weight:850;letter-spacing:-.045em;}
.pd__p s{font-size:16px;color:var(--ink-3);}
.pd__p em{font-style:normal;font-size:16px;font-weight:800;color:var(--clay);}
.pd__d{color:var(--ink-2);font-size:14.5px;line-height:1.85;font-weight:350;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:18px;}

.opt{padding:18px 0;border-top:1px solid var(--line);}
.opt__l{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.opt__l span{font-weight:500;color:var(--ink-3);font-size:12.5px;}
.opt__v{display:flex;gap:7px;flex-wrap:wrap;}
.opt__v button{
  min-width:46px;height:40px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  cursor:pointer;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.opt__v button:hover{border-color:var(--ink);}
.opt__v button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700;}
.opt__v button[data-out="true"]{color:var(--ink-3);border-style:dashed;text-decoration:line-through;cursor:not-allowed;}
.opt__v button[data-out="true"]:hover{border-color:var(--line-2);}
.opt__v i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:2px;height:40px;}
.qty button{width:38px;height:100%;border:0;background:none;cursor:pointer;font-size:17px;color:var(--ink-2);}
.qty button:hover{background:var(--tint);color:var(--ink);}
.qty button[disabled]{opacity:.3;cursor:not-allowed;}
.qty span{min-width:44px;text-align:center;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;}

.pick{background:var(--tint);padding:13px 14px;display:flex;align-items:flex-start;gap:12px;margin-top:10px;}
.pick__t{flex:1;min-width:0;}
.pick__t b{display:block;font-size:13.5px;font-weight:700;}
.pick__t span{display:block;font-size:12.5px;color:var(--ink-3);}
.pick__x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1;padding:2px 4px;}
.sum{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0;border-top:1px solid var(--ink);margin-top:16px;}
.sum span{font-size:13.5px;font-weight:700;color:var(--ink-2);}
.sum b{font-size:24px;font-weight:850;letter-spacing:-.045em;}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info{font-size:12.5px;color:var(--ink-3);line-height:1.85;padding-top:18px;border-top:1px solid var(--line);margin-top:20px;}
.info b{color:var(--ink-2);}

/* ============================================================
   가게 — 장바구니 · 주문서
   ============================================================ */
.two{display:grid;grid-template-columns:1fr 356px;gap:30px;align-items:start;padding-bottom:70px;}
@media (max-width:940px){.two{grid-template-columns:1fr;}}
.rows{border-top:1px solid var(--ink);}
.row{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.row__a{width:80px;height:100px;flex:none;background:var(--shot);overflow:hidden;}
.row__a img{width:100%;height:100%;object-fit:cover;}
.row__b{flex:1;min-width:0;}
.row__b b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.022em;}
.row__b span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.row__c{display:flex;align-items:center;gap:14px;margin-top:11px;flex-wrap:wrap;}
.row__p{text-align:right;flex:none;}
.row__p b{font-size:15px;font-weight:800;letter-spacing:-.035em;}
.row__x{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px;}
.row__x:hover{color:var(--ink);}
.warn{font-size:12.5px;color:var(--clay);font-weight:600;margin-top:7px;}

.pane{background:var(--paper);border:1px solid var(--line);padding:20px;position:sticky;top:120px;}
@media (max-width:940px){.pane{position:static;}}
.pane h3{font-size:16px;font-weight:800;letter-spacing:-.035em;padding-bottom:14px;border-bottom:1px solid var(--line);}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;color:var(--ink-2);}
.li b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.li--d b{color:var(--clay);}
.li--t{border-top:1px solid var(--ink);margin-top:10px;padding-top:14px;font-size:15px;}
.li--t span{font-weight:700;color:var(--ink);}
.li--t b{font-size:21px;font-weight:850;letter-spacing:-.045em;}
.li small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;}
.bar{height:5px;background:var(--tint);margin:4px 0 8px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s ease;}

.cpn{display:flex;gap:7px;padding:14px 0;border-top:1px solid var(--line);margin-top:10px;}
.cpn input{flex:1;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;font-size:13.5px;}
.cpn input:focus{outline:none;border-color:var(--ink);}

.steps{display:flex;align-items:center;gap:9px;padding:22px 0 4px;}
.steps div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-3);}
.steps i{
  width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;
  font-size:12px;background:var(--tint);color:var(--ink-3);
}
.steps div[data-on="true"]{color:var(--ink);}
.steps div[data-on="true"] i{background:var(--ink);color:#fff;}
.steps u{width:26px;height:1px;background:var(--line-2);text-decoration:none;}

.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (max-width:560px){.pays{grid-template-columns:1fr;}}
.pays button{
  border:1px solid var(--line-2);border-radius:2px;background:var(--paper);cursor:pointer;padding:13px 12px;text-align:left;
}
.pays button:hover{border-color:var(--ink);}
.pays button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.pays b{display:block;font-size:14px;font-weight:700;}
.pays span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;}

/* ============================================================
   가게 — 주문 내역
   ============================================================ */
.ord{border:1px solid var(--line);background:var(--paper);margin-bottom:14px;}
.ord__h{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--tint);flex-wrap:wrap;}
.ord__h b{font-size:14px;font-weight:800;letter-spacing:-.02em;}
.ord__h span{font-size:12.5px;color:var(--ink-3);}
.ord__h .sp{flex:1;}
.ord__i{display:flex;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:flex-start;}
.ord__i:last-child{border-bottom:0;}
.ord__i .a{width:58px;height:72px;flex:none;background:var(--shot);overflow:hidden;}
.ord__i .a img{width:100%;height:100%;object-fit:cover;}
.ord__i .b{flex:1;min-width:0;}
.ord__i .b b{display:block;font-size:14px;font-weight:600;}
.ord__i .b span{display:block;font-size:12.5px;color:var(--ink-3);}
.ord__i .c{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}

.flow{display:flex;align-items:center;gap:0;padding:4px 0 2px;flex-wrap:wrap;}
.flow div{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-3);}
.flow i{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none;}
.flow u{width:20px;height:1.5px;background:var(--line);margin:0 7px;text-decoration:none;}
.flow div[data-on="true"]{color:var(--ink);}
.flow div[data-on="true"] i{background:var(--leaf);}
.flow div[data-now="true"] i{background:var(--ink);box-shadow:0 0 0 3px rgba(22,21,15,.14);}
.flow div[data-x="true"]{color:var(--clay);}
.flow div[data-x="true"] i{background:var(--clay);}

.trk{border-top:1px solid var(--line);padding:13px 16px;background:#FDFCFA;font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;}
.trk b{color:var(--ink);font-weight:700;}

/* ============================================================
   뒷단 — 작업대
   ============================================================ */
.s{background:var(--sbg);color:var(--sink);min-height:100vh;font-size:13.5px;letter-spacing:-.012em;}
.s .wrap{max-width:1240px;}
.s__top{
  position:sticky;top:40px;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;
  background:var(--steel);color:#E7ECF2;
}
.s__mk{display:flex;align-items:center;gap:9px;}
.s__mk i{width:22px;height:22px;background:#E7ECF2;color:var(--steel);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;}
.s__mk b{font-size:14.5px;font-weight:800;letter-spacing:-.03em;}
.s__mk span{font-size:12px;color:#93A0B1;padding-left:10px;border-left:1px solid #3D4E63;}
.s__sp{flex:1;}
.s__u{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B7C1CE;}
.s__u i{width:24px;height:24px;border-radius:50%;background:#3D4E63;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#E7ECF2;}
.s__nav{
  position:sticky;top:92px;z-index:49;display:flex;gap:0;padding:0 20px;overflow-x:auto;
  background:var(--spanel);border-bottom:1px solid var(--sline);
}
.s__nav::-webkit-scrollbar{height:0;}
.s__nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:12px 14px;white-space:nowrap;
  font-size:13px;font-weight:600;color:var(--sink-2);display:flex;align-items:center;gap:7px;
}
.s__nav button:hover{color:var(--sink);}
.s__nav button[aria-current="true"]{color:var(--steel);font-weight:800;}
.s__nav button[aria-current="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--steel);}
.s__nav em{font-style:normal;font-size:10.5px;font-weight:800;background:#E0533A;color:#fff;border-radius:100px;padding:2px 6px;line-height:1;}
.s__b{padding:20px 20px 70px;}
.s__hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.s__hd h1{font-size:19px;font-weight:800;letter-spacing:-.036em;}
.s__hd p{font-size:12.5px;color:var(--sink-3);}
.s__hd .sp{flex:1;}

.sbtn{

.st{

.st--ship{background:#E2EFF0;color:#0F6B70;}

.st--creq,.st--rreq{background:#FBEDE1;color:#9A5312;}

.tbwrap{overflow-x:auto;border:0;}
.tbwrap::-webkit-scrollbar{height:9px;}
.tb{width:100%;min-width:900px;border-collapse:collapse;font-size:12.5px;background:var(--spanel);}

.ck{

  display:grid;place-items:center;color:transparent;padding:0;
}
.ck[data-on="true"]{background:var(--steel);border-color:var(--steel);color:#fff;}

.sbulk{
  position:sticky;bottom:14px;z-index:20;margin-top:12px;display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:4px;background:var(--sink);color:#fff;box-shadow:0 14px 34px -12px rgba(0,0,0,.6);flex-wrap:wrap;
}

.sbulk .sp{flex:1;}
.sbulk .sinp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);color:#fff;}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:820px){.kpi{grid-template-columns:repeat(2,1fr);}}
.kpi div{background:var(--spanel);border:1px solid var(--sline);border-radius:4px;padding:12px 14px;}
.kpi span{display:block;font-size:11.5px;color:var(--sink-3);font-weight:600;}
.kpi b{display:block;font-size:21px;font-weight:800;letter-spacing:-.042em;margin-top:2px;}
.kpi em{font-style:normal;font-size:11.5px;color:var(--sink-3);}
.kpi div[data-t="warn"] b{color:#9A5312;}
.kpi div[data-t="bad"] b{color:#B03A2E;}
.kpi div[data-t="ok"] b{color:#1E7A4C;}

.snote{
  display:flex;gap:9px;padding:11px 13px;border-radius:4px;background:var(--steel-soft);
  border:1px solid #CFDAE7;font-size:12.5px;color:var(--sink-2);line-height:1.65;margin-top:14px;
}
.snote svg{flex:none;margin-top:2px;color:var(--steel-2);}

.spanel{background:var(--spanel);border:1px solid var(--sline);border-radius:4px;}
.spanel__h{padding:11px 14px;border-bottom:1px solid var(--sline);font-size:13px;font-weight:800;display:flex;align-items:center;gap:9px;}
.spanel__h .sp{flex:1;}
.spanel__b{padding:14px;}

.chart{display:flex;align-items:flex-end;gap:9px;height:132px;padding:0 2px;}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.chart i{width:100%;background:var(--steel-2);border-radius:2px 2px 0 0;min-height:2px;}
.chart span{font-size:10.5px;color:var(--sink-3);font-weight:600;}

/* 재고 */
.sku{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;}
.sku div{display:flex;align-items:center;gap:9px;border:1px solid var(--sline);border-radius:3px;padding:7px 10px;background:var(--spanel);}
.sku b{flex:1;font-size:12.5px;font-weight:600;}
.sku .sinp{width:62px;text-align:right;}
.sku[data-low] {}
.sku div[data-z="true"]{border-color:#E3B3AD;background:#FDF6F5;}
.sku div[data-l="true"]{border-color:#EDD9AE;background:#FDFAF2;}

/* ============================================================
   덮개 · 알림
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(22,21,15,.5);border:0;width:100%;}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;
  width:min(500px,calc(100vw - 28px));max-height:88vh;overflow-y:auto;
  background:var(--paper);border-radius:3px;box-shadow:0 30px 70px -18px rgba(0,0,0,.5);padding:24px;
}
.modal h3{font-size:19px;font-weight:800;letter-spacing:-.04em;}
.modal p{font-size:14px;color:var(--ink-2);margin-top:9px;line-height:1.75;}
.modal__f{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap;}
.modal__l{margin-top:16px;border:1px solid var(--line);}
.modal__l div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.modal__l div:last-child{border-bottom:0;}
.modal__l .sp{flex:1;}
.calc{border:1px solid var(--line);background:var(--tint);padding:13px 14px;margin-top:16px;}
.calc div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2);padding:3px 0;}
.calc div b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.calc div.t{border-top:1px solid var(--line-2);margin-top:7px;padding-top:9px;font-size:14.5px;}
.calc div.t b{font-size:17px;font-weight:850;}
.calc small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6;}

/* 결제 창 */
.pg{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;
  width:min(400px,calc(100vw - 28px));background:#fff;border-radius:6px;overflow:hidden;
  box-shadow:0 30px 70px -18px rgba(0,0,0,.55);
}
.pg__h{background:#1B4FA0;color:#fff;padding:13px 16px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;}
.pg__h .sp{flex:1;}
.pg__b{padding:20px 18px;display:flex;flex-direction:column;gap:13px;}
.pg__r{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);}
.pg__r b{color:var(--ink);font-weight:700;}
.pg__amt{text-align:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.pg__amt span{display:block;font-size:12px;color:var(--ink-3);}
.pg__amt b{font-size:27px;font-weight:850;letter-spacing:-.045em;}
.pg__k{display:flex;flex-direction:column;gap:7px;}
.pg__n{font-size:11.5px;color:var(--ink-3);line-height:1.65;text-align:center;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:#fff;border-radius:3px;padding:11px 17px;
  font-size:13.5px;font-weight:600;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);
  max-width:calc(100vw - 28px);text-align:center;
}

/* ============================================================
   주문 상태 흐름 (설계)
   ============================================================ */
.fl{background:var(--paper);border:1px solid var(--line);padding:22px;overflow-x:auto;}
.fl__r{display:flex;align-items:center;gap:0;min-width:660px;padding:8px 0;}
.fl__n{
  flex:none;min-width:96px;padding:9px 12px;border:1.5px solid var(--ink);background:var(--paper);
  text-align:center;font-size:12.5px;font-weight:700;
}
.fl__n[data-k="end"]{background:var(--ink);color:#fff;}
.fl__n[data-k="bad"]{border-color:var(--clay);color:var(--clay);}
.fl__n[data-k="off"]{border-color:var(--line-2);color:var(--ink-3);border-style:dashed;}
.fl__a{flex:1;min-width:34px;height:1.5px;background:var(--line-2);position:relative;}
.fl__a::after{content:"";position:absolute;right:-1px;top:-3.5px;border:4px solid transparent;border-left-color:var(--line-2);}
.fl__a span{
  position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;font-weight:700;color:var(--ink-3);
}
.fl__l{font-size:12.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:18px 0 2px;}
.rules{display:flex;flex-direction:column;}
.rules > div{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
.rules > div:last-child{border-bottom:0;}
.rules b{flex:none;width:168px;font-size:13.5px;font-weight:700;}
.rules span{font-size:13.5px;color:var(--ink-2);line-height:1.75;}
@media (max-width:640px){.rules > div{flex-direction:column;gap:3px;}.rules b{width:auto;}}
</style>

<div x-data="shop()" x-cloak @keydown.escape.window="ask=null">

<!-- ============================================================
     어느 쪽에서 볼지
     ============================================================ -->
<div class="side">
  <span class="side__t">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
    <b>FORGE 견본</b><span>— 같은 주문을 양쪽에서 봅니다. 새로고침하면 처음으로.</span>
  </span>
  <span class="side__sp"></span>
  <div class="seg" role="group" aria-label="보는 쪽">
    <button :aria-pressed="side==='shop'" @click="side='shop'">고객</button>
    <button :aria-pressed="side==='seller'" @click="side='seller'">
      판매자 <em x-show="todo" x-text="todo"></em>
    </button>
  </div>
  <a href="index.html">← FORGE</a>
</div>

<!-- ============================================================
     ①  가 게
     ============================================================ -->
<template x-if="side==='shop'">
<div>
  <div class="util">
    <div class="wrap util__in">
      <template x-if="user">
        <span style="display:contents">
          <span class="me" style="padding:0 11px" x-text="user.name + '님'"></span>
          <span class="sep"></span>
          <button @click="logout()">로그아웃</button>
        </span>
      </template>
      <template x-if="!user">
        <span style="display:contents">
          <button @click="openAuth('in')">로그인</button>
          <span class="sep"></span>
          <button @click="openAuth('guest')">주문조회</button>
          <span class="sep"></span>
          <button @click="openAuth('up')">회원가입</button>
        </span>
      </template>
      <span class="sep"></span>
      <button @click="go('orders')">주문내역</button>
      <span class="sep"></span>
      <button @click="ask={k:'cs'}">고객센터</button>
      <span class="sep"></span>
      <button @click="go('cart')">장바구니<em x-show="cartCount" x-text="cartCount"></em></button>
    </div>
  </div>

  <header class="hd">
    <div class="wrap hd__in">
      <button class="logo" @click="go('home')">TAG<span>SEOUL</span></button>
      <nav class="menu">
        <button :aria-current="view==='home' && !cat" @click="go('home');cat=''">전체</button>
        <template x-for="c in cats" :key="c">
          <button :aria-current="view==='home' && cat===c" @click="go('home');cat=c" x-text="c"></button>
        </template>
        <button :aria-current="view==='flow'" @click="go('flow')">주문 흐름</button>
      </nav>
      <button class="ico" @click="go('orders')" aria-label="주문 내역">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5h15l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.2a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8.6 7.5V6a3.4 3.4 0 0 1 6.8 0v1.5"/></svg>
        <b x-show="openOrders" x-text="openOrders"></b>
      </button>
      <button class="ico" @click="go('cart')" aria-label="장바구니">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h2.2l2.3 11.3a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.3l1.4-7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
        <b x-show="cartCount" x-text="cartCount"></b>
      </button>
    </div>
  </header>

  <!-- ---------- 첫 화면 ---------- -->
  <template x-if="view==='home'">
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>오래 입을 것만<br>조금씩 만듭니다</h1>
          <p>한 시즌에 열 가지 남짓. 만든 수량과 남은 수량을 그대로 적습니다. 품절이면 품절이라고 씁니다.</p>
          <div class="hero__k">
            <span class="tag">5만원 이상 무료배송</span>
            <span class="tag">당일 3시 이전 주문 당일 출고</span>
            <span class="tag">받은 날부터 7일 반품</span>
          </div>
        </div>
        <div class="hero__a"><img :src="IMG['hero']" alt="TAG 시즌 룩북"></div>
      </section>

      <div class="cats">
        <button :aria-pressed="!cat" @click="cat=''">전체 <span x-text="products.length"></span></button>
        <template x-for="c in cats" :key="c">
          <button :aria-pressed="cat===c" @click="cat=c" x-text="c"></button>
        </template>
      </div>

      <div class="grid">
        <template x-for="p in listed" :key="p.id">
          <button class="pc" @click="openProduct(p)">
            <span class="pc__a">
              <img :src="photo(p, firstColor(p))" :alt="p.name" loading="lazy">
              <span class="pc__b">
                <span class="tag tag--ink" x-show="p.isNew">NEW</span>
                <span class="tag tag--clay" x-show="p.sale" x-text="p.sale + '%'"></span>
              </span>
              <span class="pc__o" x-show="totalStock(p)===0">품절</span>
            </span>
            <span class="pc__n" x-text="p.name"></span>
            <span class="pc__p">
              <b x-text="won(priceOf(p))"></b>
              <s x-show="p.sale" x-text="won(p.price)"></s>
            </span>
            <span class="swat" x-show="colorsOf(p).length > 1">
              <template x-for="c in colorsOf(p)" :key="c">
                <i x-show="swatch(c)" :style="'background:' + swatch(c)"></i>
              </template>
            </span>
            <span class="pc__s" x-show="totalStock(p) > 0 && totalStock(p) <= 5"
                  x-text="'남은 수량 ' + totalStock(p) + '개'"></span>
          </button>
        </template>
      </div>
    </div>
  </template>

  <!-- ---------- 상품 상세 ---------- -->
  <template x-if="view==='product' && cur">
    <div class="wrap">
      <div class="pd">
        <div class="pd__a"><img :src="photo(cur, sel['색상'])" :alt="cur.name"></div>
        <div>
          <p class="pd__c" x-text="cur.cat"></p>
          <h1 x-text="cur.name"></h1>
          <div class="pd__p">
            <b x-text="won(priceOf(cur))"></b>
            <s x-show="cur.sale" x-text="won(cur.price)"></s>
            <em x-show="cur.sale" x-text="cur.sale + '% 할인'"></em>
          </div>
          <p class="pd__d" x-text="cur.desc"></p>

          <template x-for="(o,oi) in cur.opts" :key="o.k">
            <div class="opt">
              <p class="opt__l"><span x-text="o.k"></span></p>
              <div class="opt__v">
                <template x-for="v in o.vs" :key="v">
                  <button :aria-pressed="sel[o.k]===v" :data-out="optOut(oi, v)"
                          @click="!optOut(oi, v) && pickOpt(o.k, v)">
                    <i x-show="swatch(v)" :style="'background:' + swatch(v)"></i>
                    <span x-text="v"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <template x-if="fullPick">
            <div class="opt" style="border-top:0;padding-top:6px">
              <template x-if="curStock > 0">
                <div>
                  <div class="pick">
                    <div class="pick__t">
                      <b x-text="cur.name"></b>
                      <span x-text="pickText + ' · 남은 수량 ' + curStock + '개'"></span>
                    </div>
                    <div class="qty">
                      <button @click="qty > 1 && qty--" :disabled="qty <= 1" aria-label="빼기">−</button>
                      <span x-text="qty"></span>
                      <button @click="qty < curStock && qty++" :disabled="qty >= curStock" aria-label="더하기">+</button>
                    </div>
                  </div>
                  <p class="warn" x-show="qty >= curStock" x-text="'이 조합은 ' + curStock + '개가 전부입니다'"></p>
                </div>
              </template>
              <template x-if="curStock === 0">
                <p class="warn">고른 조합은 품절입니다. 다른 색상이나 사이즈를 골라 주세요.</p>
              </template>
            </div>
          </template>

          <div class="sum">
            <span>주문 금액</span>
            <b x-text="won(fullPick && curStock ? priceOf(cur) * qty : 0)"></b>
          </div>
          <div class="buy">
            <button class="btn btn--o btn--lg" @click="addToCart()" :disabled="!fullPick || !curStock">장바구니</button>
            <button class="btn btn--lg" @click="buyNow()" :disabled="!fullPick || !curStock">바로 구매</button>
          </div>

          <p class="info">
            <b>배송</b> 5만원 이상 무료 · 미만 3,000원 · 평일 15시 이전 결제분 당일 출고<br>
            <b>반품</b> 받은 날부터 7일 이내 · 단순 변심은 반품 배송비 3,000원<br>
            <b>교환</b> 이 데모에는 없습니다. 왜 뺐는지는 <b>주문 흐름</b> 에 적어 두었습니다.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- ---------- 장바구니 ---------- -->
  <template x-if="view==='cart'">
    <div class="wrap">
      <div style="padding:34px 0 22px">
        <p class="eyebrow">SHOPPING CART</p>
        <h1 style="font-size:38px;font-weight:850;letter-spacing:-.058em;margin-top:10px">장바구니</h1>
        <div class="crumb">
          <span data-on="true"><b>01</b> 장바구니</span><i>&rsaquo;</i>
          <span><b>02</b> 주문결제</span><i>&rsaquo;</i>
          <span><b>03</b> 주문완료</span>
        </div>
      </div>
      <template x-if="!cart.length">
        <div style="padding:60px 0 90px;text-align:center;color:var(--ink-3)">
          <p style="font-size:15px;line-height:1.9">담은 상품이 없습니다.<br>마음에 드는 것을 하나 골라 보세요.</p>
          <button class="btn btn--o" style="margin-top:18px" @click="go('home')">상품 보러 가기</button>
        </div>
      </template>
      <template x-if="cart.length">
        <div class="two">
          <div class="rows">
            <template x-for="(c,i) in cart" :key="c.pid + c.sku">
              <div class="row">
                <span class="row__a"><img :src="photoOf(c.pid, c.sku)" :alt="prod(c.pid).name" loading="lazy"></span>
                <div class="row__b">
                  <b x-text="prod(c.pid).name"></b>
                  <span x-text="c.sku.split('/').join(' · ')"></span>
                  <div class="row__c">
                    <div class="qty">
                      <button @click="setQty(i, c.qty - 1)" :disabled="c.qty <= 1" aria-label="빼기">−</button>
                      <span x-text="c.qty"></span>
                      <button @click="setQty(i, c.qty + 1)" :disabled="c.qty >= skuStock(c.pid, c.sku)" aria-label="더하기">+</button>
                    </div>
                    <button class="row__x" @click="cart.splice(i,1)" aria-label="빼기">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                  </div>
                  <p class="warn" x-show="skuStock(c.pid, c.sku) === 0">품절됐습니다. 빼야 주문할 수 있습니다.</p>
                  <p class="warn" x-show="skuStock(c.pid, c.sku) > 0 && c.qty > skuStock(c.pid, c.sku)"
                     x-text="'남은 수량은 ' + skuStock(c.pid, c.sku) + '개입니다'"></p>
                </div>
                <div class="row__p">
                  <b x-text="won(priceOf(prod(c.pid)) * c.qty)"></b>
                </div>
              </div>
            </template>
          </div>
          <aside class="pane">
            <h3>결제 예정 금액</h3>
            <div class="li"><span>상품 금액</span><b x-text="won(goods)"></b></div>
            <div class="li li--d" x-show="discount"><span x-text="'쿠폰 ' + (coupon ? coupon.code : '')"></span><b x-text="'− ' + won(discount)"></b></div>
            <div class="li">
              <span>배송비</span>
              <b x-text="shipFee ? won(shipFee) : '무료'"></b>
            </div>
            <template x-if="goods - discount < FREE && goods > 0">
              <div>
                <div class="bar"><i :style="'width:' + Math.min(100, (goods - discount) / FREE * 100) + '%'"></i></div>
                <p style="font-size:12px;color:var(--ink-3)" x-text="won(FREE - (goods - discount)) + ' 더 담으면 무료배송'"></p>
              </div>
            </template>
            <div class="cpn">
              <input x-model="couponInput" placeholder="쿠폰 코드 (TAG10 · FIRST5000)" aria-label="쿠폰 코드">
              <button class="btn btn--q btn--sm" @click="applyCoupon()" x-show="!coupon">적용</button>
              <button class="btn btn--q btn--sm" @click="coupon=null;couponInput=''" x-show="coupon">해제</button>
            </div>
            <div class="li li--t"><span>합계</span><b x-text="won(payable)"></b></div>
            <button class="btn btn--full btn--lg" style="margin-top:14px" @click="toCheckout()" :disabled="!cartOk">주문서 쓰기</button>
            <p class="warn" x-show="!cartOk" style="text-align:center">품절이거나 수량이 넘는 상품이 있습니다.</p>
          </aside>
        </div>
      </template>
    </div>
  </template>

  <!-- ---------- 주문서 ---------- -->
  <template x-if="view==='checkout'">
    <div class="wrap" style="padding-bottom:70px">
      <div style="padding:34px 0 22px">
        <p class="eyebrow">ORDER CHECKOUT</p>
        <h1 style="font-size:38px;font-weight:850;letter-spacing:-.058em;margin-top:10px">주문 / 결제</h1>
        <div class="crumb">
          <span data-on="true"><b>01</b> 장바구니</span><i>&rsaquo;</i>
          <span data-on="true"><b>02</b> 주문결제</span><i>&rsaquo;</i>
          <span><b>03</b> 주문완료</span>
        </div>
      </div>

      <div class="sect">
        <div class="sect__h"><b>01</b><h3>주문상품</h3><span x-text="'(총 ' + cart.length + '건)'"></span></div>
        <div class="otw">
          <table class="otbl">
            <thead><tr>
              <th>상품/옵션정보</th>
              <th style="width:64px">수량</th>
              <th style="width:112px">상품금액</th>
              <th style="width:104px">즉시할인</th>
              <th style="width:132px">결제 예정금액</th>
            </tr></thead>
            <tbody>
              <template x-for="c in cart" :key="c.pid + c.sku">
                <tr>
                  <td>
                    <div class="ot__p">
                      <span class="ot__a"><img :src="photoOf(c.pid, c.sku)" :alt="prod(c.pid).name" loading="lazy"></span>
                      <span class="ot__b">
                        <span class="ot__br">TAG</span>
                        <span class="ot__n" x-text="prod(c.pid).name"></span>
                        <span class="ot__o" x-text="optText(c)"></span>
                      </span>
                    </div>
                  </td>
                  <td class="num" x-text="c.qty"></td>
                  <td><span :class="itemSale(c) ? 'ot__was' : ''" x-text="won(prod(c.pid).price * c.qty)"></span></td>
                  <td>
                    <span class="ot__dc" x-show="itemSale(c)" x-text="'-' + won(itemSale(c))"></span>
                    <span x-show="!itemSale(c)" style="color:var(--ink-3)">—</span>
                  </td>
                  <td class="ot__pay" x-text="won(priceOf(prod(c.pid)) * c.qty)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="ot__f"><span>주문 예정 금액</span><b x-text="won(goods)"></b></div>
        <p class="ot__note">※ 쿠폰을 쓰고 나서 일부만 취소하면, 함께 산 상품에 나눠 붙은 할인이 차감된 뒤 환불됩니다.</p>
      </div>

      <div class="two" style="padding-bottom:0">
        <div>
          <div class="sect">
            <div class="sect__h"><b>02</b><h3>주문자 정보</h3></div>
            <div class="frow"><label for="bn">이름</label><div>
              <input id="bn" class="finp" style="max-width:330px" :data-e="err.name" x-model="buyer.name" @input="syncShip()" placeholder="홍길동">
            </div></div>
            <div class="frow"><label for="bp2">연락처</label><div>
              <span class="fphone">
                <select class="finp" x-model="buyer.p1" @change="syncShip()" aria-label="번호 앞자리">
                  <option>010</option><option>011</option><option>016</option><option>017</option>
                </select><i>-</i>
                <input id="bp2" class="finp" inputmode="numeric" maxlength="4" :data-e="err.phone" x-model="buyer.p2" @input="syncShip()" aria-label="연락처 가운데">
                <i>-</i>
                <input class="finp" inputmode="numeric" maxlength="4" :data-e="err.phone" x-model="buyer.p3" @input="syncShip()" aria-label="연락처 끝">
              </span>
              <p class="ferr" x-show="err.phone">연락처를 정확히 넣어 주세요.</p>
            </div></div>
            <div class="frow"><label for="be">이메일</label><div>
              <input id="be" class="finp" style="max-width:330px" type="email" x-model="buyer.email" placeholder="you@example.com">
              <p class="fhint">주문 확인과 배송 안내를 이 주소로 보냅니다.</p>
            </div></div>
            <div class="frow" x-show="!user"><label>회원가입</label><div>
              <label class="fchk"><input type="checkbox" x-model="joinAfter"><span>이 정보로 회원가입하고 다음부터 간편하게 주문하기</span></label>
              <p class="fhint">지금은 <b>비회원 주문</b> 입니다. 주문번호와 이름으로 조회할 수 있습니다.</p>
            </div></div>
          </div>

          <div class="sect">
            <div class="sect__h"><b>03</b><h3>배송지</h3><span class="sp"></span>
              <label class="fchk"><input type="checkbox" x-model="dest.same" @change="syncShip()"><span>주문자 정보와 동일</span></label>
            </div>
            <div class="frow"><label for="sn">받는 분</label><div>
              <input id="sn" class="finp" style="max-width:330px" :disabled="dest.same" :data-e="err.sname" x-model="dest.name" placeholder="홍길동">
            </div></div>
            <div class="frow"><label for="sp2">연락처</label><div>
              <span class="fphone">
                <select class="finp" x-model="dest.p1" :disabled="dest.same" aria-label="번호 앞자리">
                  <option>010</option><option>011</option><option>016</option><option>017</option>
                </select><i>-</i>
                <input id="sp2" class="finp" inputmode="numeric" maxlength="4" :disabled="dest.same" x-model="dest.p2" aria-label="연락처 가운데">
                <i>-</i>
                <input class="finp" inputmode="numeric" maxlength="4" :disabled="dest.same" x-model="dest.p3" aria-label="연락처 끝">
              </span>
            </div></div>
            <div class="frow"><label for="sz">주소</label><div>
              <span style="display:flex;gap:7px;max-width:340px">
                <input id="sz" class="finp" style="width:120px" x-model="dest.zip" placeholder="우편번호" readonly>
                <button class="btn btn--o" style="height:44px;flex:none" @click="ask={k:'zip'}">우편번호 찾기</button>
              </span>
              <input class="finp" style="margin-top:7px" :data-e="err.addr" x-model="dest.addr" placeholder="주소" readonly>
              <input class="finp" style="margin-top:7px" x-model="dest.addr2" placeholder="상세 주소를 넣어 주세요">
              <p class="ferr" x-show="err.addr">우편번호 찾기로 주소를 골라 주세요.</p>
            </div></div>
            <div class="frow"><label for="sm">배송 요청</label><div>
              <select id="sm" class="finp" style="max-width:340px" x-model="dest.memo">
                <option>문 앞에 놓아 주세요</option>
                <option>경비실에 맡겨 주세요</option>
                <option>택배함에 넣어 주세요</option>
                <option>배송 전 연락 주세요</option>
                <option>직접 입력</option>
              </select>
              <input class="finp" style="margin-top:7px" x-show="dest.memo==='직접 입력'" x-model="dest.memo2" placeholder="요청사항을 적어 주세요">
            </div></div>
          </div>

          <div class="sect">
            <div class="sect__h"><b>04</b><h3>결제수단</h3></div>
            <div class="pays">
              <button :aria-pressed="payMethod==='card'" @click="payMethod='card'">
                <b>신용·체크카드</b><span>카드사 인증 창이 뜹니다</span></button>
              <button :aria-pressed="payMethod==='easy'" @click="payMethod='easy'">
                <b>간편결제</b><span>등록한 카드로 바로</span></button>
              <button :aria-pressed="payMethod==='bank'" @click="payMethod='bank'">
                <b>무통장 입금</b><span>입금 확인 뒤 준비 시작</span></button>
            </div>
            <div x-show="payMethod==='bank'"
                 style="margin-top:14px;padding:13px 15px;background:var(--gold-soft);border:1px solid #EBDCAE;font-size:13px;color:var(--ink-2);line-height:1.75">
              무통장은 <b>입금 대기</b> 상태로 주문이 만들어집니다. 재고는 이때 잡아 둡니다 —
              입금을 기다리는 사이에 남이 사 가면 곤란하니까요. 판매자가 입금을 확인하면 준비가 시작됩니다.
            </div>
          </div>
        </div>

        <aside class="sum2">
          <h3>총 결제금액</h3>
          <div class="sum2__r"><span x-text="'총 상품금액 (' + cartCount + '개)'"></span><b x-text="won(listGoods)"></b></div>
          <div class="sum2__r dc" x-show="saleDiscount"><span>즉시할인</span><b x-text="'-' + won(saleDiscount)"></b></div>
          <div class="sum2__r dc" x-show="discount"><span x-text="'쿠폰할인 ' + (coupon ? coupon.code : '')"></span><b x-text="'-' + won(discount)"></b></div>
          <div class="sum2__r"><span>배송비</span><b x-text="shipFee ? won(shipFee) : '무료'"></b></div>
          <div class="cpn" style="border-top:1px solid var(--line);margin-top:6px">
            <input x-model="couponInput" placeholder="쿠폰 코드 (TAG10 · FIRST5000)" aria-label="쿠폰 코드">
            <button class="btn btn--q btn--sm" @click="applyCoupon()" x-show="!coupon">적용</button>
            <button class="btn btn--q btn--sm" @click="coupon=null;couponInput=''" x-show="coupon">해제</button>
          </div>
          <div class="sum2__t"><span>총 결제금액</span><b><span x-text="won(payable).slice(1)"></span><em>원</em></b></div>
          <label style="display:flex;gap:9px;align-items:flex-start;margin-top:20px;font-size:12.5px;color:var(--ink-2);line-height:1.6;cursor:pointer">
            <input type="checkbox" x-model="agree" style="margin-top:3px;accent-color:var(--ink)">
            <span>주문 내용을 확인했고, 결제와 개인정보 제공에 동의합니다.</span>
          </label>
          <button class="btn btn--full btn--lg" style="margin-top:14px" @click="startPay()" :disabled="!agree"
                  x-text="won(payable) + ' 결제하기'"></button>
          <p class="ferr" x-show="errMsg" x-text="errMsg" style="text-align:center"></p>
        </aside>
      </div>
    </div>
  </template>

  <!-- ---------- 주문 완료 ---------- -->
  <template x-if="view==='done' && curOrder">
    <div class="wrap">
      <div style="padding:34px 0 4px">
        <p class="eyebrow">ORDER COMPLETE</p>
        <div class="crumb">
          <span data-on="true"><b>01</b> 장바구니</span><i>&rsaquo;</i>
          <span data-on="true"><b>02</b> 주문결제</span><i>&rsaquo;</i>
          <span data-on="true"><b>03</b> 주문완료</span>
        </div>
      </div>
      <div style="padding:44px 0 70px;text-align:center;max-width:520px;margin:0 auto">
        <h2 style="font-size:28px;font-weight:850;letter-spacing:-.05em"
            x-text="curOrder.method==='bank' ? '주문이 접수됐습니다' : '결제가 끝났습니다'"></h2>
        <p style="color:var(--ink-2);margin-top:12px;line-height:1.85"
           x-text="curOrder.method==='bank' ? '아래 계좌로 입금하시면 판매자가 확인한 뒤 준비를 시작합니다.' : '주문서에 적어 주신 곳으로 보내 드리겠습니다.'"></p>
        <div style="border:1px solid var(--line);background:var(--paper);padding:18px;margin-top:22px;text-align:left">
          <div class="li"><span>주문번호</span><b class="mono" x-text="curOrder.id"></b></div>
          <div class="li"><span>결제 금액</span><b x-text="won(curOrder.paid)"></b></div>
          <div class="li"><span>결제 수단</span><b x-text="methodLabel(curOrder)"></b></div>
          <template x-if="curOrder.method==='bank'">
            <div class="li"><span>입금 계좌</span><b class="mono" style="font-size:13px">국민 000000-00-000000 (주)태그서울</b></div>
          </template>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px">
          <button class="btn btn--o" @click="go('home')">계속 둘러보기</button>
          <button class="btn" @click="go('orders')">주문 내역 보기</button>
        </div>
        <p style="font-size:12.5px;color:var(--ink-3);margin-top:22px;line-height:1.8">
          이제 맨 위에서 <b>판매자</b> 로 바꿔 보세요. 방금 그 주문이 처리해야 할 목록에 올라와 있습니다.
        </p>
      </div>
    </div>
  </template>

  <!-- ---------- 주문 내역 ---------- -->
  <template x-if="view==='orders'">
    <div class="wrap">
      <div style="padding:34px 0 22px">
        <p class="eyebrow">ORDER HISTORY</p>
        <h1 style="font-size:38px;font-weight:850;letter-spacing:-.058em;margin-top:10px">주문 내역</h1>
        <p style="color:var(--ink-3);font-size:13.5px;margin-top:8px"
           x-text="user ? (user.name + '님의 주문 ' + visibleOrders.length + '건') : (onlyOrder ? ('비회원 주문 ' + onlyOrder) : '로그인하거나 주문조회로 확인할 수 있습니다')"></p>
      </div>
      <template x-if="!visibleOrders.length">
        <div style="padding:50px 0 90px;text-align:center;color:var(--ink-3)">
          <p style="font-size:15px;line-height:1.9" x-text="user ? '아직 주문이 없습니다.' : '주문내역을 보려면 로그인하거나 주문번호로 조회해 주세요.'"></p>
          <div style="display:flex;gap:8px;justify-content:center;margin-top:18px">
            <button class="btn btn--o" @click="go('home')">상품 보러 가기</button>
            <button class="btn" x-show="!user" @click="openAuth('in')">로그인 / 주문조회</button>
          </div>
        </div>
      </template>
      <div style="padding-bottom:70px">
        <template x-for="o in visibleOrders" :key="o.id">
          <div class="ord">
            <div class="ord__h">
              <b class="mono" x-text="o.id"></b>
              <span x-text="o.at"></span>
              <span class="sp"></span>
              <span x-text="methodLabel(o)"></span>
              <b x-text="won(o.paid - refunded(o))"></b>
              <span x-show="refunded(o)" style="color:var(--clay)" x-text="'환불 ' + won(refunded(o))"></span>
            </div>

            <template x-for="it in o.items" :key="it.id">
              <div class="ord__i">
                <span class="a"><img :src="photoOf(it.pid, it.sku)" :alt="it.name" loading="lazy"></span>
                <div class="b">
                  <b x-text="it.name"></b>
                  <span x-text="it.sku.split('/').join(' · ') + ' · ' + it.qty + '개 · ' + won(it.price * it.qty)"></span>
                  <div class="flow" x-html="flowHtml(it)"></div>
                  <p class="warn" x-show="it.memo" x-text="it.memo"></p>
                </div>
                <div class="c">
                  <span class="st" :class="'st--' + stClass(it.state)"><i></i><span x-text="stLabel(it.state)"></span></span>
                  <template x-if="canCancel(it)">
                    <button class="btn btn--q btn--sm" @click="askCancel(o, it)">주문 취소</button>
                  </template>
                  <template x-if="it.state==='SHIPPING'">
                    <button class="btn btn--q btn--sm" @click="toast('한진택배 ' + it.invoice + ' — 실제 조회는 붙이지 않았습니다')">배송 조회</button>
                  </template>
                  <template x-if="it.state==='DELIVERED'">
                    <button class="btn btn--sm" @click="askConfirm(o, it)">구매 확정</button>
                  </template>
                  <template x-if="canReturn(it)">
                    <button class="btn btn--q btn--sm" @click="askReturn(o, it)">반품 신청</button>
                  </template>
                </div>

          <span class="fl__a"><span>송장 입력</span></span>
          <span class="fl__n">배송중</span>
          <span class="fl__a"><span>배송사</span></span>

          <span class="fl__n" data-k="bad">자동취소</span>

          <span class="fl__n" data-k="bad">취소완료</span>
          <span class="fl__a"><span>즉시</span></span>
          <span class="fl__n" data-k="bad">환불 · 재고 복구</span>

        <div class="fl__r">
          <span class="fl__n">배송완료</span>
          <span class="fl__a"><span>고객 신청</span></span>
          <span class="fl__n">반품요청</span>
          <span class="fl__a"><span>판매자 승인</span></span>
          <span class="fl__n">반품수거중</span>
          <span class="fl__a"><span>도착 확인</span></span>
          <span class="fl__n" data-k="bad">반품완료 · 환불</span>
        </div>
      </div>

      <h3 style="font-size:18px;font-weight:800;letter-spacing:-.04em;margin:36px 0 4px">정한 것</h3>
      <div class="rules card" style="padding:4px 20px;margin-top:12px">
        <div><b>상태는 주문이 아니라 품목에 붙습니다</b>
          <span>세 개를 시키면 하나는 취소되고, 하나는 배송되고, 하나는 반품될 수 있습니다.
            주문 하나에 상태 하나를 두면 이 상황을 적을 자리가 없어집니다. 목록도 환불도 정산도 전부 품목 단위로 돕니다.</span></div>
        <div><b>취소는 승인이 없고 반품은 있습니다</b>
          <span>배송 전 취소는 판매자가 거절할 이유가 없어 즉시 처리합니다. 반품은 물건이 돌아와야 끝나므로 승인과 수거가 사이에 들어갑니다.</span></div>
        <div><b>재고는 결제 시점에 뺍니다</b>
          <span>장바구니는 재고를 잡지 않습니다. 담아 두고 안 사는 사람이 훨씬 많아서, 잡아 두면 팔 수 있는 물건이 묶입니다.
            대신 결제 직전에 다시 확인하고, 그 사이 팔렸으면 결제를 세웁니다.</span></div>
        <div><b>무통장만 예외로 재고를 잡습니다</b>
          <span>입금까지 기다리는 사이에 남이 사 가면 환불 말고는 방법이 없습니다. 대신 7일 안에 입금이 없으면 자동으로 취소하고 재고를 풉니다.</span></div>
        <div><b>부분 취소로 무료배송이 깨지면 배송비를 회수합니다</b>
          <span>5만원어치를 시켜 무료로 받고 4만원어치를 취소하면 남은 금액은 1만원입니다.
            이때 배송비 3,000원을 환불액에서 뺍니다. 안 그러면 무료배송 조건을 취소로 우회할 수 있습니다.</span></div>
        <div><b>쿠폰은 품목 금액대로 나눠 돌려받습니다</b>
          <span>1만원 쿠폰을 쓴 주문에서 절반을 취소하면 쿠폰 5,000원도 함께 회수합니다. 안 나누면 취소할수록 이득이 됩니다.</span></div>
        <div><b>구매확정 뒤에는 반품이 없습니다</b>
          <span>정산이 이미 나갔기 때문입니다. 확정 전 7일이 그래서 있습니다.</span></div>
      </div>

      <h3 style="font-size:18px;font-weight:800;letter-spacing:-.04em;margin:36px 0 4px">일부러 뺀 것</h3>
      <div class="rules card" style="padding:4px 20px;margin-top:12px">
        <div><b>교환</b><span>반품과 새 주문을 묶은 것이라 상태가 두 배로 늘어납니다. 첫 판에서는 "반품하고 다시 주문" 으로 안내하는 곳이 많습니다.</span></div>
        <div><b>부분 수량 취소</b><span>3개 중 1개만 취소하는 것. 쿠폰·배송비 안분이 한 겹 더 복잡해집니다. 품목 단위까지만 갑니다.</span></div>
        <div><b>회원 등급 · 적립금</b><span>파는 것이 자리 잡기 전에는 계산할 것만 늘어납니다.</span></div>
        <div><b>실제 배송 조회</b><span>택배사 API 는 계약이 먼저입니다. 송장번호만 받아 두고 링크로 넘깁니다.</span></div>
      </div>
    </div>
  </template>
</div>
</template>

<!-- ============================================================

<template x-if="side==='seller'">
<div class="s">
  <div class="s__top">

    <span class="s__u"><i>배</i>배수경 · 운영</span>
  </div>
  <nav class="s__nav">
    <button :aria-current="sview==='orders'" @click="sview='orders';ssel=[]">주문 <em x-show="newOrders" x-text="newOrders"></em></button>
    <button :aria-current="sview==='claims'" @click="sview='claims'">클레임 <em x-show="claims.length" x-text="claims.length"></em></button>
    <button :aria-current="sview==='stock'"  @click="sview='stock'">상품 · 재고 <em x-show="lowSkus.length" x-text="lowSkus.length"></em></button>

          <div :data-t="cnt('WAIT') ? 'warn' : ''"><span>입금대기</span><b class="num" x-text="cnt('WAIT')"></b><em>무통장</em></div>
          <div><span>배송중</span><b class="num" x-text="cnt('SHIPPING')"></b><em>송장 발급됨</em></div>
          <div :data-t="claims.length ? 'bad' : ''"><span>클레임</span><b class="num" x-text="claims.length"></b><em>반품 요청</em></div>
        </div>

        <div class="s__hd">
          <h1>주문 관리</h1>
          <p>주문이 아니라 <b>품목</b> 단위로 봅니다</p>
          <span class="sp"></span>
          <select class="ssel" x-model="sfilter" aria-label="상태">
            <option value="">상태 전체</option>
            <option value="WAIT">입금대기</option>
            <option value="PAID">결제완료</option>
            <option value="READY">상품준비중</option>
            <option value="SHIPPING">배송중</option>
            <option value="DELIVERED">배송완료</option>
            <option value="CONFIRMED">구매확정</option>
            <option value="CANCELED">취소완료</option>
            <option value="RETURNED">반품완료</option>
          </select>
        </div>

        <div class="tbwrap"><table class="tb">
          <thead>
            <tr>
              <th style="width:32px">
                <button class="ck" :data-on="allSSel" @click="toggleAllS()" aria-label="모두 선택">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
                </button>
              </th>
              <th style="width:126px">주문번호</th>
              <th>상품</th>
              <th class="nw" style="width:150px">옵션</th>
              <th class="c" style="width:48px">수량</th>
              <th class="r" style="width:96px">금액</th>
              <th style="width:100px">받는 분</th>
              <th style="width:104px">상태</th>
              <th style="width:118px">송장</th>
              <th style="width:112px"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in srows" :key="r.it.id">
              <tr :data-sel="ssel.indexOf(r.it.id) >= 0">
                <td>
                  <button class="ck" :data-on="ssel.indexOf(r.it.id) >= 0" @click="pickS(r.it.id)"
                          :disabled="!canShip(r.it)" :style="canShip(r.it) ? '' : 'opacity:.3;cursor:not-allowed'"
                          :aria-label="r.it.name + ' 선택'">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
                  </button>
                </td>
                <td class="mut mono nw" style="font-size:11.5px" x-text="r.o.id"></td>
                <td x-text="r.it.name"></td>
                <td class="mut nw" x-text="r.it.sku.split('/').join(' · ')"></td>
                <td class="c num" x-text="r.it.qty"></td>
                <td class="r num nw" x-text="won(r.it.price * r.it.qty)"></td>
                <td class="nw" x-text="r.o.buyer.name"></td>
                <td><span class="st" :class="'st--' + stClass(r.it.state)"><i></i><span x-text="stLabel(r.it.state)"></span></span></td>
                <td class="mono mut nw" style="font-size:11.5px" x-text="r.it.invoice || '—'"></td>
                <td class="nw">
                  <template x-if="r.it.state==='WAIT'">
                    <button class="sbtn sbtn--sm sbtn--p" @click="confirmDeposit(r.o)">입금 확인</button>
                  </template>
                  <template x-if="r.it.state==='PAID'">
                    <button class="sbtn sbtn--sm" @click="setState(r.o, r.it, 'READY', '상품준비중으로')">준비 시작</button>
                  </template>
                  <template x-if="r.it.state==='READY'">
                    <button class="sbtn sbtn--sm sbtn--p" @click="ssel=[r.it.id];invoiceInput=''">발송 처리</button>
                  </template>
                  <template x-if="r.it.state==='SHIPPING'">
                    <button class="sbtn sbtn--sm sbtn--g" @click="setState(r.o, r.it, 'DELIVERED', '배송완료로')">배송완료</button>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="tb__none" x-show="!srows.length">해당하는 주문이 없습니다.</p></div>

        <div class="sbulk" x-show="ssel.length" x-transition>
          <b x-text="ssel.length + '건 발송 처리'"></b>
          <input class="sinp" style="width:170px" x-model="invoiceInput" placeholder="송장번호 (비우면 자동)" aria-label="송장번호">
          <span class="sp"></span>
          <button class="sbtn sbtn--sm" @click="ssel=[]">해제</button>
          <button class="sbtn sbtn--sm sbtn--p" @click="ship()">송장 등록하고 발송</button>
        </div>

        <div class="snote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
          <div>한 주문의 품목이 여러 줄로 나옵니다. 옷은 오늘 보내고 머그컵은 내일 들어와서 모레 보내는 일이 흔하기 때문입니다.
            <b>선택칸은 발송할 수 있는 줄에만</b> 생깁니다.</div>
        </div>
      </div>
    </template>

    <!-- ---------- 클레임 ---------- -->

      </div>

          <div data-t="bad"><span>결제 수수료 3.3%</span><b class="num" x-text="'− ' + won(settle.fee)"></b><em>카드 · 간편결제</em></div>
          <div data-t="bad"><span>환불액</span><b class="num" x-text="'− ' + won(settle.refund)"></b><em>취소 · 반품</em></div>
          <div data-t="ok"><span>정산 예정액</span><b class="num" x-text="won(settle.net)"></b><em>확정 +3영업일</em></div>
        </div>

        <div class="spanel" style="margin-bottom:12px">
          <div class="spanel__h">최근 7일 결제액<span class="sp"></span>
            <span style="font-size:12px;color:var(--sink-3)" x-text="won(week.reduce((a,b) => a + b.v, 0))"></span></div>
          <div class="spanel__b">
            <div class="chart">
              <template x-for="d in week" :key="d.l">
                <div>
                  <i :style="'height:' + (weekMax ? Math.max(2, d.v / weekMax * 108) : 2) + 'px'"></i>
                  <span x-text="d.l"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="tbwrap"><table class="tb">
          <thead><tr>
            <th style="width:126px">주문번호</th><th>상품</th><th style="width:104px">상태</th>
            <th class="r" style="width:96px">판매액</th><th class="r" style="width:88px">수수료</th>
            <th class="r" style="width:96px">환불</th><th class="r" style="width:104px">정산액</th>
          </tr></thead>
          <tbody>
            <template x-for="r in settleRows" :key="r.id">
              <tr>
                <td class="mut mono nw" style="font-size:11.5px" x-text="r.oid"></td>
                <td x-text="r.name"></td>
                <td><span class="st" :class="'st--' + stClass(r.state)"><i></i><span x-text="stLabel(r.state)"></span></span></td>
                <td class="r num nw" x-text="won(r.gross)"></td>
                <td class="r num nw mut" x-text="r.fee ? '− ' + won(r.fee) : '—'"></td>
                <td class="r num nw" :style="r.refund ? 'color:#B03A2E' : ''" x-text="r.refund ? '− ' + won(r.refund) : '—'"></td>
                <td class="r num nw" style="font-weight:700" x-text="won(r.net)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="tb__none" x-show="!settleRows.length">정산할 것이 아직 없습니다.
          주문을 배송완료까지 보내고 고객이 구매확정을 누르면 여기에 잡힙니다.</p></div>

        <div class="snote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
          <div>배송완료만으로는 정산하지 않습니다. 반품 기간이 남아 있어서, 정산하고 나서 돌려주면 다시 받아 와야 하기 때문입니다.
            <b>구매확정</b> 이 정산의 시작점인 이유입니다.</div>
        </div>
      </div>
    </template>

  </div>
</div>
</template>

<!-- ============================================================

<template x-if="authOpen">
  <div>
    <button class="scrim" @click="authOpen=false" aria-label="닫기"></button>

      <button class="auth__x" @click="authOpen=false" aria-label="닫기">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="auth__lg">TAG<em>SEOUL</em></p>

      <div class="auth__tb" role="tablist">
        <button role="tab" :aria-selected="authTab!=='guest'" @click="authTab='in'">기존 회원이세요?</button>
        <button role="tab" :aria-selected="authTab==='guest'" @click="authTab='guest'">비회원 주문조회</button>
      </div>

      <template x-if="authTab!=='guest'">

            <div class="auth__i">

                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
                  <path x-show="!pwShow" d="M4 20L20 4"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="auth__save" :data-on="login.save" @click="login.save=!login.save" type="button">
            <i></i><span>아이디저장</span>
          </button>
          <p class="ferr" x-show="login.err" x-text="login.err"></p>
          <button class="auth__go" @click="doLogin()">기존 회원 로그인</button>
          <button class="auth__go auth__go--k" @click="social('카카오')">
            <svg width="17" height="16" viewBox="0 0 24 22" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 4.2 0 9.4c0 3.3 2.2 6.2 5.5 7.9l-1.4 5.1c-.1.4.3.7.7.5l6.1-4c.4 0 .7.1 1.1.1 6.6 0 12-4.2 12-9.6S18.6 0 12 0z"/></svg>
            카카오 1초 로그인/회원가입
          </button>
          <div class="auth__links">
            <button @click="toast('데모라 찾기 화면은 없습니다')">아이디/비밀번호 찾기</button>
            <button @click="social('이메일 가입')">회원가입</button>
          </div>
          <div class="auth__or">또는</div>
          <div class="auth__soc">
            <button style="background:#03C75A" @click="social('네이버')" aria-label="네이버로 로그인">N</button>
            <button style="background:#1877F2" @click="social('페이스북')" aria-label="페이스북으로 로그인">f</button>
            <button style="background:#111" @click="social('애플')" aria-label="애플로 로그인">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.6-1.9-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.3c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
            </button>
          </div>
          <p class="auth__note">
            <b>데모 계정이 채워져 있습니다.</b> 그대로 로그인을 누르거나 소셜 단추를 눌러도 같은 계정으로 들어갑니다.
            실제로는 이 자리에 소셜 인증과 약관 동의가 붙습니다.
          </p>
        </div>
      </template>

      <template x-if="authTab==='guest'">
        <div>
          <p style="font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-bottom:6px">
            회원가입 없이 주문하셨다면 주문번호와 주문하신 분 이름으로 조회할 수 있습니다.
          </p>
          <div class="auth__f">
            <div class="auth__i"><input x-model="guest.no" placeholder="주문번호 (TAG-000000-000)"></div>
            <div class="auth__i"><input x-model="guest.name" placeholder="주문자 이름"></div>
          </div>
          <p class="ferr" x-show="guest.err" x-text="guest.err"></p>
          <button class="auth__go auth__go--d" style="margin-top:20px" @click="findOrder()">주문 조회</button>
          <p class="auth__note">
            비회원 주문은 <b>주문번호와 이름이 모두 맞아야</b> 열립니다. 실제 서비스에서는 여기에 접근 횟수 제한을 겁니다 —
            주문번호를 하나씩 넣어 보며 남의 주문을 열어 보는 것을 막아야 하기 때문입니다.
          </p>
        </div>
      </template>
    </div>
  </div>
</template>

<!-- ============================================================
     결제 창 — 카드사가 띄우는 척

<template x-if="pg">
  <div>
    <div class="scrim"></div>
    <div class="pg" role="dialog" aria-modal="true">
      <div class="pg__h">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        안전결제 인증
        <span class="sp"></span>
        <span style="font-size:11.5px;font-weight:500;opacity:.8">TAG SEOUL</span>
      </div>
      <div class="pg__b">
        <div class="pg__r"><span>가맹점</span><b>(주)태그서울</b></div>

          <button class="btn btn--o btn--full" @click="payResult('limit')">한도 초과로 실패해 보기</button>

          여기서 실패를 골라 보면 주문이 만들어지지 않는 것을 볼 수 있습니다.</p>
      </div>

  </div>
