/* ============================================================
   TAG — 작은 브랜드의 온라인 스토어
   커머스 데모. 앞단(고객)과 뒷단(판매자)을 한 파일에 넣고,
   위쪽 전환기로 오가며 같은 주문을 양쪽에서 본다.

   이 데모가 하고 싶은 말은 하나다.
   주문 상태는 '주문' 이 아니라 '주문 품목' 에 붙는다.
   세 개를 시키면 하나는 취소되고 하나는 배송되고 하나는 반품될 수 있다.
   그래서 목록도, 환불 계산도, 정산도 전부 품목 단위로 돈다.

   앞단은 밝고 성글게, 뒷단은 좁고 각지게 —
   같은 파일 안에서 두 벌의 결을 쓴다.
   ============================================================ */
:root{
  /* 앞단 — 가게 */
  --bg:#FCFBF9;
  --paper:#FFFFFF;
  --tint:#F4F1EB;
  --shot:#EDEAE3;
  --line:#E7E3DB;
  --line-2:#D6D0C4;
  --ink:#16150F;
  --ink-2:#6C6760;
  --ink-3:#9A948B;
  --brand:#16150F;
  --clay:#B4482A;      --clay-soft:#FAEEE9;
  --leaf:#2E7050;      --leaf-soft:#E7F1EB;
  --gold:#9A7B22;      --gold-soft:#FAF3DF;

  /* 뒷단 — 작업대 */
  --sbg:#F1F2F4;
  --spanel:#FFFFFF;
  --sline:#DDE0E5;
  --sline-2:#C3C8D0;
  --sink:#151A21;
  --sink-2:#5A626E;
  --sink-3:#8A929E;
  --steel:#26313F;
  --steel-2:#33455A;
  --steel-soft:#E7ECF2;

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --maxw:1180px;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:15px;line-height:1.65;letter-spacing:-.014em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.032em;line-height:1.3;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px;}
img,svg{display:block;max-width:100%;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.035em;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

/* ============================================================
   맨 위 — 어느 쪽에서 볼지
   ============================================================ */
.side{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:7px 16px;background:#0F1116;color:#E9EBEF;font-size:12.5px;font-weight:600;
}
.side__t{display:flex;align-items:center;gap:7px;color:#9AA1AE;}
.side__t b{color:#E9EBEF;}
.side__sp{flex:1;}
.seg{display:flex;gap:2px;padding:2px;border-radius:100px;background:rgba(255,255,255,.08);}
.seg button{
  height:26px;padding:0 13px;border:0;border-radius:100px;background:transparent;cursor:pointer;
  color:#9AA1AE;font-size:12.5px;font-weight:700;letter-spacing:-.014em;display:flex;align-items:center;gap:6px;
}
.seg button[aria-pressed="true"]{background:#E9EBEF;color:#0F1116;}
.seg em{
  font-style:normal;font-size:10.5px;font-weight:800;line-height:1;padding:2px 6px;border-radius:100px;
  background:#E0533A;color:#fff;
}
.side a{color:#9AA1AE;text-decoration:underline;text-underline-offset:2px;}
.side a:hover{color:#E9EBEF;}
@media (max-width:720px){.side__t span{display:none;}}

/* ============================================================
   가게 — 머리
   ============================================================ */
.hd{position:sticky;top:40px;z-index:50;background:rgba(252,251,249,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.hd__in{display:flex;align-items:center;gap:18px;height:64px;}
.logo{font-size:22px;font-weight:800;letter-spacing:-.07em;cursor:pointer;background:none;border:0;padding:0;}
.logo span{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);display:block;margin-top:-4px;}
.menu{display:flex;gap:3px;flex:1;}
.menu button{
  border:0;background:none;cursor:pointer;padding:8px 12px;border-radius:100px;
  font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-.018em;
}
.menu button:hover{background:var(--tint);color:var(--ink);}
.menu button[aria-current="true"]{background:var(--ink);color:#fff;}
@media (max-width:800px){
  .hd__in{gap:9px;}
  .logo{font-size:19px;}
  .menu{overflow-x:auto;flex-wrap:nowrap;}
  .menu::-webkit-scrollbar{height:0;}
  .menu button{padding:8px 9px;font-size:13px;white-space:nowrap;}
}
.ico{
  position:relative;width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);
}
.ico:hover{background:var(--tint);}
.ico b{
  position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:100px;
  background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;line-height:1;
}

/* ============================================================
   가게 — 공통 조각
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:44px;padding:0 20px;border-radius:2px;cursor:pointer;white-space:nowrap;
  font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  transition:background .14s,color .14s,border-color .14s,opacity .14s;
}
.btn:hover{background:#000;}
.btn--o{background:transparent;color:var(--ink);}
.btn--o:hover{background:var(--tint);}
.btn--q{background:transparent;border-color:var(--line-2);color:var(--ink-2);}
.btn--q:hover{background:var(--tint);color:var(--ink);}
.btn--red{background:var(--clay);border-color:var(--clay);}
.btn--red:hover{background:#9E3D23;border-color:#9E3D23;}
.btn--sm{height:34px;padding:0 13px;font-size:13.5px;}
.btn--lg{height:52px;padding:0 26px;font-size:16px;}
.btn--full{width:100%;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.tag{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;
  font-size:11.5px;font-weight:700;letter-spacing:-.008em;white-space:nowrap;
  background:var(--tint);color:var(--ink-2);
}
.tag--clay{background:var(--clay-soft);color:var(--clay);}
.tag--leaf{background:var(--leaf-soft);color:var(--leaf);}
.tag--gold{background:var(--gold-soft);color:var(--gold);}
.tag--ink{background:var(--ink);color:#fff;}
.tag--out{background:#EEE;color:#9A948B;}

.fld{display:flex;flex-direction:column;gap:6px;}
.fld label{font-size:13px;font-weight:700;color:var(--ink-2);}
.fld input,.fld select,.fld textarea{
  height:44px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  font-size:15px;width:100%;
}
.fld textarea{height:auto;padding:11px 13px;min-height:76px;resize:vertical;line-height:1.6;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ink);}
.fld small{font-size:12.5px;color:var(--ink-3);}
.fld--e input{border-color:var(--clay);}

.card{background:var(--paper);border:1px solid var(--line);}
.sec{padding:44px 0 20px;}
.sec h2{font-size:26px;font-weight:800;letter-spacing:-.045em;}
.sec p{color:var(--ink-2);font-size:14.5px;margin-top:6px;}

/* ============================================================
   가게 — 첫 화면 · 목록
   ============================================================ */
.hero{
  display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;
  padding:46px 0 40px;border-bottom:1px solid var(--line);
}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:22px;padding:30px 0;}}
.hero h1{font-size:44px;font-weight:850;letter-spacing:-.055em;line-height:1.14;}
@media (max-width:820px){.hero h1{font-size:32px;}}
.hero p{margin-top:14px;color:var(--ink-2);font-size:16px;line-height:1.8;max-width:38ch;font-weight:350;}
.hero__k{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.hero__a{
  aspect-ratio:4/3;background:var(--shot);position:relative;overflow:hidden;
}
.hero__a img{width:100%;height:100%;object-fit:cover;}
.hero__a::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(400px 300px at 70% 20%,rgba(180,72,42,.10),transparent 62%);
}

.cats{display:flex;gap:7px;flex-wrap:wrap;padding:26px 0 18px;}
.cats button{
  height:34px;padding:0 15px;border:1px solid var(--line-2);border-radius:100px;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
}
.cats button:hover{border-color:var(--ink);color:var(--ink);}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 20px;padding-bottom:50px;}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 14px;}}
.pc{cursor:pointer;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:11px;}
.pc__a{aspect-ratio:4/5;background:var(--shot);position:relative;overflow:hidden;display:block;}
.pc__a img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.pc:hover .pc__a img{transform:scale(1.045);}
.pc__b{position:absolute;left:9px;top:9px;display:flex;gap:5px;}
.pc__o{position:absolute;inset:0;background:rgba(22,21,15,.52);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;letter-spacing:.06em;}
.pc__n{font-size:14.5px;font-weight:600;letter-spacing:-.022em;line-height:1.45;}
.pc__p{display:flex;align-items:baseline;gap:7px;}
.pc__p b{font-size:15.5px;font-weight:800;letter-spacing:-.035em;}
.pc__p s{font-size:12.5px;color:var(--ink-3);}
.pc__s{font-size:12px;color:var(--ink-3);}
.swat{display:flex;gap:4px;}
.swat i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}


/* ============================================================
   윗줄 유틸 · 로그인
   ============================================================ */
.util{border-bottom:1px solid var(--line);background:var(--paper);}
.util__in{display:flex;align-items:center;justify-content:flex-end;gap:2px;height:36px;}
.util__in button,.util__in a{
  border:0;background:none;cursor:pointer;padding:0 11px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);letter-spacing:-.018em;position:relative;
}
.util__in button:hover{color:var(--ink);}
.util__in .me{color:var(--ink);font-weight:700;}
.util__in em{
  position:absolute;top:-3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:100px;
  background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;
  display:grid;place-items:center;line-height:1;
}
.util__in .sep{width:1px;height:11px;background:var(--line-2);margin:0 4px;padding:0;}

.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--ink-3);}
.crumb{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13px;}
.crumb span{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:600;}
.crumb span b{font-size:11.5px;font-weight:800;letter-spacing:.02em;}
.crumb span[data-on="true"]{color:var(--ink);font-weight:700;}
.crumb i{font-style:normal;color:var(--line-2);}

.sect{border:1px solid var(--line);background:var(--paper);padding:26px 28px;margin-bottom:16px;}
@media (max-width:640px){.sect{padding:20px 16px;}}
.sect__h{display:flex;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:18px;}
.sect__h b{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.02em;}
.sect__h h3{font-size:19px;font-weight:800;letter-spacing:-.04em;}
.sect__h span{font-size:13px;color:var(--ink-3);font-weight:500;}
.sect__h .sp{flex:1;}

/* 주문상품 표 */
.otw{overflow-x:auto;}
.otw::-webkit-scrollbar{height:8px;}
.otbl{width:100%;min-width:660px;border-collapse:collapse;}
.otbl th{
  font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0 12px 13px;border-bottom:1px solid var(--line);
  text-align:center;white-space:nowrap;
}
.otbl th:first-child{text-align:left;}
.otbl td{padding:20px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;font-size:14px;}
.otbl td:first-child{text-align:left;}
.ot__p{display:flex;gap:16px;align-items:flex-start;}
.ot__a{width:76px;height:95px;flex:none;background:var(--shot);overflow:hidden;}
.ot__a img{width:100%;height:100%;object-fit:cover;}
.ot__b{min-width:0;padding-top:2px;}
.ot__br{font-size:12px;font-weight:700;color:var(--ink-3);}
.ot__n{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.024em;margin:3px 0 7px;line-height:1.45;}
.ot__o{font-size:12.5px;color:var(--ink-3);line-height:1.6;}
.ot__was{color:var(--ink-3);text-decoration:line-through;font-size:13px;}
.ot__dc{color:var(--clay);font-weight:700;}
.ot__pay{font-weight:800;font-size:15px;letter-spacing:-.03em;}
.ot__f{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  background:var(--tint);padding:16px 20px;font-size:14px;
}
.ot__f b{font-size:18px;font-weight:850;letter-spacing:-.04em;}
.ot__note{font-size:12px;color:var(--ink-3);line-height:1.7;text-align:right;margin-top:12px;}

/* 폼 */
.frow{display:flex;align-items:flex-start;gap:16px;padding:11px 0;}
.frow > label{flex:none;width:104px;font-size:13.5px;font-weight:700;color:var(--ink-2);padding-top:12px;}
.frow > div{flex:1;min-width:0;}
@media (max-width:640px){
  .frow{flex-direction:column;gap:6px;}
  .frow > label{width:auto;padding-top:0;}
}
.finp{
  height:44px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  font-size:14.5px;width:100%;
}
.finp:focus{outline:none;border-color:var(--ink);}
.finp[data-e="true"]{border-color:var(--clay);}
.fphone{display:flex;align-items:center;gap:7px;max-width:340px;}
.fphone select{width:96px;flex:none;}
.fphone i{font-style:normal;color:var(--ink-3);}
.fhint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.6;}
.ferr{font-size:12.5px;color:var(--clay);font-weight:600;margin-top:6px;}
.fchk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);}
.fchk input{width:16px;height:16px;accent-color:var(--ink);}

/* 오른쪽 합계 */
.sum2{background:var(--paper);border:1px solid var(--line);padding:24px;position:sticky;top:120px;}
@media (max-width:940px){.sum2{position:static;}}
.sum2 h3{font-size:16px;font-weight:800;letter-spacing:-.035em;padding-bottom:16px;border-bottom:1px solid var(--ink);}
.sum2__r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px;color:var(--ink-2);}
.sum2__r b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.sum2__r.dc b{color:var(--clay);}
.sum2__t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:18px;margin-top:8px;border-top:1px solid var(--line);}
.sum2__t span{font-size:15px;font-weight:800;}
.sum2__t b{font-size:30px;font-weight:850;letter-spacing:-.05em;font-variant-numeric:tabular-nums;}
.sum2__t b em{font-style:normal;font-size:16px;font-weight:700;margin-left:2px;}

/* ============================================================
   로그인 · 비회원 조회
   ============================================================ */
.auth{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;
  width:min(408px,calc(100vw - 28px));max-height:92vh;overflow-y:auto;
  background:#fff;border-radius:4px;box-shadow:0 30px 70px -18px rgba(0,0,0,.5);padding:34px 30px 28px;
}
.auth__lg{text-align:center;font-size:25px;font-weight:850;letter-spacing:-.06em;margin-bottom:22px;}
.auth__lg em{font-style:normal;color:var(--ink-3);font-weight:700;}
.auth__tb{display:flex;gap:0;background:var(--tint);border-radius:100px;padding:4px;margin-bottom:24px;}
.auth__tb button{
  flex:1;height:38px;border:0;border-radius:100px;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink-3);letter-spacing:-.02em;
}
.auth__tb button[aria-selected="true"]{background:var(--ink);color:#fff;}
.auth__f{display:flex;flex-direction:column;gap:2px;}
.auth__i{position:relative;}
.auth__i input{
  width:100%;height:52px;border:0;border-bottom:1px solid var(--line-2);background:none;
  font-size:15px;padding:0 30px 0 2px;
}
.auth__i input:focus{outline:none;border-bottom-color:var(--ink);}
.auth__i input::placeholder{color:var(--ink-3);}
.auth__i button{
  position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;
  color:var(--ink-3);padding:6px;
}
.auth__save{display:flex;align-items:center;gap:9px;margin:18px 0 6px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
.auth__save i{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;
  display:grid;place-items:center;
}
.auth__save i::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent;}
.auth__save[data-on="true"] i{border-color:var(--ink);}
.auth__save[data-on="true"] i::after{background:var(--ink);}
.auth__go{
  width:100%;height:52px;border:0;border-radius:2px;background:var(--tint);color:var(--ink);cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:-.02em;margin-top:12px;
}
.auth__go:hover{background:#EBE7DF;}
.auth__go--k{background:#FEE500;color:#191600;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:9px;}
.auth__go--k:hover{background:#F5DC00;}
.auth__go--d{background:var(--ink);color:#fff;}
.auth__go--d:hover{background:#000;}
.auth__links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;}
.auth__links button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;padding:0;}
.auth__links button:last-child{color:var(--ink);font-weight:700;}
.auth__or{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:var(--ink-3);font-size:12.5px;}
.auth__or::before,.auth__or::after{content:"";flex:1;height:1px;background:var(--line);}
.auth__soc{display:flex;justify-content:center;gap:14px;}
.auth__soc button{
  width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  font-size:17px;font-weight:800;color:#fff;
}
.auth__x{position:absolute;right:12px;top:12px;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:6px;}
.auth__note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
.auth__note b{color:var(--ink-2);}

/* ============================================================
   가게 — 상품 상세
   ============================================================ */
.pd{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:44px;padding:30px 0 60px;align-items:start;}
@media (max-width:940px){.pd{grid-template-columns:1fr;gap:26px;}}
.pd__a{background:var(--shot);aspect-ratio:4/5;overflow:hidden;position:sticky;top:120px;}
@media (max-width:940px){.pd__a{position:static;aspect-ratio:4/5;max-height:64vh;}}
.pd__a img{width:100%;height:100%;object-fit:cover;}
.pd h1{font-size:29px;font-weight:800;letter-spacing:-.045em;}
.pd__c{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;}
.pd__p{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px;}
.pd__p b{font-size:27px;font-weight:850;letter-spacing:-.045em;}
.pd__p s{font-size:16px;color:var(--ink-3);}
.pd__p em{font-style:normal;font-size:16px;font-weight:800;color:var(--clay);}
.pd__d{color:var(--ink-2);font-size:14.5px;line-height:1.85;font-weight:350;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:18px;}

.opt{padding:18px 0;border-top:1px solid var(--line);}
.opt__l{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.opt__l span{font-weight:500;color:var(--ink-3);font-size:12.5px;}
.opt__v{display:flex;gap:7px;flex-wrap:wrap;}
.opt__v button{
  min-width:46px;height:40px;padding:0 13px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper);
  cursor:pointer;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.opt__v button:hover{border-color:var(--ink);}
.opt__v button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700;}
.opt__v button[data-out="true"]{color:var(--ink-3);border-style:dashed;text-decoration:line-through;cursor:not-allowed;}
.opt__v button[data-out="true"]:hover{border-color:var(--line-2);}
.opt__v i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:2px;height:40px;}
.qty button{width:38px;height:100%;border:0;background:none;cursor:pointer;font-size:17px;color:var(--ink-2);}
.qty button:hover{background:var(--tint);color:var(--ink);}
.qty button[disabled]{opacity:.3;cursor:not-allowed;}
.qty span{min-width:44px;text-align:center;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;}

.pick{background:var(--tint);padding:13px 14px;display:flex;align-items:flex-start;gap:12px;margin-top:10px;}
.pick__t{flex:1;min-width:0;}
.pick__t b{display:block;font-size:13.5px;font-weight:700;}
.pick__t span{display:block;font-size:12.5px;color:var(--ink-3);}
.pick__x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1;padding:2px 4px;}
.sum{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0;border-top:1px solid var(--ink);margin-top:16px;}
.sum span{font-size:13.5px;font-weight:700;color:var(--ink-2);}
.sum b{font-size:24px;font-weight:850;letter-spacing:-.045em;}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info{font-size:12.5px;color:var(--ink-3);line-height:1.85;padding-top:18px;border-top:1px solid var(--line);margin-top:20px;}
.info b{color:var(--ink-2);}

/* ============================================================
   가게 — 장바구니 · 주문서
   ============================================================ */
.two{display:grid;grid-template-columns:1fr 356px;gap:30px;align-items:start;padding-bottom:70px;}
@media (max-width:940px){.two{grid-template-columns:1fr;}}
.rows{border-top:1px solid var(--ink);}
.row{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.row__a{width:80px;height:100px;flex:none;background:var(--shot);overflow:hidden;}
.row__a img{width:100%;height:100%;object-fit:cover;}
.row__b{flex:1;min-width:0;}
.row__b b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.022em;}
.row__b span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.row__c{display:flex;align-items:center;gap:14px;margin-top:11px;flex-wrap:wrap;}
.row__p{text-align:right;flex:none;}
.row__p b{font-size:15px;font-weight:800;letter-spacing:-.035em;}
.row__x{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px;}
.row__x:hover{color:var(--ink);}
.warn{font-size:12.5px;color:var(--clay);font-weight:600;margin-top:7px;}

.pane{background:var(--paper);border:1px solid var(--line);padding:20px;position:sticky;top:120px;}
@media (max-width:940px){.pane{position:static;}}
.pane h3{font-size:16px;font-weight:800;letter-spacing:-.035em;padding-bottom:14px;border-bottom:1px solid var(--line);}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;color:var(--ink-2);}
.li b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.li--d b{color:var(--clay);}
.li--t{border-top:1px solid var(--ink);margin-top:10px;padding-top:14px;font-size:15px;}
.li--t span{font-weight:700;color:var(--ink);}
.li--t b{font-size:21px;font-weight:850;letter-spacing:-.045em;}
.li small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;}
.bar{height:5px;background:var(--tint);margin:4px 0 8px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s ease;}

.cpn{display:flex;gap:7px;padding:14px 0;border-top:1px solid var(--line);margin-top:10px;}
.cpn input{flex:1;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;font-size:13.5px;}
.cpn input:focus{outline:none;border-color:var(--ink);}

.steps{display:flex;align-items:center;gap:9px;padding:22px 0 4px;}
.steps div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-3);}
.steps i{
  width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;
  font-size:12px;background:var(--tint);color:var(--ink-3);
}
.steps div[data-on="true"]{color:var(--ink);}
.steps div[data-on="true"] i{background:var(--ink);color:#fff;}
.steps u{width:26px;height:1px;background:var(--line-2);text-decoration:none;}

.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (max-width:560px){.pays{grid-template-columns:1fr;}}
.pays button{
  border:1px solid var(--line-2);border-radius:2px;background:var(--paper);cursor:pointer;padding:13px 12px;text-align:left;
}
.pays button:hover{border-color:var(--ink);}
.pays button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.pays b{display:block;font-size:14px;font-weight:700;}
.pays span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;}

/* ============================================================
   가게 — 주문 내역
   ============================================================ */
.ord{border:1px solid var(--line);background:var(--paper);margin-bottom:14px;}
.ord__h{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--tint);flex-wrap:wrap;}
.ord__h b{font-size:14px;font-weight:800;letter-spacing:-.02em;}
.ord__h span{font-size:12.5px;color:var(--ink-3);}
.ord__h .sp{flex:1;}
.ord__i{display:flex;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:flex-start;}
.ord__i:last-child{border-bottom:0;}
.ord__i .a{width:58px;height:72px;flex:none;background:var(--shot);overflow:hidden;}
.ord__i .a img{width:100%;height:100%;object-fit:cover;}
.ord__i .b{flex:1;min-width:0;}
.ord__i .b b{display:block;font-size:14px;font-weight:600;}
.ord__i .b span{display:block;font-size:12.5px;color:var(--ink-3);}
.ord__i .c{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}

.flow{display:flex;align-items:center;gap:0;padding:4px 0 2px;flex-wrap:wrap;}
.flow div{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-3);}
.flow i{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none;}
.flow u{width:20px;height:1.5px;background:var(--line);margin:0 7px;text-decoration:none;}
.flow div[data-on="true"]{color:var(--ink);}
.flow div[data-on="true"] i{background:var(--leaf);}
.flow div[data-now="true"] i{background:var(--ink);box-shadow:0 0 0 3px rgba(22,21,15,.14);}
.flow div[data-x="true"]{color:var(--clay);}
.flow div[data-x="true"] i{background:var(--clay);}

.trk{border-top:1px solid var(--line);padding:13px 16px;background:#FDFCFA;font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;}
.trk b{color:var(--ink);font-weight:700;}

/* ============================================================
   뒷단 — 작업대
   ============================================================ */
.s{background:var(--sbg);color:var(--sink);min-height:100vh;font-size:13.5px;letter-spacing:-.012em;}
.s .wrap{max-width:1240px;}
.s__top{
  position:sticky;top:40px;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;
  background:var(--steel);color:#E7ECF2;
}
.s__mk{display:flex;align-items:center;gap:9px;}
.s__mk i{width:22px;height:22px;background:#E7ECF2;color:var(--steel);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;}
.s__mk b{font-size:14.5px;font-weight:800;letter-spacing:-.03em;}
.s__mk span{font-size:12px;color:#93A0B1;padding-left:10px;border-left:1px solid #3D4E63;}
.s__sp{flex:1;}
.s__u{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B7C1CE;}
.s__u i{width:24px;height:24px;border-radius:50%;background:#3D4E63;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#E7ECF2;}
.s__nav{
  position:sticky;top:92px;z-index:49;display:flex;gap:0;padding:0 20px;overflow-x:auto;
  background:var(--spanel);border-bottom:1px solid var(--sline);
}
.s__nav::-webkit-scrollbar{height:0;}
.s__nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:12px 14px;white-space:nowrap;

      <h3 style="font-size:18px;font-weight:800;letter-spacing:-.04em;margin:36px 0 4px">정한 것</h3>
      <div class="rules card" style="padding:4px 20px;margin-top:12px">
        <div><b>상태는 주문이 아니라 품목에 붙습니다</b>
          <span>세 개를 시키면 하나는 취소되고, 하나는 배송되고, 하나는 반품될 수 있습니다.
            주문 하나에 상태 하나를 두면 이 상황을 적을 자리가 없어집니다. 목록도 환불도 정산도 전부 품목 단위로 돕니다.</span></div>
        <div><b>취소는 승인이 없고 반품은 있습니다</b>
          <span>배송 전 취소는 판매자가 거절할 이유가 없어 즉시 처리합니다. 반품은 물건이 돌아와야 끝나므로 승인과 수거가 사이에 들어갑니다.</span></div>
        <div><b>재고는 결제 시점에 뺍니다</b>

        <div><b>무통장만 예외로 재고를 잡습니다</b>
          <span>입금까지 기다리는 사이에 남이 사 가면 환불 말고는 방법이 없습니다. 대신 7일 안에 입금이 없으면 자동으로 취소하고 재고를 풉니다.</span></div>
        <div><b>부분 취소로 무료배송이 깨지면 배송비를 회수합니다</b>
          <span>5만원어치를 시켜 무료로 받고 4만원어치를 취소하면 남은 금액은 1만원입니다.
            이때 배송비 3,000원을 환불액에서 뺍니다. 안 그러면 무료배송 조건을 취소로 우회할 수 있습니다.</span></div>
        <div><b>쿠폰은 품목 금액대로 나눠 돌려받습니다</b>
          <span>1만원 쿠폰을 쓴 주문에서 절반을 취소하면 쿠폰 5,000원도 함께 회수합니다. 안 나누면 취소할수록 이득이 됩니다.</span></div>
        <div><b>구매확정 뒤에는 반품이 없습니다</b>
          <span>정산이 이미 나갔기 때문입니다. 확정 전 7일이 그래서 있습니다.</span></div>
      </div>

      <h3 style="font-size:18px;font-weight:800;letter-spacing:-.04em;margin:36px 0 4px">일부러 뺀 것</h3>

        <div><b>교환</b><span>반품과 새 주문을 묶은 것이라 상태가 두 배로 늘어납니다. 첫 판에서는 "반품하고 다시 주문" 으로 안내하는 곳이 많습니다.</span></div>
        <div><b>부분 수량 취소</b><span>3개 중 1개만 취소하는 것. 쿠폰·배송비 안분이 한 겹 더 복잡해집니다. 품목 단위까지만 갑니다.</span></div>
        <div><b>회원 등급 · 적립금</b><span>파는 것이 자리 잡기 전에는 계산할 것만 늘어납니다.</span></div>
        <div><b>실제 배송 조회</b><span>택배사 API 는 계약이 먼저입니다. 송장번호만 받아 두고 링크로 넘깁니다.</span></div>
      </div>
    </div>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
          <div>여기서 어떤 조합을 <b>0</b> 으로 바꾸고 고객 화면으로 가면, 그 조합은 고를 수 없게 되고
            장바구니에 이미 담아 둔 것은 결제가 막힙니다. 결제 직전에 한 번 더 세기 때문입니다.</div>
        </div>
      </div>
    </template>

    <!-- ---------- 정산 ---------- -->
    <template x-if="sview==='settle'">
      <div>
        <div class="s__hd"><h1>정산</h1><p>구매확정된 품목만 정산 대상입니다</p></div>
        <div class="kpi">
          <div><span>확정 판매액</span><b class="num" x-text="won(settle.gross)"></b><em x-text="settle.n + '개 품목'"></em></div>
          <div data-t="bad"><span>결제 수수료 3.3%</span><b class="num" x-text="'− ' + won(settle.fee)"></b><em>카드 · 간편결제</em></div>
          <div data-t="bad"><span>환불액</span><b class="num" x-text="'− ' + won(settle.refund)"></b><em>취소 · 반품</em></div>
          <div data-t="ok"><span>정산 예정액</span><b class="num" x-text="won(settle.net)"></b><em>확정 +3영업일</em></div>
        </div>

        <div class="spanel" style="margin-bottom:12px">
          <div class="spanel__h">최근 7일 결제액<span class="sp"></span>
            <span style="font-size:12px;color:var(--sink-3)" x-text="won(week.reduce((a,b) => a + b.v, 0))"></span></div>
          <div class="spanel__b">
            <div class="chart">
              <template x-for="d in week" :key="d.l">
                <div>
                  <i :style="'height:' + (weekMax ? Math.max(2, d.v / weekMax * 108) : 2) + 'px'"></i>
                  <span x-text="d.l"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="tbwrap"><table class="tb">
          <thead><tr>
            <th style="width:126px">주문번호</th><th>상품</th><th style="width:104px">상태</th>
            <th class="r" style="width:96px">판매액</th><th class="r" style="width:88px">수수료</th>
            <th class="r" style="width:96px">환불</th><th class="r" style="width:104px">정산액</th>
          </tr></thead>
          <tbody>
            <template x-for="r in settleRows" :key="r.id">
              <tr>
                <td class="mut mono nw" style="font-size:11.5px" x-text="r.oid"></td>
                <td x-text="r.name"></td>
                <td><span class="st" :class="'st--' + stClass(r.state)"><i></i><span x-text="stLabel(r.state)"></span></span></td>
                <td class="r num nw" x-text="won(r.gross)"></td>
                <td class="r num nw mut" x-text="r.fee ? '− ' + won(r.fee) : '—'"></td>
                <td class="r num nw" :style="r.refund ? 'color:#B03A2E' : ''" x-text="r.refund ? '− ' + won(r.refund) : '—'"></td>
                <td class="r num nw" style="font-weight:700" x-text="won(r.net)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="tb__none" x-show="!settleRows.length">정산할 것이 아직 없습니다.
          주문을 배송완료까지 보내고 고객이 구매확정을 누르면 여기에 잡힙니다.</p></div>

        <div class="snote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
          <div>배송완료만으로는 정산하지 않습니다. 반품 기간이 남아 있어서, 정산하고 나서 돌려주면 다시 받아 와야 하기 때문입니다.
            <b>구매확정</b> 이 정산의 시작점인 이유입니다.</div>
        </div>
      </div>
    </template>

  </div>
</div>
</template>

<template x-if="authOpen">

      <button class="auth__x" @click="authOpen=false" aria-label="닫기">

      </button>
      <p class="auth__lg">TAG<em>SEOUL</em></p>

      <div class="auth__tb" role="tablist">
        <button role="tab" :aria-selected="authTab!=='guest'" @click="authTab='in'">기존 회원이세요?</button>

                  <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
                  <path x-show="!pwShow" d="M4 20L20 4"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="auth__save" :data-on="login.save" @click="login.save=!login.save" type="button">
            <i></i><span>아이디저장</span>
          </button>
          <p class="ferr" x-show="login.err" x-text="login.err"></p>
          <button class="auth__go" @click="doLogin()">기존 회원 로그인</button>
          <button class="auth__go auth__go--k" @click="social('카카오')">
            <svg width="17" height="16" viewBox="0 0 24 22" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 4.2 0 9.4c0 3.3 2.2 6.2 5.5 7.9l-1.4 5.1c-.1.4.3.7.7.5l6.1-4c.4 0 .7.1 1.1.1 6.6 0 12-4.2 12-9.6S18.6 0 12 0z"/></svg>
            카카오 1초 로그인/회원가입
          </button>
          <div class="auth__links">
            <button @click="toast('데모라 찾기 화면은 없습니다')">아이디/비밀번호 찾기</button>
            <button @click="social('이메일 가입')">회원가입</button>
          </div>
          <div class="auth__or">또는</div>
          <div class="auth__soc">
            <button style="background:#03C75A" @click="social('네이버')" aria-label="네이버로 로그인">N</button>
            <button style="background:#1877F2" @click="social('페이스북')" aria-label="페이스북으로 로그인">f</button>
            <button style="background:#111" @click="social('애플')" aria-label="애플로 로그인">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.6-1.9-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.3c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
            </button>
          </div>
          <p class="auth__note">
            <b>데모 계정이 채워져 있습니다.</b> 그대로 로그인을 누르거나 소셜 단추를 눌러도 같은 계정으로 들어갑니다.
            실제로는 이 자리에 소셜 인증과 약관 동의가 붙습니다.
          </p>
        </div>
      </template>

      <template x-if="authTab==='guest'">
        <div>
          <p style="font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-bottom:6px">
            회원가입 없이 주문하셨다면 주문번호와 주문하신 분 이름으로 조회할 수 있습니다.
          </p>
          <div class="auth__f">
            <div class="auth__i"><input x-model="guest.no" placeholder="주문번호 (TAG-000000-000)"></div>
            <div class="auth__i"><input x-model="guest.name" placeholder="주문자 이름"></div>
          </div>
          <p class="ferr" x-show="guest.err" x-text="guest.err"></p>
          <button class="auth__go auth__go--d" style="margin-top:20px" @click="findOrder()">주문 조회</button>
          <p class="auth__note">
            비회원 주문은 <b>주문번호와 이름이 모두 맞아야</b> 열립니다. 실제 서비스에서는 여기에 접근 횟수 제한을 겁니다 —
            주문번호를 하나씩 넣어 보며 남의 주문을 열어 보는 것을 막아야 하기 때문입니다.
          </p>
        </div>
      </template>
    </div>
  </div>
</template>

     되물음
     ============================================================ -->
<template x-if="ask">
  <div>
    <button class="scrim" @click="ask=null" aria-label="닫기"></button>
    <div class="modal" role="dialog" aria-modal="true">

      <!-- 주문 취소 -->
      <template x-if="ask.k==='cancel'">
        <div>
          <h3>이 상품을 취소합니다</h3>
          <p x-text="ask.it.name + ' · ' + ask.it.sku.split('/').join(' · ') + ' · ' + ask.it.qty + '개'"></p>
          <div class="calc">
            <div><span>상품 금액</span><b x-text="won(rf.goods)"></b></div>
            <div x-show="rf.couponBack"><span>쿠폰 회수 (금액대로 나눔)</span><b x-text="'− ' + won(rf.couponBack)"></b></div>
            <div x-show="rf.shipBack"><span>배송비 환불 (주문 전체 취소)</span><b x-text="'+ ' + won(rf.shipBack)"></b></div>
            <div x-show="rf.shipCharge"><span>배송비 회수 (무료배송 조건 미달)</span><b x-text="'− ' + won(rf.shipCharge)"></b></div>
            <div class="t"><span>돌려드릴 금액</span><b x-text="won(rf.total)"></b></div>
            <small x-text="rf.why"></small>
          </div>
          <div class="modal__f">
            <button class="btn btn--q" @click="ask=null">닫기</button>
            <button class="btn btn--red" @click="doCancel()">취소하고 환불받기</button>
          </div>
        </div>
      </template>

      <!-- 반품 신청 -->
      <template x-if="ask.k==='return'">
        <div>
          <h3>반품을 신청합니다</h3>
          <p x-text="ask.it.name + ' · ' + ask.it.sku.split('/').join(' · ')"></p>
          <div class="fld" style="margin-top:16px">
            <label for="rr">사유</label>
            <select id="rr" x-model="returnKind">
              <option value="변심">단순 변심 · 사이즈가 안 맞음</option>
              <option value="불량">상품 불량 · 오배송</option>
            </select>
          </div>
          <div class="fld" style="margin-top:12px">
            <label for="rd">자세히</label>
            <textarea id="rd" x-model="returnMemo" placeholder="어깨가 생각보다 넓습니다. 한 치수 작은 것으로 다시 시킬게요."></textarea>
          </div>
          <div class="calc">
            <div><span>상품 금액</span><b x-text="won(rf.goods)"></b></div>
            <div x-show="rf.couponBack"><span>쿠폰 회수</span><b x-text="'− ' + won(rf.couponBack)"></b></div>
            <div x-show="rf.returnFee"><span>반품 배송비 (단순 변심)</span><b x-text="'− ' + won(rf.returnFee)"></b></div>
            <div x-show="rf.shipCharge"><span>배송비 회수 (무료배송 조건 미달)</span><b x-text="'− ' + won(rf.shipCharge)"></b></div>
            <div class="t"><span>환불 예정</span><b x-text="won(rf.total)"></b></div>
            <small>판매자가 물건을 확인한 뒤 환불합니다. 불량이면 반품 배송비를 받지 않습니다.</small>
          </div>
          <div class="modal__f">
            <button class="btn btn--q" @click="ask=null">닫기</button>
            <button class="btn" @click="doReturn()" :disabled="!returnMemo.trim()">반품 신청</button>
          </div>
        </div>
      </template>

      <!-- 구매확정 -->
      <template x-if="ask.k==='confirm'">
        <div>
          <h3>구매를 확정합니다</h3>
          <p>확정하면 <b>반품할 수 없습니다.</b> 판매자에게 정산이 나가기 때문입니다.
            받은 날부터 7일이 지나면 자동으로 확정됩니다.</p>
          <div class="modal__f">
            <button class="btn btn--q" @click="ask=null">조금 더 볼게요</button>
            <button class="btn" @click="doConfirm()">확정</button>
          </div>
        </div>
      </template>

      <!-- 반품 거절 (판매자) -->
      <template x-if="ask.k==='refuse'">
        <div>
          <h3>반품을 거절합니다</h3>
          <p>사유는 고객 화면에 그대로 보입니다. 비워 두면 거절할 수 없습니다.</p>
          <div class="fld" style="margin-top:16px">
            <label for="rj">거절 사유</label>
            <textarea id="rj" x-model="refuseMemo" placeholder="착용 흔적이 있어 재판매가 어렵습니다. 사진을 메일로 보내 드렸습니다."></textarea>
          </div>
          <div class="modal__f">
            <button class="btn btn--q" @click="ask=null">닫기</button>
            <button class="btn btn--red" @click="doRefuse()" :disabled="!refuseMemo.trim()">거절</button>
          </div>
        </div>
      </template>

      <!-- 반품 환불 (판매자) -->
      <template x-if="ask.k==='refund'">
        <div>
          <h3>물건을 확인하고 환불합니다</h3>
          <p x-text="ask.it.name + ' · ' + ask.it.sku.split('/').join(' · ') + ' · ' + (ask.it.reason || '')"></p>
          <div class="calc">
            <div><span>상품 금액</span><b x-text="won(rf.goods)"></b></div>
            <div x-show="rf.couponBack"><span>쿠폰 회수</span><b x-text="'− ' + won(rf.couponBack)"></b></div>
            <div x-show="rf.returnFee"><span>반품 배송비</span><b x-text="'− ' + won(rf.returnFee)"></b></div>
            <div x-show="rf.shipCharge"><span>배송비 회수</span><b x-text="'− ' + won(rf.shipCharge)"></b></div>
            <div class="t"><span>환불액</span><b x-text="won(rf.total)"></b></div>
            <small>환불과 함께 재고를 되돌립니다. 상태가 나빠 되팔 수 없으면 재고를 올리지 않고 폐기로 잡아야 하는데, 그건 이 데모에 없습니다.</small>
          </div>
          <div class="modal__f">
            <button class="btn btn--q" @click="ask=null">닫기</button>
            <button class="btn" @click="doRefund()">환불하고 반품 완료</button>
          </div>
        </div>
      </template>

      <!-- 우편번호 찾기 -->
      <template x-if="ask.k==='zip'">
        <div>
          <h3>우편번호 찾기</h3>
          <p>실제로는 도로명주소 검색이 붙는 자리입니다. 데모에서는 아래에서 고르세요.</p>
          <div class="modal__l">
            <template x-for="z in zips" :key="z.zip">
              <div style="cursor:pointer" @click="pickZip(z)">
                <b class="mono" style="font-size:12.5px" x-text="z.zip"></b>
                <span x-text="z.addr"></span>
                <span class="sp"></span>
                <span style="color:var(--ink-3);font-size:11.5px">고르기</span>
              </div>
            </template>
          </div>
          <div class="modal__f"><button class="btn btn--q" @click="ask=null">닫기</button></div>
        </div>
      </template>

      <!-- 고객센터 -->
      <template x-if="ask.k==='cs'">
        <div>
          <h3>고객센터</h3>
          <p>평일 10:00 – 17:00 · 점심 12:30 – 13:30 · 주말·공휴일 휴무</p>
          <div class="modal__l">
            <div><b>배송은 얼마나 걸리나요</b><span class="sp"></span><span>평일 15시 이전 결제분 당일 출고 · 보통 2–3일</span></div>

function p2(n){ return n < 10 ? "0" + n : "" + n; }
function p3(n){ return n < 10 ? "00" + n : (n < 100 ? "0" + n : "" + n); }
function isoOf(d){ return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function seed(s){ var h = 2166136261; for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function wonOf(n){ return "₩" + Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* 옵션 조합마다 SKU 를 만든다. 같은 상품이면 늘 같은 재고가 나오도록 씨앗을 쓴다. */
function skusOf(opts, key){
  var combos = [[]];
  opts.forEach(function(o){
    var next = [];
    combos.forEach(function(c){ o.vs.forEach(function(v){ next.push(c.concat([v])); }); });
    combos = next;
  });
  if(!opts.length) combos = [["기본"]];
  var out = {}, pool = [0, 1, 2, 3, 4, 6, 8, 9, 12, 15];
  combos.forEach(function(c){ out[c.join("/")] = { stock: pool[seed(key + c.join("/")) % 10] }; });
  var ks = Object.keys(out);
  out[ks[0]].stock = 8;                                   /* 하나는 반드시 살 수 있게 */
  if(ks.length > 2) out[ks[ks.length - 2]].stock = 0;     /* 하나는 반드시 품절 */
  return out;
}

      });

    },

    },

    /* ---- 정산 ---- */

      var out = [], self = this;

       ============================================================ */
    go(v){ this.view = v; this.errMsg = ""; window.scrollTo(0, 0); },

  };
