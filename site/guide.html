/* ============================================================
   INDEX — 세림화학 사내 문서 검색 어시스턴트
   RAG 데모. 네 견본과 또 결을 갈랐다.
   PALLET 라이트 어드민, MAT 따뜻한 종이, STAMP 서류,
   TAG 밝은 가게 — 이쪽은 어두운 도구 위에 밝은 원문을 얹는다.

   하고 싶은 말 두 가지.
   1) 답변 옆에는 늘 '왜 이렇게 답했는지' 가 열려 있어야 한다.
      질의 재작성 → 후보 → 재순위 → 실제로 쓴 문단까지 보인다.
   2) 권한은 답변 단계가 아니라 검색 단계에서 건다.
      답을 만들어 놓고 가리면 이미 샌 것이다.
   ============================================================ */
:root{
  --bg:#0D0F15;
  --panel:#141822;
  --panel-2:#1B202C;
  --panel-3:#232936;
  --line:#262D3B;
  --line-2:#354055;

  --ink:#E9ECF3;
  --ink-2:#98A2B7;
  --ink-3:#6A748B;

  --iris:#8B7BF7;   --iris-soft:rgba(139,123,247,.14);
  --sky:#4C9AFF;    --sky-soft:rgba(76,154,255,.13);
  --ok:#3DD68C;     --ok-soft:rgba(61,214,140,.13);
  --warn:#F0A93B;   --warn-soft:rgba(240,169,59,.13);
  --crit:#F2637E;   --crit-soft:rgba(242,99,126,.13);

  /* 원문은 종이다 */
  --paper:#FBFAF6;
  --paper-2:#F2EFE7;
  --pline:#E2DDD0;
  --pink-1:#1A1A17;
  --pink-2:#5C5850;
  --mark:#FFE9A3;

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --rail:224px; --side:372px;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.65;letter-spacing:-.013em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.035em;}

/* ---------- 조각 ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 13px;border-radius:7px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);
  transition:background .14s,border-color .14s,color .14s;
}
.b:hover{background:var(--panel-3);border-color:var(--ink-3);}
.b--p{background:var(--iris);border-color:var(--iris);color:#12101F;font-weight:700;}
.b--p:hover{background:#9C8EF8;border-color:#9C8EF8;}
.b--g{background:transparent;border-color:transparent;color:var(--ink-2);}
.b--g:hover{background:var(--panel-2);color:var(--ink);}
.b--sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.b--lg{height:42px;padding:0 18px;font-size:14.5px;}
.b[disabled]{opacity:.4;cursor:not-allowed;}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:11.5px;font-weight:700;letter-spacing:-.008em;white-space:nowrap;
  background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--pub{background:var(--ok-soft);color:var(--ok);}
.pill--team{background:var(--sky-soft);color:var(--sky);}
.pill--hr{background:var(--warn-soft);color:var(--warn);}
.pill--exec{background:var(--crit-soft);color:var(--crit);}
.pill--iris{background:var(--iris-soft);color:var(--iris);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;}
.note{
  display:flex;gap:10px;padding:13px 15px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.75;
}
.note svg{flex:none;margin-top:3px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--iris{background:var(--iris-soft);border-color:rgba(139,123,247,.3);}
.note--iris svg{color:var(--iris);}
.note--warn{background:var(--warn-soft);border-color:rgba(240,169,59,.3);}
.note--warn svg{color:var(--warn);}
.note--crit{background:var(--crit-soft);border-color:rgba(242,99,126,.3);}
.note--crit svg{color:var(--crit);}

/* ============================================================
   틀
   ============================================================ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh;overflow:hidden;}

.rail{
  display:flex;flex-direction:column;min-height:0;
  background:#0A0C11;border-right:1px solid var(--line);
}
.rail__hd{flex:none;padding:16px 16px 14px;border-bottom:1px solid var(--line);}
.rail__bk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);}
.rail__bk:hover{color:var(--iris);}
.mk{display:flex;align-items:center;gap:9px;margin-top:11px;}
.mk__i{
  width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--iris),var(--sky));color:#0B0D14;
}
.mk__t{font-size:16px;font-weight:800;letter-spacing:-.05em;}
.mk__c{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:-.01em;}

.rail__nav{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.rail__l{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.13em;padding:14px 8px 6px;}
.rail__nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  border:0;background:none;cursor:pointer;text-align:left;
  font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.016em;
}
.rail__nav button:hover{background:var(--panel);color:var(--ink);}
.rail__nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);font-weight:700;}
.rail__nav button svg{flex:none;opacity:.8;}
.rail__nav button[aria-current="true"] svg{color:var(--iris);opacity:1;}
.rail__nav em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);}

.who{flex:none;border-top:1px solid var(--line);padding:12px 10px;}
.who__b{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;
}
.who__b:hover{border-color:var(--line-2);}
.who__av{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--panel-3);color:var(--ink);font-size:12px;font-weight:700;
}
.who__t{flex:1;min-width:0;}
.who__t b{display:block;font-size:13px;font-weight:700;line-height:1.25;}
.who__t span{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who__m{
  position:absolute;left:10px;bottom:66px;width:270px;z-index:60;
  background:var(--panel);border:1px solid var(--line-2);border-radius:11px;padding:5px;
  box-shadow:0 24px 56px -18px rgba(0,0,0,.9);
}
.who__h{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;padding:9px 10px 6px;}
.who__i{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  border:0;background:none;cursor:pointer;text-align:left;
}
.who__i:hover{background:var(--panel-2);}
.who__i[aria-current="true"]{background:var(--iris-soft);}
.who__i div{flex:1;min-width:0;}
.who__i b{display:block;font-size:13px;font-weight:700;}
.who__i span{display:block;font-size:11.5px;color:var(--ink-3);}
.who__f{font-size:11.5px;color:var(--ink-3);line-height:1.65;padding:9px 10px 5px;border-top:1px solid var(--line);margin-top:4px;}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.top{
  flex:none;display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.top h1{font-size:16px;font-weight:800;letter-spacing:-.032em;}
.top p{font-size:12.5px;color:var(--ink-3);}
.top .sp{flex:1;}
.body{flex:1;min-height:0;overflow-y:auto;}
.pad{padding:22px 24px 60px;max-width:1020px;}
@media (max-width:640px){.pad{padding:18px 14px 60px;}}

/* ============================================================
   검색 — 대화와 과정을 나란히
   ============================================================ */
.split{display:grid;grid-template-columns:1fr var(--side);min-height:0;flex:1;}
@media (max-width:1180px){.split{grid-template-columns:1fr;}}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);}
.chat__b{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 8px;}
@media (max-width:640px){.chat__b{padding:16px 14px 8px;}}
.chat__in{
  flex:none;padding:14px 24px 18px;border-top:1px solid var(--line);background:var(--panel);
}
@media (max-width:640px){.chat__in{padding:12px 14px 14px;}}
.ask{display:flex;gap:9px;align-items:flex-end;}
.ask textarea{
  flex:1;min-height:46px;max-height:130px;resize:none;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--panel-2);font-size:14.5px;line-height:1.55;
}
.ask textarea:focus{outline:none;border-color:var(--iris);background:var(--panel-3);}
.ask textarea::placeholder{color:var(--ink-3);}
.ask__go{
  width:46px;height:46px;flex:none;border-radius:10px;border:0;cursor:pointer;
  background:var(--iris);color:#12101F;display:grid;place-items:center;
}
.ask__go:hover{background:#9C8EF8;}
.ask__go[disabled]{opacity:.35;cursor:not-allowed;}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
.chips button{
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;
  padding:7px 11px;border-radius:100px;font-size:12.5px;font-weight:600;letter-spacing:-.016em;
}
.chips button:hover{border-color:var(--iris);color:var(--ink);}
.chips button[data-lock="true"]{opacity:.55;}
.chips button[data-lock="true"]::before{content:"🔒";font-size:10px;margin-right:2px;}

.hero{padding:38px 0 26px;max-width:640px;}
.hero h2{font-size:27px;font-weight:800;letter-spacing:-.048em;line-height:1.25;}
.hero p{color:var(--ink-2);font-size:14.5px;line-height:1.85;margin-top:12px;font-weight:350;}
.hero__k{display:grid;gap:9px;margin-top:22px;}
.hero__k div{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.7;}
.hero__k i{
  width:20px;height:20px;border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;
  background:var(--iris-soft);color:var(--iris);font-style:normal;font-size:11px;font-weight:800;
}
.hero__k b{color:var(--ink);}

.turn{margin-bottom:26px;}
.q{
  display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;
}
.q__a{
  width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--panel-3);color:var(--ink-2);font-size:11px;font-weight:700;
}
.q p{font-size:16px;font-weight:600;letter-spacing:-.026em;line-height:1.5;padding-top:2px;}
.a{display:flex;gap:11px;align-items:flex-start;}
.a__a{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--iris),var(--sky));color:#0B0D14;
}
.a__b{flex:1;min-width:0;}
.a__t{font-size:14.5px;line-height:1.9;color:var(--ink);font-weight:350;}
.a__t b{font-weight:700;}
.cite{
  display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:5px;background:var(--iris-soft);color:var(--iris);border:0;cursor:pointer;
  font-family:var(--m);font-size:10.5px;font-weight:700;margin:0 2px;vertical-align:1px;
}
.cite:hover{background:var(--iris);color:#12101F;}
.srcs{display:flex;flex-direction:column;gap:7px;margin-top:16px;}
.srcs__l{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;}
.src{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
}
.src:hover{border-color:var(--line-2);background:var(--panel-2);}
.src__n{
  width:19px;height:19px;border-radius:5px;flex:none;display:grid;place-items:center;
  background:var(--iris-soft);color:var(--iris);font-family:var(--m);font-size:10.5px;font-weight:700;
}
.src__t{flex:1;min-width:0;}
.src__t b{display:block;font-size:13px;font-weight:600;letter-spacing:-.018em;}
.src__t span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.src__s{font-family:var(--m);font-size:11.5px;color:var(--ink-3);flex:none;}
.a__f{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
.a__f span{font-size:11.5px;color:var(--ink-3);}

.deny{
  border:1px solid rgba(242,99,126,.32);background:var(--crit-soft);border-radius:10px;padding:15px 16px;
}
.deny b{display:block;font-size:14px;font-weight:700;color:var(--crit);margin-bottom:7px;}
.deny p{font-size:13.5px;color:var(--ink-2);line-height:1.8;}
.deny ul{margin:10px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:4px;}
.deny li{font-size:13px;color:var(--ink-2);line-height:1.6;}

.think{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:13.5px;}
.think i{width:7px;height:7px;border-radius:50%;background:var(--iris);animation:bl 1.1s infinite;}
.think i:nth-child(2){animation-delay:.16s;}
.think i:nth-child(3){animation-delay:.32s;}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ============================================================
   과정 패널
   ============================================================ */
.side{display:flex;flex-direction:column;min-height:0;background:#0A0C11;}
@media (max-width:1180px){
  .side{
    position:fixed;inset:auto 0 0 0;height:80dvh;z-index:70;border-top:1px solid var(--line-2);
    border-radius:14px 14px 0 0;transform:translateY(101%);transition:transform .28s ease;
    box-shadow:0 -22px 60px -20px rgba(0,0,0,.9);
  }
  .side[data-open="true"]{transform:none;}
}
.side__hd{flex:none;display:flex;align-items:center;gap:9px;height:47px;padding:0 16px;border-bottom:1px solid var(--line);}
.side__hd b{font-size:13px;font-weight:800;letter-spacing:-.02em;}
.side__hd .sp{flex:1;}
.side__x{display:none;}
@media (max-width:1180px){.side__x{display:grid;}}
.side__b{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 30px;}
.side__e{padding:44px 14px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.85;}

.step{position:relative;padding:0 0 16px 26px;}
.step::before{content:"";position:absolute;left:7px;top:20px;bottom:0;width:1.5px;background:var(--line);}
.step:last-child::before{display:none;}
.step__d{
  position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;
  border:2px solid var(--line-2);background:#0A0C11;
}
.step[data-on="true"] .step__d{border-color:var(--iris);background:var(--iris);}
.step__h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:-.016em;}
.step__h em{margin-left:auto;font-style:normal;font-family:var(--m);font-size:11px;color:var(--ink-3);}
.step__c{margin-top:8px;}
.step__t{font-size:12.5px;color:var(--ink-2);line-height:1.7;}
.step__t code{font-family:var(--m);font-size:11.5px;background:var(--panel-2);border-radius:4px;padding:1px 5px;color:var(--ink);}

.qq{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.qq span{
  font-family:var(--m);font-size:11px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;color:var(--ink-2);
}
.qq span[data-add="true"]{background:var(--iris-soft);border-color:rgba(139,123,247,.3);color:var(--iris);}

.cand{display:flex;flex-direction:column;gap:5px;}
.cand__r{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;width:100%;text-align:left;
}
.cand__r:hover{border-color:var(--line-2);}
.cand__r[data-used="true"]{border-color:rgba(139,123,247,.45);background:var(--iris-soft);}
.cand__r[data-cut="true"]{opacity:.42;}
.cand__k{font-family:var(--m);font-size:10.5px;color:var(--ink-3);width:17px;flex:none;text-align:right;}
.cand__t{flex:1;min-width:0;}
.cand__t b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cand__t span{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{width:44px;height:4px;border-radius:100px;background:var(--panel-3);flex:none;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--iris);}
.cand__s{font-family:var(--m);font-size:11px;color:var(--ink-2);width:34px;text-align:right;flex:none;}
.cand__x{
  font-size:10px;font-weight:700;color:var(--crit);background:var(--crit-soft);border-radius:4px;
  padding:1px 5px;flex:none;
}

/* ============================================================
   원문 — 종이
   ============================================================ */
.doc{
  position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);z-index:80;
  background:var(--paper);color:var(--pink-1);display:flex;flex-direction:column;
  box-shadow:-24px 0 70px -20px rgba(0,0,0,.75);
}
.doc__hd{
  flex:none;display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--pline);
  background:var(--paper-2);
}
.doc__hd b{font-size:15px;font-weight:800;letter-spacing:-.028em;}
.doc__hd span{font-size:12px;color:var(--pink-2);}
.doc__hd .sp{flex:1;}
.doc__x{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--pline);background:var(--paper);
  cursor:pointer;display:grid;place-items:center;color:var(--pink-2);flex:none;
}
.doc__x:hover{background:var(--paper-2);}
.doc__b{flex:1;min-height:0;overflow-y:auto;padding:26px 30px 60px;}
@media (max-width:640px){.doc__b{padding:20px 18px 50px;}}
.doc__m{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--pink-2);padding-bottom:16px;border-bottom:1px solid var(--pline);margin-bottom:20px;}
.doc__m b{color:var(--pink-1);font-weight:600;}
.para{padding:12px 14px;border-radius:8px;margin:0 -14px 4px;line-height:1.95;font-size:14.5px;color:#2B2822;}
.para[data-hit="true"]{background:var(--mark);box-shadow:inset 3px 0 0 #C79A1E;}
.para__n{
  display:block;font-family:var(--m);font-size:11px;color:var(--pink-2);margin-bottom:5px;font-weight:600;
}
.para[data-hit="true"] .para__n{color:#8A6A12;}
.doc__note{
  margin-top:24px;padding:13px 15px;border:1px solid var(--pline);border-radius:9px;background:var(--paper-2);
  font-size:12.5px;color:var(--pink-2);line-height:1.75;
}
.doc__note b{color:var(--pink-1);}
.scrim{position:fixed;inset:0;z-index:75;background:rgba(6,8,12,.66);border:0;width:100%;}

/* ============================================================
   문서함 · 색인 · 설정 · 평가
   ============================================================ */
.hd2{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.hd2 h2{font-size:20px;font-weight:800;letter-spacing:-.038em;}
.hd2 p{font-size:13px;color:var(--ink-3);}
.hd2 .sp{flex:1;}

.tb{width:100%;border-collapse:collapse;font-size:13px;}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);}
.tbw::-webkit-scrollbar{height:8px;}
.tb{min-width:760px;}
.tb th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:11px 13px;white-space:nowrap;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.tb th.r,.tb td.r{text-align:right;}
.tb th.c,.tb td.c{text-align:center;}
.tb td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tb tbody tr:last-child td{border-bottom:0;}
.tb tbody tr{cursor:pointer;}
.tb tbody tr:hover td{background:var(--panel-2);}
.tb .nw{white-space:nowrap;}
.tb .mut{color:var(--ink-3);}
.tb b{font-weight:600;letter-spacing:-.018em;}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
@media (max-width:860px){.kpi{grid-template-columns:repeat(2,1fr);}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px;}
.kpi span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;}
.kpi b{display:block;font-size:23px;font-weight:800;letter-spacing:-.045em;margin-top:3px;}
.kpi em{font-style:normal;font-size:11.5px;color:var(--ink-3);}
.kpi div[data-t="iris"] b{color:var(--iris);}
.kpi div[data-t="ok"] b{color:var(--ok);}
.kpi div[data-t="warn"] b{color:var(--warn);}
.kpi div[data-t="crit"] b{color:var(--crit);}

/* 파이프라인 */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:18px;}
@media (max-width:820px){.pipe{grid-template-columns:1fr 1fr;}}
.pipe > div{
  position:relative;background:var(--panel);border:1px solid var(--line);padding:16px 16px 15px;
}
.pipe > div:first-child{border-radius:11px 0 0 11px;}
.pipe > div:last-child{border-radius:0 11px 11px 0;}
.pipe > div + div{border-left:0;}
@media (max-width:820px){
  .pipe > div{border-radius:0 !important;border-left:1px solid var(--line) !important;}
  .pipe > div:nth-child(1){border-radius:11px 0 0 0 !important;}
  .pipe > div:nth-child(2){border-radius:0 11px 0 0 !important;border-left:0 !important;}
  .pipe > div:nth-child(3){border-top:0;border-radius:0 0 0 11px !important;}
  .pipe > div:nth-child(4){border-top:0;border-left:0 !important;border-radius:0 0 11px 0 !important;}
}
.pipe__n{font-family:var(--m);font-size:11px;color:var(--ink-3);}
.pipe__t{font-size:14px;font-weight:700;letter-spacing:-.024em;margin:5px 0 8px;}
.pipe__v{font-size:22px;font-weight:800;letter-spacing:-.045em;}
.pipe__v em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-3);margin-left:3px;}
.pipe__d{font-size:12px;color:var(--ink-3);line-height:1.65;margin-top:6px;}
.pipe__bar{height:3px;background:var(--panel-3);border-radius:100px;margin-top:11px;overflow:hidden;}
.pipe__bar i{display:block;height:100%;background:var(--iris);width:0;transition:width .5s ease;}
.pipe > div[data-run="true"] .pipe__bar i{width:100%;}

/* 설정 */
.set{display:flex;flex-direction:column;}
.set__r{display:flex;align-items:flex-start;gap:18px;padding:17px 0;border-bottom:1px solid var(--line);}
.set__r:last-child{border-bottom:0;}
.set__t{flex:1;min-width:0;}
.set__t b{display:block;font-size:14px;font-weight:700;letter-spacing:-.022em;}
.set__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:3px;}
.set__c{flex:none;width:230px;}
@media (max-width:700px){.set__r{flex-direction:column;gap:10px;}.set__c{width:100%;}}
.seg{display:flex;gap:3px;padding:3px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);}
.seg button{
  flex:1;height:30px;border:0;border-radius:6px;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--ink-3);
}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--ink);}
.sw{
  position:relative;width:42px;height:24px;border-radius:100px;background:var(--line-2);border:0;cursor:pointer;
  padding:0;transition:background .16s ease;flex:none;
}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .16s ease;}
.sw[data-on="true"]{background:var(--iris);}
.sw[data-on="true"] i{transform:translateX(18px);}
.rng{width:100%;accent-color:var(--iris);}
.rng__l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px;}
.rng__v{font-family:var(--m);font-size:12.5px;color:var(--ink);font-weight:600;}

/* 평가 */
.ev{display:flex;flex-direction:column;}
.ev__r{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);}
.ev__r:last-child{border-bottom:0;}
.ev__i{
  width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:800;
}
.ev__i[data-ok="true"]{background:var(--ok-soft);color:var(--ok);}
.ev__i[data-ok="false"]{background:var(--crit-soft);color:var(--crit);}
.ev__q{flex:1;min-width:0;font-size:13px;}
.ev__q span{display:block;font-size:11.5px;color:var(--ink-3);}
.ev__k{font-family:var(--m);font-size:11.5px;color:var(--ink-3);flex:none;white-space:nowrap;}

/* 노트 */
.doc-note h3{font-size:15px;font-weight:800;letter-spacing:-.026em;margin-bottom:8px;}
.doc-note h3::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--iris);margin:0 9px 3px 0;}
.doc-note p{font-size:13.5px;color:var(--ink-2);line-height:1.9;font-weight:350;}
.doc-note p + p{margin-top:9px;}
.doc-note code{font-family:var(--m);font-size:12px;color:var(--iris);background:var(--iris-soft);padding:1px 6px;border-radius:5px;}
.doc-note b{color:var(--ink);}
.doc-note dl{margin:10px 0 0;display:flex;flex-direction:column;gap:9px;}
.doc-note dt{font-size:13px;font-weight:700;color:var(--ink);}
.doc-note dd{margin:3px 0 0;font-size:13px;color:var(--ink-3);line-height:1.75;}
.hr{height:1px;background:var(--line);margin:22px 0;}

/* 좁은 화면 */
.mtop{display:none;}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .rail{
    position:fixed;left:0;top:0;bottom:0;width:250px;z-index:90;transform:translateX(-101%);
    transition:transform .26s ease;box-shadow:22px 0 60px -22px rgba(0,0,0,.9);
  }
  .rail[data-open="true"]{transform:none;}
  .mtop{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
        background:var(--panel-2);cursor:pointer;flex:none;}
  .who__m{bottom:auto;top:52px;}
}
.fab{
  display:none;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:65;
  align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:100px;border:1px solid var(--line-2);
  cursor:pointer;background:var(--panel-3);color:var(--ink);font-size:13px;font-weight:700;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.8);
}
@media (max-width:1180px){.fab{display:inline-flex;}}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);border-radius:9px;padding:11px 16px;
  font-size:13px;font-weight:600;box-shadow:0 18px 44px -14px rgba(0,0,0,.9);max-width:calc(100vw - 28px);
}
</style>

<div class="app" x-data="idx()" x-cloak @keydown.escape.window="doc=null;whoOpen=false;railOpen=false">

<!-- ============================================================
     왼쪽 레일
     ============================================================ -->
<aside class="rail" :data-open="railOpen" @click.outside="railOpen=false">
  <div class="rail__hd">
    <a class="rail__bk" href="index.html">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      FORGE 견본
    </a>
    <div class="mk">
      <span class="mk__i">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="16.4" width="10" height="2.6" rx="1.3"/></svg>
      </span>
      <span>
        <span class="mk__t">INDEX</span>
        <span class="mk__c">세림화학 사내 문서</span>
      </span>
    </div>
  </div>

  <nav class="rail__nav">
    <p class="rail__l">쓰는 곳</p>
    <button :aria-current="view==='ask'" @click="go('ask')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      검색
    </button>
    <button :aria-current="view==='docs'" @click="go('docs')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/></svg>
      문서함 <em x-text="readable.length + '/' + docs.length"></em>
    </button>

    <p class="rail__l">만드는 곳</p>
    <button :aria-current="view==='index'" @click="go('index')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.2"/></svg>
      색인 파이프라인
    </button>
    <button :aria-current="view==='set'" @click="go('set')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="2.2" fill="currentColor" stroke="none"/></svg>
      검색 설정
    </button>
    <button :aria-current="view==='eval'" @click="go('eval')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4.5 3 3L20 7"/></svg>
      평가 세트 <em x-text="score.recall + '%'"></em>
    </button>
    <button :aria-current="view==='note'" @click="go('note')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"/><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>
      만들 때 정한 것
    </button>
  </nav>

  <div class="who" @click.outside="whoOpen=false">
    <button class="who__b" @click="whoOpen=!whoOpen" :aria-expanded="whoOpen">
      <span class="who__av" x-text="me.name.slice(0,1)"></span>
      <span class="who__t"><b x-text="me.name"></b><span x-text="me.team + ' · ' + levelName(me.level)"></span></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <div class="who__m" x-show="whoOpen" x-transition>
      <p class="who__h">계정을 바꿔 보세요</p>
      <template x-for="u in users" :key="u.id">
        <button class="who__i" :aria-current="u.id===me.id" @click="setMe(u)">
          <span class="who__av" x-text="u.name.slice(0,1)"></span>
          <div><b x-text="u.name"></b><span x-text="u.team + ' · ' + levelName(u.level)"></span></div>
          <span class="pill" :class="'pill--' + u.level" x-text="readableFor(u).length + '건'"></span>
        </button>
      </template>
      <p class="who__f">같은 질문이라도 볼 수 있는 문서가 다르면 답이 달라집니다. 권한은 답변이 아니라 <b style="color:var(--ink)">검색 단계</b>에서 겁니다.</p>
    </div>
  </div>
</aside>

<!-- ============================================================
     본문
     ============================================================ -->
<div class="main">
  <div class="top">
    <button class="mtop" @click.stop="railOpen=!railOpen" aria-label="메뉴">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 x-text="titleOf(view)"></h1>
    <p x-show="view==='ask'">답한 근거를 오른쪽에서 그대로 볼 수 있습니다</p>
    <span class="sp"></span>
    <span class="pill" :class="'pill--' + me.level" x-text="levelName(me.level) + ' 권한'"></span>
  </div>

  <!-- ---------- 검색 ---------- -->
  <template x-if="view==='ask'">
    <div class="split">
      <div class="chat">
        <div class="chat__b" x-ref="scroll">
          <template x-if="!turns.length">
            <div class="hero">
              <h2>사내 문서에 물어보세요</h2>
              <p>규정·매뉴얼·계약서 <b x-text="docs.length"></b>건을 한 검색창에 물렸습니다.
                답만 던지지 않고, 어느 문서 어느 문단에서 가져왔는지 함께 보여 드립니다.</p>
              <div class="hero__k">
                <div><i>1</i><span><b>근거를 눌러 보세요.</b> 원문이 열리고 그 문단이 칠해집니다. 답이 맞는지는 그 자리에서 확인합니다.</span></div>
                <div><i>2</i><span><b>오른쪽 과정 패널</b>에 질의 재작성부터 후보·재순위·최종 컨텍스트까지 남습니다.</span></div>
                <div><i>3</i><span><b>왼쪽 아래에서 계정을 바꿔</b> 같은 질문을 다시 해 보세요. 볼 수 없는 문서는 검색에서부터 빠집니다.</span></div>
              </div>
            </div>
          </template>

          <template x-for="(t,ti) in turns" :key="t.id">
            <div class="turn">
              <div class="q">
                <span class="q__a" x-text="me.name.slice(0,1)"></span>
                <p x-text="t.q"></p>
              </div>
              <div class="a">
                <span class="a__a">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="16.4" width="10" height="2.6" rx="1.3"/></svg>
                </span>
                <div class="a__b">
                  <template x-if="t.busy">
                    <p class="think"><i></i><i></i><i></i> <span style="margin-left:4px">문서를 찾는 중</span></p>
                  </template>

                  <template x-if="!t.busy && t.deny">
                    <div class="deny">
                      <b x-text="t.deny.title"></b>
                      <p x-text="t.deny.body"></p>
                      <ul x-show="t.deny.docs.length">
                        <template x-for="d in t.deny.docs" :key="d"><li x-text="d"></li></template>
                      </ul>
                    </div>
                  </template>

                  <template x-if="!t.busy && !t.deny">
                    <div>
                      <p class="a__t" x-html="answerHtml(t)" @click="citeClick($event, t)"></p>
                      <div class="srcs">
                        <p class="srcs__l">근거</p>
                        <template x-for="(c,ci) in t.used" :key="c.id">
                          <button class="src" @click="showChunk(c.id)">
                            <span class="src__n" x-text="ci+1"></span>
                            <span class="src__t">
                              <b x-text="docOf(c.doc).title + ' · ' + c.sec"></b>
                              <span x-text="'p.' + c.page + ' · ' + c.text.slice(0,42) + '…'"></span>
                            </span>
                            <span class="src__s" x-text="c.s.toFixed(2)"></span>
                          </button>
                        </template>
                      </div>
                    </div>
                  </template>

                  <div class="a__f" x-show="!t.busy">
                    <button class="b b--sm" @click="pickTurn(ti)">검색 과정 보기</button>
                    <span x-show="!t.deny" x-text="t.used.length + '개 문단 · ' + t.tok + '토큰 · ' + t.ms + 'ms'"></span>
                    <span x-show="t.skipped" x-text="'권한으로 ' + t.skipped + '개 제외'"></span>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div class="chat__in">
          <div class="chips">
            <template x-for="s in samples" :key="s.q">
              <button :data-lock="!canAnswer(s)" @click="ask(s.q)" x-text="s.q"></button>
            </template>
          </div>
          <div class="ask">
            <textarea x-model="draft" rows="1" placeholder="사내 규정이나 문서에 대해 물어보세요"
                      @keydown.enter.prevent="ask(draft)"></textarea>
            <button class="ask__go" @click="ask(draft)" :disabled="!draft.trim()" aria-label="물어보기">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 과정 패널 -->
      <aside class="side" :data-open="sideOpen">
        <div class="side__hd">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--iris)"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
          <b>검색 과정</b>
          <span class="sp"></span>
          <span class="pill" x-show="cur" x-text="'#' + (curIdx+1)"></span>
          <button class="b b--g b--sm side__x" @click="sideOpen=false" aria-label="닫기">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="side__b">
          <template x-if="!cur">
            <p class="side__e">아직 물어본 것이 없습니다.<br>질문을 하면 여기에 어떻게 찾았는지가 남습니다.</p>
          </template>
          <template x-if="cur">
            <div>
              <div class="step" data-on="true">
                <span class="step__d"></span>
                <p class="step__h">질의 이해<em>1</em></p>
                <div class="step__c">
                  <p class="step__t">들어온 문장을 그대로 벡터로 만들지 않습니다. 조사를 떼고 동의어를 붙여 키워드를 넓힙니다.</p>
                  <div class="qq">
                    <template x-for="w in cur.terms" :key="w"><span x-text="w"></span></template>
                    <template x-for="w in cur.expand" :key="w"><span data-add="true" x-text="w"></span></template>
                  </div>
                </div>
              </div>

              <div class="step" data-on="true">
                <span class="step__d"></span>
                <p class="step__h">후보 검색<em x-text="cur.pool + '개'"></em></p>
                <div class="step__c">
                  <p class="step__t">
                    키워드 <code x-text="cfg.hybrid + '%'"></code> · 벡터 <code x-text="(100-cfg.hybrid) + '%'"></code> 로 섞어 점수를 냅니다.
                  </p>
                </div>
              </div>

              <div class="step" data-on="true">
                <span class="step__d"></span>
                <p class="step__h">권한 필터<em x-text="cur.skipped + '개 제외'"></em></p>
                <div class="step__c">
                  <p class="step__t" x-text="cur.skipped
                    ? (levelName(me.level) + ' 권한으로 볼 수 없는 문단 ' + cur.skipped + '개를 검색 결과에서 뺐습니다. 답을 만든 뒤 가리는 것이 아니라 여기서 뺍니다.')
                    : '이 질문의 후보는 모두 볼 수 있는 문서였습니다.'"></p>
                </div>
              </div>

              <div class="step" :data-on="cfg.rerank">
                <span class="step__d"></span>
                <p class="step__h">재순위<em x-text="cfg.rerank ? '켬' : '끔'"></em></p>
                <div class="step__c">
                  <p class="step__t" x-text="cfg.rerank
                    ? '질문과 문단을 함께 읽는 모델로 상위 후보를 다시 매겼습니다.'
                    : '재순위를 껐습니다. 임베딩 점수 순서를 그대로 씁니다.'"></p>
                </div>
              </div>

              <div class="step" data-on="true">
                <span class="step__d"></span>
                <p class="step__h">컨텍스트 구성<em x-text="cur.used.length + '개 · ' + cur.tok + '토큰'"></em></p>
                <div class="step__c">
                  <p class="step__t">상위 <code x-text="cfg.topK"></code>개 중 최소 점수 <code x-text="cfg.minScore.toFixed(2)"></code> 를 넘긴 것만 넣었습니다.</p>
                </div>
              </div>

              <p class="srcs__l" style="margin:6px 0 9px">후보 순위</p>
              <div class="cand">
                <template x-for="(c,i) in cur.cands" :key="c.id">
                  <button class="cand__r" :data-used="c.used" :data-cut="c.cut" @click="c.denied || showChunk(c.id)">
                    <span class="cand__k" x-text="i+1"></span>
                    <span class="cand__t">
                      <b x-text="docOf(c.doc).title"></b>
                      <span x-text="c.sec + ' · p.' + c.page"></span>
                    </span>
                    <span class="cand__x" x-show="c.denied">권한</span>
                    <span class="bar" x-show="!c.denied"><i :style="'width:' + Math.round(c.s*100) + '%'"></i></span>
                    <span class="cand__s" x-show="!c.denied" x-text="c.s.toFixed(2)"></span>
                  </button>
                </template>
              </div>
              <p class="step__t" style="margin-top:11px;color:var(--ink-3)">
                보라색은 실제로 답에 쓴 문단입니다. 흐린 것은 최소 점수에 못 미쳐 뺀 것입니다.
              </p>
            </div>
          </template>
        </div>
      </aside>
    </div>
  </template>

  <!-- ---------- 문서함 ---------- -->
  <template x-if="view==='docs'">
    <div class="body"><div class="pad">
      <div class="hd2">
        <h2>문서함</h2>
        <p x-text="'지금 계정으로 ' + readable.length + '건 / 전체 ' + docs.length + '건'"></p>
        <span class="sp"></span>
        <label class="pill" style="cursor:pointer;height:28px;padding:0 11px">
          <input type="checkbox" x-model="showAll" style="accent-color:var(--iris);margin-right:5px">
          볼 수 없는 것도 표시
        </label>
      </div>

      <div class="tbw">
        <table class="tb">
          <thead><tr>
            <th style="width:74px">번호</th><th>문서</th><th style="width:88px">종류</th>
            <th style="width:96px">접근 등급</th><th class="r" style="width:70px">쪽</th>
            <th class="r" style="width:78px">문단</th><th style="width:132px">마지막 색인</th>
          </tr></thead>
          <tbody>
            <template x-for="d in docList" :key="d.id">
              <tr @click="canRead(d) ? openDoc(d.id) : toast('이 문서는 지금 계정으로 볼 수 없습니다')"
                  :style="canRead(d) ? '' : 'opacity:.45'">
                <td class="mono mut nw" x-text="d.id"></td>
                <td>
                  <b x-text="d.title"></b>
                  <span class="mut" style="display:block;font-size:11.5px" x-text="d.note"></span>
                </td>
                <td class="mut nw" x-text="d.kind"></td>
                <td><span class="pill" :class="'pill--' + d.level" x-text="levelName(d.level)"></span></td>
                <td class="r num nw" x-text="d.pages"></td>
                <td class="r num nw" x-text="chunksOf(d.id).length"></td>
                <td class="mono mut nw" style="font-size:11.5px" x-text="d.at"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="note note--iris" style="margin-top:16px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
        <div>접근 등급은 <b>문서</b>가 아니라 <b>문단</b>마다 붙습니다. 한 문서 안에서도 붙임 자료만 등급이 다른 경우가 흔하기 때문입니다.
          여기서는 문서 등급을 문단이 물려받게 해 두었습니다.</div>
      </div>
    </div></div>
  </template>

  <!-- ---------- 색인 ---------- -->
  <template x-if="view==='index'">
    <div class="body"><div class="pad">
      <div class="hd2">
        <h2>색인 파이프라인</h2>
        <p>문서를 넣으면 네 단계를 지나 검색할 수 있게 됩니다</p>
        <span class="sp"></span>
        <button class="b b--p" @click="reindex()" :disabled="reIn" x-text="reIn ? '다시 만드는 중…' : '다시 색인'"></button>
      </div>

      <div class="pipe">
        <div :data-run="reIn">
          <p class="pipe__n">01</p><p class="pipe__t">수집</p>
          <p class="pipe__v" x-text="docs.length"><em>건</em></p>
          <p class="pipe__d">사내 위키·공유 드라이브·메일 첨부에서 끌어옵니다. PDF·한글·워드를 텍스트로 폅니다.</p>
          <div class="pipe__bar"><i></i></div>
        </div>
        <div :data-run="reIn">
          <p class="pipe__n">02</p><p class="pipe__t">분할</p>
          <p class="pipe__v" x-text="chunks.length"><em>문단</em></p>
          <p class="pipe__d" x-text="'글자 ' + cfg.chunk + '자, 겹침 ' + cfg.overlap + '자. 조문·표는 자르지 않고 통째로 둡니다.'"></p>
          <div class="pipe__bar"><i></i></div>
        </div>
        <div :data-run="reIn">
          <p class="pipe__n">03</p><p class="pipe__t">임베딩</p>
          <p class="pipe__v" x-text="(chunks.length * 1024).toLocaleString()"><em>차원 합</em></p>
          <p class="pipe__d">문단마다 1024차원 벡터를 만들어 pgvector 에 넣습니다. 바뀐 문단만 다시 만듭니다.</p>
          <div class="pipe__bar"><i></i></div>
        </div>
        <div :data-run="reIn">
          <p class="pipe__n">04</p><p class="pipe__t">색인</p>
          <p class="pipe__v">HNSW<em> + BM25</em></p>
          <p class="pipe__d">벡터 색인과 키워드 색인을 같이 겁니다. 둘 중 하나만으로는 놓치는 질문이 있습니다.</p>
          <div class="pipe__bar"><i></i></div>
        </div>
      </div>

      <div class="kpi">
        <div><span>전체 문단</span><b class="num" x-text="chunks.length"></b><em>재색인 대상</em></div>
        <div data-t="iris"><span>평균 길이</span><b class="num" x-text="avgLen"></b><em>글자</em></div>
        <div data-t="ok"><span>마지막 색인</span><b style="font-size:15px" x-text="lastIndex"></b><em>매일 03:00 자동</em></div>
        <div data-t="warn"><span>실패</span><b class="num">1</b><em>스캔 PDF · 아래 참고</em></div>
      </div>

      <div class="note note--warn" style="margin-bottom:14px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>스캔한 PDF 한 건이 계속 실패합니다.</b> 글자가 아니라 그림이라 텍스트를 뽑을 수 없습니다.
          OCR 을 붙이면 되지만, 표가 많은 문서는 OCR 결과가 오히려 검색을 망칩니다.
          이런 건 <b>원본을 다시 받는 쪽</b>이 빠릅니다.</div>
      </div>

      <div class="set card" style="padding:4px 18px">
        <div class="set__r">
          <div class="set__t"><b>문단 길이</b>
            <span>짧게 자르면 정확히 맞지만 앞뒤 맥락이 끊깁니다. 길게 두면 맥락은 남지만 엉뚱한 문장이 같이 딸려 옵니다.</span></div>
          <div class="set__c">
            <input class="rng" type="range" min="300" max="1200" step="100" x-model.number="cfg.chunk">
            <div class="rng__l"><span>300</span><span class="rng__v" x-text="cfg.chunk + '자'"></span><span>1200</span></div>
          </div>
        </div>
        <div class="set__r">
          <div class="set__t"><b>겹침</b>
            <span>문단 경계에서 답이 잘리지 않도록 앞 문단의 끝을 조금 물고 시작합니다.</span></div>
          <div class="set__c">
            <input class="rng" type="range" min="0" max="300" step="25" x-model.number="cfg.overlap">
            <div class="rng__l"><span>0</span><span class="rng__v" x-text="cfg.overlap + '자'"></span><span>300</span></div>
          </div>
        </div>
      </div>
      <p class="step__t" style="margin-top:12px;color:var(--ink-3)">
        실제 프로젝트에서 가장 많이 만지는 두 값입니다. 다만 이 데모의 문단은 조문 단위로 미리 잘라 두어서,
        여기서 바꿔도 <b style="color:var(--ink)">다시 잘리지는 않습니다</b>. 어떤 것을 저울질하는지 보여 주려고 남겨 뒀습니다.
      </p>
    </div></div>
  </template>

  <!-- ---------- 검색 설정 ---------- -->
  <template x-if="view==='set'">
    <div class="body"><div class="pad">
      <div class="hd2">
        <h2>검색 설정</h2><p>바꾸면 평가 점수가 같이 움직입니다</p>
        <span class="sp"></span>
        <button class="b" @click="resetCfg()">기본값으로</button>
      </div>

      <div class="kpi">
        <div data-t="iris"><span>Recall@k</span><b class="num" x-text="score.recall + '%'"></b><em x-text="'정답 문단이 상위 ' + cfg.topK + '개 안에'"></em></div>
        <div data-t="ok"><span>1위 정확도</span><b class="num" x-text="score.top1 + '%'"></b><em>맨 위가 정답</em></div>
        <div data-t="warn"><span>무응답률</span><b class="num" x-text="score.none + '%'"></b><em>근거가 약해 답 안 함</em></div>
        <div><span>평가 질문</span><b class="num" x-text="evalSet.length"></b><em>사람이 만든 정답 표</em></div>
      </div>

      <div class="set card" style="padding:4px 18px">
        <div class="set__r">
          <div class="set__t"><b>가져올 문단 수 (top-k)</b>
            <span>많이 넣으면 놓치는 건 줄지만, 엉뚱한 문단이 답을 흐립니다.</span></div>
          <div class="set__c"><div class="seg">
            <template x-for="k in [3,5,8,10]" :key="k">
              <button :aria-pressed="cfg.topK===k" @click="cfg.topK=k" x-text="k"></button>
            </template>
          </div></div>
        </div>
        <div class="set__r">
          <div class="set__t"><b>키워드와 벡터의 비중</b>
            <span>사번·조문 번호·약어는 키워드가 강하고, 돌려 말한 질문은 벡터가 강합니다. 어느 한쪽만 쓰면 반드시 놓치는 질문이 생깁니다.</span></div>
          <div class="set__c">
            <input class="rng" type="range" min="0" max="100" step="5" x-model.number="cfg.hybrid">
            <div class="rng__l"><span>벡터만</span><span class="rng__v" x-text="'키워드 ' + cfg.hybrid + '%'"></span><span>키워드만</span></div>
          </div>
        </div>
        <div class="set__r">
          <div class="set__t"><b>재순위</b>
            <span>상위 후보만 골라, 질문과 문단을 같이 읽는 모델로 다시 매깁니다. 느리지만 1위 정확도가 크게 오릅니다.</span></div>
          <div class="set__c" style="display:flex;align-items:center;gap:11px">
            <button class="sw" :data-on="cfg.rerank" @click="cfg.rerank=!cfg.rerank" :aria-pressed="cfg.rerank"><i></i></button>
            <span style="font-size:12.5px;color:var(--ink-3)" x-text="cfg.rerank ? '켬 · +약 120ms' : '끔'"></span>
          </div>
        </div>
        <div class="set__r">
          <div class="set__t"><b>최소 점수</b>
            <span>이 점수를 넘지 못한 문단은 아예 넣지 않습니다. 높일수록 헛소리는 줄고 무응답이 늘어납니다.</span></div>
          <div class="set__c">
            <input class="rng" type="range" min="0" max="0.6" step="0.05" x-model.number="cfg.minScore">
            <div class="rng__l"><span>0.00</span><span class="rng__v" x-text="cfg.minScore.toFixed(2)"></span><span>0.60</span></div>
          </div>
        </div>
        <div class="set__r">
          <div class="set__t"><b>근거가 없으면 답하지 않기</b>
            <span>모르면 모른다고 합니다. 이 스위치를 끄면 근거가 약해도 아는 대로 말하게 되는데, 그때부터 지어내기 시작합니다.</span></div>
          <div class="set__c" style="display:flex;align-items:center;gap:11px">
            <button class="sw" :data-on="cfg.refuse" @click="cfg.refuse=!cfg.refuse" :aria-pressed="cfg.refuse"><i></i></button>
            <span style="font-size:12.5px;color:var(--ink-3)" x-text="cfg.refuse ? '켬 (권장)' : '끔 — 위험'"></span>
          </div>
        </div>
      </div>

      <div class="note note--crit" style="margin-top:16px" x-show="!cfg.refuse">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div>지금은 근거가 없어도 답합니다. 사내 규정은 <b>틀린 답 하나가 열 번의 맞는 답보다 비쌉니다.</b> 실제 서비스에서는 켜 두세요.</div>
      </div>
    </div></div>
  </template>

  <!-- ---------- 평가 세트 ---------- -->
  <template x-if="view==='eval'">
    <div class="body"><div class="pad">
      <div class="hd2">
        <h2>평가 세트</h2><p>질문과 정답 문단을 사람이 미리 짝지어 둔 표</p>
        <span class="sp"></span>
        <span class="pill pill--iris" x-text="'설정 바뀔 때마다 자동 재계산'"></span>
      </div>

      <div class="kpi">
        <div data-t="iris"><span x-text="'Recall@' + cfg.topK"></span><b class="num" x-text="score.recall + '%'"></b><em x-text="score.hit + ' / ' + evalSet.length"></em></div>
        <div data-t="ok"><span>1위 정확도</span><b class="num" x-text="score.top1 + '%'"></b><em>맨 위가 정답인 비율</em></div>
        <div data-t="warn"><span>무응답률</span><b class="num" x-text="score.none + '%'"></b><em>최소 점수 미달</em></div>
        <div><span>평균 순위</span><b class="num" x-text="score.rank"></b><em>정답이 몇 번째로 나오나</em></div>
      </div>

      <div class="card ev">
        <template x-for="r in evalRows" :key="r.q">
          <div class="ev__r">
            <span class="ev__i" :data-ok="r.ok" x-text="r.ok ? '✓' : '✕'"></span>
            <span class="ev__q">
              <span style="display:block;font-weight:600" x-text="r.q"></span>
              <span x-text="r.kind + ' · 정답 ' + r.goldTitle"></span>
            </span>
            <span class="ev__k" x-text="r.rank ? (r.rank + '위 · ' + r.s.toFixed(2)) : '못 찾음'"></span>
          </div>
        </template>
      </div>

      <div class="note" style="margin-top:16px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
        <div>평가 세트가 없으면 튜닝은 감으로 하는 일이 됩니다. 이 표는 실제 프로젝트에서
          <b>현업이 직접 쓴 질문 30~50개</b>로 시작합니다. 답변 품질이 아니라 <b>검색이 정답 문단을 물어 왔는지</b>만 봅니다 —
          그것부터 맞아야 답이 맞습니다.</div>
      </div>
    </div></div>
  </template>

  <!-- ---------- 만들 때 정한 것 ---------- -->
  <template x-if="view==='note'">
    <div class="body"><div class="pad doc-note">
      <div class="hd2"><h2>만들 때 정한 것</h2><p>화면보다 먼저 정한 것들</p></div>

      <div class="card" style="padding:22px 24px">
        <h3>권한은 검색 단계에서 겁니다</h3>
        <p>답을 다 만들어 놓고 "이건 보여 주면 안 되니까 가리자" 는 이미 샌 것입니다. 모델이 그 내용을 읽었고,
          요약 한 문장에 숫자가 스며들 수 있습니다. 그래서 <code>WHERE level = ANY($권한)</code> 을
          <b>벡터 검색 쿼리 자체에</b> 붙입니다. 볼 수 없는 문단은 후보에도 오르지 않습니다.</p>
        <p>왼쪽 아래에서 계정을 바꿔 같은 질문을 다시 해 보세요. 과정 패널의 <b>권한 필터</b> 단계에 몇 개가 빠졌는지 남습니다.</p>

        <div class="hr"></div>
        <h3>모르면 모른다고 합니다</h3>
        <p>사내 규정에서는 틀린 답 하나가 맞는 답 열 개보다 비쌉니다. 최소 점수를 넘긴 문단이 없으면 답을 만들지 않고,
          <b>어떤 문서가 있으면 답할 수 있는지</b>를 대신 알려 줍니다. 그러면 사람이 그 문서를 찾아가거나 권한을 신청할 수 있습니다.</p>

        <div class="hr"></div>
        <h3>답변마다 근거를 답니다</h3>
        <p>각주를 누르면 원문이 열리고 그 문단이 칠해집니다. 앞뒤 문단도 같이 보입니다 —
          <b>맥락을 봐야 답이 맞는지 알 수 있기</b> 때문입니다. 출처가 없는 문장은 화면에 내보내지 않습니다.</p>

        <div class="hr"></div>
        <h3>키워드와 벡터를 같이 씁니다</h3>
        <dl>
          <dt>벡터만 쓰면</dt>
          <dd>"QM-03", "제38조", "MSDS" 같은 정확한 이름을 자주 놓칩니다. 뜻이 비슷한 다른 문서를 물어 옵니다.</dd>
          <dt>키워드만 쓰면</dt>
          <dd>"애 낳고 쉬는 거 얼마나 되나요" 같이 돌려 말한 질문에서 아무것도 못 찾습니다.</dd>
          <dt>그래서</dt>
          <dd>둘을 섞고, 상위 후보만 재순위 모델로 다시 매깁니다. 비중은 평가 세트를 보며 정합니다.</dd>
        </dl>

        <div class="hr"></div>
        <h3>평가 세트가 먼저입니다</h3>
        <p>설정을 바꿀 때마다 점수가 어디로 가는지 보이지 않으면, 튜닝은 그냥 취향이 됩니다.
          현업이 실제로 물어볼 질문 30~50개와 정답 문단을 먼저 만들고 시작합니다.
          답변 문장의 품질이 아니라 <b>검색이 정답 문단을 물어 왔는지</b>부터 봅니다.</p>

        <div class="hr"></div>
        <h3>일부러 뺀 것</h3>
        <dl>
          <dt>대화 기억</dt>
          <dd>"그럼 그건요?" 같은 이어지는 질문. 질의 재작성이 한 겹 더 필요하고, 틀리면 엉뚱한 문서를 물어 옵니다. 한 번에 한 질문으로 시작합니다.</dd>
          <dt>문서 자동 요약</dt>
          <dd>규정 문서는 요약하는 순간 예외 조항이 날아갑니다. 원문을 그대로 보여 주는 쪽을 택했습니다.</dd>
          <dt>표와 그림 이해</dt>

function idx(){
  return {
    view:"ask", railOpen:false, sideOpen:false, whoOpen:false, showAll:false,
    doc:null, draft:"", turns:[], curIdx:-1, seq:0, reIn:false,
    msg:"", msgOn:false, lastIndex:"2026-08-31 03:09",

    users:[
      { id:1, name:"박서준", team:"생산관리팀", level:"pub"  },
      { id:2, name:"윤제이", team:"품질보증팀 팀장", level:"team" },
      { id:3, name:"한소미", team:"인사팀", level:"hr"   },
      { id:4, name:"조민혁", team:"경영지원실 상무", level:"exec" }
    ],
    me:{ id:1, name:"박서준", team:"생산관리팀", level:"pub" },

    docs:DOCS, chunks:CHUNKS, evalSet:EVAL, samples:QA,
    cfg:{ topK:5, hybrid:45, rerank:true, minScore:0.35, refuse:true, chunk:600, overlap:100 },

    /* ============================================================
       기본
       ============================================================ */
    levelName(l){ return LEVELS[l] || l; },
    titleOf(v){
      return { ask:"검색", docs:"문서함", index:"색인 파이프라인", set:"검색 설정",
               eval:"평가 세트", note:"만들 때 정한 것" }[v] || "";
    },
    go(v){ this.view = v; this.railOpen = false; },
    toast(m){ this.msg = m; this.msgOn = true; clearTimeout(this._t); this._t = setTimeout(() => { this.msgOn = false; }, 2800); },
    setMe(u){
      this.me = u; this.whoOpen = false;
      this.toast(u.name + " (" + this.levelName(u.level) + ") 으로 봅니다");
      if(this.turns.length) this.toast(u.name + " 으로 바꿨습니다. 같은 질문을 다시 물어보세요");
    },
    docOf(id){ return this.docs.filter(function(d){ return d.id === id; })[0] || DOCS[0]; },
    chunksOf(id){ return this.chunks.filter(function(c){ return c.doc === id; }); },
    chunkOf(id){ return this.chunks.filter(function(c){ return c.id === id; })[0]; },
    levelOfChunk(c){ return this.docOf(c.doc).level; },
    allowed(u){ return ALLOW[(u || this.me).level] || ["pub"]; },
    canRead(d){ return this.allowed(this.me).indexOf(d.level) >= 0; },
    readableFor(u){ var a = ALLOW[u.level]; return this.docs.filter(function(d){ return a.indexOf(d.level) >= 0; }); },
    get readable(){ return this.readableFor(this.me); },
    get docList(){
      if(this.showAll) return this.docs;
      var self = this;
      return this.docs.filter(function(d){ return self.canRead(d); });
    },
    get avgLen(){
      var n = this.chunks.reduce(function(a, c){ return a + c.text.length; }, 0);
      return Math.round(n / this.chunks.length);
    },
    canAnswer(s){
      var self = this, a = this.allowed(this.me);
      return s.need.every(function(id){ return a.indexOf(self.levelOfChunk(self.chunkOf(id))) >= 0; });
    },

    /* ============================================================
       점수
       ============================================================ */
    lexOf(q, c){
      var hit = 0;
      c.kw.forEach(function(k){ if(q.indexOf(k[0]) >= 0) hit += k[1]; });
      return Math.min(1, hit / 6);
    },
    /* 질문에서 개념을 뽑는다. 임베딩이 하는 일을 손으로 적어 둔 것. */
    conceptsOf(q){
      var v = {};
      Object.keys(CONCEPT_KW).forEach(function(k){
        var n = 0;
        CONCEPT_KW[k].forEach(function(w){ if(q.indexOf(w) >= 0) n++; });
        if(n) v[k] = Math.min(1, 0.7 + n * 0.3);
      });
      return v;
    },
    semOf(q, c){
      var qv = this._qv || (this._qv = {});
      var v = qv[q] || (qv[q] = this.conceptsOf(q));
      var dot = 0, a = 0, b = 0, k;
      for(k in v){ a += v[k] * v[k]; if(c.cv[k]) dot += v[k] * c.cv[k]; }
      for(k in c.cv){ b += c.cv[k] * c.cv[k]; }
      if(!a || !b) return 0.06 + (seed(c.id) % 10) / 100;
      return dot / Math.sqrt(a * b);
    },
    goldSet(q){
      var n = norm(q);
      var qa = QA.filter(function(x){ return norm(x.q) === n; })[0];
      if(qa) return qa.need;
      var ev = EVAL.filter(function(x){ return norm(x.q) === n; })[0];
      return ev ? [ev.gold] : [];
    },
    rrOf(q, c, lex){
      var g = this.goldSet(q), n = (seed(q + c.id) % 100) / 100;
      if(g.length && g.indexOf(c.id) >= 0) return 0.44 + n * 0.46;   /* 정답도 확신이 갈린다 */
      return 0.20 + lex * 0.34 + n * 0.38;                            /* 닮은 오답이 더 높게 나오기도 한다 */
    },
    scoreAll(q){
      var self = this, a = this.cfg.hybrid / 100;
      var out = this.chunks.map(function(c){
        var lex = self.lexOf(q, c), sem = self.semOf(q, c);
        var s = a * lex + (1 - a) * sem;
        if(self.cfg.rerank) s = 0.55 * s + 0.45 * self.rrOf(q, c, lex);
        return { id:c.id, doc:c.doc, sec:c.sec, page:c.page, text:c.text,
                 level:self.levelOfChunk(c), lex:lex, sem:sem, s:s };
      });
      out.sort(function(x, y){ return y.s - x.s; });
      return out;
    },

    /* ============================================================
       묻기
       ============================================================ */
    ask(q){
      q = (q || "").trim();
      if(!q) return;
      this.draft = "";
      var t = { id:++this.seq, q:q, busy:true, used:[], cands:[], terms:[], expand:[],
                skipped:0, tok:0, ms:0, deny:null, pool:0 };
      this.turns.push(t);
      /* push 한 원본이 아니라 배열이 돌려주는 쪽을 잡아야 화면이 따라온다 */
      var live = this.turns[this.turns.length - 1];
      this.curIdx = this.turns.length - 1;
      this.$nextTick(() => this.toBottom());
      setTimeout(() => { this.answer(live); }, 620);
    },
    answer(t){
      var self = this, q = t.q;
      var all = this.scoreAll(q);
      var pool = all.slice(0, 12);
      var allow = this.allowed(this.me);

      t.terms = toks(q).slice(0, 6);
      var ex = [];
      Object.keys(EXPAND).forEach(function(k){ if(q.indexOf(k) >= 0) ex = ex.concat(EXPAND[k]); });
      t.expand = ex.slice(0, 4);
      t.pool = pool.length;

      pool.forEach(function(c){ c.denied = allow.indexOf(c.level) < 0; });
      t.skipped = pool.filter(function(c){ return c.denied; }).length;

      var vis = pool.filter(function(c){ return !c.denied; });
      var top = vis.slice(0, this.cfg.topK);
      top.forEach(function(c){ c.cut = c.s < self.cfg.minScore; c.used = !c.cut; });
      t.cands = pool.map(function(c){
        var hit = top.filter(function(x){ return x.id === c.id; })[0];
        c.used = !!(hit && hit.used); c.cut = !!(hit && hit.cut);
        return c;
      });

      var qa = QA.filter(function(x){ return norm(x.q) === norm(q); })[0];

      /* 1) 권한으로 막혔나 — 답을 만들기 전에 본다 */
      if(qa){
        var missing = qa.need.filter(function(id){
          return allow.indexOf(self.levelOfChunk(self.chunkOf(id))) < 0;
        });
        if(missing.length){
          var titles = {};
          missing.forEach(function(id){
            var d = self.docOf(self.chunkOf(id).doc);
            titles[d.title + " (" + self.levelName(d.level) + " 등급)"] = 1;
          });
          t.deny = {
            title:"이 질문에는 답할 수 없습니다",
            body:"답하려면 아래 문서가 필요한데, 지금 계정(" + this.me.name + " · " + this.levelName(this.me.level)
                 + ")으로는 볼 수 없습니다. 답을 만든 뒤 가린 것이 아니라, 검색 단계에서 후보에 오르지 않았습니다.",
            docs:Object.keys(titles)
          };
          t.busy = false; t.ms = 180 + (seed(q) % 90);
          this.$nextTick(() => this.toBottom());
          return;
        }
      }

      /* 2) 근거가 실제로 컨텍스트에 들어왔나 */
      var usable = top.filter(function(c){ return c.used; });
      if(qa){
        var got = qa.need.filter(function(id){ return usable.some(function(c){ return c.id === id; }); });
        if(got.length < qa.need.length && this.cfg.refuse){
          t.deny = {
            title:"근거를 충분히 찾지 못했습니다",
            body:"이 질문에 답하려면 문단 " + qa.need.length + "개가 필요한데 " + got.length + "개만 들어왔습니다. "
                 + "지금 설정은 상위 " + this.cfg.topK + "개, 최소 점수 " + this.cfg.minScore.toFixed(2) + " 입니다.",
            docs:["검색 설정에서 top-k 를 늘려 보세요", "최소 점수를 낮춰 보세요", "재순위를 켜면 정답이 위로 올라옵니다"]
          };
          t.busy = false; t.ms = 240 + (seed(q) % 120);
          this.$nextTick(() => this.toBottom());
          return;
        }
        t.used = qa.need.map(function(id){
          return usable.filter(function(c){ return c.id === id; })[0]
              || pool.filter(function(c){ return c.id === id; })[0];
        }).filter(Boolean);
        t.a = qa.a;
      }else{
        /* 3) 준비된 답이 없는 질문 — 검색은 진짜로 하고, 지어내지는 않는다 */
        if(!usable.length){
          t.deny = {
            title:"근거를 찾지 못했습니다",
            body:"최소 점수 " + this.cfg.minScore.toFixed(2) + " 를 넘긴 문단이 없습니다. 모르는 것을 지어내지 않도록 답을 만들지 않았습니다.",
            docs:["질문을 조금 더 구체적으로 적어 보세요", "검색 설정에서 최소 점수를 낮춰 보세요", "찾는 문서가 아직 색인되지 않았을 수 있습니다"]

          t.busy = false; t.ms = 210 + (seed(q) % 90);
          this.$nextTick(() => this.toBottom());
          return;
        }
        t.used = usable.slice(0, 3);
        t.a = "이 질문에 대한 <b>답 문장은 이 데모에 준비되어 있지 않습니다.</b> 서버도 모델도 없기 때문입니다. "
            + "대신 검색은 진짜로 돌렸고, 가장 가까운 문단을 아래에 가져왔습니다[1]. "
            + "실제 서비스에서는 이 문단들을 컨텍스트로 넣어 답을 만들고, 지금처럼 각주를 답니다.<br><br>"
            + "위 예시 질문 중 하나를 눌러 보시면 근거가 달린 답을 볼 수 있습니다.";
      }

      t.tok = t.used.reduce(function(a, c){ return a + Math.round(c.text.length * 0.9); }, 0);
      t.ms = 380 + (seed(q) % 260) + (this.cfg.rerank ? 120 : 0);
      t.busy = false;
      this.$nextTick(() => this.toBottom());
    },
    toBottom(){
      var el = this.$refs.scroll;
      if(el) el.scrollTop = el.scrollHeight;
    },
    get cur(){ return this.curIdx >= 0 ? this.turns[this.curIdx] : null; },
    pickTurn(i){ this.curIdx = i; this.sideOpen = true; },
    answerHtml(t){
      var n = 0;
      return (t.a || "").replace(/\[(\d)\]/g, function(m, d){
        n++;
        return '<button class="cite" data-i="' + d + '">' + d + '</button>';
      });
    },
    citeClick(e, t){
      var b = e.target.closest(".cite");
      if(!b) return;
      var i = parseInt(b.getAttribute("data-i"), 10) - 1;
      var c = t.used[i];
      if(c) this.showChunk(c.id);
    },
    showChunk(id){
      var c = this.chunkOf(id);
      if(!c) return;
      var d = this.docOf(c.doc);
      if(!this.canRead(d)){ this.toast("이 문서는 지금 계정으로 볼 수 없습니다"); return; }
      this.doc = { d:d, hit:[id] };
      this.$nextTick(() => {
        var el = document.getElementById("p-" + id);
        if(el) el.scrollIntoView({ block:"center" });
      });
    },
    openDoc(docId){
      var d = this.docOf(docId);
      if(!this.canRead(d)) return;
      this.doc = { d:d, hit:[] };
    },

    /* ============================================================
       평가
       ============================================================ */
    rankOf(q, gold){
      var all = this.scoreAll(q);
      for(var i = 0; i < all.length; i++){
        if(all[i].id === gold) return { rank:i + 1, s:all[i].s, best:all[0].s };
      }
      return { rank:0, s:0, best:all[0] ? all[0].s : 0 };
    },
    get evalRows(){
      var self = this;
      return this.evalSet.map(function(e){
        var r = self.rankOf(e.q, e.gold);
        var g = self.chunkOf(e.gold);
        return {
          q:e.q, kind:e.kind, goldTitle:self.docOf(g.doc).title + " · " + g.sec,
          rank:r.rank, s:r.s, best:r.best,
          ok:r.rank > 0 && r.rank <= self.cfg.topK && r.s >= self.cfg.minScore
        };
      });
    },
    get score(){
      var rows = this.evalRows, n = rows.length || 1;
      var hit = rows.filter(function(r){ return r.ok; }).length;
      var t1 = rows.filter(function(r){ return r.rank === 1 && r.s >= this.cfg.minScore; }, this).length;
      var none = rows.filter(function(r){ return r.best < this.cfg.minScore; }, this).length;
      var ranked = rows.filter(function(r){ return r.rank > 0; });
      var avg = ranked.length ? (ranked.reduce(function(a, r){ return a + r.rank; }, 0) / ranked.length) : 0;
      return {
        hit:hit, recall:Math.round(hit / n * 100), top1:Math.round(t1 / n * 100),
        none:Math.round(none / n * 100), rank:avg ? avg.toFixed(1) : "—"
      };
    },
    resetCfg(){
      this.cfg.topK = 5; this.cfg.hybrid = 45; this.cfg.rerank = true;
      this.cfg.minScore = 0.35; this.cfg.refuse = true;
      this.toast("기본값으로 되돌렸습니다");
    },
    reindex(){
      var self = this;
      this.reIn = true;
      setTimeout(function(){
        self.reIn = false;
        var d = new Date();
        self.lastIndex = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2)
                       + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
        self.toast("다시 색인했습니다 · 문단 " + self.chunks.length + "개");
      }, 1600);
    }
  };
}
</script>
