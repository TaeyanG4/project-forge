/* ============================================================
   PALLET — 소규모 제조사 재고 관리
   제품 UI 데모. 스튜디오 사이트(FORGE)와 일부러 다른 결로 잡았다.
   업무용 도구는 하루 종일 보는 화면이라, 차분한 라이트 한 벌로 간다.
   ============================================================ */
:root{
  --bg:#F6F7F9;
  --panel:#FFFFFF;
  --panel-2:#FBFCFD;
  --line:#E4E7EC;
  --line-2:#D0D5DD;

  --ink:#101828;
  --ink-2:#475467;
  --ink-3:#98A2B3;

  --brand:#4F46E5;
  --brand-2:#6366F1;
  --brand-soft:#EEF0FE;

  --ok:#039855;      --ok-soft:#ECFDF3;
  --warn:#DC6803;    --warn-soft:#FFFAEB;
  --crit:#D92D20;    --crit-soft:#FEF3F2;
  --info:#0E7490;    --info-soft:#ECFEFF;

  --r:8px; --r-lg:12px; --r-xl:16px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
  --sh:0 2px 6px -1px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --sh-lg:0 12px 32px -8px rgba(16,24,40,.16);

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

  --side:236px;
  --top:60px;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14.5px;line-height:1.65;letter-spacing:-.011em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
h1,h2,h3,h4{margin:0;letter-spacing:-.028em;line-height:1.35;}
p{margin:0;}
button{font-family:inherit;}

/* ---------- 공통 조각 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 15px;border-radius:var(--r);cursor:pointer;
  font-size:14px;font-weight:600;letter-spacing:-.014em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  box-shadow:var(--sh-sm);transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3);}
.btn--pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn--pri:hover{background:#4338CA;border-color:#4338CA;}
.btn--ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2);}
.btn--ghost:hover{background:var(--brand-soft);color:var(--brand);}
.btn--danger{color:var(--crit);border-color:#FDA29B;}
.btn--danger:hover{background:var(--crit-soft);}
.btn--sm{height:32px;padding:0 11px;font-size:13px;}
.btn--lg{height:44px;padding:0 20px;font-size:15px;}
.btn--block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.fld{display:flex;flex-direction:column;gap:6px;}
.fld > label{font-size:13px;font-weight:600;color:var(--ink-2);}
.fld input,.fld select,.fld textarea{
  height:40px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:14.5px;width:100%;
  box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s;
}
.fld textarea{height:auto;padding:10px 12px;min-height:84px;resize:vertical;line-height:1.6;}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);
}
.fld small{font-size:12.5px;color:var(--ink-3);}

.tag{
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;
  border-radius:100px;font-size:12px;font-weight:600;letter-spacing:-.01em;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);
}
.tag--ok{background:var(--ok-soft);border-color:#A6F4C5;color:var(--ok);}
.tag--warn{background:var(--warn-soft);border-color:#FEC84B;color:var(--warn);}
.tag--crit{background:var(--crit-soft);border-color:#FDA29B;color:var(--crit);}
.tag--info{background:var(--info-soft);border-color:#A5F3FC;color:var(--info);}
.tag--brand{background:var(--brand-soft);border-color:#C7D2FE;color:var(--brand);}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;}

/* ============================================================
   인증 · 온보딩
   ============================================================ */
.gate{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1fr 1fr;}
@media (max-width:900px){.gate{grid-template-columns:1fr;}}
.gate__art{
  background:linear-gradient(160deg,#312E81 0%,#4F46E5 55%,#6366F1 100%);
  color:#fff;padding:48px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;
}
@media (max-width:900px){.gate__art{display:none;}}
.gate__art::after{
  content:"";position:absolute;right:-90px;bottom:-90px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);
}
.gate__art h2{font-size:31px;font-weight:800;line-height:1.35;letter-spacing:-.035em;max-width:14ch;}
.gate__art p{color:rgba(255,255,255,.82);font-size:15.5px;line-height:1.85;max-width:34ch;font-weight:350;}
.gate__stat{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative;}
.gate__stat div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-lg);padding:15px 17px;}
.gate__stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;}
.gate__stat span{font-size:12.5px;color:rgba(255,255,255,.76);}

.gate__form{display:flex;align-items:center;justify-content:center;padding:40px 28px;}
.gate__box{width:100%;max-width:392px;display:flex;flex-direction:column;gap:22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand__mk{
  width:32px;height:32px;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px -2px rgba(79,70,229,.5);
}
.brand__tx{font-size:19px;font-weight:800;letter-spacing:-.03em;}
.tabs{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);padding:3px;border-radius:10px;}
.tabs button{
  flex:1;height:34px;border:0;border-radius:7px;background:transparent;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-.014em;
}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh-sm);}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
.sso{display:flex;flex-direction:column;gap:8px;}
.err{font-size:13px;color:var(--crit);}

.steps{display:flex;gap:7px;}
.steps i{flex:1;height:4px;border-radius:100px;background:var(--line);}
.steps i[data-on="true"]{background:var(--brand);}

/* ============================================================
   앱 셸
   ============================================================ */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;}
@media (max-width:1000px){.app{grid-template-columns:1fr;}}

.side{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
@media (max-width:1000px){
  .side{position:fixed;z-index:60;width:var(--side);transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--sh-lg);}
  .side[data-open="true"]{transform:none;}
}
.side__top{padding:16px 16px 12px;border-bottom:1px solid var(--line);}
.ws{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:left;
}
.ws:hover{border-color:var(--line-2);}
.ws__av{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;}
.ws__nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:700;}
.ws__pl{font-size:11.5px;color:var(--ink-3);}

.nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav__lb{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;padding:14px 10px 6px;}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);
  font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;letter-spacing:-.014em;
}
.nav a:hover{background:var(--panel-2);color:var(--ink);}
.nav a[aria-current="true"]{background:var(--brand-soft);color:var(--brand);}
.nav a svg{flex:none;opacity:.85;}

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <h1 x-text="titleOf(view)"></h1>
          <span class="top__sp"></span>
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--ink-3)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input placeholder="품목 · SKU 검색" x-model="q" @focus="goto('items')" aria-label="검색">
          </label>
          <button class="btn btn--pri btn--sm" @click="openMove()" x-show="can('move.create')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            입출고
          </button>
        </header>

        <div class="page">
          <!-- ── 대시보드 ── -->
          <template x-if="view==='dash'">
            <div>
              <div class="page__hd">
                <div><h2>오늘 재고</h2><p x-text="ws.name + ' · ' + fmtDate(new Date())"></p></div>
                <span class="sp"></span>
                <button class="btn btn--sm" @click="toast('CSV 내려받기는 데모에서 생략했습니다')">CSV 내보내기</button>
              </div>

              <div class="kpis">
                <div class="card kpi">
                  <span class="kpi__t">전체 품목</span>
                  <span class="kpi__v" x-text="items.length"></span>
                  <span class="kpi__d">활성 <b x-text="items.filter(i=>i.active).length"></b> · 단종 <b x-text="items.filter(i=>!i.active).length"></b></span>
                </div>
                <div class="card kpi">
                  <span class="kpi__t">재고 자산</span>
                  <span class="kpi__v" x-text="won(totalValue)"></span>
                  <span class="kpi__d up">▲ 전주 대비 4.2%</span>
                </div>
                <div class="card kpi">
                  <span class="kpi__t">
                    안전재고 미만
                    <span class="tag tag--crit" x-show="lowStock.length"><i></i>확인 필요</span>
                  </span>
                  <span class="kpi__v" x-text="lowStock.length"></span>
                  <span class="kpi__d">발주가 필요한 품목</span>
                </div>
                <div class="card kpi">
                  <span class="kpi__t">이번 주 입출고</span>
                  <span class="kpi__v" x-text="moves.length"></span>
                  <span class="kpi__d">입고 <b x-text="moves.filter(m=>m.type==='in').length"></b> · 출고 <b x-text="moves.filter(m=>m.type==='out').length"></b></span>
                </div>
              </div>

              <div class="grid2">
                <div class="card">
                  <div class="panel__hd"><h3>입출고 추이</h3><span class="sp"></span>
                    <span class="tag">최근 14일</span></div>
                  <div class="panel__bd"><div class="chart"><canvas id="cFlow"></canvas></div></div>
                </div>
                <div class="card">
                  <div class="panel__hd"><h3>분류별 재고 자산</h3></div>
                  <div class="panel__bd"><div class="chart"><canvas id="cCat"></canvas></div></div>
                </div>
              </div>

              <div class="grid2">
                <div class="card">
                  <div class="panel__hd"><h3>최근 활동</h3><span class="sp"></span>
                    <button class="btn btn--ghost btn--sm" @click="goto('moves')">전체 보기</button></div>
                  <ul class="feed">
                    <template x-for="m in moves.slice(0,6)" :key="m.id">
                      <li>
                        <span class="ic" :style="m.type==='in'?'background:var(--ok-soft);color:var(--ok)':(m.type==='out'?'background:var(--info-soft);color:var(--info)':'background:var(--warn-soft);color:var(--warn)')">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                            <path :d="m.type==='in'?'M12 19V5M5 12l7-7 7 7':(m.type==='out'?'M12 5v14M5 12l7 7 7-7':'M20 12H4')"/>
                          </svg>
                        </span>
                        <span class="tx">
                          <b x-text="itemName(m.itemId)"></b>
                          <span x-text="' ' + moveLabel(m.type) + ' '"></span>
                          <b x-text="m.qty.toLocaleString('ko-KR') + itemUnit(m.itemId)"></b>
                          <div style="color:var(--ink-3);font-size:12.5px" x-text="m.actor + ' · ' + m.reason"></div>
                        </span>
                        <span class="tm" x-text="ago(m.at)"></span>
                      </li>
                    </template>
                  </ul>
                </div>

                <div class="card">
                  <div class="panel__hd"><h3>발주가 필요합니다</h3></div>
                  <ul class="feed">
                    <template x-for="i in lowStock.slice(0,6)" :key="i.id">
                      <li @click="openItem(i)" style="cursor:pointer">
                        <span class="ic" style="background:var(--crit-soft);color:var(--crit)">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
                        </span>
                        <span class="tx"><b x-text="i.name"></b>
                          <div style="color:var(--ink-3);font-size:12.5px">
                            현재 <span x-text="i.qty + i.unit"></span> · 안전재고 <span x-text="i.min + i.unit"></span>
                          </div>
                        </span>
                        <span class="tag tag--crit" x-text="(i.min - i.qty) + i.unit + ' 부족'"></span>
                      </li>
                    </template>
                    <template x-if="!lowStock.length">
                      <li><span class="tx" style="color:var(--ink-3)">모든 품목이 안전재고 위에 있습니다.</span></li>
                    </template>
                  </ul>
                </div>
              </div>
            </div>
          </template>

          <!-- ── 품목 ── -->
          <template x-if="view==='items'">
            <div>
              <div class="page__hd">
                <div><h2>품목</h2><p x-text="filtered.length + '개 · 전체 ' + items.length + '개'"></p></div>
                <span class="sp"></span>
                <button class="btn btn--pri" @click="openNewItem()" x-show="can('item.create')">품목 추가</button>
              </div>

              <div class="tbar">
                <label class="search" style="min-width:260px">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--ink-3)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                  <input placeholder="이름 · SKU" x-model="q" aria-label="품목 검색">
                </label>
                <select class="btn" style="width:auto;padding:0 12px" x-model="fCat" aria-label="분류">
                  <option value="">모든 분류</option>
                  <template x-for="c in cats" :key="c"><option x-text="c" :value="c"></option></template>
                </select>
                <select class="btn" style="width:auto;padding:0 12px" x-model="fLoc" aria-label="자리">
                  <option value="">모든 자리</option>
                  <template x-for="l in ws.locations" :key="l"><option x-text="l" :value="l"></option></template>
                </select>
                <button class="btn btn--sm" :style="fLow?'border-color:var(--crit);color:var(--crit)':''" @click="fLow=!fLow">
                  안전재고 미만만
                </button>
                <span style="flex:1"></span>
                <button class="btn btn--sm" @click="q='';fCat='';fLoc='';fLow=false">초기화</button>
              </div>

              <div class="bulk" x-show="sel.length">
                <span x-text="sel.length + '개 선택됨'"></span>
                <span class="sp"></span>
                <button class="btn btn--sm" @click="toast('일괄 분류 변경 — 데모에서는 흐름만')">분류 변경</button>
                <button class="btn btn--sm btn--danger" @click="bulkDeactivate()" x-show="can('item.delete')">단종 처리</button>
                <button class="btn btn--sm" @click="sel=[]">해제</button>
              </div>

              <div class="card tbl-wrap">
                <table>
                  <thead><tr>
                    <th style="width:38px"><input type="checkbox" @change="toggleAll($event)" :checked="sel.length && sel.length===filtered.length" aria-label="전체 선택"></th>
                    <th class="sortable" @click="sortBy('name')">품목 <span x-show="sort.k==='name'" x-text="sort.d>0?'↑':'↓'"></span></th>
                    <th>분류</th><th>자리</th>
                    <th class="sortable" style="text-align:right" @click="sortBy('qty')">현재고 <span x-show="sort.k==='qty'" x-text="sort.d>0?'↑':'↓'"></span></th>
                    <th style="text-align:right">안전재고</th>
                    <th class="sortable" style="text-align:right" @click="sortBy('value')">자산 <span x-show="sort.k==='value'" x-text="sort.d>0?'↑':'↓'"></span></th>
                    <th>상태</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="i in filtered" :key="i.id">
                      <tr :data-sel="sel.includes(i.id)" @click="openItem(i)">
                        <td @click.stop><input type="checkbox" :checked="sel.includes(i.id)" @change="toggleSel(i.id)" :aria-label="i.name + ' 선택'"></td>
                        <td><div class="nm" x-text="i.name"></div><div class="sku" x-text="i.sku"></div></td>
                        <td><span class="tag" x-text="i.cat"></span></td>
                        <td x-text="i.loc"></td>
                        <td class="num" x-text="i.qty.toLocaleString('ko-KR') + i.unit"></td>
                        <td class="num" style="color:var(--ink-3)" x-text="i.min.toLocaleString('ko-KR')"></td>
                        <td class="num" x-text="won(i.qty * i.cost)"></td>
                        <td>
                          <span class="tag" :class="!i.active ? '' : (i.qty <= i.min ? 'tag--crit' : (i.qty <= i.min*1.5 ? 'tag--warn' : 'tag--ok'))">
                            <i x-show="i.active"></i>
                            <span x-text="!i.active ? '단종' : (i.qty <= i.min ? '부족' : (i.qty <= i.min*1.5 ? '임박' : '정상'))"></span>
                          </span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="empty" x-show="!filtered.length">
                  <b>조건에 맞는 품목이 없습니다</b>
                  검색어나 필터를 바꿔보세요.
                </div>
              </div>
            </div>
          </template>

          <!-- ── 입출고 ── -->
          <template x-if="view==='moves'">
            <div>
              <div class="page__hd">
                <div><h2>입출고 이력</h2><p>현재고는 이 기록을 합산해 만듭니다. 기록을 지우지 않고 반대 기록으로 되돌립니다.</p></div>
                <span class="sp"></span>
                <button class="btn btn--pri" @click="openMove()" x-show="can('move.create')">입출고 등록</button>
              </div>
              <div class="card tbl-wrap">
                <table>
                  <thead><tr><th>일시</th><th>품목</th><th>구분</th><th style="text-align:right">수량</th><th>자리</th><th>사유</th><th>담당</th></tr></thead>
                  <tbody>
                    <template x-for="m in moves" :key="m.id">
                      <tr style="cursor:default">
                        <td class="sku" x-text="fmtDT(m.at)"></td>
                        <td class="nm" x-text="itemName(m.itemId)"></td>
                        <td><span class="tag" :class="m.type==='in'?'tag--ok':(m.type==='out'?'tag--info':'tag--warn')" x-text="moveLabel(m.type)"></span></td>
                        <td class="num" x-text="(m.type==='out'?'-':'+') + m.qty.toLocaleString('ko-KR')"></td>
                        <td x-text="m.loc"></td>
                        <td style="color:var(--ink-2)" x-text="m.reason"></td>
                        <td x-text="m.actor"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <!-- ── 팀 · 권한 ── -->
          <template x-if="view==='team'">
            <div>
              <div class="page__hd">
                <div><h2>팀과 권한</h2><p>역할은 네 단계입니다. 사람마다 권한을 따로 켜고 끄는 대신 역할로 묶었습니다.</p></div>
                <span class="sp"></span>
                <button class="btn btn--pri" @click="inviteOpen=true" x-show="can('member.invite')">팀원 초대</button>
              </div>

              <div class="card tbl-wrap" style="margin-bottom:22px">
                <table>
                  <thead><tr><th>이름</th><th>이메일</th><th>역할</th><th>상태</th><th style="width:60px"></th></tr></thead>
                  <tbody>
                    <template x-for="m in members" :key="m.id">
                      <tr style="cursor:default">
                        <td><div style="display:flex;align-items:center;gap:10px">
                          <span class="av" x-text="m.name.slice(0,1)"></span>
                          <span class="nm" x-text="m.name + (m.id===me.id ? ' (나)' : '')"></span>
                        </div></td>
                        <td style="color:var(--ink-2)" x-text="m.email"></td>
                        <td>
                          <select class="btn btn--sm" style="width:auto;padding:0 8px"
                                  x-model="m.role" @change="roleChanged(m)"
                                  :disabled="!can('member.role') || m.role==='owner'">
                            <template x-for="(r,k) in roles" :key="k">
                              <option :value="k" x-text="r.label"></option>
                            </template>
                          </select>
                        </td>
                        <td><span class="tag" :class="m.pending?'tag--warn':'tag--ok'"><i></i><span x-text="m.pending?'초대함':'활성'"></span></span></td>
                        <td><button class="btn btn--ghost btn--sm" x-show="can('member.remove') && m.role!=='owner'"
                                    @click="members = members.filter(x=>x.id!==m.id); toast('내보냈습니다')">내보내기</button></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <h3 style="font-size:16px;margin-bottom:10px">역할별 권한</h3>
              <div class="tbl-wrap card" style="margin-bottom:16px">
                <table class="mx">
                  <thead><tr><th>할 수 있는 일</th>
                    <template x-for="(r,k) in roles" :key="k"><th x-text="r.label"></th></template>
                  </tr></thead>
                  <tbody>
                    <template x-for="p in permList" :key="p.key">
                      <tr>
                        <td x-text="p.label"></td>
                        <template x-for="(r,k) in roles" :key="k">
                          <td>
                            <span :class="r.perms.includes(p.key) ? 'y' : (r.partial && r.partial.includes(p.key) ? 'p' : 'n')"
                                  x-text="r.perms.includes(p.key) ? '●' : (r.partial && r.partial.includes(p.key) ? '◐' : '—')"></span>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p style="font-size:13px;color:var(--ink-3)">● 가능 · ◐ 제한적으로 가능(자기가 만든 것만) · — 불가</p>

              <div class="note note--warn" style="margin-top:18px"><span class="ic">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
              </span><div>
                <b>소유자는 반드시 한 명 이상</b>이어야 합니다. 마지막 소유자는 역할을 낮추거나 내보낼 수 없게 서버에서도 막습니다.
                화면에서만 막으면 API 를 직접 부르는 순간 뚫립니다.
              </div></div>
            </div>
          </template>

          <!-- ── 요금제 ── -->
          <template x-if="view==='billing'">
            <div>
              <div class="page__hd">
                <div><h2>요금제와 결제</h2><p x-text="'현재 ' + plans[plan].name + ' 요금제 · 다음 결제일 ' + nextBill"></p></div>
              </div>

              <div class="plans" style="margin-bottom:24px">
                <template x-for="(p,k) in plans" :key="k">
                  <div class="card plan" :data-cur="k===plan">
                    <span class="plan__b" x-show="k===plan">사용 중</span>
                    <h3 x-text="p.name"></h3>
                    <div class="pr"><span x-text="p.price ? won(p.price) : '무료'"></span><span x-show="p.price"> / 월</span></div>
                    <p style="color:var(--ink-2);font-size:14px" x-text="p.for"></p>
                    <ul>
                      <template x-for="f in p.feats" :key="f">
                        <li><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span x-text="f"></span></li>
                      </template>
                    </ul>
                    <button class="btn" :class="k===plan?'':'btn--pri'" :disabled="k===plan || !can('billing.manage')"
                            @click="changePlan(k)" x-text="k===plan ? '현재 요금제' : '이 요금제로'"></button>
                  </div>
                </template>
              </div>

              <div class="grid2">
                <div class="card">
                  <div class="panel__hd"><h3>결제 수단</h3><span class="sp"></span>
                    <button class="btn btn--sm" @click="cardOpen=true" x-show="can('billing.manage')" x-text="card ? '변경' : '등록'"></button></div>
                  <div class="panel__bd">
                    <template x-if="card">
                      <div style="display:flex;align-items:center;gap:14px">
                        <span style="width:46px;height:32px;border-radius:6px;background:linear-gradient(135deg,#1e293b,#475569);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700">CARD</span>
                        <div><b x-text="'•••• •••• •••• ' + card.last4"></b>
                          <div style="font-size:12.5px;color:var(--ink-3)" x-text="card.brand + ' · ' + card.exp + ' 만료'"></div></div>
                      </div>
                    </template>
                    <template x-if="!card">
                      <p style="color:var(--ink-3)">등록된 카드가 없습니다. 무료 요금제는 카드 없이 씁니다.</p>
                    </template>
                  </div>
                </div>

                <div class="card">
                  <div class="panel__hd"><h3>이번 달 사용량</h3></div>
                  <div class="panel__bd" style="display:flex;flex-direction:column;gap:14px">
                    <template x-for="u in usage" :key="u.k">
                      <div>
                        <div style="display:flex;font-size:13.5px;margin-bottom:6px">
                          <span x-text="u.k"></span><span style="flex:1"></span>
                          <b class="mono" x-text="u.v + ' / ' + (u.max === Infinity ? '무제한' : u.max)"></b>
                        </div>
                        <div style="height:7px;border-radius:100px;background:var(--line);overflow:hidden">
                          <div :style="'height:100%;border-radius:100px;width:' + Math.min(100, u.max===Infinity?12:u.v/u.max*100) + '%;background:' + (u.max!==Infinity && u.v/u.max>0.85 ? 'var(--warn)' : 'var(--brand)')"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="card" style="margin-top:16px">
                <div class="panel__hd"><h3>청구 내역</h3></div>
                <div class="tbl-wrap">
                  <table>
                    <thead><tr><th>청구일</th><th>내역</th><th style="text-align:right">금액</th><th>상태</th><th style="width:80px"></th></tr></thead>
                    <tbody>
                      <template x-for="v in invoices" :key="v.id">
                        <tr style="cursor:default">
                          <td class="sku" x-text="v.date"></td>
                          <td x-text="v.desc"></td>
                          <td class="num" x-text="won(v.amount)"></td>
                          <td><span class="tag" :class="v.status==='paid'?'tag--ok':'tag--warn'"><i></i><span x-text="v.status==='paid'?'결제됨':'대기'"></span></span></td>
                          <td><button class="btn btn--ghost btn--sm" @click="toast('영수증 내려받기는 데모에서 생략했습니다')">영수증</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

          <!-- ── 설계 ── -->
          <template x-if="view==='design'">
            <div>
              <div class="page__hd">
                <div><h2>데이터 구조와 권한</h2>
                  <p>화면보다 이쪽이 먼저입니다. 여기서 튼 방향은 나중에 열 배로 비싸집니다.</p></div>
              </div>

              <div class="note note--ok" style="margin-bottom:20px"><span class="ic">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
              </span><div>
                <b>현재고를 컬럼으로 두지 않았습니다.</b>
                입출고 기록(<span class="mono">movements</span>)을 합산해서 만듭니다. 재고가 안 맞을 때
                "언제부터 틀어졌는지" 되짚을 수 있고, 동시에 두 사람이 출고해도 숫자가 깨지지 않습니다.
                대신 목록이 느려지므로 <span class="mono">stock_snapshots</span> 에 하루 단위로 접어 둡니다.
              </div></div>

              <h3 style="font-size:16px;margin:0 0 12px">테이블</h3>
              <div class="erd" style="margin-bottom:22px">
                <template x-for="e in erd" :key="e.name">
                  <div class="card ent" :class="e.kind ? 'ent--'+e.kind : ''">
                    <div class="ent__hd"><span x-text="e.name"></span><small x-text="e.note"></small></div>
                    <table><tbody>
                      <template x-for="c in e.cols" :key="c[0]">
                        <tr><td :class="c[2]" x-text="c[0]"></td><td x-text="c[1]"></td></tr>
                      </template>
                    </tbody></table>
                  </div>
                </template>
              </div>

              <h3 style="font-size:16px;margin:0 0 12px">권한을 거는 자리</h3>
              <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:22px">
                <div class="note"><span class="ic">1</span><div>
                  <b>화면</b> — 버튼을 감춥니다. 편의일 뿐 보안이 아닙니다.
                </div></div>
                <div class="note"><span class="ic">2</span><div>
                  <b>API</b> — 모든 요청에서 <span class="mono">memberships.role</span> 을 확인합니다. 진짜 방어선은 여기입니다.
                </div></div>
                <div class="note"><span class="ic">3</span><div>
                  <b>데이터베이스</b> — 행 수준 보안(RLS)으로 <span class="mono">workspace_id</span> 가 다른 행은 아예 보이지 않게 합니다.
                  API 에 구멍이 나도 남의 회사 재고는 새지 않습니다.
                </div></div>
              </div>

              <div class="note note--warn"><span class="ic">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
              </span><div>
                <b>이 데모는 UI 까지입니다.</b> 서버도 데이터베이스도 없고, 새로고침하면 처음 값으로 돌아갑니다.
                위 설계는 실제로 만들 때의 계획이고, 화면은 그 계획대로 움직이는지 확인하는 용도입니다.
              </div></div>
            </div>
          </template>

          <!-- ── 설정 ── -->
          <template x-if="view==='settings'">
            <div>
              <div class="page__hd"><div><h2>워크스페이스 설정</h2></div></div>
              <div style="display:flex;flex-direction:column;gap:16px;max-width:620px">
                <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px">
                  <div class="fld"><label>워크스페이스 이름</label><input x-model="ws.name" :disabled="!can('ws.manage')"></div>
                  <div class="fld"><label>업종</label><input x-model="ws.industry" :disabled="!can('ws.manage')"></div>
                  <button class="btn btn--pri" style="align-self:flex-start" @click="toast('저장했습니다')" x-show="can('ws.manage')">저장</button>
                </div>

                <div class="card" style="padding:20px">
                  <h3 style="font-size:15.5px;margin-bottom:12px">재고를 두는 자리</h3>
                  <ul class="mini">
                    <template x-for="(l,i) in ws.locations" :key="i">
                      <li><span style="flex:1" x-text="l"></span>
                        <span class="tag" x-text="items.filter(x=>x.loc===l).length + '개 품목'"></span></li>
                    </template>
                  </ul>
                </div>

                <div class="card" style="padding:20px;border-color:#FDA29B">
                  <h3 style="font-size:15.5px;color:var(--crit);margin-bottom:6px">워크스페이스 삭제</h3>
                  <p style="color:var(--ink-2);font-size:14px;margin-bottom:14px">
                    품목과 입출고 기록이 모두 지워집니다. 되돌릴 수 없습니다.
                  </p>
                  <button class="btn btn--danger" :disabled="!can('ws.delete')" @click="toast('소유자만 할 수 있습니다')">삭제</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 품목 서랍 -->
      <template x-if="drawer">
        <div class="drawer" @keydown.escape.window="drawer=null">
          <div class="drawer__veil" @click="drawer=null"></div>
          <div class="drawer__pn">
            <div class="drawer__hd">
              <div style="flex:1">
                <h3 x-text="drawer.name"></h3>
                <div class="sku" style="margin-top:3px" x-text="drawer.sku + ' · ' + drawer.cat"></div>
              </div>
              <button class="x" @click="drawer=null" aria-label="닫기">✕</button>
            </div>
            <div class="drawer__bd">
              <div class="kpis" style="grid-template-columns:1fr 1fr">
                <div class="card kpi"><span class="kpi__t">현재고</span>
                  <span class="kpi__v" x-text="drawer.qty.toLocaleString('ko-KR') + drawer.unit"></span>
                  <span class="kpi__d" x-text="'안전재고 ' + drawer.min + drawer.unit"></span></div>
                <div class="card kpi"><span class="kpi__t">재고 자산</span>
                  <span class="kpi__v" x-text="won(drawer.qty*drawer.cost)"></span>
                  <span class="kpi__d" x-text="'단가 ' + won(drawer.cost)"></span></div>
              </div>

              <div class="card" style="padding:18px">
                <dl class="dl">
                  <dt>SKU</dt><dd class="mono" x-text="drawer.sku"></dd>
                  <dt>분류</dt><dd x-text="drawer.cat"></dd>
                  <dt>자리</dt><dd x-text="drawer.loc"></dd>
                  <dt>단위</dt><dd x-text="drawer.unit"></dd>
                  <dt>상태</dt><dd><span class="tag" :class="drawer.active?'tag--ok':''" x-text="drawer.active?'활성':'단종'"></span></dd>
                </dl>
              </div>

              <div class="card">
                <div class="panel__hd"><h3 style="font-size:14.5px">입출고 이력</h3></div>
                <ul class="feed">
                  <template x-for="m in movesOf(drawer.id)" :key="m.id">
                    <li>
                      <span class="tag" :class="m.type==='in'?'tag--ok':(m.type==='out'?'tag--info':'tag--warn')" x-text="moveLabel(m.type)"></span>
                      <span class="tx"><b x-text="(m.type==='out'?'-':'+') + m.qty + drawer.unit"></b>
                        <div style="color:var(--ink-3);font-size:12.5px" x-text="m.reason + ' · ' + m.actor"></div></span>
                      <span class="tm" x-text="ago(m.at)"></span>
                    </li>
                  </template>
                  <template x-if="!movesOf(drawer.id).length">
                    <li><span class="tx" style="color:var(--ink-3)">아직 기록이 없습니다.</span></li>
                  </template>
                </ul>
              </div>

              <div style="display:flex;gap:9px">
                <button class="btn btn--pri" style="flex:1" @click="openMove(drawer)" x-show="can('move.create')">입출고 등록</button>
                <button class="btn" @click="toast('품목 수정은 데모에서 흐름만 보여드립니다')" x-show="can('item.update')">수정</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- 입출고 모달 -->
      <template x-if="moveOpen">
        <div class="modal" @keydown.escape.window="moveOpen=false">
          <div class="modal__veil" @click="moveOpen=false"></div>
          <div class="modal__pn">
            <h3>입출고 등록</h3>
            <div class="fld"><label>품목</label>
              <select x-model="mv.itemId">
                <template x-for="i in items.filter(x=>x.active)" :key="i.id">
                  <option :value="i.id" x-text="i.name + ' (' + i.sku + ')'"></option>
                </template>
              </select></div>
            <div class="tabs">
              <button :aria-selected="mv.type==='in'" @click="mv.type='in'">입고</button>
              <button :aria-selected="mv.type==='out'" @click="mv.type='out'">출고</button>
              <button :aria-selected="mv.type==='adj'" @click="mv.type='adj'">조정</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="fld"><label>수량</label><input type="number" min="1" x-model.number="mv.qty"></div>
              <div class="fld"><label>자리</label>
                <select x-model="mv.loc">
                  <template x-for="l in ws.locations" :key="l"><option x-text="l" :value="l"></option></template>
                </select></div>
            </div>
            <div class="fld"><label>사유</label><input x-model="mv.reason" placeholder="정기 발주 입고"></div>
            <p class="err" x-show="mvErr" x-text="mvErr"></p>
            <div style="display:flex;gap:9px;justify-content:flex-end">
              <button class="btn" @click="moveOpen=false">취소</button>
              <button class="btn btn--pri" @click="saveMove()">등록</button>
            </div>
          </div>
        </div>
      </template>

      <!-- 품목 추가 모달 -->
      <template x-if="itemOpen">
        <div class="modal" @keydown.escape.window="itemOpen=false">
          <div class="modal__veil" @click="itemOpen=false"></div>
          <div class="modal__pn">
            <h3>품목 추가</h3>
            <div class="fld"><label>이름</label><input x-model="ni.name" placeholder="스테인리스 볼트 M6"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="fld"><label>SKU</label><input x-model="ni.sku" placeholder="BLT-M6-SS"></div>
              <div class="fld"><label>분류</label>
                <select x-model="ni.cat"><template x-for="c in cats" :key="c"><option x-text="c" :value="c"></option></template></select></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
              <div class="fld"><label>단위</label><input x-model="ni.unit" placeholder="개"></div>
              <div class="fld"><label>안전재고</label><input type="number" x-model.number="ni.min"></div>
              <div class="fld"><label>단가</label><input type="number" x-model.number="ni.cost"></div>
            </div>
            <p class="err" x-show="niErr" x-text="niErr"></p>
            <div style="display:flex;gap:9px;justify-content:flex-end">
              <button class="btn" @click="itemOpen=false">취소</button>
              <button class="btn btn--pri" @click="saveItem()">추가</button>
            </div>
          </div>
        </div>
      </template>

      <!-- 초대 모달 -->
      <template x-if="inviteOpen">
        <div class="modal" @keydown.escape.window="inviteOpen=false">
          <div class="modal__veil" @click="inviteOpen=false"></div>
          <div class="modal__pn">
            <h3>팀원 초대</h3>
            <div class="fld"><label>이메일</label><input x-model="inv.email" placeholder="park@company.com"></div>
            <div class="fld"><label>역할</label>
              <select x-model="inv.role">
                <template x-for="(r,k) in roles" :key="k">
                  <option :value="k" x-text="r.label + ' — ' + r.desc" x-show="k!=='owner'"></option>
                </template>
              </select></div>
            <div style="display:flex;gap:9px;justify-content:flex-end">
              <button class="btn" @click="inviteOpen=false">취소</button>
              <button class="btn btn--pri" @click="sendInvite()">초대 보내기</button>
            </div>
          </div>
        </div>
      </template>

      <!-- 카드 등록 모달 -->
      <template x-if="cardOpen">
        <div class="modal" @keydown.escape.window="cardOpen=false">
          <div class="modal__veil" @click="cardOpen=false"></div>
          <div class="modal__pn">
            <h3>결제 수단 등록</h3>
            <div class="note note--warn"><span class="ic">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
            </span><div>
              데모라 실제 카드 입력은 두지 않았습니다. 실제로 만들 때도 카드 번호는
              <b>우리 서버를 거치지 않고</b> 결제사 위젯이 직접 받습니다. 우리는 토큰만 저장합니다.
            </div></div>
            <div style="display:flex;gap:9px;justify-content:flex-end">
              <button class="btn" @click="cardOpen=false">취소</button>
              <button class="btn btn--pri" @click="card={last4:'4242',brand:'신한',exp:'09/28'};cardOpen=false;toast('결제 수단을 등록했습니다')">모의 카드 등록</button>
            </div>
          </div>
        </div>
      </template>

      <div class="toast" x-show="msg" x-transition x-text="msg"></div>
    </div>
  </template>

  <!-- 로그인 없이 바로 둘러보기 -->
  <button class="skip" type="button" x-show="screen !== 'app'" @click="enterApp()">
    로그인 없이 둘러보기
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
  </button>
</div>

      {name:"movements", note:"원장 · 지우지 않음", cols:[["id","uuid PK","pk"],["workspace_id","uuid FK","fk"],["item_id","uuid FK","fk"],["location_id","uuid FK","fk"],["type","enum",""],["qty","int",""],["reason","text",""],["actor_id","uuid FK","fk"],["voids_id","uuid FK","fk"],["created_at","timestamptz",""]]},
      {name:"stock_snapshots", note:"합산 결과 캐시", cols:[["workspace_id","uuid FK","fk"],["item_id","uuid FK","fk"],["location_id","uuid FK","fk"],["qty","int",""],["as_of","date",""]]},
      {name:"subscriptions", kind:"bill", note:"요금제 상태", cols:[["workspace_id","uuid FK","fk"],["plan","enum",""],["status","enum",""],["pg_customer_id","text",""],["period_end","timestamptz",""]]},
      {name:"invoices", kind:"bill", note:"청구", cols:[["id","uuid PK","pk"],["workspace_id","uuid FK","fk"],["amount","int",""],["status","enum",""],["issued_at","timestamptz",""]]}
    ],

    menu:[
      {label:"현장", items:[
        {id:"dash", name:"대시보드", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>'},
        {id:"items", name:"품목", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg>'},
        {id:"moves", name:"입출고", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M7 17V7M7 7L4 10M7 7l3 3"/><path d="M17 7v10M17 17l3-3M17 17l-3-3"/></svg>'}
      ]},
      {label:"관리", items:[
        {id:"team", name:"팀과 권한", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>'},
        {id:"billing", name:"요금제", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>'},
        {id:"settings", name:"설정", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/></svg>'}
      ]},
      {label:"만들 때 정한 것", items:[
        {id:"design", name:"데이터 구조와 권한", perm:"item.read", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>'}
      ]}
    ],

    /* ============================================================
       동작
       ============================================================ */
    init(){
      this.seedMoves();
      this.$watch("view", (v) => { if(v === "dash") this.$nextTick(() => this.charts()); });
    },

    /* --- 인증 --- */
    doAuth(){
      this.authErr = "";
      if(!this.auth.email || this.auth.email.indexOf("@") < 0){ this.authErr = "이메일 주소를 확인해주세요."; return; }
      if((this.auth.pw || "").length < 4){ this.authErr = "비밀번호를 입력해주세요."; return; }
      if(this.authTab === "up"){
        if(!this.auth.name){ this.authErr = "이름을 적어주세요."; return; }
        this.me.name = this.auth.name;
        this.me.email = this.auth.email;
        this.members[0].name = this.auth.name;
        this.members[0].email = this.auth.email;
        this.screen = "onboard"; this.step = 1;
      }else{
        this.screen = "app";
        this.$nextTick(() => this.charts());
      }
    },
    ssoNote(){ this.toast("실제 연동 대신 바로 들어갑니다"); this.enterApp(); },
    enterApp(){
      this.screen = "app";
      this.view = "dash";
      this.$nextTick(() => this.charts());
    },
    finishOnboard(){
      this.ws.locations = this.ws.locations.filter(Boolean);
      if(!this.ws.locations.length) this.ws.locations = ["본사 창고"];
      var emails = (this.ws.invites || "").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
      var self = this;
      emails.slice(0, 5).forEach(function(e, i){
        self.members.push({id:100+i, name:e.split("@")[0], email:e, role:"manager", pending:true});
      });
      this.screen = "app";
      this.$nextTick(() => this.charts());
      if(emails.length) this.toast(emails.length + "명에게 초대를 보냈습니다");
    },
    signOut(){ this.screen = "auth"; this.authTab = "in"; this.view = "dash"; },

    /* --- 권한 --- */
    can(p){ if(!p) return true; return (this.roles[this.me.role].perms || []).indexOf(p) >= 0; },

    /* --- 이동 --- */
    goto(v){ this.view = v; this.sideOpen = false; },
    titleOf(v){
      var t = {dash:"대시보드", items:"품목", moves:"입출고", team:"팀과 권한", billing:"요금제", settings:"설정", design:"데이터 구조와 권한"};
      return t[v] || "";
    },

    /* --- 계산 --- */
    get totalValue(){ return this.items.reduce(function(a,i){ return a + i.qty * i.cost; }, 0); },
    get lowStock(){ return this.items.filter(function(i){ return i.active && i.qty <= i.min; }); },
    get filtered(){
      var q = this.q.trim().toLowerCase(), self = this;
      var r = this.items.filter(function(i){
        if(q && (i.name + " " + i.sku).toLowerCase().indexOf(q) < 0) return false;
        if(self.fCat && i.cat !== self.fCat) return false;
        if(self.fLoc && i.loc !== self.fLoc) return false;
        if(self.fLow && !(i.active && i.qty <= i.min)) return false;
        return true;
      });
      var k = this.sort.k, d = this.sort.d;
      return r.sort(function(a,b){
        var av = k === "value" ? a.qty*a.cost : a[k], bv = k === "value" ? b.qty*b.cost : b[k];
        if(typeof av === "string") return av.localeCompare(bv, "ko") * d;
        return (av - bv) * d;
      });
    },
    sortBy(k){ if(this.sort.k === k) this.sort.d *= -1; else { this.sort.k = k; this.sort.d = 1; } },
    toggleSel(id){
      var i = this.sel.indexOf(id);
      if(i >= 0) this.sel.splice(i,1); else this.sel.push(id);
    },
    toggleAll(e){ this.sel = e.target.checked ? this.filtered.map(function(i){ return i.id; }) : []; },
    bulkDeactivate(){
      var self = this;
      this.items.forEach(function(i){ if(self.sel.indexOf(i.id) >= 0) i.active = false; });
      this.toast(this.sel.length + "개를 단종 처리했습니다");
      this.sel = [];
    },

    /* --- 품목 --- */
    openItem(i){ this.drawer = i; },
    openNewItem(){ this.ni = {name:"",sku:"",cat:"부품",unit:"개",min:0,cost:0}; this.niErr=""; this.itemOpen = true; },
    saveItem(){
      if(!this.ni.name || !this.ni.sku){ this.niErr = "이름과 SKU 는 있어야 합니다."; return; }
      if(this.items.some(x => x.sku.toLowerCase() === this.ni.sku.toLowerCase())){
        this.niErr = "이미 쓰고 있는 SKU 입니다."; return;
      }
      this.items.unshift(Object.assign({
        id: Date.now(), qty: 0, active: true, loc: this.ws.locations[0]
      }, this.ni));
      this.itemOpen = false;
      this.toast("품목을 추가했습니다");
    },
    itemName(id){ var i = this.items.find(function(x){ return x.id === id; }); return i ? i.name : "—"; },
    itemUnit(id){ var i = this.items.find(function(x){ return x.id === id; }); return i ? i.unit : ""; },

    /* --- 입출고 --- */
    openMove(item){
      this.mv = {itemId: item ? item.id : this.items[0].id, type:"in", qty:100,
                 loc: item ? item.loc : this.ws.locations[0], reason:""};
      this.mvErr = ""; this.moveOpen = true;
    },
    saveMove(){
      var it = this.items.find(x => x.id == this.mv.itemId);
      if(!it){ this.mvErr = "품목을 골라주세요."; return; }
      if(!this.mv.qty || this.mv.qty <= 0){ this.mvErr = "수량은 1 이상이어야 합니다."; return; }
      if(this.mv.type === "out" && this.mv.qty > it.qty){
        this.mvErr = "현재고(" + it.qty + it.unit + ")보다 많이 출고할 수 없습니다."; return;
      }
      var delta = this.mv.type === "out" ? -this.mv.qty : this.mv.qty;
      it.qty += delta;
      this.moves.unshift({
        id: Date.now(), itemId: it.id, type: this.mv.type, qty: this.mv.qty,
        loc: this.mv.loc, reason: this.mv.reason || "사유 없음",
        actor: this.me.name, at: new Date()
      });
      this.moveOpen = false;
      this.toast(it.name + " " + this.moveLabel(this.mv.type) + " " + this.mv.qty + it.unit);
      if(this.view === "dash") this.$nextTick(() => this.charts());
    },
    moveLabel(t){ return t === "in" ? "입고" : (t === "out" ? "출고" : "조정"); },
    movesOf(id){ return this.moves.filter(function(m){ return m.itemId === id; }); },
    seedMoves(){
      var seed = [
        [1,"in",4000,"정기 발주 입고","박입고",5],[5,"out",6,"납품 출고","이출고",9],
        [3,"in",600,"정기 발주 입고","박입고",26],[2,"out",40,"생산 투입","이출고",32],
        [6,"out",5,"라인 보충","이출고",50],[4,"in",1200,"포장재 입고","박입고",74],
        [7,"out",800,"생산 투입","이출고",98],[8,"out",26,"생산 투입","이출고",120],
        [1,"out",2200,"생산 투입","이출고",144],[9,"in",100,"라벨 입고","박입고",170]
      ];
      var now = Date.now(), self = this;
      this.moves = seed.map(function(s, i){
        return {id:i+1, itemId:s[0], type:s[1], qty:s[2], reason:s[3], actor:s[4],
                loc: (self.items.find(function(x){ return x.id === s[0]; }) || {}).loc || "본사 창고",
                at: new Date(now - s[5]*3600*1000)};
      });
    },

    /* --- 팀 --- */
    roleChanged(m){
      if(this.members.filter(function(x){ return x.role === "owner"; }).length === 0){
        m.role = "owner";
        this.toast("소유자는 최소 한 명 있어야 합니다");
        return;
      }
      this.toast(m.name + " 님의 역할을 바꿨습니다");
    },
    sendInvite(){
      if(!this.inv.email || this.inv.email.indexOf("@") < 0){ this.toast("이메일을 확인해주세요"); return; }
      this.members.push({id:Date.now(), name:this.inv.email.split("@")[0], email:this.inv.email, role:this.inv.role, pending:true});
      this.inviteOpen = false;
      this.toast("초대를 보냈습니다");
      this.inv = {email:"", role:"manager"};
    },

    /* --- 요금제 --- */
    get usage(){
      return [
        {k:"품목", v:this.items.length, max: this.plan==="free" ? 50 : Infinity},
        {k:"사용자", v:this.members.length, max: this.plan==="free" ? 1 : (this.plan==="team" ? 10 : Infinity)},
        {k:"창고", v:this.ws.locations.length, max: this.plan==="biz" ? Infinity : 3}
      ];
    },
    changePlan(k){
      if(k !== "free" && !this.card){ this.cardOpen = true; return; }
      this.plan = k;
      this.toast(this.plans[k].name + " 요금제로 바꿨습니다");
    },

    /* --- 유틸 --- */
    won(n){ return "₩" + Math.round(n).toLocaleString("ko-KR"); },
    fmtDate(d){ return d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일"; },
    fmtDT(d){
      var p = function(n){ return String(n).padStart(2,"0"); };
      return (d.getMonth()+1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    },
    ago(d){
      var s = (Date.now() - d.getTime())/1000;
      if(s < 3600) return Math.max(1, Math.round(s/60)) + "분 전";
      if(s < 86400) return Math.round(s/3600) + "시간 전";
      return Math.round(s/86400) + "일 전";
    },
    toast(m){ this.msg = m; clearTimeout(this._t); this._t = setTimeout(() => this.msg = "", 2400); },

    /* --- 차트 --- */
    charts(){
      if(typeof Chart === "undefined") return;
      var self = this;
      var css = getComputedStyle(document.documentElement);
      var brand = css.getPropertyValue("--brand").trim();
      var ink3 = css.getPropertyValue("--ink-3").trim();
      var line = css.getPropertyValue("--line").trim();
      Chart.defaults.font.family = css.getPropertyValue("--f").trim();
      Chart.defaults.color = ink3;

      var f = document.getElementById("cFlow");
      if(f){
        if(this._f) this._f.destroy();
        var days = [], ins = [], outs = [];
        for(var i = 13; i >= 0; i--){
          var d = new Date(Date.now() - i*86400000);
          days.push((d.getMonth()+1) + "/" + d.getDate());
          ins.push(Math.round(600 + Math.sin(i/2.2)*400 + Math.random()*380));
          outs.push(Math.round(520 + Math.cos(i/1.9)*330 + Math.random()*300));
        }
        this._f = new Chart(f, {
          type:"line",
          data:{labels:days, datasets:[
            {label:"입고", data:ins, borderColor:brand, backgroundColor:"rgba(79,70,229,.10)", fill:true, tension:.36, borderWidth:2, pointRadius:0, pointHoverRadius:4},
            {label:"출고", data:outs, borderColor:"#0E7490", backgroundColor:"rgba(14,116,144,.08)", fill:true, tension:.36, borderWidth:2, pointRadius:0, pointHoverRadius:4}
          ]},
          options:{responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
            plugins:{legend:{position:"bottom",labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:"circle",padding:16}}},
            scales:{x:{grid:{display:false},border:{color:line}},
                    y:{grid:{color:line},border:{display:false},ticks:{maxTicksLimit:5}}}}
        });
      }

      var c = document.getElementById("cCat");
      if(c){
        if(this._c) this._c.destroy();
        var byCat = {};
        this.items.forEach(function(i){ if(i.active) byCat[i.cat] = (byCat[i.cat]||0) + i.qty*i.cost; });
        this._c = new Chart(c, {
          type:"doughnut",
          data:{labels:Object.keys(byCat), datasets:[{data:Object.values(byCat),
            backgroundColor:["#4F46E5","#0E7490","#7C3AED","#059669","#DC6803"], borderWidth:0, hoverOffset:6}]},
          options:{responsive:true, maintainAspectRatio:false, cutout:"62%",
            plugins:{legend:{position:"bottom",labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:"circle",padding:12}}}}
        });
      }

      /* 레이아웃이 앉은 뒤 한 번 더 — 안 그러면 그리드 적용 전 폭으로 굳는다 */
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if(self._f) self._f.resize();
          if(self._c) self._c.resize();
        });
      });
      if(!this._rs){
        this._rs = true;
        window.addEventListener("resize", function(){
          if(self._f) self._f.resize();
          if(self._c) self._c.resize();
        });
      }
    }
  };
}
</script>
