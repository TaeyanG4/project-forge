:root{
  color-scheme:dark;
  --ground:#08090D; --surface:#12141C; --line:#232735; --line-2:#343B4D;
  --ink:#F4F6FA; --ink-2:#B0B8CB; --ink-3:#78809A;
  --straw:#FFB020; --on-accent:#0A0B10;
  --spectrum:linear-gradient(90deg,#FFB020 0%,#FF8A2B 18%,#FF6B35 34%,#E8467C 54%,#A855F7 76%,#3B9EFF 100%);
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#FAFAF8; --surface:#FFFFFF; --line:#E3E2DC; --line-2:#CFCEC6;
  --ink:#14151A; --ink-2:#4A4E5A; --ink-3:#7C818E;
  --straw:#A66000; --on-accent:#FFFFFF;
  --spectrum:linear-gradient(90deg,#A66000 0%,#A34E14 18%,#B0432A 34%,#A32355 54%,#6B29A8 76%,#1A5FA8 100%);
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--ground);color:var(--ink-2);
  font-family:var(--f);font-size:16px;line-height:1.85;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  max-width:640px;width:100%;margin:0 auto;padding:80px 24px 60px;
}
/* 로고 — Fornax 는 화로자리다. 크기가 다른 별 셋을 옅은 선으로 잇는다 */

.k{
  font-size:12.5px;letter-spacing:.2em;color:var(--ink-3);
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
.band{display:block;height:3px;width:110px;background:var(--spectrum);border-radius:2px;margin:14px 0 26px;}
h1{
  margin:0 0 18px;color:var(--ink);font-size:clamp(28px,5.4vw,40px);
  font-weight:800;line-height:1.3;letter-spacing:-.03em;
}
p{margin:0 0 12px;font-size:16.5px;}
b{color:var(--ink);font-weight:600;}
.go{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  padding:13px 22px;border-radius:100px;font-size:15px;font-weight:700;
  letter-spacing:-.015em;transition:filter .2s ease,transform .2s ease,border-color .2s ease,color .2s ease;
}
.btn--hot{background:var(--straw);color:var(--on-accent);border:0;}
.btn--hot:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn--ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);}
.btn--ghost:hover{color:var(--ink);border-color:var(--straw);}
footer{
  border-top:1px solid var(--line);padding:26px 24px;font-size:13.5px;color:var(--ink-3);
}
footer .in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;}
footer a{color:var(--ink-3);text-decoration:none;}
footer a:hover{color:var(--straw);}
</style>
