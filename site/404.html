body{
  margin:0;background:var(--ground);color:var(--ink-2);
  font-family:var(--f);font-size:16px;line-height:1.85;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  max-width:640px;width:100%;margin:0 auto;padding:80px 24px 60px;
}
/* 로고 — Fornax 는 화로자리다. 크기가 다른 별 셋을 옅은 선으로 잇는다 */
.mark{
  width:34px;height:34px;background:var(--spectrum);margin-bottom:30px;
  -webkit-mask-image:url("data:image/svg+xml;charset=utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271.33%27%20stroke-linecap%3D%27round%27%20opacity%3D%27.55%27%3E%3Cpath%20d%3D%27M4.41%2016.74%2011.60%208.62%27%2F%3E%3Cpath%20d%3D%27M11.60%208.62%2019.96%2013.02%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2711.60%27%20cy%3D%278.62%27%20r%3D%274.06%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%274.41%27%20cy%3D%2716.74%27%20r%3D%272.90%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2719.96%27%20cy%3D%2713.02%27%20r%3D%272.44%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E");
  mask-image:url("data:image/svg+xml;charset=utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271.33%27%20stroke-linecap%3D%27round%27%20opacity%3D%27.55%27%3E%3Cpath%20d%3D%27M4.41%2016.74%2011.60%208.62%27%2F%3E%3Cpath%20d%3D%27M11.60%208.62%2019.96%2013.02%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2711.60%27%20cy%3D%278.62%27%20r%3D%274.06%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%274.41%27%20cy%3D%2716.74%27%20r%3D%272.90%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2719.96%27%20cy%3D%2713.02%27%20r%3D%272.44%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E");
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
}
.k{
  font-size:12.5px;letter-spacing:.2em;color:var(--ink-3);
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
.band{display:block;height:3px;width:110px;background:var(--spectrum);border-radius:2px;margin:14px 0 26px;}
h1{
  margin:0 0 18px;color:var(--ink);font-size:clamp(28px,5.4vw,40px);
  font-weight:800;line-height:1.3;letter-spacing:-.03em;
}
p{margin:0 0 12px;font-size:16.5px;}
b{color:var(--ink);font-weight:600;}
.go{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  padding:13px 22px;border-radius:100px;font-size:15px;font-weight:700;
  letter-spacing:-.015em;transition:filter .2s ease,transform .2s ease,border-color .2s ease,color .2s ease;
}
.btn--hot{background:var(--straw);color:var(--on-accent);border:0;}
.btn--hot:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn--ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);}
.btn--ghost:hover{color:var(--ink);border-color:var(--straw);}
footer{
  border-top:1px solid var(--line);padding:26px 24px;font-size:13.5px;color:var(--ink-3);
}
footer .in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;}
footer a{color:var(--ink-3);text-decoration:none;}
footer a:hover{color:var(--straw);}
</style>
</head>
<body>

<main>
  <span class="mark" aria-hidden="true"></span>
  <span class="k">404 / NOT FOUND</span>
  <span class="band" aria-hidden="true"></span>
  <h1>이 주소에는<br>아무것도 없습니다</h1>
  <p>
    주소를 잘못 누르셨거나, 있던 것이 자리를 옮겼습니다.
    아래에서 찾으시는 쪽으로 가시면 됩니다.
  </p>
  <p>
    찾으시던 게 <b>견본</b>이었다면 견본실에 아홉 건을 열어 두었습니다.
  </p>
  <div class="go">
    <a class="btn btn--hot" href="/">메인으로</a>
    <a class="btn btn--ghost" href="/gallery.html">견본실</a>
    <a class="btn btn--ghost" href="/#contact">문의하기</a>
  </div>
</main>

<footer>
  <div class="in">
    <a href="/">Fornax</a>
    <span>·</span>
    <a href="/privacy.html">개인정보처리방침</a>
    <span>·</span>
    <span>© 2026 Fornax</span>
  </div>
</footer>

<script>
/* 밝기는 본문과 같은 열쇠를 쓴다. 오다가 여기로 떨어져도 눈이 부시지 않게 */
try{
  if(localStorage.getItem("forge-theme") === "light")
    document.documentElement.setAttribute("data-theme", "light");
}catch(e){}
</script>
</body>
</html>
