/* ============================================================
   BRIDGE — 금성전기 주문·출고 시스템 이관 상황판
   레거시 이관 데모. 앞의 다섯과 성격이 다르다.
   이건 파는 제품이 아니라 '옮기는 동안 보는 화면' 이다.
   그래서 화면 자랑이 아니라 계기판을 만들었다.

   하고 싶은 말 세 가지.
   1) 한 번에 안 옮긴다. 화면을 묶어 파(波)로 나누고 트래픽을 조금씩 넘긴다.
   2) 옮기는 동안 두 시스템이 같은 데이터를 본다. 그래서 언제든 되돌릴 수 있다.
   3) 되돌리는 기준을 미리 숫자로 못박아 둔다. 새벽에 판단하지 않으려고.
   ============================================================ */
:root{
  --bg:#131211;
  --panel:#1B1A18;
  --panel-2:#232120;
  --panel-3:#2C2926;
  --line:#2E2B29;
  --line-2:#413B37;

  --ink:#EDE9E3;
  --ink-2:#A49C92;
  --ink-3:#6F6861;

  --amber:#E8A33D;  --amber-soft:rgba(232,163,61,.13);
  --teal:#3FB6A8;   --teal-soft:rgba(63,182,168,.13);
  --red:#E5544B;    --red-soft:rgba(229,84,75,.13);
  --blue:#5E9BD6;   --blue-soft:rgba(94,155,214,.13);

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.65;letter-spacing:-.013em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:46px 46px;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.04em;}

/* ---------- 조각 ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 13px;border-radius:6px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);
  transition:background .14s,border-color .14s,color .14s;
}
.b:hover{background:var(--panel-3);border-color:var(--ink-3);}
.b--a{background:var(--amber);border-color:var(--amber);color:#1A1408;font-weight:700;}
.b--a:hover{background:#F0B155;border-color:#F0B155;}
.b--r{background:var(--red);border-color:var(--red);color:#20090A;font-weight:700;}
.b--r:hover{background:#EC6A62;border-color:#EC6A62;}
.b--g{background:transparent;border-color:transparent;color:var(--ink-2);}
.b--g:hover{background:var(--panel-2);color:var(--ink);}
.b--sm{height:28px;padding:0 10px;font-size:12px;}
.b[disabled]{opacity:.38;cursor:not-allowed;}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:4px;
  font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--ok{background:var(--teal-soft);color:var(--teal);}
.pill--warn{background:var(--amber-soft);color:var(--amber);}
.pill--bad{background:var(--red-soft);color:var(--red);}
.pill--old{background:var(--amber-soft);color:var(--amber);}
.pill--new{background:var(--teal-soft);color:var(--teal);}
.pill--idle{background:var(--panel-3);color:var(--ink-3);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.note{
  display:flex;gap:10px;padding:13px 15px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.75;
}
.note svg{flex:none;margin-top:3px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--amber{background:var(--amber-soft);border-color:rgba(232,163,61,.3);}
.note--amber svg{color:var(--amber);}
.note--red{background:var(--red-soft);border-color:rgba(229,84,75,.32);}
.note--red svg{color:var(--red);}
.note--teal{background:var(--teal-soft);border-color:rgba(63,182,168,.3);}
.note--teal svg{color:var(--teal);}

/* ============================================================
   틀 — 위에 상태띠를 늘 붙여 둔다
   ============================================================ */
.app{display:flex;flex-direction:column;min-height:100dvh;}
.top{
  flex:none;display:flex;align-items:center;gap:13px;height:52px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.mk{display:flex;align-items:center;gap:9px;flex:none;}
.mk__i{
  width:27px;height:27px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--amber),#C8722A);color:#1A1408;
}
.mk__t{font-size:15.5px;font-weight:800;letter-spacing:-.05em;}
.mk__c{font-size:12px;color:var(--ink-3);font-weight:600;padding-left:10px;border-left:1px solid var(--line-2);}
.top .sp{flex:1;}
.top__bk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);}
.top__bk:hover{color:var(--amber);}
@media (max-width:760px){.mk__c{display:none;}}

/* 상태띠 — 어느 화면에 있든 숫자는 늘 보인다 */
.strip{
  flex:none;display:flex;align-items:stretch;gap:0;overflow-x:auto;
  background:var(--panel-2);border-bottom:1px solid var(--line);
  scrollbar-width:none;-ms-overflow-style:none;
}
.strip::-webkit-scrollbar{height:0;width:0;}
.strip__c{
  flex:1;min-width:158px;padding:11px 16px;border-right:1px solid var(--line);
}
.strip__c:last-child{border-right:0;}
.strip__l{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:600;}
.strip__v{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.strip__v b{font-size:22px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
.strip__v em{font-style:normal;font-size:11.5px;color:var(--ink-3);}
.strip__c[data-t="ok"] .strip__v b{color:var(--teal);}
.strip__c[data-t="warn"] .strip__v b{color:var(--amber);}
.strip__c[data-t="bad"] .strip__v b{color:var(--red);}
.strip__act{flex:none;display:flex;align-items:center;padding:10px 16px;}
/* 좁은 화면에서 띠가 옆으로 밀려도 되돌리기는 늘 손에 닿는 자리에 둔다 */
@media (max-width:760px){
  .strip__act{position:sticky;right:0;background:var(--panel-2);border-left:1px solid var(--line);padding:10px 12px;}
}

.nav{
  flex:none;display:flex;flex-wrap:wrap;gap:0;padding:0 14px;overflow:visible;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:12px 14px;white-space:nowrap;
  font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.016em;
  display:flex;align-items:center;gap:7px;
}
.nav button:hover{color:var(--ink);}
.nav button[aria-current="true"]{color:var(--amber);font-weight:700;}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;background:var(--amber);}
.nav em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);}

.body{flex:1;min-height:0;}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px;}
@media (max-width:640px){.wrap{padding:18px 14px 60px;}}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.hd h2{font-size:20px;font-weight:800;letter-spacing:-.038em;}
.hd p{font-size:13px;color:var(--ink-3);}
.hd .sp{flex:1;}

/* ============================================================
   상황판
   ============================================================ */
.deck{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.deck{grid-template-columns:1fr;}}

.gauge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 20px 18px;text-align:center;}
.gauge__w{position:relative;width:100%;max-width:264px;margin:0 auto;}
.gauge__n{
  position:absolute;left:0;right:0;bottom:6px;
}
.gauge__n b{display:block;font-size:44px;font-weight:850;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums;}
.gauge__n span{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:5px;}
.gauge__t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:-4px;}
.gauge__lg{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:12px;color:var(--ink-2);}
.gauge__lg span{display:flex;align-items:center;gap:6px;}
.gauge__lg i{width:9px;height:9px;border-radius:3px;}

.roll{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.roll__t{font-size:12px;color:var(--ink-3);line-height:1.7;margin-bottom:11px;}
.roll__t b{color:var(--ink);}

/* 파(波) */
.waves{display:flex;flex-direction:column;gap:10px;}
.wave{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px 17px;}
.wave[data-hot="true"]{border-color:rgba(229,84,75,.4);}
.wave__h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wave__n{
  width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:var(--panel-3);color:var(--ink-2);font-family:var(--m);font-size:11.5px;font-weight:700;
}
.wave[data-on="true"] .wave__n{background:var(--teal-soft);color:var(--teal);}
.wave__t b{font-size:14.5px;font-weight:700;letter-spacing:-.022em;}
.wave__t span{display:block;font-size:12px;color:var(--ink-3);line-height:1.6;}
.wave__h .sp{flex:1;}
.wave__v{font-family:var(--m);font-size:17px;font-weight:700;letter-spacing:-.04em;min-width:52px;text-align:right;}
.wave__b{display:flex;align-items:center;gap:13px;margin-top:12px;}
.rng{flex:1;accent-color:var(--teal);}
.wave[data-hot="true"] .rng{accent-color:var(--red);}
.wave__bar{height:6px;border-radius:100px;background:var(--panel-3);overflow:hidden;margin-top:10px;display:flex;}
.wave__bar i{display:block;height:100%;transition:width .3s ease;}
.wave__bar i:first-child{background:var(--teal);}
.wave__bar i:last-child{background:var(--amber);opacity:.55;}
.wave__w{
  display:flex;gap:8px;align-items:flex-start;margin-top:11px;padding:9px 11px;border-radius:8px;
  background:var(--red-soft);border:1px solid rgba(229,84,75,.3);font-size:12px;color:var(--ink-2);line-height:1.65;
}
.wave__w b{color:var(--red);}

/* 계기 */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;}
@media (max-width:560px){.meters{grid-template-columns:1fr;}}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;}
.meter__l{font-size:12px;color:var(--ink-3);font-weight:600;}
.meter__r{display:flex;align-items:flex-end;gap:16px;margin-top:8px;}
.meter__c{flex:1;min-width:0;}
.meter__c span{display:block;font-size:11px;color:var(--ink-3);}
.meter__c b{display:block;font-size:19px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.meter__c[data-s="old"] b{color:var(--amber);}
.meter__c[data-s="new"] b{color:var(--teal);}
.meter__c[data-s="new"][data-bad="true"] b{color:var(--red);}
.meter__d{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.6;}

/* 이벤트 로그 */
.log{display:flex;flex-direction:column;}
.log__r{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.log__r:last-child{border-bottom:0;}
.log__t{font-family:var(--m);font-size:11.5px;color:var(--ink-3);flex:none;}
.log__k{
  font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 7px;flex:none;height:18px;
  display:inline-flex;align-items:center;
}
.log__k[data-k="turn"]{background:var(--teal-soft);color:var(--teal);}
.log__k[data-k="back"]{background:var(--red-soft);color:var(--red);}
.log__k[data-k="check"]{background:var(--blue-soft);color:var(--blue);}
.log__k[data-k="warn"]{background:var(--amber-soft);color:var(--amber);}
.log__m{flex:1;min-width:0;color:var(--ink-2);line-height:1.6;}
.log__m b{color:var(--ink);}

/* ============================================================
   진단 · 표
   ============================================================ */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:860px){.kpi{grid-template-columns:repeat(2,1fr);}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px;}
.kpi span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.045em;margin-top:2px;font-variant-numeric:tabular-nums;}
.kpi em{font-style:normal;font-size:11.5px;color:var(--ink-3);}
.kpi div[data-t="amber"] b{color:var(--amber);}
.kpi div[data-t="teal"] b{color:var(--teal);}
.kpi div[data-t="red"] b{color:var(--red);}

.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);}
.tbw::-webkit-scrollbar{height:8px;}
.tb{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;}
.tb th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:11px 13px;white-space:nowrap;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.tb th.r,.tb td.r{text-align:right;}
.tb th.c,.tb td.c{text-align:center;}
.tb td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tb tbody tr:last-child td{border-bottom:0;}
.tb .nw{white-space:nowrap;}
.tb .mut{color:var(--ink-3);}
.tb b{font-weight:600;letter-spacing:-.018em;}

/* 두 칸 목록 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:820px){.two{grid-template-columns:1fr;}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.list__h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;}
.list__h .sp{flex:1;}
.list__r{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);}
.list__r:last-child{border-bottom:0;}
.list__r i{
  width:19px;height:19px;border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:800;background:var(--panel-3);color:var(--ink-3);
}
.list__r[data-t="keep"] i{background:var(--teal-soft);color:var(--teal);}
.list__r[data-t="drop"] i{background:var(--red-soft);color:var(--red);}
.list__r b{display:block;font-size:13px;font-weight:700;}
.list__r span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.65;}
.list__r span b{display:inline;color:var(--ink-2);}

/* 라우팅 */
.route{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);}
.route:last-child{border-bottom:0;}
.route__p{font-family:var(--m);font-size:12.5px;color:var(--ink);flex:1;min-width:0;}
.route__a{color:var(--ink-3);flex:none;}
.route__d{flex:none;}

/* 컷오버 체크리스트 */
.chk{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.chk__r{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;}
.chk__r:last-child{border-bottom:0;}
.chk__r:hover{background:var(--panel-2);}
.chk__b{
  width:19px;height:19px;border-radius:5px;flex:none;margin-top:2px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;background:var(--panel-2);
}
.chk__r[data-on="true"] .chk__b{background:var(--teal);border-color:var(--teal);color:#0C1A18;}
.chk__t{flex:1;min-width:0;}
.chk__t b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.02em;}
.chk__r[data-on="true"] .chk__t b{color:var(--ink-3);text-decoration:line-through;}
.chk__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.65;margin-top:2px;}
.chk__o{font-size:11.5px;color:var(--ink-3);flex:none;font-family:var(--m);}

.prog{height:6px;border-radius:100px;background:var(--panel-3);overflow:hidden;margin-top:10px;}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s ease;}

/* 되돌리기 기준 */
.rule{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line);}
.rule:last-child{border-bottom:0;}
.rule__t{flex:1;min-width:0;}
.rule__t b{display:block;font-size:13.5px;font-weight:700;}
.rule__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.65;}
.rule__v{font-family:var(--m);font-size:14px;font-weight:700;flex:none;white-space:nowrap;}
.rule__now{font-family:var(--m);font-size:12.5px;flex:none;min-width:74px;text-align:right;}
.rule[data-hit="true"]{background:var(--red-soft);}
.rule[data-hit="true"] .rule__now{color:var(--red);font-weight:700;}

/* 노트 */
.doc h3{font-size:15px;font-weight:800;letter-spacing:-.026em;margin-bottom:8px;}
.doc h3::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin:0 9px 3px 0;}
.doc p{font-size:13.5px;color:var(--ink-2);line-height:1.9;font-weight:350;}
.doc p + p{margin-top:9px;}
.doc code{font-family:var(--m);font-size:12px;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:5px;}
.doc b{color:var(--ink);}
.doc dl{margin:12px 0 0;display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px solid var(--line-2);}
.doc dt{font-size:13px;font-weight:700;color:var(--ink);}
.doc dd{margin:3px 0 0;font-size:13px;color:var(--ink-3);line-height:1.75;}
.hr{height:1px;background:var(--line);margin:22px 0;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:11px 16px;
  font-size:13px;font-weight:600;box-shadow:0 18px 44px -14px rgba(0,0,0,.9);max-width:calc(100vw - 28px);
}
.demo{
  flex:none;display:flex;align-items:center;gap:9px;padding:8px 20px;
  background:#0E0D0C;color:var(--ink-3);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);
}
.demo b{color:var(--ink-2);}
.demo .sp{flex:1;}
.demo a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;}
.demo a:hover{color:var(--amber);}
@media (max-width:700px){.demo span.hideS{display:none;}}

/* ============================================================
   전략 — 7R
   ============================================================ */
.ask{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:820px){.ask{grid-template-columns:1fr;}}
.ask>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
.ask u{text-decoration:none;font-family:var(--m);font-size:11px;font-weight:700;color:var(--amber);}
.ask b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.022em;margin-top:4px;}
.ask span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:5px;}
.ask em{font-style:normal;color:var(--ink-2);}

.rs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:1000px){.rs{grid-template-columns:repeat(2,1fr);}}
@media (max-width:540px){.rs{grid-template-columns:1fr;}}
.rc{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;
}
.rc:hover{border-color:var(--line-2);}
.rc[data-on="true"]{border-color:var(--amber);background:var(--amber-soft);}
.rc__h{display:flex;align-items:center;gap:8px;}
.rc__i{width:8px;height:8px;border-radius:3px;flex:none;background:var(--ink-3);}
.rc__k{font-size:14px;font-weight:800;letter-spacing:-.028em;}
.rc__e{font-family:var(--m);font-size:11px;color:var(--ink-3);}
.rc__n{margin-left:auto;font-family:var(--m);font-size:12.5px;font-weight:700;color:var(--ink-3);}
.rc[data-on="true"] .rc__n{color:var(--amber);}
.rc__d{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:7px;}
.rc__b{display:block;height:4px;border-radius:100px;background:var(--panel-3);margin-top:11px;overflow:hidden;}
.rc__b i{display:block;height:100%;background:var(--ink-3);transition:width .3s ease;}

.rtag{
  font-family:var(--m);font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;
  white-space:nowrap;display:inline-block;
}
/* 얼마나 손대는지로 색을 나눈다. 일곱 가지 색을 외우게 하지 않는다 */
.rtag[data-r="rehost"],.rtag[data-r="replatform"],.rc__i[data-r="rehost"],.rc__i[data-r="replatform"]
  {background:var(--blue-soft);color:var(--blue);}
.rtag[data-r="refactor"],.rtag[data-r="rebuild"],.rc__i[data-r="refactor"],.rc__i[data-r="rebuild"]
  {background:var(--amber-soft);color:var(--amber);}
.rtag[data-r="replace"],.rc__i[data-r="replace"]{background:var(--teal-soft);color:var(--teal);}
.rtag[data-r="retain"],.rc__i[data-r="retain"]{background:var(--panel-3);color:var(--ink-3);}
.rtag[data-r="retire"],.rc__i[data-r="retire"]{background:var(--red-soft);color:var(--red);}
.rc__i[data-r]{background:currentColor;}
.rc__i[data-r="rehost"],.rc__i[data-r="replatform"]{color:var(--blue);}
.rc__i[data-r="refactor"],.rc__i[data-r="rebuild"]{color:var(--amber);}
.rc__i[data-r="replace"]{color:var(--teal);}
.rc__i[data-r="retain"]{color:var(--ink-3);}
.rc__i[data-r="retire"]{color:var(--red);}

/* ============================================================
   구 화면 · 새 화면
   ============================================================ */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:18px;}
.cmp>div{min-width:0;}
@media (max-width:1000px){.cmp{grid-template-columns:minmax(0,1fr);}}
.win{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);}
.win__u{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);}
.win__d{display:flex;gap:5px;flex:none;}
.win__d i{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.win__a{
  flex:1;min-width:0;font-family:var(--m);font-size:11px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win__y{font-family:var(--m);font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;flex:none;}
.win__y[data-o="true"]{background:var(--amber-soft);color:var(--amber);}
.win__y[data-o="false"]{background:var(--teal-soft);color:var(--teal);}
.win__s{overflow-x:auto;}
.win__s::-webkit-scrollbar{height:8px;}
.win__c{font-size:12.5px;color:var(--ink-3);line-height:1.75;padding:12px 14px;border-top:1px solid var(--line);}
.win__c b{color:var(--ink);}

/* 2011년 화면. 윈도우가 있는 자리에서는 진짜 굴림으로 뜬다 */
.old{
  background:#D4D0C8;color:#000;min-width:520px;
  font-family:"굴림",Gulim,"돋움",Dotum,Tahoma,sans-serif;font-size:11px;line-height:1.45;
}
.old__t{
  background:linear-gradient(90deg,#0A246A,#4A7BB7);color:#fff;font-weight:700;
  padding:3px 5px;display:flex;align-items:center;gap:6px;
}
.old__t s{text-decoration:none;margin-left:auto;display:flex;gap:2px;}
.old__t s i{
  width:15px;height:13px;background:#D4D0C8;color:#000;font-style:normal;font-size:9px;
  text-align:center;line-height:12px;border:1px solid;border-color:#fff #404040 #404040 #fff;
}
.old__m{padding:2px 6px;border-bottom:1px solid #808080;display:flex;gap:13px;}
.old__m u{text-decoration:none;}
.old__m u:first-letter{text-decoration:underline;}
.old__b{padding:3px 5px;border-bottom:1px solid #808080;display:flex;gap:3px;flex-wrap:wrap;}
.old__b i{
  padding:2px 7px;font-style:normal;background:#D4D0C8;
  border:1px solid;border-color:#fff #404040 #404040 #fff;
}
.old__ax{background:#FFFFE1;border-bottom:1px solid #808080;padding:4px 6px;}
.old__w{padding:7px;}
.old table{border-collapse:collapse;width:100%;margin-bottom:6px;}
.old th,.old td{border:1px solid #808080;padding:3px 5px;vertical-align:middle;}
.old th{background:#ECE9D8;font-weight:700;white-space:nowrap;}
.old td{background:#fff;}
.old td.lb{background:#ECE9D8;font-weight:700;white-space:nowrap;}
.old .rq{color:#C00;}
.old .ip{
  display:inline-block;background:#fff;padding:1px 4px;min-width:74px;
  border:1px solid;border-color:#808080 #fff #fff #808080;
}
.old .ip[data-w="s"]{min-width:44px;}
.old .ip[data-w="l"]{min-width:150px;}
.old__st{border-top:1px solid #fff;padding:3px 6px;display:flex;gap:12px;color:#333;}
.old__st span:last-child{margin-left:auto;}

/* 2026년 화면 */
.nsys{background:#FBFBFC;color:#14161A;min-width:520px;}
.nsys__t{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #E7E8EC;}
.nsys__t b{font-size:14.5px;font-weight:800;letter-spacing:-.032em;}
.nsys__t em{font-style:normal;font-size:11.5px;color:#6B7280;}
.nsys__t .sp{flex:1;}
.nsys__k{font-size:11.5px;font-weight:700;border-radius:5px;padding:3px 9px;background:#E7F5F2;color:#0F7D6E;}
.nsys__w{padding:14px;}
.nsys__f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px;}
@media (max-width:1200px){.nsys__f{grid-template-columns:repeat(2,1fr);}}
.nsys__l{display:block;font-size:11px;font-weight:700;color:#6B7280;margin-bottom:5px;letter-spacing:.01em;}
.nsys__i{
  display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #DDDFE5;
  border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:500;
}
.nsys__i u{text-decoration:none;color:#9AA0A8;font-size:11px;margin-left:auto;font-family:var(--m);white-space:nowrap;}
.nsys table{width:100%;border-collapse:collapse;font-size:12px;}
.nsys th{text-align:left;font-size:11px;color:#6B7280;padding:7px 8px;border-bottom:1px solid #E7E8EC;font-weight:700;}
.nsys td{padding:8px;border-bottom:1px solid #F0F1F4;}
.nsys th.r,.nsys td.r{text-align:right;}
.nsys td b{font-weight:700;}
.nsys__hint{
  font-size:11.5px;color:#0F7D6E;background:#E7F5F2;border-radius:7px;padding:7px 10px;
  margin-top:11px;line-height:1.6;
}
.nsys__bar{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid #E7E8EC;}
.nsys__bar span{font-size:11.5px;color:#9AA0A8;margin-right:auto;}
.nsys__b{border-radius:7px;padding:8px 15px;font-size:12.5px;font-weight:700;}
.nsys__b[data-p="true"]{background:#14161A;color:#fff;}
.nsys__b[data-p="false"]{background:#fff;border:1px solid #DDDFE5;color:#14161A;}

/* ============================================================
   코드
   ============================================================ */
.sub{
  display:inline-flex;gap:3px;padding:3px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;margin-bottom:16px;
}
.sub button{
  border:0;background:none;border-radius:7px;padding:7px 15px;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);
}
.sub button:hover{color:var(--ink);}
.sub button[aria-current="true"]{background:var(--panel-3);color:var(--ink);font-weight:700;}

.code{background:#0D0C0B;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.code__h{
  display:flex;align-items:center;gap:9px;padding:9px 13px;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.code__f{font-family:var(--m);font-size:11.5px;color:var(--ink-2);}
.code__h .sp{flex:1;}

<header class="top">
  <span class="mk">
    <span class="mk__i">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 16h18"/><path d="M5 16v5M19 16v5"/><path d="M5 16a7 7 0 0 1 14 0"/></svg>
    </span>
    <span class="mk__t">BRIDGE</span>
  </span>
  <span class="mk__c">금성전기 · 주문출고 시스템 이관</span>
  <span class="sp"></span>
  <span class="pill" :class="hot ? 'pill--bad' : 'pill--ok'">

  </span>
</header>

<!-- 상태띠 — 어느 화면에 있든 숫자는 늘 보인다 -->
<div class="strip">
  <div class="strip__c" data-t="ok">
    <p class="strip__l">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      새 시스템으로 흘리는 비율
    </p>
    <p class="strip__v"><b class="num" x-text="pct + '%'"></b><em x-text="'구 시스템 ' + (100 - pct) + '%'"></em></p>
  </div>
  <div class="strip__c" :data-t="errNew > 0.5 ? 'bad' : (errNew > 0.25 ? 'warn' : 'ok')">
    <p class="strip__l">새 시스템 오류율</p>
    <p class="strip__v"><b class="num" x-text="errNew.toFixed(2) + '%'"></b><em x-text="'구 ' + errOld.toFixed(2) + '%'"></em></p>
  </div>
  <div class="strip__c" :data-t="diffs > 20 ? 'bad' : (diffs > 8 ? 'warn' : 'ok')">
    <p class="strip__l">어긋난 데이터</p>
    <p class="strip__v"><b class="num" x-text="diffs + '건'"></b><em>어제 대조 기준</em></p>
  </div>
  <div class="strip__c">
    <p class="strip__l">되돌리는 데 걸리는 시간</p>
    <p class="strip__v"><b class="num" x-text="rollLabel"></b><em x-text="waves[3].traffic > 0 ? '배치가 도는 중' : '라우팅만 되돌리면 끝'"></em></p>
  </div>
  <div class="strip__act">
    <button class="b b--r" @click="rollback()" :disabled="rolling || pct === 0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span x-text="rolling ? '되돌리는 중…' : '되돌리기'"></span>
    </button>
  </div>
</div>

<nav class="nav">
  <button :aria-current="view==='deck'" @click="view='deck'">상황판</button>
  <button :aria-current="view==='scan'" @click="view='scan'">진단</button>
  <button :aria-current="view==='r7'" @click="view='r7'">전략 <em>7R</em></button>
  <button :aria-current="view==='cmp'" @click="view='cmp'">구 · 새 비교</button>
  <button :aria-current="view==='waves'" @click="view='waves'">이관 순서</button>
  <button :aria-current="view==='dual'" @click="view='dual'">이중 운영 <em x-text="diffs + '건'"></em></button>
  <button :aria-current="view==='cut'" @click="view='cut'">컷오버 · 되돌리기 <em x-text="doneChecks + '/' + checks.length"></em></button>
  <button :aria-current="view==='note'" @click="view='note'">정한 것</button>
</nav>

<div class="body">

<!-- ============================================================
     상황판
     ============================================================ -->
<template x-if="view==='deck'">
  <div class="wrap">
    <div class="hd">
      <h2>상황판</h2>
      <p>지금 어디까지 넘어갔는지, 넘겨도 되는지</p>
    </div>

    <div class="note" :class="hot ? 'note--red' : 'note--teal'" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div x-show="!hot">
        지표가 모두 기준 안에 있습니다. 다음 파의 손잡이를 조금 올려 보세요 —
        <b>한 번에 다 넘기지 않는 이유</b>는, 무엇이 잘못됐는지 알려면 한 번에 하나만 바꿔야 하기 때문입니다.
      </div>
      <div x-show="hot">
        <b>되돌리기 기준을 넘겼습니다.</b>
        <span x-text="breaches.map(function(b){ return b.name; }).join(' · ')"></span> —
        이럴 때 새벽에 고민하지 않도록 기준을 미리 숫자로 적어 두었습니다. 위의 <b>되돌리기</b>를 누르세요.
      </div>
    </div>

    <div class="deck">
      <div>
        <div class="gauge">
          <div class="gauge__w">
            <svg viewBox="0 0 240 138" width="100%" aria-hidden="true">
              <path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="#2C2926" stroke-width="16" stroke-linecap="round"/>
              <path d="M20 120 A100 100 0 0 1 220 120" fill="none" :stroke="hot ? '#E5544B' : '#3FB6A8'" stroke-width="16" stroke-linecap="round"
                    stroke-dasharray="314.16" :stroke-dashoffset="314.16 - 314.16 * pct / 100"
                    style="transition:stroke-dashoffset .35s ease,stroke .25s ease"/>
            </svg>
            <div class="gauge__n">
              <b class="num" x-text="pct + '%'"></b>
              <span>새 시스템이 받는 비율</span>
            </div>
          </div>
          <p class="gauge__t"><span>구 시스템</span><span>새 시스템</span></p>
          <div class="gauge__lg">
            <span><i style="background:#E8A33D"></i>구 · 2011년</span>
            <span><i style="background:#3FB6A8"></i>새 · 2026년</span>
          </div>

          <div class="roll">
            <p class="roll__t">
              두 시스템이 <b>같은 데이터를 보고 있어서</b> 되돌리기는 라우팅만 바꾸면 끝납니다.
              그래서 <b x-text="rollLabel"></b> 입니다.
            </p>
            <p class="roll__t" x-show="waves[3].traffic > 0" style="color:var(--red)">
              다만 마감 배치가 새 시스템에서 돌고 있으면, 배치가 끝날 때까지 기다려야 합니다.
            </p>
          </div>
        </div>

        <div class="card" style="margin-top:16px;padding:15px 17px">
          <p style="font-size:12.5px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;margin-bottom:10px">최근 기록</p>
          <div class="log">
            <template x-for="l in logs.slice(0,7)" :key="l.id">
              <div class="log__r">
                <time class="log__t" x-text="l.t"></time>
                <span class="log__k" :data-k="l.k" x-text="l.kt"></span>
                <span class="log__m" x-html="l.m"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <div>
        <div class="hd" style="margin-bottom:11px">
          <h2 style="font-size:16px">파(波)별 전환</h2>
          <p>화면을 묶어 네 번에 나눠 넘깁니다</p>
        </div>
        <div class="waves">
          <template x-for="(w,i) in waves" :key="w.id">
            <div class="wave" :data-on="w.traffic > 0" :data-hot="!w.ready && w.traffic > 0">
              <div class="wave__h">
                <span class="wave__n" x-text="w.id + '파'"></span>
                <span class="wave__t">
                  <b x-text="w.name"></b>
                  <span x-text="w.n + '개 화면 · 위험도 ' + w.risk + ' · ' + w.since"></span>
                </span>
                <span class="sp"></span>
                <span class="pill" :class="w.ready ? 'pill--ok' : 'pill--idle'" x-text="w.ready ? '준비됨' : '준비 중'"></span>
                <span class="wave__v" x-text="w.traffic + '%'"></span>
              </div>
              <div class="wave__b">
                <input class="rng" type="range" min="0" max="100" step="10"
                       x-model.number="w.traffic" @change="moved(w)"
                       :aria-label="w.id + '파 ' + w.name + ' 전환 비율'">
              </div>
              <div class="wave__bar">
                <i :style="'width:' + w.traffic + '%'"></i>
                <i :style="'width:' + (100 - w.traffic) + '%'"></i>
              </div>
              <p style="font-size:12px;color:var(--ink-3);line-height:1.65;margin-top:9px" x-text="w.desc"></p>
              <div class="wave__w" x-show="!w.ready && w.traffic > 0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" style="flex:none;margin-top:2px;color:var(--red)"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                <div><b>아직 준비되지 않은 파입니다.</b> <span x-text="w.block"></span>
                  순서를 건너뛰면 지표가 바로 나빠지는 것을 위에서 볼 수 있습니다.</div>
              </div>
            </div>
          </template>
        </div>

        <div class="meters">
          <div class="meter">
            <p class="meter__l">응답 시간 (주문 목록 기준)</p>
            <div class="meter__r">
              <span class="meter__c" data-s="old"><span>구 시스템</span><b class="num" x-text="msOld + 'ms'"></b></span>
              <span class="meter__c" data-s="new" :data-bad="msNew > 800"><span>새 시스템</span><b class="num" x-text="msNew + 'ms'"></b></span>
            </div>
            <p class="meter__d">옮기는 이유의 절반은 이것입니다. 나머지 절반은 고칠 수 있게 되는 것입니다.</p>
          </div>
          <div class="meter">
            <p class="meter__l">오늘 처리한 주문</p>
            <div class="meter__r">
              <span class="meter__c" data-s="old"><span>구 시스템</span><b class="num" x-text="ordOld.toLocaleString()"></b></span>
              <span class="meter__c" data-s="new"><span>새 시스템</span><b class="num" x-text="ordNew.toLocaleString()"></b></span>
            </div>
            <p class="meter__d">합쳐서 하루 1,200건. 한 건도 흘리면 안 되는 숫자입니다.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ============================================================
     진단
     ============================================================ -->
<template x-if="view==='scan'">
  <div class="wrap">
    <div class="hd">
      <h2>진단</h2>
      <p>옮기기 전에 무엇이 있는지부터 셌습니다 · 2026-05 조사</p>
    </div>

    <div class="kpi">
      <div><span>화면</span><b class="num">87</b><em>실제 쓰는 것 52 · 6개월 무사용 35</em></div>
      <div><span>테이블</span><b class="num">214</b><em>쓰는 것 131 · 빈 것 83</em></div>
      <div data-t="amber"><span>저장 프로시저</span><b class="num">391</b><em>아무 데서도 안 부르는 것 88</em></div>
      <div data-t="red"><span>자동 테스트</span><b class="num">0</b><em>코드 34.2만 줄</em></div>
    </div>

    <div class="note note--amber" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div>테스트가 하나도 없다는 것이 이 프로젝트에서 가장 비싼 사실입니다.
        <b>그래서 코드를 읽어 옮기지 않고, 화면에 들어오고 나가는 것을 기준으로 옮깁니다.</b>
        같은 입력에 같은 출력이 나오는지를 두 시스템에 동시에 물어 대조합니다.</div>
    </div>

    <div class="two" style="margin-bottom:16px">
      <div class="list">
        <div class="list__h">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--teal)"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
          옮기는 것
          <span class="sp"></span><span class="pill pill--ok">52개 화면</span>
        </div>
        <div class="list__r" data-t="keep"><i>✓</i><div><b>실제 쓰는 화면 52개</b>
          <span>6개월 접속 로그로 걸렀습니다. 한 사람이라도 매달 쓰면 남깁니다.</span></div></div>
        <div class="list__r" data-t="keep"><i>✓</i><div><b>주문 · 출고 · 재고 전량 (2011~)</b>
          <span>지운 데이터는 없습니다. 검색 안 되던 오래된 것도 다 옮깁니다.</span></div></div>
        <div class="list__r" data-t="keep"><i>✓</i><div><b>거래처와 단가 이력</b>
          <span>단가는 이력이 곧 근거입니다. 현재 값만 옮기면 지난 계산을 설명할 수 없습니다.</span></div></div>
        <div class="list__r" data-t="keep"><i>✓</i><div><b>세금계산서 · 택배사 연동</b>
          <span>세 곳 모두 새로 붙입니다. 옛 연동은 규격이 이미 바뀌어 있었습니다.</span></div></div>
      </div>

      <div class="list">
        <div class="list__h">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--red)"><path d="M6 6l12 12M18 6L6 18"/></svg>
          안 옮기는 것
          <span class="sp"></span><span class="pill pill--bad">35개 화면</span>
        </div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>6개월간 아무도 안 연 화면 35개</b>
          <span>옮기면 그만큼 만들고, 시험하고, 앞으로 계속 고쳐야 합니다. 없애는 것이 가장 싼 이관입니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>2014년에 끝난 프로모션 정산 4개</b>
          <span>데이터는 읽기 전용으로 남기고 화면은 만들지 않습니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>ActiveX 라벨 출력</b>
          <span>브라우저가 이미 못 씁니다. 현장에서는 관리자 권한으로 옛 브라우저를 띄워 쓰고 있었습니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>엑셀 매크로 보고서 12종</b>
          <span>사람마다 파일이 조금씩 달랐습니다. 새 시스템 내보내기 한 벌로 합칩니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>사번으로 하드코딩된 예외 7곳</b>
          <span>퇴사한 사람의 사번이 세 개 있었습니다. 권한으로 바꿉니다.</span></div></div>
      </div>
    </div>

    <div class="hd" style="margin:24px 0 12px"><h2 style="font-size:16px">붙어 있는 것</h2>
      <p>안에서 도는 것보다 밖으로 물린 것이 늘 더 어렵습니다</p></div>
    <div class="tbw">
      <table class="tb">
        <thead><tr><th>연결</th><th>어디에</th><th style="width:110px">방식</th><th style="width:96px">난이도</th><th>어떻게 옮기나</th></tr></thead>
        <tbody>
          <tr><td><b>택배사 3곳</b></td><td class="mut">송장 발급 · 배송 조회</td><td class="mut">SOAP</td>
            <td><span class="pill pill--warn">보통</span></td><td class="mut">규격이 REST 로 바뀌어 새로 붙입니다</td></tr>
          <tr><td><b>전자세금계산서</b></td><td class="mut">발행 · 국세청 전송</td><td class="mut">외부 SaaS</td>

<span>    <i class="k">expect</i>(got.lines.map(l =&gt; l.amount)).toEqual(g.legacy.ITEMS.map(i =&gt; i.AMT));</span>

<span>    <i class="c">// 알고 두는 차이 : 부가세 반올림 위치. 목록에 없는 건이면 실패시킨다.</i></span>
<span>    <i class="k">if</i> (KNOWN_VAT_DIFF.has(g.legacy.ORD_NO)) {</span>

<mark data-m="good">      <i class="k">expect</i>(got.vatAmount).toBe(g.legacy.VAT);</mark>
<span>    }</span>
<span>  });</span>
<span>});</span>

<div class="hd" style="margin:24px 0 12px"><h2 style="font-size:16px">옮기면서 걸린 것</h2><p>412만 행을 옮기는 일의 대부분은 이 표를 만드는 일이었습니다</p><span class="sp"></span><span class="pill pill--warn">보정 12,659행</span></div>
<div class="tbw"><table class="tb">
<thead><tr><th style="width:150px">구 컬럼</th><th style="width:150px">새 컬럼</th>
<th style="width:104px">걸린 행</th><th>어떻게 했나</th></tr></thead><tbody>
<tr><td class="mono">ORD_DT VARCHAR2(8)</td><td class="mono">orderedOn DATE</td><td class="r num">214</td>
  <td class="mut"><b>빈 값 214행.</b> 등록일(INS_DT)로 채우고 <code>migrated_from</code> 에 표시를 남겼습니다. 지어내지 않고 남겨 둡니다.</td></tr>
<tr><td class="mono">STS CHAR(2)</td><td class="mono">status enum</td><td class="r num">31</td>
  <td class="mut"><b>규격에 없는 값 <code>'40'</code> 이 31행.</b> 2016년에 잠깐 쓰다 만 "보류" 였습니다. 만든 사람을 찾아 물어봤습니다.</td></tr>
<tr><td class="mono">TOT_AMT NUMBER</td><td class="mono">goodsAmount Int</td><td class="r num">37</td>
  <td class="mut"><b>소수점이 있는 행 37개.</b> 반올림하고 원본 값을 따로 보관했습니다. 회계팀 확인을 받았습니다.</td></tr>
<tr><td class="mono">REMARK2 VARCHAR2(200)</td><td class="mono">shippingMemo · note</td><td class="r num">8,940</td>
  <td class="mut"><b>85%가 배송 메모.</b> "부재시 경비실", "오전배송" 같은 것들. 나머지는 <code>note</code> 로 보냈습니다.</td></tr>
<tr><td class="mono">USE_YN CHAR(1)</td><td class="mono">deletedAt</td><td class="r num">12,408</td>
  <td class="mut"><b>지운 시각을 아무도 안 적었습니다.</b> 이관 시각으로 넣고, 진짜 삭제 시각은 모른다고 문서에 적었습니다.</td></tr>
<tr><td class="mono">CUST_CD VARCHAR2(10)</td><td class="mono">customerId</td><td class="r num">29</td>
  <td class="mut"><b>거래처 표에 없는 코드 29개.</b> 폐업한 곳입니다. 거래처를 먼저 만들고 이어 붙였습니다.</td></tr>
</tbody></table></div>
<div class="note" style="margin-top:14px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg><div>깨끗하지 않은 데이터를 만나면 <b>고치는 것보다 남기는 것이 먼저</b>입니다. 무엇을 어떻게 바꿨는지 행 단위로 남겨 두어야, 반년 뒤에 "이 숫자 왜 이래요" 라는 질문에 답할 수 있습니다.</div></div>
<div class="hd" style="margin:24px 0 12px"><h2 style="font-size:16px">매일 새벽 3시에 도는 대조</h2><p>옮긴 뒤에도 두 시스템이 같은 값을 갖고 있는지 매일 확인합니다</p></div>
<div class="code"><div class="code__h"><span class="code__f">recon/orders-daily.sql</span><span class="sp"></span><span class="code__y" data-o="false">정합성 대조</span></div><pre class="code__b"><span><i class="c">-- 매일 03:00 · 두 시스템을 통째로 맞춰 본다</i></span>
<span><i class="k">WITH</i> legacy <i class="k">AS</i> (</span>
<span>  <i class="k">SELECT</i> ORD_NO, TOT_AMT, VAT, STS</span>
<span>    <i class="k">FROM</i> gsord11.TB_ORDER</span>
<span>   <i class="k">WHERE</i> ORD_DT = <i class="k">TO_CHAR</i>(SYSDATE - <i class="n">1</i>, <i class="s">&#x27;YYYYMMDD&#x27;</i>)</span>
<span>), fresh <i class="k">AS</i> (</span>
<span>  <i class="k">SELECT</i> order_no, goods_amount, vat_amount, status</span>
<span>    <i class="k">FROM</i> orders</span>
<span>   <i class="k">WHERE</i> ordered_on = CURRENT_DATE - <i class="n">1</i></span>
<span>)</span>
<span><i class="k">SELECT</i> <i class="k">COALESCE</i>(l.ORD_NO, f.order_no) <i class="k">AS</i> ord_no,</span>
<span>       l.TOT_AMT <i class="k">AS</i> legacy_amt, f.goods_amount <i class="k">AS</i> new_amt,</span>
<span>       <i class="k">CASE</i> <i class="k">WHEN</i> l.ORD_NO <i class="k">IS</i> <i class="k">NULL</i> <i class="k">THEN</i> <i class="s">&#x27;새 시스템에만 있음&#x27;</i></span>
<span>            <i class="k">WHEN</i> f.order_no <i class="k">IS</i> <i class="k">NULL</i> <i class="k">THEN</i> <i class="s">&#x27;구 시스템에만 있음&#x27;</i></span>
<span>            <i class="k">WHEN</i> l.TOT_AMT &lt;&gt; f.goods_amount <i class="k">THEN</i> <i class="s">&#x27;금액 다름&#x27;</i></span>
<span>            <i class="k">WHEN</i> l.VAT &lt;&gt; f.vat_amount <i class="k">THEN</i> <i class="s">&#x27;부가세 다름&#x27;</i></span>
<span>            <i class="k">ELSE</i> <i class="s">&#x27;상태 다름&#x27;</i> <i class="k">END</i> <i class="k">AS</i> reason</span>
<span>  <i class="k">FROM</i> legacy l FULL OUTER <i class="k">JOIN</i> fresh f <i class="k">ON</i> l.ORD_NO = f.order_no</span>
<span> <i class="k">WHERE</i> l.ORD_NO <i class="k">IS</i> <i class="k">NULL</i> <i class="k">OR</i> f.order_no <i class="k">IS</i> <i class="k">NULL</i></span>
<span>    <i class="k">OR</i> l.TOT_AMT &lt;&gt; f.goods_amount <i class="k">OR</i> l.VAT &lt;&gt; f.vat_amount</span>
<span>    <i class="k">OR</i> l.STS &lt;&gt; map_status(f.status);</span>
<span><i class="c">-- 결과가 0건이어도 좋아하지 않는다. 쿼리가 안 돌았을 때도 0건이다.</i></span></pre></div>
</div></template>
  </div>
</template>

<template x-if="view==='waves'">
  <div class="wrap">
    <div class="hd">
      <h2>이관 순서</h2>
      <p>무엇을 먼저 넘길지가 이 일의 대부분입니다</p>
    </div>

    <div class="note" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div>순서는 <b>되돌리기 쉬운 것부터</b> 입니다. 사용량이 많은 것부터도, 만들기 쉬운 것부터도 아닙니다.
        읽기만 하는 화면은 잘못돼도 새로고침으로 끝나지만, 마감 배치는 숫자가 이미 나간 뒤에 알게 됩니다.</div>
    </div>

    <div class="tbw" style="margin-bottom:16px">
      <table class="tb">
        <thead><tr>
          <th style="width:56px">파</th><th>묶음</th><th class="c" style="width:74px">화면</th>
          <th class="c" style="width:84px">비중</th><th style="width:96px">위험도</th>
          <th style="width:118px">시기</th><th class="c" style="width:88px">지금</th><th>되돌리면</th>
        </tr></thead>
        <tbody>
          <template x-for="w in waves" :key="w.id">
            <tr>
              <td class="mono mut nw" x-text="w.id + '파'"></td>

              <td class="c num" x-text="w.n"></td>
              <td class="c num mut" x-text="w.share + '%'"></td>
              <td><span class="pill" :class="w.riskLv >= 3 ? 'pill--bad' : (w.riskLv === 2 ? 'pill--warn' : 'pill--ok')" x-text="w.risk"></span></td>
              <td class="mut nw" x-text="w.since"></td>
              <td class="c num" :style="w.traffic > 0 ? 'color:var(--teal);font-weight:700' : 'color:var(--ink-3)'" x-text="w.traffic + '%'"></td>
              <td class="mut" x-text="w.back"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <div class="two">
      <div class="list">
        <div class="list__h">왜 이 순서인가</div>
        <div class="list__r"><i>1</i><div><b>조회부터</b>

        <div class="list__r"><i>2</i><div><b>그다음 주문 등록</b>
          <span>여기서부터 쓰기가 들어갑니다. 두 곳에 같이 쓰고 매일 대조합니다. 여기가 제일 오래 걸립니다.</span></div></div>
        <div class="list__r"><i>3</i><div><b>출고와 송장</b>
          <span>현장 장비가 붙어 있어 사무실에서 다 확인할 수 없습니다. 창고에 가서 라벨을 뽑아 봐야 압니다.</span></div></div>
        <div class="list__r"><i>4</i><div><b>마감 배치는 맨 마지막</b>
          <span>한 달에 하루만 돕니다. 두 달은 양쪽에서 같이 돌려 결과가 같은지 보고 나서 넘깁니다.</span></div></div>
      </div>
      <div class="list">
        <div class="list__h">안 하는 것</div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>한 번에 통째로 바꾸기</b>
          <span>주말에 다 옮기고 월요일에 여는 방식. 잘못되면 되돌릴 시간이 없고, 무엇이 문제인지도 모릅니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>코드를 그대로 번역하기</b>
          <span>테스트가 없어서 옮긴 코드가 맞는지 확인할 방법이 없습니다. 화면이 하는 일을 기준으로 다시 만듭니다.</span></div></div>
        <div class="list__r" data-t="drop"><i>✕</i><div><b>새 기능 같이 넣기</b>

        <div class="list__r" data-t="drop"><i>✕</i><div><b>구 시스템 개발 멈추기</b>
          <span>멈출 수 없습니다. 급한 수정은 계속 들어옵니다. 대신 <b>새 화면이 있는 곳은 구 시스템을 안 고칩니다.</b></span></div></div>

<template x-if="view==='dual'">

    </div>

    <div class="note note--teal" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div>앞에 문지기를 하나 세워 두고, 경로마다 <b>어디로 보낼지</b>를 정합니다. 새 시스템에 쓴 것은 구 시스템에도 같이 씁니다.
        그래서 언제든 라우팅만 되돌리면 아무 일도 없던 것이 됩니다 — <b>이게 되돌리기가 빠른 이유</b>입니다.</div>
    </div>

    <div class="two" style="margin-bottom:16px">
      <div class="list">
        <div class="list__h">라우팅 규칙<span class="sp"></span><span class="pill" x-text="pct + '% 새 시스템'"></span></div>

                    x-text="waveOf(r.w).traffic >= 100 ? '새 시스템' : (waveOf(r.w).traffic > 0 ? (waveOf(r.w).traffic + '% 새 시스템') : '구 시스템')"></span>

<mark data-m="good">      <i class="k">await</i> db.outbox.update({                          <i class="c">// 실패는 버리지 않고 남긴다</i></mark>

          why: sh ? "송장 시각을 구 시스템은 KST 로 저장하고 새 시스템은 UTC 로 저장합니다. 값은 같고 표시가 다릅니다."
                  : "표시 시각을 맞춘 뒤로 0건." },
        { t:"stock_moves", n:906120, d:0,
          why:"재고는 아직 구 시스템만 씁니다. 그래도 대조는 매일 돌립니다 — 안 돌리면 언제 어긋났는지 모릅니다." },
        { t:"customers", n:24180, d:0,
          why:"이 표는 옮기지 않습니다. 새 시스템이 구 시스템 것을 그대로 읽습니다." }
      ];
    },
    get diffs(){
      return this.diffRows.reduce(function(a, r){ return a + r.d; }, 0);
    },

    get msOld(){ return 2340; },
    get msNew(){
      var s = 180;
      this.waves.forEach(function(w){
        s += (w.traffic / 100) * (w.ready ? 22 * w.riskLv : 210 * w.riskLv);
      });
      return Math.round(s);
    },
    get ordNew(){ return Math.round(1200 * this.pct / 100); },
    get ordOld(){ return 1200 - this.ordNew; },

    /* 마감 배치가 돌고 있으면 라우팅만 바꿔서는 못 되돌린다 */
    get rollLabel(){ return this.waves[3].traffic > 0 ? "최대 12분" : "20초"; },

    /* ── 되돌리기 기준 ────────────────────────────────────── */
    /* 새벽 세 시에 "이 정도면 괜찮은가" 를 판단하게 두지 않으려고
       숫자로 적어 둔다. 넘으면 상의하지 않고 되돌린다. */
    get rules(){
      var e = this.errNew, d = this.diffs, m = this.msNew;
      return [
        { name:"새 시스템 오류율", why:"주문 한 건이 안 들어가면 그날 안에 전화가 옵니다.",
          limit:"0.50% 초과", now:e.toFixed(2) + "%", hit:e > 0.5 },
        { name:"어긋난 데이터", why:"두 시스템의 숫자가 다르면 어느 쪽도 못 믿게 됩니다.",
          limit:"20건 초과", now:d + "건", hit:d > 20 },
        { name:"주문 목록 응답", why:"느려서 옮겼는데 더 느리면 옮길 이유가 없습니다.",
          limit:"800ms 초과", now:m + "ms", hit:m > 800 }
      ];
    },
    get breaches(){ return this.rules.filter(function(r){ return r.hit; }); },
    get hot(){ return this.breaches.length > 0; },
    get doneChecks(){ return this.checks.filter(function(c){ return c.on; }).length; },

    /* ── 동작 ─────────────────────────────────────────────── */
    waveOf(id){
      return this.waves.filter(function(w){ return w.id === id; })[0] || this.waves[0];
    },

    stamp(){
      this.clock = (this.clock + 2 + (this._id % 3)) % 1440;
      var h = Math.floor(this.clock / 60), m = this.clock % 60;

    },
    log(k, kt, m){
      this._id += 1;
      this.logs.unshift({ id:this._id, t:this.stamp(), k:k, kt:kt, m:m });
      if(this.logs.length > 40) this.logs.pop();
    },
    toast(m){
      this.msg = m; this.msgOn = true;
      clearTimeout(this._mt);
      var self = this;
      this._mt = setTimeout(function(){ self.msgOn = false; }, 2800);
    },

    moved(w){
      var was = w.last;
      w.last = w.traffic;
      if(was === w.traffic) return;
      var up = w.traffic > was;
      this.log(up ? "turn" : "back", up ? "전환" : "되돌림",
        "<b>" + w.id + "파 " + w.name + "</b> " + was + "% → <b>" + w.traffic + "%</b>");
      if(!w.ready && w.traffic > 0){
        this.log("warn", "주의", "<b>" + w.id + "파</b> 는 아직 준비 전입니다. " + w.block);
        this.toast(w.id + "파는 아직 준비 전입니다 — 지표를 보세요");
      } else if(this.hot){
        this.toast("되돌리기 기준을 넘겼습니다");
      } else if(w.traffic === 100 && up){
        this.toast(w.id + "파 전부 새 시스템으로. 마감 한 번은 지나 봐야 합니다");
      }
    },

    toggleCheck(c){
      c.on = !c.on;
      this.log("check", c.on ? "점검" : "해제",
        "<b>" + c.t + "</b> 를 " + (c.on ? "끝냈다고 표시했습니다." : "다시 열었습니다."));
      if(this.doneChecks === this.checks.length){
        this.toast("다 채웠어도 구 시스템은 두 달 더 켜 둡니다");
      }
    },

    /* 손으로 10%씩 내린다. 한 번에 0으로 떨구지 않고 눈에 보이게 —
       실제로도 게이트웨이 설정이 각 노드에 퍼지는 데 시간이 걸린다. */
    rollback(){
      if(this.rolling || this.pct === 0) return;
      var self = this;
      var was = this.pct, had4 = this.waves[3].traffic > 0;
      this.rolling = true;
      this.log("back", "되돌림", "<b>되돌리기</b> — 모든 파를 구 시스템으로 내립니다. 원인은 내린 다음에 찾습니다.");
      var iv = setInterval(function(){
        var left = false;
        self.waves.forEach(function(w){
          if(w.traffic > 0) w.traffic = Math.max(0, w.traffic - 10);
          w.last = w.traffic;
          if(w.traffic > 0) left = true;
        });
        if(left) return;
        clearInterval(iv);
        self.rolling = false;
        var took = had4 ? (10 + (was % 5)) + "분 12초" : (16 + Math.round(was / 5)) + "초";
        self.drills.push({
          id: self._id + 1,
          at: "오늘",
          what: had4 ? "전체 되돌리기 (마감 배치 종료 대기 포함)" : "전체 되돌리기 (" + was + "% → 0%)",
          took: took
        });
        self.log("back", "되돌림", "모두 구 시스템으로 돌아왔습니다. 걸린 시간 <b>" + took + "</b>. 기록은 되돌리기 연습에 남습니다.");
        self.toast("구 시스템이 전부 받고 있습니다 — " + took);
      }, 90);
    }
  };
}
