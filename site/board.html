/* ============================================================
   TALLY — 오늘식탁 지표 대시보드
   데이터 대시보드 데모.

   차트를 예쁘게 그리는 건 이 일의 절반도 안 된다. 어려운 쪽은
   1) 숫자가 매일 저절로 최신이 되게 만드는 것,
   2) 그 숫자가 무엇을 세는지 한 문장으로 못박아 두는 것,
   3) 다른 데서 나온 숫자와 안 맞을 때 왜 다른지 댈 수 있는 것.
   그래서 차트 옆에 늘 '언제 들어온 숫자인지' 를 붙여 두었다.
   ============================================================ */
:root{
  --bg:#F1F4F6;
  --panel:#FFFFFF;
  --panel-2:#F7F9FB;
  --panel-3:#EBEFF3;
  --line:#E0E6EB;
  --line-2:#CBD5DE;

  --ink:#0F1A24;
  --ink-2:#465666;
  --ink-3:#8393A2;

  --green:#0B7A5B;   --green-soft:#E3F3EE;
  --blue:#1D6FE0;    --blue-soft:#E7EFFC;
  --amber:#A8700A;   --amber-soft:#FAF0DA;
  --red:#C33128;     --red-soft:#FBE9E7;
  --violet:#6B44C8;  --violet-soft:#EEE9FB;

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.65;letter-spacing:-.013em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.04em;}

/* ---------- 조각 ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:33px;padding:0 13px;border-radius:7px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  transition:background .14s,border-color .14s,color .14s;
}
.b:hover{background:var(--panel-2);border-color:var(--ink-3);}
.b--a{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
.b--a:hover{background:#0E8D69;border-color:#0E8D69;}
.b--g{background:transparent;border-color:transparent;color:var(--ink-2);}
.b--g:hover{background:var(--panel-3);color:var(--ink);}
.b--sm{height:28px;padding:0 10px;font-size:12px;}
.b[disabled]{opacity:.4;cursor:not-allowed;}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--ok{background:var(--green-soft);color:var(--green);}
.pill--warn{background:var(--amber-soft);color:var(--amber);}
.pill--bad{background:var(--red-soft);color:var(--red);}
.pill--info{background:var(--blue-soft);color:var(--blue);}
.pill--idle{background:var(--panel-3);color:var(--ink-3);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;}
.note{
  display:flex;gap:10px;padding:13px 15px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.75;
}
.note svg{flex:none;margin-top:3px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--amber{background:var(--amber-soft);border-color:#EDD8A6;}
.note--amber svg{color:var(--amber);}
.note--red{background:var(--red-soft);border-color:#F1C9C5;}
.note--red svg{color:var(--red);}
.note--green{background:var(--green-soft);border-color:#BCE0D6;}
.note--green svg{color:var(--green);}
.note--blue{background:var(--blue-soft);border-color:#C6DAF7;}
.note--blue svg{color:var(--blue);}

/* ============================================================
   틀 — 위에 조작 막대를 붙박아 둔다
   ============================================================ */
.app{display:flex;flex-direction:column;min-height:100dvh;}
.demo{
  flex:none;display:flex;align-items:center;gap:9px;padding:8px 20px;
  background:var(--ink);color:#B8C4CE;font-size:12px;font-weight:600;
}
.demo b{color:#fff;}
.demo .sp{flex:1;}
.demo a{color:#B8C4CE;text-decoration:underline;text-underline-offset:2px;}
.demo a:hover{color:#8FE3C6;}
@media (max-width:760px){.demo span.hideS{display:none;}}

.top{
  flex:none;display:flex;align-items:center;gap:13px;height:54px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.mk{display:flex;align-items:center;gap:9px;flex:none;}
.mk__i{
  width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--green);color:#fff;
}
.mk__t{font-size:15.5px;font-weight:800;letter-spacing:-.05em;}
.mk__c{font-size:12px;color:var(--ink-3);font-weight:600;padding-left:10px;border-left:1px solid var(--line);}
.top .sp{flex:1;}
.top__bk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);}
.top__bk:hover{color:var(--green);}
@media (max-width:820px){.mk__c{display:none;}}

/* 지금 이 순간 — 실시간으로 도는 자리 */
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600;}
.live i{
  width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;
  box-shadow:0 0 0 0 rgba(11,122,91,.5);animation:beat 2.2s infinite;
}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(11,122,91,.45);}
  70%{box-shadow:0 0 0 7px rgba(11,122,91,0);}
  100%{box-shadow:0 0 0 0 rgba(11,122,91,0);}
}
.live b{color:var(--ink);font-family:var(--m);font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:reduce){.live i{animation:none;}}
@media (max-width:980px){.live{display:none;}}

/* 조작 막대 — 기간 · 비교 · 채널 */
.bar{
  flex:none;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 20px;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.bar .sp{flex:1;}
.seg{display:inline-flex;padding:2px;background:var(--panel-3);border-radius:8px;gap:2px;}
.seg button{
  border:0;background:none;border-radius:6px;padding:6px 12px;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button[aria-current="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,26,36,.08);}
.bar__l{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;}

.nav{
  flex:none;display:flex;flex-wrap:wrap;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:12px 14px;white-space:nowrap;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.016em;
  display:flex;align-items:center;gap:7px;
}
.nav button:hover{color:var(--ink);}
.nav button[aria-current="true"]{color:var(--green);font-weight:700;}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;background:var(--green);}
.nav em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);}
.nav em[data-bad="true"]{color:var(--red);}

.body{flex:1;min-height:0;}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 70px;}
@media (max-width:640px){.wrap{padding:16px 14px 60px;}}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.hd h2{font-size:20px;font-weight:800;letter-spacing:-.038em;}
.hd p{font-size:13px;color:var(--ink-3);}
.hd .sp{flex:1;}

/* ============================================================
   오늘 — 숫자판
   ============================================================ */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
@media (max-width:1140px){.kpis{grid-template-columns:repeat(3,1fr);}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr);}}
@media (max-width:460px){.kpis{grid-template-columns:1fr;}}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px 12px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative;
  transition:border-color .14s,box-shadow .14s;
}
.kpi:hover{border-color:var(--line-2);box-shadow:0 2px 10px -4px rgba(15,26,36,.14);}
.kpi[data-on="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green);}
.kpi__l{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);}
.kpi__l u{
  text-decoration:none;width:13px;height:13px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--panel-3);color:var(--ink-3);font-size:9px;font-weight:800;
}
.kpi__v{display:flex;align-items:baseline;gap:3px;margin-top:5px;}
.kpi__v b{font-size:25px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;font-family:var(--m);}
.kpi__v span{font-size:13px;font-weight:700;color:var(--ink-2);}
.kpi__d{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;}
.kpi__d[data-t="up"]{color:var(--green);}
.kpi__d[data-t="down"]{color:var(--red);}
.kpi__d[data-t="flat"]{color:var(--ink-3);}
.kpi__d em{font-style:normal;font-weight:600;color:var(--ink-3);}
.kpi__s{display:block;margin-top:9px;height:26px;}
.kpi__f{
  display:flex;align-items:center;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);font-family:var(--m);
}
.kpi__f i{width:5px;height:5px;border-radius:50%;background:var(--green);flex:none;}
.kpi__f[data-stale="true"]{color:var(--amber);}
.kpi__f[data-stale="true"] i{background:var(--amber);}
.kpi__f[data-stale="hand"]{color:var(--ink-3);}
.kpi__f[data-stale="hand"] i{background:var(--ink-3);}

/* 큰 그림 */
.plot{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px 12px;}
.plot__h{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:12px;}
.plot__h b{font-size:15px;font-weight:800;letter-spacing:-.03em;}
.plot__h .sp{flex:1;}
.lg{display:flex;align-items:center;gap:13px;font-size:11.5px;color:var(--ink-2);font-weight:600;}
.lg span{display:flex;align-items:center;gap:5px;}
.lg i{width:9px;height:9px;border-radius:2px;}
.lg i[data-l="line"]{width:13px;height:2px;border-radius:2px;}
.lg i[data-l="gap"]{background:repeating-linear-gradient(45deg,var(--line-2) 0 2px,transparent 2px 4px);border:1px solid var(--line-2);}
.chart{width:100%;height:auto;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.chart .gr{stroke:var(--line);stroke-width:1;}
.chart .bar{fill:var(--green);}
.chart .bar[data-cmp="true"]{fill:var(--line-2);}
.chart .gap{fill:none;stroke:var(--line-2);stroke-width:1;}
.chart .ln{fill:none;stroke:#9BAAB8;stroke-width:1.8;}
.chart text{font-family:var(--m);font-size:9.5px;fill:var(--ink-3);}
.chart .hit{fill:transparent;cursor:pointer;}
.tip{
  position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;
  padding:9px 11px;font-size:12px;line-height:1.6;box-shadow:0 12px 30px -10px rgba(15,26,36,.5);white-space:nowrap;
}
.tip b{font-family:var(--m);font-variant-numeric:tabular-nums;}
.tip u{display:block;text-decoration:none;font-size:11px;color:#9FB3C4;margin-bottom:3px;}

/* 정의 손잡이 */
.defs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--panel);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.chip:hover{border-color:var(--ink-3);}
.chip[data-on="true"]{background:var(--green-soft);border-color:#9FD3C3;color:var(--green);font-weight:700;}
.chip i{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;}
.chip[data-on="true"] i{background:var(--green);border-color:var(--green);color:#fff;}

/* 채널 */
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start;}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr);}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
@media (max-width:880px){.two{grid-template-columns:minmax(0,1fr);}}

.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);}
.tb{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;}
.tb th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:11px 13px;white-space:nowrap;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.tb th.r,.tb td.r{text-align:right;}
.tb td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tb tbody tr:last-child td{border-bottom:0;}
.tb tbody tr:hover{background:var(--panel-2);}
.tb .keep{white-space:nowrap;}
.tb .mut{color:var(--ink-3);}
.tb b{font-weight:600;}
.tb tr[data-sum="true"] td{background:var(--panel-2);font-weight:700;}
.tb tr[data-sum="true"]:hover td{background:var(--panel-2);}
.sh{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.sh i{display:block;height:6px;border-radius:100px;background:var(--green);flex:none;}
.sh i[data-c="1"]{background:var(--blue);}
.sh i[data-c="2"]{background:var(--violet);}
.sh i[data-c="3"]{background:var(--amber);}

/* ============================================================
   파이프라인
   ============================================================ */
.flow{display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr;gap:0;align-items:stretch;}
@media (max-width:980px){.flow{grid-template-columns:1fr;}.flow__a{transform:rotate(90deg);margin:4px auto;}}
.flow__c{display:flex;flex-direction:column;gap:8px;}
.flow__t{font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;margin-bottom:2px;}
.flow__a{display:grid;place-items:center;color:var(--line-2);}
.node{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .14s;
}
.node:hover{border-color:var(--line-2);}
.node[data-s="fail"]{border-color:#EFC0BC;background:var(--red-soft);}
.node[data-s="run"]{border-color:#B7D0F4;background:var(--blue-soft);}
.node[data-s="hand"]{border-style:dashed;}
.node__h{display:flex;align-items:center;gap:8px;}
.node__h b{font-size:13px;font-weight:700;letter-spacing:-.02em;}
.node__h .sp{flex:1;}
.node__d{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:4px;font-family:var(--m);}
.node__b{height:3px;border-radius:100px;background:var(--panel-3);overflow:hidden;margin-top:8px;}
.node__b i{display:block;height:100%;background:var(--blue);transition:width .18s linear;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green);}
.dot[data-s="fail"]{background:var(--red);}
.dot[data-s="run"]{background:var(--blue);}
.dot[data-s="hand"]{background:var(--ink-3);}
.dot[data-s="wait"]{background:var(--line-2);}

.runs{display:flex;flex-direction:column;}
.run{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;}
.run:last-child{border-bottom:0;}
.run time{font-family:var(--m);font-size:11.5px;color:var(--ink-3);flex:none;}
.run__n{font-weight:600;flex:none;min-width:112px;}
.run__m{flex:1;min-width:0;color:var(--ink-3);}
.run__t{font-family:var(--m);font-size:11.5px;color:var(--ink-3);flex:none;}

/* ============================================================
   지표 정의
   ============================================================ */
.def{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.def__h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
.def__h b{font-size:15px;font-weight:800;letter-spacing:-.03em;}
.def__h .sp{flex:1;}
.def__h em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-family:var(--m);}
.def__b{padding:14px 16px;}
.def__s{font-size:14px;color:var(--ink);line-height:1.8;font-weight:500;}
.def__s b{background:var(--green-soft);padding:0 4px;border-radius:4px;}
.def__g{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px;}
@media (max-width:700px){.def__g{grid-template-columns:1fr;}}
.def__x{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel-2);}
.def__x p{font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin-bottom:6px;}
.def__x li{font-size:12.5px;color:var(--ink-2);line-height:1.75;list-style:none;padding-left:14px;position:relative;}
.def__x li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line-2);}
.def__x[data-t="out"] li::before{background:var(--red);}
.def__x[data-t="in"] li::before{background:var(--green);}

.sql{
  margin:0;padding:12px 0;background:var(--ink);border-radius:9px;overflow-x:auto;
  font-family:var(--m);font-size:11.5px;line-height:1.8;color:#C8D6E2;
}
.sql>span{display:block;padding:0 14px;white-space:pre;min-width:max-content;}
.sql i{font-style:normal;}
.sql i.k{color:#8FC6F5;}
.sql i.s{color:#8FD6A8;}
.sql i.c{color:#7A8A99;}
.sql i.n{color:#F0C070;}

/* ============================================================
   숫자가 안 맞을 때
   ============================================================ */
.recon{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.rrow{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);}
.rrow:last-child{border-bottom:0;}
.rrow[data-t="head"]{background:var(--panel-2);}
.rrow[data-t="sum"]{background:var(--green-soft);}
.rrow__t{flex:1;min-width:0;}
.rrow__t b{display:block;font-size:13.5px;font-weight:700;}
.rrow__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.7;}
.rrow__v{font-family:var(--m);font-size:15px;font-weight:700;flex:none;min-width:124px;text-align:right;letter-spacing:-.03em;}
.rrow[data-t="minus"] .rrow__v{color:var(--red);}
.rrow[data-t="plus"] .rrow__v{color:var(--blue);}
.rrow[data-t="sum"] .rrow__v{color:var(--green);}
.rrow__k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--panel-3);color:var(--ink-3);font-family:var(--m);font-size:11px;font-weight:700;}
.rrow[data-t="minus"] .rrow__k{background:var(--red-soft);color:var(--red);}
.rrow[data-t="plus"] .rrow__k{background:var(--blue-soft);color:var(--blue);}
.rrow[data-t="sum"] .rrow__k{background:var(--green);color:#fff;}

/* ============================================================
   경보
   ============================================================ */
.alerts{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.al{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
.al:last-child{border-bottom:0;}
.al[data-off="true"]{background:var(--panel-2);}
.al__s{
  flex:none;margin-top:1px;width:38px;height:21px;border-radius:100px;background:var(--line-2);
  position:relative;cursor:pointer;border:0;padding:0;transition:background .16s;
}
.al__s::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .16s;}
.al__s[aria-checked="true"]{background:var(--green);}
.al__s[aria-checked="true"]::after{transform:translateX(17px);}
.al__t{flex:1;min-width:0;}
.al__t b{display:block;font-size:13.5px;font-weight:700;}
.al__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:1px;}
.al__t code{font-family:var(--m);font-size:11.5px;color:var(--ink-2);background:var(--panel-3);padding:1px 5px;border-radius:4px;}
.al__c{flex:none;text-align:right;}
.al__c b{display:block;font-family:var(--m);font-size:13px;font-weight:700;}
.al__c span{display:block;font-size:11px;color:var(--ink-3);}

/* ============================================================
   정한 것
   ============================================================ */
.doc h3{font-size:15px;font-weight:800;letter-spacing:-.026em;margin-bottom:8px;}
.doc h3::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin:0 9px 3px 0;}
.doc p{font-size:13.5px;color:var(--ink-2);line-height:1.9;font-weight:400;}
.doc p + p{margin-top:9px;}
.doc code{font-family:var(--m);font-size:12px;color:var(--green);background:var(--green-soft);padding:1px 6px;border-radius:5px;}
.doc b{color:var(--ink);}
.doc dl{margin:12px 0 0;display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px solid var(--line);}
.doc dt{font-size:13px;font-weight:700;color:var(--ink);}
.doc dd{margin:3px 0 0;font-size:13px;color:var(--ink-3);line-height:1.75;}
.hr{height:1px;background:var(--line);margin:22px 0;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--ink);border:1px solid var(--ink);color:#fff;border-radius:9px;padding:11px 16px;
  font-size:13px;font-weight:600;box-shadow:0 18px 44px -14px rgba(15,26,36,.5);max-width:calc(100vw - 28px);
}
</style>

<div class="app" x-data="tally()" x-cloak>

<div class="demo">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
  <span><b>Fornax 견본</b> — 실제 회사 자료가 아닙니다. 새로고침하면 처음으로 돌아갑니다.</span>
  <span class="sp"></span>
  <span class="hideS">위의 <b>기간 · 채널</b> 과 아래 <b>정의 손잡이</b> 를 바꿔 보세요.</span>
  <a href="index.html">← Fornax</a>
</div>

<!-- ============================================================
     윗줄
     ============================================================ -->
<header class="top">
  <span class="mk">
    <span class="mk__i">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M10 20V6M16 20v-4M22 20V9"/></svg>
    </span>
    <span class="mk__t">TALLY</span>
  </span>
  <span class="mk__c">오늘식탁 · 정기배송 지표</span>
  <span class="sp"></span>
  <span class="live">
    <i></i><span>지금 주문 <b x-text="liveN"></b>건</span>
    <span style="color:var(--line-2)">·</span>
    <span>마지막 <b x-text="liveAgo"></b>초 전</span>
  </span>
  <button class="b b--sm" @click="exportCsv()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>
    내보내기
  </button>
</header>

<!-- 조작 막대 -->
<div class="bar">
  <span class="bar__l">기간</span>
  <span class="seg">
    <button :aria-current="range===7" @click="setRange(7)">7일</button>
    <button :aria-current="range===28" @click="setRange(28)">28일</button>
    <button :aria-current="range===90" @click="setRange(90)">90일</button>
  </span>
  <span class="bar__l" style="margin-left:6px">비교</span>
  <span class="seg">
    <button :aria-current="cmp==='prev'" @click="cmp='prev'">직전 기간</button>
    <button :aria-current="cmp==='year'" @click="cmp='year'">작년 같은 기간</button>
  </span>
  <span class="bar__l" style="margin-left:6px">채널</span>
  <span class="seg">
    <template x-for="c in channels" :key="c.k">
      <button :aria-current="ch===c.k" @click="ch=c.k" x-text="c.n"></button>
    </template>
  </span>
  <span class="sp"></span>
  <span style="font-size:11.5px;color:var(--ink-3);font-family:var(--m)" x-text="'집계 ' + cacheAt + ' · 5분 캐시'"></span>
  <button class="b b--sm" @click="recalc()" :disabled="calc">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" :style="calc ? 'animation:spin 1s linear infinite' : ''"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    <span x-text="calc ? '다시 세는 중…' : '다시 세기'"></span>
  </button>
</div>

<nav class="nav">
  <button :aria-current="view==='now'" @click="view='now'">오늘</button>
  <button :aria-current="view==='pipe'" @click="view='pipe'">파이프라인
    <em :data-bad="failCount > 0" x-text="failCount ? failCount + '건 실패' : '정상'"></em></button>
  <button :aria-current="view==='defs'" @click="view='defs'">지표 정의</button>
  <button :aria-current="view==='recon'" @click="view='recon'">숫자 맞추기</button>
  <button :aria-current="view==='alert'" @click="view='alert'">경보
    <em x-text="onAlerts + '/' + alerts.length"></em></button>
  <button :aria-current="view==='note'" @click="view='note'">정한 것</button>
</nav>

<div class="body">

<!-- ============================================================
     오늘
     ============================================================ -->
<template x-if="view==='now'">
  <div class="wrap">

    <div class="note note--red" style="margin-bottom:14px" x-show="gapDay">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div style="flex:1">
        <b>어제 쿠팡 매출이 아직 안 들어왔습니다.</b>
        새벽 4시 수집이 실패했고, 재시도 3번도 같은 오류였습니다 (<span class="mono">429 Too Many Requests</span>).
        <b>그래서 어제 자리를 비워 두었습니다</b> — 숫자가 떨어진 것처럼 보이면 사람들이 원인부터 찾기 시작합니다.
      </div>
      <button class="b b--sm b--a" style="flex:none;align-self:center" @click="retry('coupang')" :disabled="running">
        <span x-text="running ? '받는 중…' : '다시 받기'"></span>
      </button>
    </div>

    <div class="note note--green" style="margin-bottom:14px" x-show="!gapDay">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
      <div>여섯 원천이 모두 제 시각에 들어왔습니다. <b>어제까지의 숫자가 다 찼습니다.</b>
        오프라인 팝업 매출만 사람이 손으로 넣는데, 그 칸에는 표시를 따로 달아 두었습니다.</div>
    </div>

    <!-- 숫자판 -->
    <div class="kpis">
      <template x-for="k in kpis" :key="k.id">
        <button class="kpi" :data-on="pickMetric===k.id" @click="openDef(k.id)">
          <span class="kpi__l"><span x-text="k.name"></span><u>?</u></span>
          <span class="kpi__v"><b x-text="k.v"></b><span x-text="k.unit"></span></span>
          <span class="kpi__d" :data-t="k.dir">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" x-show="k.dir!=='flat'"
                 :style="k.arrow==='down' ? 'transform:rotate(180deg)' : ''"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
            <span x-text="k.delta"></span>
            <em x-text="(cmp==='prev' ? '직전' : '작년') + ' 대비' + (liveDays < range ? ' · 같은 ' + liveDays + '일' : '')"></em>
          </span>
          <svg class="kpi__s" viewBox="0 0 120 26" preserveAspectRatio="none" aria-hidden="true">
            <polyline :points="k.spark" fill="none" :stroke="k.dir==='down' ? 'var(--red)' : 'var(--green)'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
          </svg>
          <span class="kpi__f" :data-stale="k.fresh.t"><i></i><span x-text="k.fresh.s"></span></span>
        </button>
      </template>
    </div>

    <!-- 정의 손잡이 -->
    <div class="card" style="padding:13px 15px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
        <span class="bar__l">매출을 무엇으로 셀까</span>
        <div class="defs">
          <button class="chip" :data-on="d.refund" @click="d.refund = !d.refund">
            <i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></i>
            환불 · 취소 빼기</button>
          <button class="chip" :data-on="d.test" @click="d.test = !d.test">
            <i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></i>
            테스트 · 내부 주문 빼기</button>
          <button class="chip" :data-on="d.vat" @click="d.vat = !d.vat">
            <i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></i>
            부가세 포함</button>
        </div>
        <span class="sp"></span>
        <span class="pill" :class="defOff ? 'pill--warn' : 'pill--idle'" x-text="defOff ? '기본 정의와 다름' : '기본 정의'"></span>
      </div>
      <p style="font-size:12.5px;color:var(--ink-3);line-height:1.75;margin-top:10px">
        같은 기간인데 손잡이 세 개로 매출이
        <b class="mono" style="color:var(--ink)" x-text="won(rawSum)"></b> 에서
        <b class="mono" style="color:var(--green)" x-text="won(sum)"></b> 까지 움직입니다
        (<span class="mono" x-text="pctOf(sum, rawSum)"></span>).
        <b style="color:var(--ink)">그래서 숫자를 주고받을 때는 정의를 같이 주고받아야 합니다.</b>
        회사의 기본은 <b style="color:var(--ink)">환불 뺀 · 테스트 뺀 · 부가세 별도</b> 입니다.
      </p>
    </div>

    <!-- 큰 그림 -->
    <div class="plot" style="position:relative;margin-bottom:14px" @mouseleave="tip = null">
      <div class="plot__h">
        <b x-text="chLabel + ' 일별 매출'"></b>
        <span class="pill" :class="liveDays < range ? 'pill--warn' : 'pill--idle'"
              x-text="liveDays < range ? (range + '일 중 ' + liveDays + '일 집계') : (range + '일')"></span>
        <span class="sp"></span>
        <span class="lg">
          <span><i style="background:var(--green)"></i>이번 기간</span>
          <span><i data-l="line" style="background:#9BAAB8"></i><span x-text="cmp==='prev' ? '직전 기간' : '작년 같은 기간'"></span></span>
          <span x-show="gapDay"><i data-l="gap"></i>아직 안 들어옴</span>
        </span>
      </div>
      <!-- svg 안에서는 <template> 이 템플릿으로 안 잡힌다. 그림은 통째로 만들어 붙인다 -->
      <div x-html="chartSvg" @mouseover="onHover($event)"></div>
      <div class="tip" x-show="tip" x-cloak :style="tip ? ('left:' + tip.l + '%;top:8px;transform:translateX(' + (tip.l > 62 ? '-104%' : '4px') + ')') : ''">
        <u x-text="tip && tip.day"></u>
        <div x-html="tip && tip.body"></div>
      </div>
    </div>

    <div class="split">
      <div>
        <div class="hd" style="margin-bottom:10px">
          <h2 style="font-size:16px">채널별</h2>
          <p>같은 기간, 어디서 얼마나 팔렸나</p>
        </div>
        <div class="tbw">
          <table class="tb">
            <thead><tr><th>채널</th><th class="r" style="width:118px">매출</th><th class="r" style="width:78px">주문</th>
              <th class="r" style="width:88px">객단가</th><th class="r" style="width:132px">비중</th></tr></thead>
            <tbody>
              <template x-for="r in chRows" :key="r.k">
                <tr>
                  <td><b x-text="r.n"></b>
                    <span class="pill pill--idle" style="margin-left:6px" x-show="r.hand">손입력</span></td>
                  <td class="r mono" x-text="won(r.rev)"></td>
                  <td class="r mono mut" x-text="r.ord.toLocaleString()"></td>
                  <td class="r mono mut" x-text="won(r.aov)"></td>
                  <td class="r"><span class="sh"><i :data-c="r.c" :style="'width:' + Math.max(3, r.share * .84) + 'px'"></i>
                    <span class="mono mut" x-text="r.share.toFixed(1) + '%'"></span></span></td>
                </tr>
              </template>
              <tr data-sum="true">
                <td>합계</td>
                <td class="r mono" x-text="won(sum)"></td>
                <td class="r mono" x-text="orders.toLocaleString()"></td>
                <td class="r mono" x-text="won(aov)"></td>
                <td class="r mono">100.0%</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p style="font-size:12.5px;color:var(--ink-3);line-height:1.75;margin-top:10px">
          오프라인 팝업만 담당자가 매주 월요일에 스프레드시트로 넣습니다.
          <b style="color:var(--ink)">손으로 넣는 칸은 손으로 넣는다고 화면에 적어 둡니다.</b>
          안 그러면 월요일 오전마다 "매출이 왜 떨어졌냐" 는 질문을 받습니다.
        </p>
      </div>

      <div>
        <div class="hd" style="margin-bottom:10px">
          <h2 style="font-size:16px">광고와 구독</h2>
          <p>쓴 돈과 남은 사람</p>
        </div>
        <div class="card" style="padding:15px 17px;margin-bottom:10px">
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-size:12px;font-weight:700;color:var(--ink-3)">ROAS</span>
            <b class="num" style="font-size:24px;font-weight:800" x-text="roas.toFixed(2)"></b>
            <span class="sp" style="flex:1"></span>
            <span class="pill" :class="roas >= 3 ? 'pill--ok' : (roas >= 2.2 ? 'pill--warn' : 'pill--bad')"
                  x-text="roas >= 3 ? '목표 위' : (roas >= 2.2 ? '목표 아래' : '손해')"></span>
          </div>
          <p style="font-size:12.5px;color:var(--ink-3);line-height:1.75;margin-top:8px">
            광고비 <b class="mono" style="color:var(--ink)" x-text="won(adCost)"></b> 로
            <b class="mono" style="color:var(--ink)" x-text="won(adRev)"></b> 를 벌었습니다.
            <b style="color:var(--ink)">이 숫자는 플랫폼이 알려 준 값이라 서로 겹칩니다</b> —
            메타와 구글이 같은 주문을 각자 자기 성과로 셉니다. 합이 실제 매출을 넘는 날도 있습니다.
          </p>
        </div>
        <div class="card" style="padding:15px 17px">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:9px">
            <span style="font-size:12px;font-weight:700;color:var(--ink-3)">구독</span>
            <span class="sp" style="flex:1"></span>
            <span style="font-size:11.5px;color:var(--ink-3);font-family:var(--m)">오늘 06:00 자동</span>
          </div>
          <template x-for="s in subRows" :key="s.n">
            <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
              <span style="font-size:13px;flex:1" x-text="s.n"></span>
              <b class="mono" style="font-size:14px;font-weight:700" x-text="s.v"></b>
              <span class="mono" style="font-size:11.5px;min-width:52px;text-align:right"
                    :style="s.up ? 'color:var(--green)' : 'color:var(--red)'" x-text="s.d"></span>
            </div>
          </template>
          <p style="font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:10px">
            이탈률은 <b style="color:var(--ink)">해지 버튼을 누른 사람</b>만 셉니다. 결제 실패로 조용히 빠진 사람은
            따로 셉니다 — 둘을 합치면 무엇을 고쳐야 할지 알 수 없습니다.
          </p>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ============================================================

<template x-if="view==='pipe'">
  <div class="wrap">
    <div class="hd">
      <h2>파이프라인</h2>
      <p>숫자가 저절로 최신이 되게 만드는 쪽 — 이 일의 대부분입니다</p>
      <span class="sp"></span>
      <span class="pill" :class="failCount ? 'pill--bad' : 'pill--ok'"
            x-text="failCount ? failCount + '개 실패' : '여섯 원천 모두 정상'"></span>
    </div>

    <div class="note" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div>차트를 그리는 데는 하루면 됩니다. 그 차트가 <b>내일 아침에도 맞는 숫자를 들고 있게 만드는 데</b> 나머지 시간이 듭니다.
        원천이 여섯이고, 그중 하나는 사람입니다. 실패하는 날이 반드시 옵니다 —
        <b>실패했을 때 조용히 틀린 숫자를 보여주지 않는 것</b>이 이 화면의 목표입니다.</div>
    </div>

    <div class="flow" style="margin-bottom:18px">
      <div class="flow__c">
        <p class="flow__t">원천 · 6</p>
        <template x-for="s in sources" :key="s.k">
          <button class="node" :data-s="s.s" @click="poke(s)">
            <span class="node__h">
              <i class="dot" :data-s="s.s"></i>
              <b x-text="s.n"></b>
              <span class="sp"></span>
              <span class="pill" :class="s.s==='fail' ? 'pill--bad' : (s.s==='run' ? 'pill--info' : (s.s==='hand' ? 'pill--idle' : 'pill--ok'))"
                    x-text="s.s==='fail' ? '실패' : (s.s==='run' ? '받는 중' : (s.s==='hand' ? '사람' : '정상'))"></span>
            </span>
            <span class="node__d" x-text="s.every + ' · ' + s.last"></span>
            <span class="node__b" x-show="s.s==='run'"><i :style="'width:' + s.p + '%'"></i></span>
          </button>
        </template>
      </div>
      <div class="flow__a">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </div>
      <div class="flow__c">
        <p class="flow__t">적재 · 변환</p>
        <div class="node">
          <span class="node__h"><i class="dot" :data-s="failCount ? 'wait' : 'ok'"></i><b>정제 · 중복 제거</b></span>
          <span class="node__d">stg_orders · 10분</span>
          <span class="node__d" style="font-family:var(--f);color:var(--ink-2)">
            같은 주문이 자사몰과 PG 양쪽에서 옵니다. 주문번호로 하나로 묶습니다.</span>
        </div>
        <div class="node">
          <span class="node__h"><i class="dot" :data-s="failCount ? 'wait' : 'ok'"></i><b>일별 집계</b></span>
          <span class="node__d">mart_daily · 매일 05:30</span>
          <span class="node__d" style="font-family:var(--f);color:var(--ink-2)">
            원천이 하나라도 안 들어오면 그날 행을 만들지 않습니다. 반쪽짜리 숫자를 만드느니 비워 둡니다.</span>
        </div>
        <div class="node">
          <span class="node__h"><i class="dot" data-s="ok"></i><b>캐시 굽기</b></span>
          <span class="node__d">5분 · 마지막 <span x-text="cacheAt"></span></span>
          <span class="node__d" style="font-family:var(--f);color:var(--ink-2)">
            화면을 열 때마다 412만 행을 세지 않습니다. 5분마다 미리 세어 두고, 언제 센 값인지 화면에 적습니다.</span>
        </div>
      </div>
      <div class="flow__a">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </div>
      <div class="flow__c">
        <p class="flow__t">지표 · 화면</p>
        <template x-for="m in metrics" :key="m.id">
          <button class="node" @click="openDef(m.id)">
            <span class="node__h"><i class="dot" :data-s="(gapDay && m.hitByGap) ? 'wait' : 'ok'"></i><b x-text="m.name"></b>
              <span class="sp"></span>
              <span class="pill pill--idle" x-show="gapDay && m.hitByGap">어제 빠짐</span></span>
            <span class="node__d" x-text="m.owner + ' · ' + m.every"></span>
          </button>
        </template>
      </div>
    </div>

    <div class="two" style="align-items:start">
      <div>
        <div class="hd" style="margin-bottom:10px"><h2 style="font-size:16px">오늘 새벽에 돈 것</h2>
          <p>실패는 지우지 않고 남깁니다</p></div>
        <div class="card runs">
          <template x-for="r in runs" :key="r.id">
            <div class="run">
              <time x-text="r.t"></time>
              <span class="run__n" x-text="r.n"></span>
              <span class="pill" :class="r.k==='fail' ? 'pill--bad' : (r.k==='retry' ? 'pill--warn' : (r.k==='skip' ? 'pill--idle' : 'pill--ok'))"
                    x-text="r.k==='fail' ? '실패' : (r.k==='retry' ? '재시도' : (r.k==='skip' ? '건너뜀' : '성공'))"></span>
              <span class="run__m" x-text="r.m"></span>
              <span class="run__t" x-text="r.d"></span>
            </div>
          </template>
        </div>
      </div>
      <div>
        <div class="hd" style="margin-bottom:10px"><h2 style="font-size:16px">이렇게 정해 두었습니다</h2>
          <p>새벽에 깨지 않으려고</p></div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="run" style="align-items:flex-start;padding:13px 15px">
            <span class="run__n" style="min-width:96px">돌리는 시각</span>
            <span class="run__m" style="color:var(--ink-2)">외부 API 는 새벽 <b class="mono">04:00</b>. 플랫폼 정산이 자정 직후에 확정되고,
              그 시간대가 가장 덜 막힙니다. 집계는 <b class="mono">05:30</b>, 사람이 출근하기 세 시간 전에 끝납니다.</span>
          </div>
          <div class="run" style="align-items:flex-start;padding:13px 15px">
            <span class="run__n" style="min-width:96px">실패하면</span>
            <span class="run__m" style="color:var(--ink-2)">10분 간격으로 <b class="mono">3번</b> 다시 시도합니다. 그래도 안 되면
              <b style="color:var(--ink)">그날 데이터를 만들지 않고</b> 슬랙으로 부릅니다. 반쪽을 채워 넣지 않습니다.</span>
          </div>
          <div class="run" style="align-items:flex-start;padding:13px 15px">
            <span class="run__n" style="min-width:96px">다시 받으면</span>
            <span class="run__m" style="color:var(--ink-2)">그날 것만 지우고 다시 넣습니다(<b class="mono">멱등</b>). 두 번 돌려도 두 배가 되지 않아야
              마음 놓고 다시 돌릴 수 있습니다.</span>
          </div>
          <div class="run" style="align-items:flex-start;padding:13px 15px">
            <span class="run__n" style="min-width:96px">늦게 오는 것</span>
            <span class="run__m" style="color:var(--ink-2)">PG 정산은 <b class="mono">D+2</b> 에 확정됩니다. 그래서 최근 이틀 숫자는
              나중에 바뀝니다 — 화면에도 그렇게 적어 둡니다.</span>
          </div>
          <div class="run" style="align-items:flex-start;padding:13px 15px">
            <span class="run__n" style="min-width:96px">사람이 넣는 것</span>
            <span class="run__m" style="color:var(--ink-2)">오프라인 팝업 매출만 시트로 받습니다. 월요일 정오까지 안 들어오면
              담당자에게 먼저 알립니다. <b style="color:var(--ink)">사람도 파이프라인의 한 단계로 취급합니다.</b></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template x-if="view==='defs'">
  <div class="wrap">
    <div class="hd">
      <h2>지표 정의</h2>
      <p>이 숫자가 무엇을 세는지 한 문장으로 적어 둡니다</p>
    </div>

    <div class="note note--blue" style="margin-bottom:14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div>회의에서 숫자가 안 맞는 이유는 대개 계산이 틀려서가 아니라 <b>서로 다른 것을 세고 있어서</b>입니다.
        그래서 지표마다 <b>한 문장 정의 · 세는 것 · 안 세는 것 · 실제 쿼리 · 주인</b>을 붙여 두고,
        화면의 숫자에서 여기로 바로 올 수 있게 했습니다.</div>
    </div>

    <span class="seg" style="margin-bottom:14px">
      <template x-for="m in metrics" :key="m.id">
        <button :aria-current="pickMetric===m.id" @click="pickMetric=m.id" x-text="m.name"></button>
      </template>
    </span>

<template x-if="pickMetric==='revenue'">
  <div class="def">
    <div class="def__h">
      <b>매출</b>
      <span class="sp"></span>
      <em>주인 데이터팀 · 정하늘</em>
      <span class="pill pill--idle">갱신 10분</span>
      <span class="pill pill--idle">캐시 5분</span>
    </div>
    <div class="def__b">
      <p class="def__s">결제가 <b>확정된</b> 주문의 <b>상품 금액 합계</b>. 환불·취소를 뺀 뒤, 부가세는 <b>빼고</b> 셉니다.</p>
      <div class="def__g">
        <div class="def__x" data-t="in"><p>세는 것</p><ul style="margin:0;padding:0"><li>결제 완료 · 배송 준비중 · 배송중 · 배송완료</li><li>정기배송 회차 결제 (매 회차를 그 날짜에 답니다)</li><li>오프라인 팝업 현장 결제 (월요일 손입력)</li></ul></div>
        <div class="def__x" data-t="out"><p>안 세는 것</p><ul style="margin:0;padding:0"><li>결제 대기 · 결제 실패 (아직 돈이 아닙니다)</li><li>환불 · 부분 취소 금액 (취소한 날이 아니라 <b>원래 주문한 날</b>에서 뺍니다)</li><li>테스트 계정 12개와 내부 직원 주문</li><li>배송비와 부가세 (배송비는 따로 셉니다)</li><li>쿠폰 · 적립금 할인액 (할인 뒤 실결제액만)</li></ul></div>
      </div>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:14px 0 7px">실제로 도는 쿼리</p>
      <pre class="sql"><span><i class="c">-- mart_daily.revenue  ·  매일 05:30 + 10분마다 증분</i></span><span><i class="k">SELECT</i> o.ordered_on <i class="k">AS</i> d,</span><span>       o.channel,</span><span>       <i class="k">SUM</i>(i.paid_amount - i.refunded_amount) <i class="k">AS</i> revenue</span><span>  <i class="k">FROM</i> stg_order_items i</span><span>  <i class="k">JOIN</i> stg_orders o <i class="k">ON</i> o.order_id = i.order_id</span><span> <i class="k">WHERE</i> o.status <i class="k">IN</i> (<i class="s">&#x27;PAID&#x27;</i>,<i class="s">&#x27;PREP&#x27;</i>,<i class="s">&#x27;SHIPPING&#x27;</i>,<i class="s">&#x27;DONE&#x27;</i>)</span><span>   <i class="k">AND</i> o.is_test = false                       <i class="c">-- 테스트 계정 12개</i></span><span>   <i class="k">AND</i> o.customer_id <i class="k">NOT</i> <i class="k">IN</i> (<i class="k">SELECT</i> id <i class="k">FROM</i> internal_accounts)</span><span>   <i class="k">AND</i> i.kind = <i class="s">&#x27;GOODS&#x27;</i>                        <i class="c">-- 배송비 · 부가세 제외</i></span><span> <i class="k">GROUP</i> <i class="k">BY</i> <i class="n">1</i>, <i class="n">2</i>;</span></pre>
      <div class="note note--amber" style="margin-top:13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>자주 어긋나는 지점.</b> "어제 매출" 을 물어보는 사람마다 다른 숫자를 기대합니다. 대표는 부가세 포함 총액, 마케팅은 환불 전 금액, 회계는 인식 기준 매출입니다. <b>그래서 화면 위에 손잡이를 두고, 무엇을 켠 값인지 늘 보이게 했습니다.</b></div>
      </div>
    </div>
  </div>
</template>

<template x-if="pickMetric==='orders'">
  <div class="def">
    <div class="def__h">
      <b>주문 수</b>
      <span class="sp"></span>
      <em>주인 데이터팀 · 정하늘</em>
      <span class="pill pill--idle">갱신 10분</span>
      <span class="pill pill--idle">캐시 5분</span>
    </div>
    <div class="def__b">
      <p class="def__s">같은 기간에 <b>결제가 확정된 주문서의 개수</b>. 한 주문서에 상품이 몇 개든 <b>1건</b>입니다.</p>
      <div class="def__g">
        <div class="def__x" data-t="in"><p>세는 것</p><ul style="margin:0;padding:0"><li>결제 확정된 주문서 1건 = 1</li><li>정기배송은 회차마다 1건</li><li>채널이 달라도 주문서 단위로 셉니다</li></ul></div>
        <div class="def__x" data-t="out"><p>안 세는 것</p><ul style="margin:0;padding:0"><li>전부 취소된 주문 (부분 취소는 그대로 1건)</li><li>테스트 · 내부 주문</li><li>같은 사람이 5분 안에 두 번 결제한 중복 (자동으로 합칩니다)</li></ul></div>
      </div>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:14px 0 7px">실제로 도는 쿼리</p>
      <pre class="sql"><span><i class="k">SELECT</i> o.ordered_on <i class="k">AS</i> d,</span><span>       o.channel,</span><span>       <i class="k">COUNT</i>(<i class="k">DISTINCT</i> o.order_id) <i class="k">AS</i> orders</span><span>  <i class="k">FROM</i> stg_orders o</span><span> <i class="k">WHERE</i> o.status <i class="k">IN</i> (<i class="s">&#x27;PAID&#x27;</i>,<i class="s">&#x27;PREP&#x27;</i>,<i class="s">&#x27;SHIPPING&#x27;</i>,<i class="s">&#x27;DONE&#x27;</i>)</span><span>   <i class="k">AND</i> o.is_test = false</span><span> <i class="k">GROUP</i> <i class="k">BY</i> <i class="n">1</i>, <i class="n">2</i>;</span></pre>
      <div class="note note--amber" style="margin-top:13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>자주 어긋나는 지점.</b> 주문 수를 <b>주문 품목 수</b>로 세면 밀키트 3종 담은 주문이 3건이 됩니다. 객단가가 3분의 1로 보이고, 아무도 눈치채지 못한 채 광고 예산이 잘못 잡힙니다.</div>
      </div>
    </div>
  </div>
</template>

<template x-if="pickMetric==='aov'">
  <div class="def">
    <div class="def__h">
      <b>객단가</b>
      <span class="sp"></span>
      <em>주인 데이터팀 · 정하늘</em>
      <span class="pill pill--idle">갱신 10분</span>
      <span class="pill pill--idle">캐시 5분</span>
    </div>
    <div class="def__b">
      <p class="def__s"><b>매출 ÷ 주문 수</b>. 두 숫자를 각각 정의한 다음, 나눈 것뿐입니다.</p>
      <div class="def__g">
        <div class="def__x" data-t="in"><p>세는 것</p><ul style="margin:0;padding:0"><li>위의 매출 정의 그대로</li><li>위의 주문 수 정의 그대로</li></ul></div>
        <div class="def__x" data-t="out"><p>안 세는 것</p><ul style="margin:0;padding:0"><li>평균을 따로 저장하지 않습니다 — 저장하면 반드시 앞의 둘과 어긋납니다</li></ul></div>
      </div>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:14px 0 7px">실제로 도는 쿼리</p>
      <pre class="sql"><span><i class="c">-- 저장하지 않고 화면에서 나눕니다. 저장하면 반올림이 쌓입니다.</i></span><span><i class="k">SELECT</i> d, channel,</span><span>       revenue,</span><span>       orders,</span><span>       <i class="k">CASE</i> <i class="k">WHEN</i> orders = <i class="n">0</i> <i class="k">THEN</i> <i class="k">NULL</i></span><span>            <i class="k">ELSE</i> <i class="k">ROUND</i>(revenue::numeric / orders) <i class="k">END</i> <i class="k">AS</i> aov</span><span>  <i class="k">FROM</i> mart_daily;</span></pre>
      <div class="note note--amber" style="margin-top:13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>자주 어긋나는 지점.</b> 기간을 합칠 때 <b>일별 객단가의 평균</b>을 내면 틀립니다. 주문이 3건인 날과 900건인 날을 같은 무게로 세게 됩니다. 항상 <b>기간 매출 합 ÷ 기간 주문 합</b> 입니다.</div>
      </div>
    </div>
  </div>
</template>

<template x-if="pickMetric==='subs'">
  <div class="def">
    <div class="def__h">
      <b>활성 구독자</b>
      <span class="sp"></span>
      <em>주인 CRM · 문세진</em>
      <span class="pill pill--idle">갱신 매일 06:00</span>
      <span class="pill pill--idle">캐시 1시간</span>
    </div>
    <div class="def__b">
      <p class="def__s">오늘 기준으로 <b>다음 배송 예정일이 잡혀 있는 사람</b>. 결제 성공 여부와 무관하게, 구독을 유지하고 있는 상태입니다.</p>
      <div class="def__g">
        <div class="def__x" data-t="in"><p>세는 것</p><ul style="margin:0;padding:0"><li>정기배송 진행중</li><li>일시정지 (돌아올 사람으로 봅니다 · 최대 8주)</li><li>결제 실패로 재시도 중인 사람 (아직 3회 안 지남)</li></ul></div>
        <div class="def__x" data-t="out"><p>안 세는 것</p><ul style="margin:0;padding:0"><li>해지 완료</li><li>일시정지 8주를 넘긴 사람</li><li>결제 3회 연속 실패로 자동 종료된 사람</li></ul></div>
      </div>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:14px 0 7px">실제로 도는 쿼리</p>
      <pre class="sql"><span><i class="c">-- 매일 06:00 스냅숏. 과거를 다시 계산하지 않고 그날 값을 그대로 남깁니다.</i></span><span><i class="k">SELECT</i> <i class="k">CURRENT_DATE</i> <i class="k">AS</i> d,</span><span>       <i class="k">COUNT</i>(*) <i class="k">FILTER</i> (<i class="k">WHERE</i> s.state = <i class="s">&#x27;ACTIVE&#x27;</i>) <i class="k">AS</i> active,</span><span>       <i class="k">COUNT</i>(*) <i class="k">FILTER</i> (<i class="k">WHERE</i> s.state = <i class="s">&#x27;PAUSED&#x27;</i>) <i class="k">AS</i> paused,</span><span>       <i class="k">COUNT</i>(*) <i class="k">FILTER</i> (<i class="k">WHERE</i> s.state = <i class="s">&#x27;DUNNING&#x27;</i>) <i class="k">AS</i> dunning</span><span>  <i class="k">FROM</i> subscriptions s</span><span> <i class="k">WHERE</i> s.state <i class="k">IN</i> (<i class="s">&#x27;ACTIVE&#x27;</i>,<i class="s">&#x27;PAUSED&#x27;</i>,<i class="s">&#x27;DUNNING&#x27;</i>)</span><span>   <i class="k">AND</i> (s.paused_at <i class="k">IS</i> <i class="k">NULL</i> <i class="k">OR</i> s.paused_at &gt; <i class="k">CURRENT_DATE</i> - <i class="k">INTERVAL</i> <i class="s">&#x27;8 weeks&#x27;</i>);</span></pre>
      <div class="note note--amber" style="margin-top:13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>자주 어긋나는 지점.</b> 일시정지를 활성에 넣을지가 늘 싸움입니다. 넣으면 숫자가 좋아 보이고, 빼면 여름마다 급락합니다. <b>8주라는 선을 긋고 문서에 적어 둔 다음에는 아무도 다시 묻지 않았습니다.</b></div>
      </div>
    </div>
  </div>
</template>

<template x-if="pickMetric==='churn'">
  <div class="def">
    <div class="def__h">
      <b>이탈률</b>
      <span class="sp"></span>
      <em>주인 CRM · 문세진</em>
      <span class="pill pill--idle">갱신 매일 06:00</span>
      <span class="pill pill--idle">캐시 1시간</span>
    </div>
    <div class="def__b">
      <p class="def__s">이번 달에 <b>스스로 해지 버튼을 누른 사람</b> ÷ 달 시작 시점의 활성 구독자.</p>
      <div class="def__g">
        <div class="def__x" data-t="in"><p>세는 것</p><ul style="margin:0;padding:0"><li>해지 버튼을 눌러 해지한 사람</li></ul></div>
        <div class="def__x" data-t="out"><p>안 세는 것</p><ul style="margin:0;padding:0"><li>결제 실패로 조용히 빠진 사람 (<b>결제이탈</b>로 따로 셉니다)</li><li>일시정지</li><li>환불 요청만 하고 구독은 유지한 사람</li></ul></div>
      </div>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin:14px 0 7px">실제로 도는 쿼리</p>
      <pre class="sql"><span><i class="k">WITH</i> base <i class="k">AS</i> (</span><span>  <i class="k">SELECT</i> active <i class="k">FROM</i> mart_subs_daily</span><span>   <i class="k">WHERE</i> d = <i class="k">DATE_TRUNC</i>(<i class="s">&#x27;month&#x27;</i>, <i class="k">CURRENT_DATE</i>)</span><span>), quit <i class="k">AS</i> (</span><span>  <i class="k">SELECT</i> <i class="k">COUNT</i>(*) <i class="k">AS</i> n <i class="k">FROM</i> subscription_events</span><span>   <i class="k">WHERE</i> kind = <i class="s">&#x27;CANCEL_BY_USER&#x27;</i>                <i class="c">-- 결제 실패는 여기 안 들어옵니다</i></span><span>     <i class="k">AND</i> at <i class="k">BETWEEN</i> <i class="k">DATE_TRUNC</i>(<i class="s">&#x27;month&#x27;</i>, <i class="k">CURRENT_DATE</i>) <i class="k">AND</i> <i class="k">CURRENT_DATE</i></span><span>)</span><span><i class="k">SELECT</i> <i class="k">ROUND</i>(quit.n::numeric / <i class="k">NULLIF</i>(base.active, <i class="n">0</i>) * <i class="n">100</i>, <i class="n">2</i>) <i class="k">AS</i> churn_pct</span><span>  <i class="k">FROM</i> base, quit;</span></pre>
      <div class="note note--amber" style="margin-top:13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><b>자주 어긋나는 지점.</b> 둘을 합쳐서 하나로 보면 <b>무엇을 고쳐야 할지 알 수 없습니다.</b> 해지 버튼은 상품 문제고 결제 실패는 카드 문제입니다. 지난 분기 이탈의 41%가 카드 만료였습니다 — 메뉴를 고칠 뻔했습니다.</div>
      </div>
    </div>
  </div>
</template>
  </div>
</template>

<template x-if="view==='recon'">

      <span class="pill pill--ok">남는 차이 0원</span>

      <div>"대시보드 매출이랑 통장 입금이 왜 달라요" 는 대시보드를 만들면 <b>반드시</b> 나오는 질문입니다.

        달라야 정상이고, 중요한 건 <b>왜 다른지 한 줄씩 댈 수 있는가</b>입니다.</div>

      <p>보기 좋은 화면은 하루면 만듭니다. 어려운 쪽은 그 화면이 <b>내일 아침에도 맞는 숫자를 들고 있게</b> 만드는 것입니다.
        원천이 여섯이고 그중 하나는 사람입니다. 그래서 수집·정제·집계·캐시를 먼저 세우고 화면은 마지막에 붙였습니다.</p>

      <div class="hr"></div>
      <h3>정의를 먼저, 화면은 그다음</h3>
      <p>회의에서 숫자가 안 맞는 이유는 대개 계산이 틀려서가 아니라 <b>서로 다른 것을 세고 있어서</b>입니다.
        지표마다 한 문장 정의와 <code>세는 것 / 안 세는 것</code> 목록, 실제 쿼리, 주인을 붙여 두었습니다.
        화면의 숫자를 누르면 바로 그 정의로 갑니다.</p>
      <dl>
        <dt>손잡이는 두되, 기본값을 못박습니다</dt>
        <dd>환불 뺀 · 테스트 뺀 · 부가세 별도. 다른 값으로 본 화면에는 "기본 정의와 다름" 이 붙습니다.</dd>
        <dt>주인이 없는 지표는 만들지 않습니다</dt>
        <dd>물어볼 사람이 없는 숫자는 반년 뒤에 아무도 못 믿습니다.</dd>
      </dl>

        그날 오전이 통째로 날아갑니다. 그래서 그날은 막대를 그리지 않고 빗금으로 비워 두고,
        위에 왜 비었는지와 <b>다시 받는 단추</b>를 답니다.</p>

      <div class="hr"></div>

      <p>오프라인 팝업 매출만 담당자가 월요일에 시트로 넣습니다. 자동으로 들어오는 숫자와 나란히 두면
        똑같아 보이지만 성격이 다릅니다. <b>사람도 파이프라인의 한 단계로 취급하고</b>, 늦으면 담당자에게 먼저 알립니다.</p>

        대신 <b>모든 숫자 옆에 언제 센 값인지</b>를 붙입니다 — "지금 이 숫자는 3분 전 값입니다" 를 알면

      <p>PG 정산은 <code>D+2</code> 에 확정됩니다. 최근 이틀 숫자는 나중에 바뀝니다.
        이걸 안 적어 두면 "어제 봤을 때랑 다른데요" 가 매주 나옵니다.</p>

      <div class="hr"></div>
      <h3>경보는 적을수록 읽힙니다</h3>
      <p>많이 우는 경보는 사람을 지치게 하고, 지친 사람은 알림을 끄는 게 아니라 <b>읽지 않게 됩니다.</b>
        경보를 만들기 전에 세 가지를 묻습니다 — 울리면 누가 무엇을 하는가, 새벽에 깨워도 되는가,

        <b>기간 · 정의 · 채널 · 집계 시각</b>을 같이 적습니다. 숫자만 있는 파일은 반드시 오해를 만듭니다.</p>

      <div class="hr"></div>
      <h3>이 데모에 없는 것</h3>

        실제 프로젝트에서는 이 자리에 수집 작업 스케줄러, 창고, 집계 배치, 캐시,
        그리고 <b>매달 마감 다음 날 이 화면을 열어 보는 사람</b>이 있습니다.</p>

  var x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

  var x = new Date(2026, 8, 1);              /* 오늘은 2026-09-01 로 못박는다 */
  x.setDate(x.getDate() - back);

    ],

    /* ── 숫자 만들기 ──────────────────────────────────────── */
    /* back = 1 이면 어제. 채널별로 따로 만들고, 합이 그날 매출이 된다. */
    revCh(back, ci){
      var dw = dayOf(back).getDay();
      var grow = Math.pow(0.99925, back);
      var base = 38200000 * CH[ci].w * grow * WK_REV[dw];
      return Math.round(base * (0.90 + rnd(back * 5 + ci) * 0.20) / 1000) * 1000;
    },
    ordCh(back, ci){
      var dw = dayOf(back).getDay();
      var grow = Math.pow(0.99930, back);
      var base = 1120 * CH[ci].w * grow * WK_ORD[dw];
      return Math.round(base * (0.92 + rnd(back * 7 + ci + 3) * 0.16));
    },
    /* 고른 채널만 더한다 */
    pick(){
      if(this.ch === "all") return [0, 1, 2, 3];
      for(var i = 0; i < CH.length; i++) if(CH[i].k === this.ch) return [i];
      return [0, 1, 2, 3];
    },
    rawRev(back){
      var self = this, s = 0;
      this.pick().forEach(function(i){ s += self.revCh(back, i); });
      return s;
    },
    rawOrd(back){
      var self = this, s = 0;
      this.pick().forEach(function(i){ s += self.ordCh(back, i); });
      return s;
    },
    /* 손잡이 세 개가 곱해지는 자리. 정의가 숫자를 만든다. */
    get adj(){
      return (this.d.refund ? 0.966 : 1) * (this.d.test ? 0.992 : 1) * (this.d.vat ? 1.1 : 1);
    },
    get defOff(){ return !(this.d.refund && this.d.test && !this.d.vat); },
    rev(back){ return Math.round(this.rawRev(back) * this.adj); },

    /* 어제(back=1)는 쿠팡이 안 들어와 집계 행이 없다 */
    get gapDay(){ return this.sources.filter(function(s){ return s.s === "fail"; }).length > 0; },
    get failCount(){ return this.sources.filter(function(s){ return s.s === "fail"; }).length; },
    isGap(back){ return this.gapDay && back === 1; },

    get days(){
      var out = [], self = this;
      for(var b = this.range; b >= 1; b--) out.push({ back:b, gap:self.isGap(b) });
      return out;
    },
    cmpBack(back){ return this.cmp === "prev" ? back + this.range : back + 364; },

    get sum(){
      var self = this, s = 0;
      this.days.forEach(function(x){ if(!x.gap) s += self.rev(x.back); });
      return s;
    },
    get rawSum(){
      var self = this, s = 0;
      this.days.forEach(function(x){ if(!x.gap) s += self.rawRev(x.back); });
      return s;
    },
    /* 빠진 날은 비교 쪽에서도 뺀다. 안 그러면 27일과 28일을 견주게 되고,
       "매출이 떨어졌다" 는 잘못된 결론이 나온다. */
    get cmpSum(){
      var self = this, s = 0;
      this.days.forEach(function(x){ if(!x.gap) s += self.rev(self.cmpBack(x.back)); });
      return s;
    },
    get orders(){
      var self = this, s = 0;
      this.days.forEach(function(x){ if(!x.gap) s += self.rawOrd(x.back); });
      return Math.round(s * (this.d.test ? 0.992 : 1));
    },
    get cmpOrders(){
      var self = this, s = 0;
      this.days.forEach(function(x){ if(!x.gap) s += self.rawOrd(self.cmpBack(x.back)); });
      return Math.round(s * (this.d.test ? 0.992 : 1));
    },
    get aov(){ return this.orders ? Math.round(this.sum / this.orders) : 0; },
    get cmpAov(){ return this.cmpOrders ? Math.round(this.cmpSum / this.cmpOrders) : 0; },

    subsAt(back){ return Math.round(18420 * Math.pow(0.99940, back)); },
    get subs(){ return this.subsAt(0); },
    get churn(){ return 3.12; },
    get cmpChurn(){ return this.cmp === "prev" ? 3.44 : 4.06; },

    get adCost(){ return Math.round(this.sum * 0.215 / 1000) * 1000; },
    get adRev(){ return Math.round(this.sum * 0.63 / 1000) * 1000; },
    get roas(){ return this.adCost ? this.adRev / this.adCost : 0; },

    /* ── 화면에 쓰는 모양 ─────────────────────────────────── */
    won(n){ return Math.round(n).toLocaleString(); },
    mny(n){
      if(n >= 100000000) return (n / 100000000).toFixed(n >= 1000000000 ? 1 : 2) + "억";
      if(n >= 10000) return Math.round(n / 10000).toLocaleString() + "만";
      return Math.round(n).toLocaleString();
    },
    pctOf(a, b){ return b ? (a / b * 100).toFixed(1) + "%" : "—"; },
    delta(now, was){
      if(!was) return { dir:"flat", arrow:"up", delta:"—" };
      var p = (now - was) / was * 100;
      return {
        dir: Math.abs(p) < 0.15 ? "flat" : (p > 0 ? "up" : "down"),
        arrow: p >= 0 ? "up" : "down",
        delta: (p >= 0 ? "+" : "") + p.toFixed(1) + "%"
      };
    },
    /* 이탈률은 내려가는 게 좋은 숫자다. 색만 뒤집고 화살표는 그대로 둔다. */
    deltaInv(now, was){
      var x = this.delta(now, was);
      if(x.dir === "up") x.dir = "down"; else if(x.dir === "down") x.dir = "up";
      return x;
    },
    spark(fn){
      var n = Math.min(24, this.range), pts = [], vs = [], self = this;
      var step = Math.max(1, Math.floor(this.range / n));
      for(var b = this.range; b >= 1; b -= step) vs.push(fn.call(self, b));
      var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), sp = (hi - lo) || 1;
      vs.forEach(function(v, i){
        pts.push((i / Math.max(1, vs.length - 1) * 120).toFixed(1) + "," + (24 - (v - lo) / sp * 22).toFixed(1));
      });
      return pts.join(" ");
    },
    fresh(hit){
      if(hit && this.gapDay) return { t:"true", s:"어제 빠짐 · 04:12" };
      if(hit) return { t:"false", s:"자동 · " + this.cacheAt };
      return { t:"false", s:"자동 · 오늘 06:00" };
    },

    get kpis(){
      var self = this;
      var a = this.delta(this.sum, this.cmpSum);
      var b = this.delta(this.orders, this.cmpOrders);
      var c = this.delta(this.aov, this.cmpAov);
      var e = this.delta(this.subs, this.subsAt(this.cmp === "prev" ? this.range : 364));
      var f = this.deltaInv(this.churn, this.cmpChurn);
      return [
        { id:"revenue", name:"매출",       unit:"원", v:this.mny(this.sum),          dir:a.dir, arrow:a.arrow, delta:a.delta,
          spark:this.spark(function(x){ return this.rev(x); }),    fresh:this.fresh(true) },
        { id:"orders",  name:"주문 수",     unit:"건", v:this.orders.toLocaleString(), dir:b.dir, arrow:b.arrow, delta:b.delta,
          spark:this.spark(function(x){ return this.rawOrd(x); }), fresh:this.fresh(true) },
        { id:"aov",     name:"객단가",      unit:"원", v:this.won(this.aov),           dir:c.dir, arrow:c.arrow, delta:c.delta,
          spark:this.spark(function(x){ return Math.round(this.rev(x) / Math.max(1, this.rawOrd(x))); }), fresh:this.fresh(true) },
        { id:"subs",    name:"활성 구독자",  unit:"명", v:this.subs.toLocaleString(),   dir:e.dir, arrow:e.arrow, delta:e.delta,
          spark:this.spark(function(x){ return this.subsAt(x); }), fresh:this.fresh(false) },
        { id:"churn",   name:"이탈률",      unit:"%",  v:this.churn.toFixed(2),        dir:f.dir, arrow:f.arrow, delta:f.delta,
          spark:this.spark(function(x){ return 3.6 - x * 0.004 + rnd(x) * 0.2; }),     fresh:this.fresh(false) }
      ];
    },

    get chLabel(){
      if(this.ch === "all") return "전체 채널";
      for(var i = 0; i < CH.length; i++) if(CH[i].k === this.ch) return CH[i].n;
      return "전체 채널";
    },
    get chRows(){
      var self = this, out = [];
      this.pick().forEach(function(i){
        var rv = 0, od = 0;
        self.days.forEach(function(x){
          if(x.gap) return;
          rv += Math.round(self.revCh(x.back, i) * self.adj);
          od += self.ordCh(x.back, i);
        });
        od = Math.round(od * (self.d.test ? 0.992 : 1));
        out.push({ k:CH[i].k, n:CH[i].n, c:CH[i].c, hand:!!CH[i].hand,
                   rev:rv, ord:od, aov:od ? Math.round(rv / od) : 0,
                   share:self.sum ? rv / self.sum * 100 : 0 });
      });
      return out;
    },
    get subRows(){
      return [
        { n:"활성 구독자",       v:this.subs.toLocaleString(), d:"+2.1%",  up:true },
        { n:"이번 달 신규",      v:"1,284",                    d:"+6.4%",  up:true },
        { n:"해지 (버튼)",       v:"586",                      d:"−4.2%",  up:true },
        { n:"결제 실패 이탈",    v:"214",                      d:"+11.8%", up:false }
      ];
    },

    /* ── 그림 ─────────────────────────────────────────────── */
    get yMax(){
      var self = this, hi = 0;
      this.days.forEach(function(x){
        hi = Math.max(hi, x.gap ? 0 : self.rev(x.back), self.rev(self.cmpBack(x.back)));
      });
      var step = Math.pow(10, String(Math.round(hi)).length - 2);
      return Math.max(step, Math.ceil(hi / step) * step) * 1.06;
    },
    yOf(v){ return 208 - (v / this.yMax) * 194; },
    get grid(){
      var out = [], self = this;
      for(var i = 0; i <= 4; i++){
        var v = this.yMax * i / 4;
        out.push({ y:+this.yOf(v).toFixed(1), t:i ? self.mny(v) : "0" });
      }
      return out;
    },
    get bars(){
      var ds = this.days, n = ds.length, self = this;
      var x0 = 46, x1 = 892, step = (x1 - x0) / n;
      var w = Math.max(2, step - (n > 40 ? 1.4 : (n > 12 ? 3 : 14)));
      var every = Math.ceil(n / 8);
      return ds.map(function(x, i){
        var v = x.gap ? 0 : self.rev(x.back);
        var cx = x0 + step * i + step / 2;
        var dt = dayOf(x.back);
        return {
          i: i, gap: x.gap, back: x.back, v: v,
          x: +(cx - w / 2).toFixed(1), cx: +cx.toFixed(1), w: +w.toFixed(1),
          y: +self.yOf(v).toFixed(1), h: +Math.max(0, 208 - self.yOf(v)).toFixed(1),
          sx: +(x0 + step * i).toFixed(1), sw: +step.toFixed(1),
          tick: (n - 1 - i) % every === 0,
          label: (dt.getMonth() + 1) + "/" + dt.getDate()
        };
      });
    },
    /* svg 안에 <template> 을 두면 x-for 가 안 돈다. 통째로 만들어 x-html 로 붙인다. */
    get chartSvg(){
      var out = '<svg class="chart" viewBox="0 0 900 230" preserveAspectRatio="xMidYMid meet"'
              + ' role="img" aria-label="일별 매출 막대 그래프">';
      this.grid.forEach(function(g){
        out += '<line class="gr" x1="46" y1="' + g.y + '" x2="892" y2="' + g.y + '"></line>'
             + '<text x="40" y="' + (g.y + 3) + '" text-anchor="end">' + g.t + '</text>';
      });
      this.bars.forEach(function(b){
        out += b.gap
          ? '<rect class="gap" x="' + b.x + '" y="14" width="' + b.w + '" height="194" rx="1.5" stroke-dasharray="3 3"></rect>'
          : '<rect class="bar" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="1.5"></rect>';
      });
      out += '<polyline class="ln" points="' + this.cmpLine + '" stroke-dasharray="4 3"></polyline>';
      this.bars.forEach(function(b){
        if(b.tick) out += '<text x="' + b.cx + '" y="222" text-anchor="middle">' + b.label + '</text>';
      });
      this.bars.forEach(function(b){
        out += '<rect class="hit" data-i="' + b.i + '" x="' + b.sx + '" y="12" width="' + b.sw + '" height="196"></rect>';
      });
      return out + '</svg>';
    },
    onHover(e){
      var t = e.target;
      if(!t || !t.getAttribute) return;
      var i = t.getAttribute("data-i");
      this.tip = (i === null) ? null : this.tipOf(this.bars[+i]);
    },
    get cmpLine(){
      var self = this;
      return this.bars.map(function(b){
        return b.cx.toFixed(1) + "," + self.yOf(self.rev(self.cmpBack(b.back))).toFixed(1);
      }).join(" ");
    },
    tipOf(b){
      var was = this.rev(this.cmpBack(b.back));
      var dt = dayOf(b.back), wk = "일월화수목금토"[dt.getDay()];
      var day = (dt.getMonth() + 1) + "월 " + dt.getDate() + "일 (" + wk + ")";
      if(b.gap){
        return { l:(b.cx / 900) * 100, day:day,
                 body:"<b>아직 안 들어옴</b><br>쿠팡 수집 실패로 이 날 행을 만들지 않았습니다." };
      }
      var p = was ? (b.v - was) / was * 100 : 0;
      return { l:(b.cx / 900) * 100, day:day,
               body:"매출 <b>" + this.won(b.v) + "</b>원<br>"
                  + (this.cmp === "prev" ? "직전" : "작년") + " <b>" + this.won(was) + "</b>원 "
                  + "(" + (p >= 0 ? "+" : "") + p.toFixed(1) + "%)" };
    },

    /* ── 숫자 맞추기 ──────────────────────────────────────── */
    get recRows(){
      if(this.rec === "pg") return [
        { n:"부가세", v:114860000, d:"PG 는 실제로 긁힌 총액을 봅니다. 우리는 상품 금액만 셉니다." },
        { n:"배송비 매출", v:38200000, d:"배송비는 매출에서 따로 셉니다. 카드에는 함께 긁힙니다." },
        { n:"PG 수수료", v:-36100000, d:"카드·간편결제 요율이 달라 평균이 아니라 정산서의 실제 합계를 씁니다." },
        { n:"8/30~8/31 결제분", v:-72400000, d:"D+2 정산이라 이 이틀치는 9월에 입금됩니다." },
        { n:"7/30~7/31 결제분", v:68900000, d:"반대로 지난달 말일치가 8월에 들어왔습니다." },
        { n:"취소 반영 시차", v:-4300000, d:"8월 말에 접수된 취소가 9월 정산에서 차감됩니다." }
      ];
      return [
        { n:"배송비 매출", v:38200000, d:"회계는 배송비도 매출로 인식합니다." },
        { n:"9월 배송분 선수금", v:-96300000, d:"8월에 받았지만 9월에 나가는 정기배송 회차. 받은 날이 아니라 나간 날에 인식합니다." },
        { n:"8월 배송분 (7월 수금)", v:88100000, d:"반대로 7월에 받고 8월에 나간 회차가 여기 들어옵니다." },
        { n:"쿠폰 할인액", v:21400000, d:"우리는 실결제액만 셉니다. 회계는 총액을 매출로 잡고 할인은 판매촉진비로 뺍니다." },
        { n:"팝업 위탁 총액", v:-9800000, d:"위탁 판매라 총액이 아니라 수수료만 매출로 인식합니다." }
      ];
    },
    get recSum(){
      return this.recRows.reduce(function(a, r){ return a + r.v; }, 1148600000);
    },

    /* ── 경보 ─────────────────────────────────────────────── */
    get onAlerts(){ return this.alerts.filter(function(a){ return a.on; }).length; },
    get onBad(){ return this.alerts.filter(function(a){ return a.on && a.hits > 30; }).length > 0; },
    toggleAlert(a){
      a.on = !a.on;
      if(a.on && a.hits > 30) this.toast(a.n + " — 지난 90일에 " + a.hits + "번 울린 규칙입니다");
      else if(!a.on) this.toast(a.n + " 경보를 껐습니다");
    },

    /* ── 동작 ─────────────────────────────────────────────── */
    stamp(){
      this._cl = (this._cl + 3 + (this._tick % 4)) % 1440;
      var h = Math.floor(this._cl / 60), m = this._cl % 60;
      return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    },
    toast(m){
      this.msg = m; this.msgOn = true;
      clearTimeout(this._mt);
      var self = this;
      this._mt = setTimeout(function(){ self.msgOn = false; }, 3000);
    },
    get liveDays(){ return this.days.filter(function(x){ return !x.gap; }).length; },
    setRange(n){ this.range = n; this.tip = null; },
    openDef(id){ this.pickMetric = id; this.view = "defs"; },

    recalc(){
      if(this.calc) return;
      var self = this;
      this.calc = true;
      setTimeout(function(){
        self.calc = false;
        self._tick += 1;
        self.cacheAt = self.stamp();
        self.toast("다시 셌습니다 · 412만 행 · 1.4초");
      }, 900);
    },

    poke(s){
      if(s.s === "fail") return this.retry(s.k);
      if(s.s === "hand") return this.toast("이 칸은 담당자가 월요일에 시트로 넣습니다");
