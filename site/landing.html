/* ============================================================
   BEACON — 브랜드 · 랜딩 사이트 작업대

   랜딩 사이트 데모를 랜딩 사이트로만 만들면 보여줄 게 없다.
   예쁜 화면은 누구나 그린다. 넘기고 나서 무너지는 자리는 따로 있다.

   그래서 작업대를 만들었다. 왼쪽에 진짜 사이트가 돌아가고,
   오른쪽에서 카피를 고치면 미리보기 · 검색결과 · 공유카드가 같이 바뀐다.
   무엇을 넣으면 얼마나 느려지는지도 손잡이로 만져 볼 수 있다.

   하고 싶은 말 세 가지.
   1) 예쁜 것과 빠른 것은 고르는 게 아니라, 무엇을 안 넣을지 정하는 것이다.
   2) 검색에 어떻게 뜨는지는 나중에 보는 게 아니라 만들면서 보는 것이다.
   3) 글자 하나 바꾸려고 우리를 부르게 만들면 그 사이트는 6개월 뒤에 죽는다.
   ============================================================ */
:root{
  --bg:#101114;
  --panel:#17191D;
  --panel-2:#1D2025;
  --panel-3:#262A30;
  --line:#24272C;
  --line-2:#353A41;

  --ink:#E7E9EC;
  --ink-2:#9EA4AC;
  --ink-3:#6A717A;

  --lime:#B7E63B;   --lime-soft:rgba(183,230,59,.13);
  --sky:#63A8F0;    --sky-soft:rgba(99,168,240,.13);
  --rose:#F0637D;   --rose-soft:rgba(240,99,125,.13);
  --amber:#E9A93F;  --amber-soft:rgba(233,169,63,.13);

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.65;letter-spacing:-.013em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.04em;}

/* ---------- 조각 ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:33px;padding:0 13px;border-radius:7px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);
  transition:background .14s,border-color .14s,color .14s;
}
.b:hover{background:var(--panel-3);border-color:var(--ink-3);}
.b--a{background:var(--lime);border-color:var(--lime);color:#141A05;font-weight:700;}
.b--a:hover{background:#C6EF57;border-color:#C6EF57;}
.b--g{background:transparent;border-color:transparent;color:var(--ink-2);}
.b--g:hover{background:var(--panel-2);color:var(--ink);}
.b--sm{height:28px;padding:0 10px;font-size:12px;}
.b[disabled]{opacity:.4;cursor:not-allowed;}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--ok{background:var(--lime-soft);color:var(--lime);}
.pill--info{background:var(--sky-soft);color:var(--sky);}
.pill--warn{background:var(--amber-soft);color:var(--amber);}
.pill--bad{background:var(--rose-soft);color:var(--rose);}
.pill--idle{background:var(--panel-3);color:var(--ink-3);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;}
.note{
  display:flex;gap:10px;padding:13px 15px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.75;
}
.note svg{flex:none;margin-top:3px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--ok{background:var(--lime-soft);border-color:rgba(183,230,59,.28);}
.note--ok svg{color:var(--lime);}
.note--info{background:var(--sky-soft);border-color:rgba(99,168,240,.28);}
.note--info svg{color:var(--sky);}
.note--warn{background:var(--amber-soft);border-color:rgba(233,169,63,.3);}
.note--warn svg{color:var(--amber);}
.note--bad{background:var(--rose-soft);border-color:rgba(240,99,125,.3);}
.note--bad svg{color:var(--rose);}

/* ============================================================
   작업대 틀
   ============================================================ */
.app{display:flex;flex-direction:column;min-height:100dvh;}
.demo{
  flex:none;display:flex;align-items:center;gap:9px;padding:8px 20px;
  background:#0A0B0D;color:var(--ink-3);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);
}
.demo b{color:var(--ink-2);}
.demo .sp{flex:1;}
.demo a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;}
.demo a:hover{color:var(--lime);}
@media (max-width:760px){.demo span.hideS{display:none;}}

.top{
  flex:none;display:flex;align-items:center;gap:13px;height:54px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.mk{display:flex;align-items:center;gap:9px;flex:none;}
.mk__i{
  width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--lime);color:#141A05;
}
.mk__t{font-size:15.5px;font-weight:800;letter-spacing:-.05em;}
.mk__c{font-size:12px;color:var(--ink-3);font-weight:600;padding-left:10px;border-left:1px solid var(--line-2);}
.top .sp{flex:1;}
@media (max-width:860px){.mk__c{display:none;}}
/* 좁은 화면에서는 윗줄이 한 줄에 안 들어간다. 자르지 말고 줄을 바꾼다 */
@media (max-width:560px){
  .top{height:auto;padding:9px 14px;flex-wrap:wrap;row-gap:8px;}
  .top .pill{order:3;}
}

.nav{
  flex:none;display:flex;flex-wrap:wrap;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:12px 14px;white-space:nowrap;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.016em;
  display:flex;align-items:center;gap:7px;
}
.nav button:hover{color:var(--ink);}
.nav button[aria-current="true"]{color:var(--lime);font-weight:700;}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;background:var(--lime);}
.nav em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);}
.nav em[data-t="bad"]{color:var(--rose);}
.nav em[data-t="ok"]{color:var(--lime);}

.body{flex:1;min-height:0;}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 70px;}
@media (max-width:640px){.wrap{padding:15px 14px 60px;}}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.hd h2{font-size:20px;font-weight:800;letter-spacing:-.038em;}
.hd p{font-size:13px;color:var(--ink-3);}
.hd .sp{flex:1;}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr);}}

/* ============================================================
   미리보기 — 왼쪽에 진짜 사이트, 오른쪽에 손잡이
   ============================================================ */
.deck{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:14px;align-items:start;}
@media (max-width:1080px){.deck{grid-template-columns:minmax(0,1fr);}}

.chrome{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.chrome__b{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);}
.chrome__d{display:flex;gap:5px;flex:none;}
.chrome__d i{width:9px;height:9px;border-radius:50%;background:var(--line-2);}
.chrome__u{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:100px;
  background:var(--bg);border:1px solid var(--line);font-family:var(--m);font-size:11.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chrome__u svg{flex:none;color:var(--lime);}
.seg{display:inline-flex;padding:2px;background:var(--panel-3);border-radius:8px;gap:2px;flex:none;}
.seg button{
  border:0;background:none;border-radius:6px;padding:5px 11px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button[aria-current="true"]{background:var(--panel);color:var(--ink);font-weight:700;}
@media (max-width:620px){
  .chrome__b{flex-wrap:wrap;row-gap:8px;}
  .chrome__u{order:3;width:100%;flex:1 0 100%;}
}
.stage{background:#0B0C0E;padding:0;overflow:auto;height:min(66vh,620px);}
.stage[data-w="m"]{padding:18px 0;display:flex;justify-content:center;}
.frame{width:100%;background:#FBF8F3;}
.stage[data-w="m"] .frame{width:390px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 8px #1A1C20,0 24px 60px -20px #000;}

/* 편집 표시 */
.frame [data-edit]{position:relative;}
.frame[data-on="true"] [data-edit]{outline:1px dashed rgba(139,123,232,.75);outline-offset:3px;border-radius:3px;cursor:pointer;}
.frame[data-on="true"] [data-edit]:hover{background:rgba(139,123,232,.10);}
.frame[data-on="true"] [data-edit]::after{
  content:attr(data-edit);position:absolute;top:-9px;left:0;transform:translateY(-100%);
  background:#8B7BE8;color:#fff;font-family:var(--m);font-size:9.5px;font-weight:700;
  padding:1px 6px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity .14s;pointer-events:none;
}
.frame[data-on="true"] [data-edit]:hover::after{opacity:1;}
.frame[data-on="true"] [data-edit][data-sel="true"]{outline:2px solid #8B7BE8;background:rgba(139,123,232,.12);}

/* ── 고요 랜딩 ─────────────────────────────────────────── */
.lp{font-family:"Pretendard",system-ui,sans-serif;color:#171523;letter-spacing:-.018em;line-height:1.6;}
.lp *{box-sizing:border-box;}
.lp-nav{
  display:flex;align-items:center;gap:10px;padding:16px 40px;
  background:rgba(18,20,46,.55);position:relative;z-index:2;
}
.lp-nav b{font-size:17px;font-weight:800;letter-spacing:-.06em;color:#F6F3FF;}
.lp-nav em{font-style:normal;font-size:10.5px;font-weight:700;color:#B9AEF2;letter-spacing:.14em;margin-left:2px;}
.lp-nav .sp{flex:1;}
.lp-nav a{font-size:13px;font-weight:500;color:#D7D2EC;padding:0 9px;}
.lp-nav .go{
  background:#B9AEF2;color:#1A1638;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:700;margin-left:6px;
}
.lp[data-w="m"] .lp-nav{padding:13px 18px;}
.lp[data-w="m"] .lp-nav a{display:none;}

.lp-hero{
  position:relative;padding:78px 40px 86px;overflow:hidden;text-align:center;
  background:
    radial-gradient(120% 90% at 50% -20%,rgba(185,174,242,.42) 0%,rgba(185,174,242,0) 55%),
    linear-gradient(170deg,#12142E 0%,#221D4A 52%,#3A2C5E 100%);
  margin-top:-58px;padding-top:120px;
}
.lp[data-w="m"] .lp-hero{padding:96px 20px 56px;}
.lp-orb{
  position:absolute;left:50%;top:-120px;width:340px;height:340px;margin-left:-170px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFF8E7 0%,#F3E3C0 38%,#C9B48A 70%,rgba(201,180,138,0) 72%);
  opacity:.5;filter:blur(1px);
}
.lp-stars{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 78% 16%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 34% 62%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 62% 44%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 88% 68%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 22% 78%,#fff,transparent);}
.lp-hero__in{position:relative;z-index:1;max-width:720px;margin:0 auto;}
.lp-kick{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#C9BFF7;
  background:rgba(185,174,242,.15);border:1px solid rgba(185,174,242,.3);border-radius:100px;padding:5px 13px;margin-bottom:20px;
}
.lp-h1{font-size:52px;font-weight:850;letter-spacing:-.055em;line-height:1.16;color:#F8F5FF;}
.lp[data-w="m"] .lp-h1{font-size:34px;}
.lp-sub{font-size:16.5px;color:#CFC8E8;margin-top:16px;line-height:1.8;font-weight:400;}
.lp[data-w="m"] .lp-sub{font-size:14.5px;}
.lp-cta{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap;}
.lp-b1{background:#F6F3FF;color:#1A1638;border-radius:100px;padding:14px 28px;font-size:15px;font-weight:700;}
.lp-b2{border:1px solid rgba(246,243,255,.35);color:#EDE9F8;border-radius:100px;padding:14px 24px;font-size:15px;font-weight:600;}
.lp-fine{font-size:12px;color:#9F97C4;margin-top:14px;}

.lp-trust{display:flex;justify-content:center;gap:0;background:#171533;padding:0;}
.lp-trust div{flex:1;padding:20px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.07);}
.lp-trust div:last-child{border-right:0;}
.lp-trust b{display:block;font-family:var(--m);font-size:22px;font-weight:700;color:#F6F3FF;letter-spacing:-.04em;}
.lp-trust span{display:block;font-size:12px;color:#9F97C4;margin-top:3px;}
.lp[data-w="m"] .lp-trust b{font-size:18px;}

.lp-sec{padding:64px 40px;}
.lp[data-w="m"] .lp-sec{padding:40px 20px;}
.lp-sec__h{text-align:center;max-width:600px;margin:0 auto 36px;}
.lp-eyebrow{font-size:11.5px;font-weight:800;color:#8B7BE8;letter-spacing:.16em;margin-bottom:10px;}
.lp-h2{font-size:30px;font-weight:800;letter-spacing:-.045em;}
.lp[data-w="m"] .lp-h2{font-size:23px;}
.lp-lead{font-size:15px;color:#6B6580;margin-top:11px;line-height:1.8;}
.lp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:940px;margin:0 auto;}
.lp[data-w="m"] .lp-grid{grid-template-columns:1fr;}
.lp-card{background:#fff;border:1px solid #EBE5DC;border-radius:16px;padding:24px 22px;}
.lp-card i{
  display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-style:normal;
  background:#EFEBFC;color:#6C5CD4;margin-bottom:14px;
}
.lp-card b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.035em;}
.lp-card p{font-size:13.5px;color:#6B6580;margin-top:8px;line-height:1.8;}

.lp-quote{background:#F3EFE7;}
.lp-qs{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:940px;margin:0 auto;}
.lp[data-w="m"] .lp-qs{grid-template-columns:1fr;}
.lp-q{background:#fff;border-radius:16px;padding:24px 22px;border:1px solid #EBE5DC;}
.lp-q p{font-size:14.5px;line-height:1.85;color:#2E2A3D;}
.lp-q span{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:12.5px;color:#6B6580;}
.lp-q span i{width:26px;height:26px;border-radius:50%;background:#EFEBFC;color:#6C5CD4;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;}

.lp-price{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:720px;margin:0 auto;}
.lp[data-w="m"] .lp-price{grid-template-columns:1fr;}
.lp-p{background:#fff;border:1px solid #EBE5DC;border-radius:16px;padding:26px 24px;}
.lp-p[data-hot="true"]{border-color:#8B7BE8;box-shadow:0 0 0 3px #EFEBFC;position:relative;}
.lp-p[data-hot="true"]::after{
  content:"가장 많이 씁니다";position:absolute;top:-11px;left:24px;background:#8B7BE8;color:#fff;
  font-size:11px;font-weight:700;border-radius:100px;padding:3px 11px;
}
.lp-p b{display:block;font-size:14px;font-weight:800;color:#6C5CD4;}
.lp-p em{display:block;font-style:normal;font-size:34px;font-weight:850;letter-spacing:-.05em;margin-top:8px;}
.lp-p em s{text-decoration:none;font-size:14px;font-weight:600;color:#6B6580;margin-left:3px;}
.lp-p u{display:block;text-decoration:none;font-size:13px;color:#6B6580;margin-top:6px;}
.lp-p ul{margin:16px 0 0;padding:0;list-style:none;}
.lp-p li{font-size:13.5px;color:#3B3650;padding:5px 0 5px 20px;position:relative;}
.lp-p li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:4px;border-left:2px solid #6C5CD4;border-bottom:2px solid #6C5CD4;transform:rotate(-45deg);}
.lp-p .go{display:block;text-align:center;margin-top:18px;border-radius:100px;padding:12px;font-size:14px;font-weight:700;background:#EFEBFC;color:#4B3EA8;}
.lp-p[data-hot="true"] .go{background:#171523;color:#fff;}

.lp-faq{max-width:720px;margin:0 auto;}
.lp-f{border-bottom:1px solid #E5DFD5;padding:16px 0;}
.lp-f b{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:-.03em;}
.lp-f b s{text-decoration:none;margin-left:auto;color:#9C95AE;font-weight:400;}
.lp-f p{font-size:13.5px;color:#6B6580;margin-top:8px;line-height:1.85;}

.lp-end{
  text-align:center;padding:70px 40px;color:#F6F3FF;
  background:linear-gradient(160deg,#12142E,#33285A);
}
.lp[data-w="m"] .lp-end{padding:48px 20px;}
.lp-end h3{font-size:30px;font-weight:850;letter-spacing:-.05em;}
.lp[data-w="m"] .lp-end h3{font-size:23px;}
.lp-end p{font-size:14.5px;color:#CFC8E8;margin-top:12px;}
.lp-foot{background:#0E1024;color:#8A83AC;padding:26px 40px;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;}
.lp-foot .sp{flex:1;}
.lp[data-w="m"] .lp-foot{padding:20px;}

/* ── 오른쪽 손잡이 ─────────────────────────────────────── */
.side{display:flex;flex-direction:column;gap:12px;}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.pnl__h{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);}
.pnl__h b{font-size:12.5px;font-weight:800;letter-spacing:.01em;}
.pnl__h .sp{flex:1;}
.pnl__b{padding:12px 13px;}
.fld{margin-bottom:11px;}
.fld:last-child{margin-bottom:0;}
.fld label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px;}
.fld label u{text-decoration:none;margin-left:auto;font-family:var(--m);font-size:10.5px;}
.fld input,.fld textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;
  padding:8px 10px;font-size:13px;line-height:1.6;resize:vertical;
}
.fld input:focus,.fld textarea:focus{border-color:var(--lime);outline:none;}
.fld[data-sel="true"] input,.fld[data-sel="true"] textarea{border-color:#8B7BE8;box-shadow:0 0 0 2px rgba(139,123,232,.22);}
.cnt{font-family:var(--m);font-size:10.5px;color:var(--ink-3);}
.cnt[data-over="true"]{color:var(--rose);font-weight:700;}

/* ============================================================
   성능
   ============================================================ */
.gauge{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.ring{position:relative;width:112px;height:112px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;font-family:var(--m);
  font-size:30px;font-weight:800;letter-spacing:-.05em;
}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:820px){.mets{grid-template-columns:repeat(2,1fr);}}
.met{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;}
.met p{font-size:11.5px;color:var(--ink-3);font-weight:700;}
.met b{display:block;font-family:var(--m);font-size:23px;font-weight:800;letter-spacing:-.05em;margin-top:3px;}
.met b em{font-style:normal;font-size:13px;font-weight:700;color:var(--ink-2);margin-left:2px;}
.met s{display:block;text-decoration:none;font-size:11.5px;margin-top:4px;font-weight:600;}
.met[data-t="ok"] b{color:var(--lime);} .met[data-t="ok"] s{color:var(--lime);}
.met[data-t="warn"] b{color:var(--amber);} .met[data-t="warn"] s{color:var(--amber);}
.met[data-t="bad"] b{color:var(--rose);} .met[data-t="bad"] s{color:var(--rose);}
.met u{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);margin-top:7px;padding-top:7px;border-top:1px solid var(--line);}

.sw{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
.sw:last-child{border-bottom:0;}
.sw__s{
  flex:none;margin-top:2px;width:38px;height:21px;border-radius:100px;background:var(--line-2);
  position:relative;cursor:pointer;border:0;padding:0;transition:background .16s;
}
.sw__s::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .16s;}
.sw__s[aria-checked="true"]{background:var(--rose);}
.sw__s[aria-checked="true"]::after{transform:translateX(17px);}
.sw__t{flex:1;min-width:0;}
.sw__t b{display:block;font-size:13.5px;font-weight:700;}
.sw__t span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:1px;}
.sw__c{flex:none;text-align:right;font-family:var(--m);font-size:12px;color:var(--ink-3);}
.sw__c b{display:block;font-size:13px;font-weight:700;color:var(--rose);}

.bud{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;}
.bud:last-child{border-bottom:0;}
.bud span{flex:none;min-width:96px;color:var(--ink-2);}
.bud i{flex:1;height:7px;border-radius:100px;background:var(--panel-3);overflow:hidden;}
.bud i s{display:block;height:100%;background:var(--lime);text-decoration:none;transition:width .2s ease;}
.bud i s[data-over="true"]{background:var(--rose);}
.bud b{font-family:var(--m);font-size:11.5px;font-weight:700;min-width:104px;text-align:right;color:var(--ink-3);}

/* ============================================================
   검색
   ============================================================ */
.serp{background:#fff;border-radius:12px;padding:20px 22px;color:#202124;font-family:arial,"Pretendard",sans-serif;}
.serp__q{
  display:flex;align-items:center;gap:10px;border:1px solid #DFE1E5;border-radius:100px;padding:9px 16px;
  font-size:14px;color:#202124;margin-bottom:20px;
}
.serp__q svg{color:#9AA0A6;flex:none;}
.serp__r{max-width:600px;}
.serp__u{display:flex;align-items:center;gap:8px;font-size:12px;color:#202124;margin-bottom:3px;}
.serp__u i{width:22px;height:22px;border-radius:50%;background:#12142E;display:grid;place-items:center;font-style:normal;color:#B9AEF2;font-size:10px;font-weight:800;}
.serp__u span{display:block;font-size:12px;color:#5F6368;line-height:1.3;}
.serp__t{font-size:20px;line-height:1.3;color:#1A0DAB;margin:2px 0 3px;font-weight:400;}
.serp__d{font-size:14px;color:#4D5156;line-height:1.58;}
.serp__d b{font-weight:700;color:#4D5156;}
.serp__x{display:flex;gap:16px;margin-top:9px;}
.serp__x a{font-size:14px;color:#1A0DAB;}

.ogc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2);max-width:420px;}
.ogc__i{height:158px;position:relative;
  background:radial-gradient(110% 90% at 50% -10%,rgba(185,174,242,.5) 0%,rgba(185,174,242,0) 58%),linear-gradient(160deg,#12142E,#3A2C5E);
  display:grid;place-items:center;text-align:center;padding:0 22px;}
.ogc__i b{font-size:24px;font-weight:850;letter-spacing:-.05em;color:#F8F5FF;}
.ogc__i em{font-style:normal;display:block;font-size:11px;font-weight:700;color:#B9AEF2;letter-spacing:.16em;margin-bottom:9px;}
.ogc__t{padding:12px 14px;}
.ogc__t u{display:block;text-decoration:none;font-family:var(--m);font-size:11px;color:var(--ink-3);}
.ogc__t b{display:block;font-size:14px;font-weight:700;margin-top:3px;letter-spacing:-.025em;}
.ogc__t span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.6;}

.code{background:#0B0C0E;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.code__h{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);}
.code__f{font-family:var(--m);font-size:11px;color:var(--ink-3);}
.code__h .sp{flex:1;}
.code__b{margin:0;padding:11px 0;overflow-x:auto;font-family:var(--m);font-size:11.5px;line-height:1.75;color:var(--ink-2);}
.code__b>span{display:block;padding:0 14px;white-space:pre;min-width:max-content;}
.code__b i{font-style:normal;}
.code__b i.k{color:var(--sky);}
.code__b i.s{color:var(--lime);}
.code__b i.c{color:var(--ink-3);}

/* ============================================================
   고칠 수 있게 · 유입
   ============================================================ */
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);}
.tb{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;}
.tb th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:11px 13px;white-space:nowrap;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
.tb th.r,.tb td.r{text-align:right;}
.tb td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tb tbody tr:last-child td{border-bottom:0;}
.tb .mut{color:var(--ink-3);}
.tb .keep{white-space:nowrap;}
.tb b{font-weight:600;}

.fun{display:flex;flex-direction:column;gap:8px;}
.fstep{display:flex;align-items:center;gap:12px;}
.fstep span{flex:none;min-width:128px;font-size:13px;font-weight:600;}
.fstep i{flex:1;height:30px;border-radius:7px;background:var(--panel-3);overflow:hidden;position:relative;}
.fstep i s{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#8FCB2C);text-decoration:none;}
.fstep b{font-family:var(--m);font-size:12.5px;font-weight:700;min-width:96px;text-align:right;}
.fstep em{font-style:normal;font-family:var(--m);font-size:11px;color:var(--ink-3);min-width:52px;text-align:right;}

.doc h3{font-size:15px;font-weight:800;letter-spacing:-.026em;margin-bottom:8px;}
.doc h3::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--lime);margin:0 9px 3px 0;}
.doc p{font-size:13.5px;color:var(--ink-2);line-height:1.9;font-weight:350;}
.doc p + p{margin-top:9px;}
.doc code{font-family:var(--m);font-size:12px;color:var(--lime);background:var(--lime-soft);padding:1px 6px;border-radius:5px;}
.doc b{color:var(--ink);}

.toast{

}

<template x-if="view==='perf'">
  <div class="wrap">
    <div class="hd">
      <h2>성능</h2>
      <p>예쁜 것과 빠른 것은 고르는 게 아니라, 무엇을 안 넣을지 정하는 것입니다</p>
      <span class="sp"></span>
      <span class="pill pill--idle mono">4G · 중급 안드로이드 기준</span>
    </div>

    <div class="note" :class="score >= 90 ? 'note--ok' : (score >= 70 ? 'note--warn' : 'note--bad')" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div x-show="!on.img && !on.font && !on.tags">
        아무것도 안 넣은 상태입니다. <b>첫 화면이 <span x-text="lcp.toFixed(1)"></span>초에 뜹니다.</b>
        아래 세 개를 하나씩 켜 보세요 — 흔히 "이 정도는 넣어도 되죠?" 하고 들어오는 것들입니다.
      </div>
      <div x-show="on.img || on.font || on.tags">
        <b x-text="onCount + '개를 켰습니다.'"></b>
        첫 화면이 <b><span x-text="lcp.toFixed(1)"></span>초</b>, 전송량이 <b><span x-text="kb"></span>KB</b> 입니다.
        <span x-show="score < 70"><b>이 상태로 넘기면 모바일에서 절반이 뜨기 전에 나갑니다.</b></span>
        <span x-show="score >= 70">아직 견딜 만하지만, 셋 다 켜면 무너집니다.</span>
      </div>
    </div>

    <div class="two" style="margin-bottom:16px">
      <div class="card" style="padding:18px 20px">
        <div class="gauge">
          <div class="ring">
            <svg width="112" height="112" viewBox="0 0 112 112">
              <circle cx="56" cy="56" r="48" fill="none" stroke="var(--panel-3)" stroke-width="10"/>
              <circle cx="56" cy="56" r="48" fill="none" stroke-width="10" stroke-linecap="round"
                      :stroke="score >= 90 ? 'var(--lime)' : (score >= 70 ? 'var(--amber)' : 'var(--rose)')"
                      stroke-dasharray="301.6" :stroke-dashoffset="301.6 - 301.6 * score / 100"
                      style="transition:stroke-dashoffset .3s ease,stroke .2s ease"/>
            </svg>
            <b :style="score >= 90 ? 'color:var(--lime)' : (score >= 70 ? 'color:var(--amber)' : 'color:var(--rose)')" x-text="score"></b>
          </div>
          <div style="flex:1;min-width:160px">
            <p style="font-size:13.5px;font-weight:800;letter-spacing:-.03em">성능 점수</p>
            <p style="font-size:12.5px;color:var(--ink-3);line-height:1.75;margin-top:6px">
              계약서에 <b style="color:var(--ink)">90점 이상</b>이라고 적었습니다. 넘기고 나서 이 숫자가 떨어지면
              무엇 때문에 떨어졌는지 이 화면에서 바로 보입니다.
            </p>
          </div>
        </div>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="bud">
          <span>전송량</span>
          <i><s :data-over="kb > 300" :style="'width:' + Math.min(100, kb / 6) + '%'"></s></i>
          <b><span x-text="kb"></span> / 300KB</b>
        </div>
        <div class="bud">
          <span>자바스크립트</span>
          <i><s :data-over="js > 90" :style="'width:' + Math.min(100, js / 1.8) + '%'"></s></i>
          <b><span x-text="js"></span> / 90KB</b>
        </div>
        <div class="bud">
          <span>글꼴</span>
          <i><s :data-over="fontKb > 60" :style="'width:' + Math.min(100, fontKb / 1.2) + '%'"></s></i>
          <b><span x-text="fontKb"></span> / 60KB</b>
        </div>
        <div class="bud">
          <span>요청 수</span>
          <i><s :data-over="req > 30" :style="'width:' + Math.min(100, req * 2.5) + '%'"></s></i>
          <b><span x-text="req"></span> / 30개</b>
        </div>
      </div>
    </div>

    <div class="mets" style="margin-bottom:16px">
      <div class="met" :data-t="lcp <= 2.5 ? 'ok' : (lcp <= 4 ? 'warn' : 'bad')">
        <p>첫 화면이 뜨는 시간 (LCP)</p>
        <b><span x-text="lcp.toFixed(1)"></span><em>초</em></b>
        <s x-text="lcp <= 2.5 ? '좋음 · 2.5초 이하' : (lcp <= 4 ? '개선 필요' : '나쁨 · 4초 초과')"></s>
        <u>사람이 "안 뜨네" 라고 느끼기 시작하는 지점입니다.</u>

<template x-if="view==='note'">
  <div class="wrap doc">
    <div class="hd"><h2>정한 것</h2><p>화면보다 먼저 정한 것들</p></div>
    <div class="card" style="padding:22px 24px">
      <h3>예쁜 것과 빠른 것은 고르는 게 아닙니다</h3>
      <p>둘 중 하나를 고르라는 말은 대개 <b>무엇을 안 넣을지 정하지 않았다</b>는 뜻입니다.
        배경 영상, 웹폰트 네 벌, 채팅 위젯, 히트맵 — 하나씩 보면 다 그럴듯하고 합치면 첫 화면이 5초입니다.
        <code>전송량 300KB · 자바스크립트 90KB</code> 같은 숫자를 먼저 적어 두고, 넘으면 무언가를 뺍니다.</p>

      <div class="hr"></div>
      <h3>구조와 카피를 먼저 정합니다</h3>
      <p>디자인 시안부터 그리면 채울 글이 없어서 "혁신적인 솔루션" 같은 말이 들어갑니다.
        <b>무슨 순서로 무슨 말을 할지</b>를 먼저 정하고, 그 말이 들어갈 자리를 그립니다.
        섹션 순서를 정하는 회의가 시안 회의보다 오래 걸리는 게 정상입니다.</p>

      <div class="hr"></div>
      <h3>글자 하나는 우리를 부르지 않고 고칩니다</h3>
      <p>사이트가 죽는 가장 흔한 이유는 느려서가 아니라 <b>고칠 수 없어서</b>입니다.
        문구·가격·후기·FAQ·사진은 CMS 에서 바로 고치고 30초 뒤에 반영됩니다.
        지난 여섯 달에 75번 고쳤고 그중 <b>71번은 우리 없이</b> 처리됐습니다.</p>
      <dl>
        <dt>대신 구조는 잠급니다</dt>
        <dd>섹션 순서나 새 페이지는 우리가 합니다. 전부 열어 두면 반년 뒤에 아무도 못 고치는 사이트가 됩니다.</dd>
        <dt>글자 수를 세되 막지는 않습니다</dt>
        <dd>넘으면 빨갛게 알려 줍니다. 막으면 결국 우리에게 전화가 오고, 그러면 안 고치게 됩니다.</dd>
      </dl>

      <div class="hr"></div>
      <h3>검색결과는 만들면서 같이 봅니다</h3>
      <p>검색결과와 카톡 공유 카드는 <b>사이트를 열어 보기 전에 먼저 보는 화면</b>입니다.
        그런데 대개 마지막 날에 급하게 채웁니다. 여기서는 카피를 고치면 그 자리에서 같이 바뀌고,
        제목이 잘리는지도 바로 보입니다.</p>
      <p>공유 카드 그림은 글자를 그림에 그려 자동으로 만듭니다. 이미지를 따로 만들어 두면
        카피를 고쳤을 때 <b>카드만 옛날 문구로 남습니다.</b></p>

      <div class="hr"></div>
      <h3>순위는 약속하지 않습니다</h3>
      <p>우리가 할 수 있는 건 <b>걸리게 만들어 두는 것까지</b>입니다 — 주소 구조, 제목 규칙,
        구조화 데이터, 사이트맵, 속도. 순위는 글의 내용과 시간이 정합니다.
        한 달 만에 1등을 만들어 준다는 곳은 다른 걸 팔고 있습니다.</p>

      <div class="hr"></div>
      <h3>세는 것을 먼저 정합니다</h3>
      <p>측정 도구를 붙이는 것과 무엇을 셀지 정하는 것은 다른 일입니다.
        <b>사람이 하기를 바라는 행동 다섯 개</b>를 적고 그것만 셉니다.
        방문자 수는 늘 늘어나고, 늘 아무것도 알려 주지 않습니다.</p>
      <p>개인정보는 보내지 않습니다. 동의 전에는 쿠키를 심지 않고, 거절해도 사이트는 그대로 됩니다.
        <b>거절하면 안 되는 사이트는 그 자체가 문제입니다.</b></p>

      <div class="hr"></div>
      <h3>넘길 때 같이 드리는 것</h3>
      <p>파일 한 벌이 아니라 <b>고칠 수 있는 상태</b>를 넘깁니다 —
        CMS 계정, 되돌리기, 성능 예산이 걸린 배포 검사, 측정 대시보드, 그리고
        <code>어디를 어떻게 고치는지</code> 적은 두 장짜리 문서.
        영상 강의는 아무도 안 봅니다.</p>

      <div class="hr"></div>
      <h3>이 데모에 없는 것</h3>
      <p>서버도 CMS 도 붙어 있지 않습니다. 지표는 손잡이 위치로 계산한 값이고,
        새로고침하면 처음으로 돌아갑니다. 실제 프로젝트에서는 이 자리에
        Next.js, 헤드리스 CMS, 배포 파이프라인, 성능 검사, 측정 도구,
        그리고 <b>목요일 오후에 가격을 고치는 사장님</b>이 있습니다.</p>
    </div>
  </div>
</template>

<script>
/* ============================================================
   BEACON — 고요 GOYO 브랜드 사이트 작업대

   서버도 CMS 도 붙어 있지 않다. 지표는 손잡이 위치로 만든 값이다.
   보여주려는 건 점수가 아니라 연결이다 —
   카피를 고치면 미리보기 · 검색결과 · 공유카드가 같이 바뀌고,
   무엇을 넣으면 얼마나 느려지는지가 그 자리에서 보인다.
   ============================================================ */
window.beacon = function(){
  var clamp = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
  return {
    view: "view",
    dev: "d",
    editOn: false,
    sel: "",
    msg: "", msgOn: false,
    _mt: null,

    /* 사장님이 직접 고치는 자리 */
    c: {
      kick:  "수면 습관 앱",
      h1:    "잠들기 전 15분을 바꿉니다",
      sub:   "자는 법을 고치는 건 어렵습니다. 자기 전 15분이면 충분합니다. 호흡과 소리, 그리고 한 줄 기록.",
      cta2:  "7일 무료로",
      fine:  "카드 정보는 7일 뒤에 받습니다",
      price: "4,900원",
      end:   "안 맞으면 7일 안에 그냥 나가시면 됩니다. 묻지 않습니다."
    },

    /* 흔히 "이 정도는 넣어도 되죠?" 하고 들어오는 것들 */
    on: { img:false, font:false, tags:false },

    blocks: [
      { n:"히어로 제목 · 설명", who:"누구나", dep:false, lim:"제목 24자 · 설명 80자. 넘으면 빨갛게 알려 주되 막지는 않습니다" },
      { n:"버튼 문구", who:"누구나", dep:false, lim:"12자. 연결할 곳은 목록에서 고릅니다" },
      { n:"FAQ", who:"누구나", dep:false, lim:"개수 제한 없음. 구조화 데이터가 같이 나갑니다" },
      { n:"요금 · 가격", who:"운영", dep:false, lim:"숫자와 설명만. 플랜 개수는 못 바꿉니다" },
      { n:"후기", who:"운영", dep:false, lim:"최대 6개. 순서는 끌어서 바꿉니다" },
      { n:"사진 교체", who:"운영", dep:false, lim:"대체글이 필수입니다. WebP 세 크기로 자동 변환" },
      { n:"검색 제목 · 설명", who:"운영", dep:false, lim:"비워 두면 히어로 카피를 그대로 씁니다" },
      { n:"공지 띠", who:"운영", dep:false, lim:"켜고 끄기 · 기간 예약" },
      { n:"섹션 순서", who:"개발", dep:true, lim:"열어 두면 반드시 무너집니다" },
      { n:"새 페이지", who:"개발", dep:true, lim:"주소 규칙 · 사이트맵 · 내부 링크가 같이 걸립니다" },
      { n:"성능 예산", who:"개발", dep:true, lim:"배포 검사에서 막습니다. 사람이 판단하지 않습니다" }
    ],

    funnel: [
      { n:"사이트 방문",      v:24180, p:"100%" },
      { n:"요금까지 내려봄",  v:11420, p:"47.2%" },
      { n:"시작 버튼 클릭",   v:3860,  p:"16.0%" },
      { n:"가입 완료",        v:1284,  p:"5.3%" }
    ],

    sources: [
      { n:"검색",            v:9840, c:612, r:6.2 },
      { n:"인스타그램",      v:5180, c:132, r:2.5 },
      { n:"직접 · 즐겨찾기", v:4120, c:198, r:4.8 },
      { n:"블로그 글",       v:3960, c:241, r:6.1 },
      { n:"추천 · 지인",     v:1080, c:101, r:9.4 }
    ],

    get editableN(){ return this.blocks.filter(function(x){ return x.who !== "개발"; }).length; },

    /* ── 성능 ─────────────────────────────────────────────── */
    /* 기준값은 아무것도 안 넣은 상태다. 켤 때마다 더한다. */
    get onCount(){ return (this.on.img ? 1 : 0) + (this.on.font ? 1 : 0) + (this.on.tags ? 1 : 0); },
    get kb(){ return 214 + (this.on.img ? 1840 : 0) + (this.on.font ? 420 : 0) + (this.on.tags ? 310 : 0); },
    get js(){ return 42 + (this.on.tags ? 268 : 0); },
    get fontKb(){ return 38 + (this.on.font ? 196 : 0); },
    get req(){ return 18 + (this.on.img ? 2 : 0) + (this.on.font ? 4 : 0) + (this.on.tags ? 9 : 0); },
    get lcp(){ return 1.1 + (this.on.img ? 2.4 : 0) + (this.on.font ? 0.9 : 0) + (this.on.tags ? 1.6 : 0); },
    get inp(){ return 90 + (this.on.tags ? 260 : 0); },
    get cls(){ return 0.02 + (this.on.img ? 0.09 : 0) + (this.on.font ? 0.05 : 0) + (this.on.tags ? 0.03 : 0); },
    get score(){
      var p = clamp((this.lcp - 1.0) * 10, 0, 45)
            + clamp((this.inp - 80) / 16, 0, 22)
            + clamp((this.cls - 0.02) * 120, 0, 18)
            + clamp((this.kb - 250) / 60, 0, 15);
      return Math.max(4, Math.round(100 - p));
    },

    /* ── 검색 ─────────────────────────────────────────────── */
    /* 따로 적게 하지 않는다. 히어로 카피가 그대로 제목이 된다.
       따로 적게 하면 카피를 고쳤을 때 여기만 옛날 문구로 남는다. */
    get seoTitle(){ return this.c.h1.replace(/\s+/g, " ").trim() + " · 고요 GOYO"; },
    get seoDesc(){ return this.c.sub.replace(/\s+/g, " ").trim(); },
    cut(s, n){ return (s && s.length > n) ? s.slice(0, n - 1) + "…" : (s || ""); },
    esc(s){
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    },
    get metaLines(){
      var t = this.esc(this.seoTitle), d = this.esc(this.seoDesc);
      var og = this.esc("/og?t=" + this.cut(this.c.h1, 22));
      return [
        '<i class="c">// 고친 글자가 여기까지 그대로 내려옵니다</i>',
        '<i class="k">export const</i> metadata = {',
        '  title:       <i class="s">"' + t + '"</i>,',
        '  description: <i class="s">"' + d + '"</i>,',
        '  alternates:  { canonical: <i class="s">"https://goyo.kr"</i> },',
        '  openGraph: {',
        '    title:       <i class="s">"' + t + '"</i>,',
        '    description: <i class="s">"' + d + '"</i>,',
        '    <i class="c">// 그림 파일을 따로 만들지 않고 글자를 그려서 만듭니다</i>',
        '    images: [<i class="s">"' + og + '"</i>],',
        '  },',
        '};'
      ];
    },

    /* ── 동작 ─────────────────────────────────────────────── */
    pick(k){
      if(!this.editOn) this.editOn = true;
      this.sel = k;
    },
    toast(m){
      this.msg = m; this.msgOn = true;
      clearTimeout(this._mt);
      var self = this;
      this._mt = setTimeout(function(){ self.msgOn = false; }, 3200);
    },
    publish(){
      if(this.score < 90){
        this.toast("성능 " + this.score + "점 — 배포 검사에서 막힙니다. 90점을 넘겨야 나갑니다");
        this.view = "perf";
        return;
      }
      this.toast("올렸습니다 · 30초 뒤 goyo.kr 에 반영 · 되돌리기는 언제든");
    }
  };
};
</script>
