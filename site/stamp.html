/* ============================================================
   STAMP — 한빛물산 사내 결재 · 지출 관리
   사내 업무 시스템 데모. 다른 두 견본과 일부러 결을 갈랐다.
   PALLET 은 하루 종일 보는 라이트 도구, MAT 은 따뜻한 소비자 앱,
   이쪽은 '서류'다. 종이 결재란과 도장을 그대로 화면으로 옮겼고,
   글자와 줄 간격을 촘촘하게 잡아 한 화면에 많이 담는다.

   축은 오른쪽 위의 역할 전환기다. 같은 화면이 신청자 · 팀장 ·
   경영지원 · 대표에게 각각 어떻게 달라지는지가 이 견본의 핵심이다.
   ============================================================ */
:root{
  --paper:#FAF9F6;
  --panel:#FFFFFF;
  --panel-2:#F5F4F0;
  --panel-3:#EFEDE7;
  --line:#E4E1D9;
  --line-2:#D2CEC3;

  --ink:#191C22;
  --ink-2:#565B67;
  --ink-3:#8A8F9B;

  --navy:#213A5C;
  --navy-2:#2C4C78;
  --navy-soft:#E9EEF5;

  --seal:#BE3A31;      --seal-soft:#FBEDEB;
  --ok:#1E7A4C;        --ok-soft:#E6F2EB;
  --warn:#B26A00;      --warn-soft:#FBF1DE;
  --pay:#0E6B70;       --pay-soft:#E2F0F0;

  --r:5px; --r-lg:8px;
  --sh-sm:0 1px 2px rgba(25,28,34,.06);
  --sh:0 4px 14px -4px rgba(25,28,34,.14);
  --sh-lg:0 20px 48px -14px rgba(25,28,34,.30);

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

  --top:52px; --nav:41px;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f);font-size:13.5px;line-height:1.6;letter-spacing:-.012em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.028em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:1px;border-radius:3px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.03em;}

/* ---------- 공통 조각 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 12px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  box-shadow:var(--sh-sm);transition:background .13s,border-color .13s,color .13s;
}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3);}
.btn--pri{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn--pri:hover{background:var(--navy-2);border-color:var(--navy-2);}
.btn--ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.btn--ok:hover{background:#1a6a42;border-color:#1a6a42;}
.btn--no{color:var(--seal);border-color:#E7ADA8;}
.btn--no:hover{background:var(--seal-soft);}
.btn--gh{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2);}
.btn--gh:hover{background:var(--panel-2);color:var(--ink);}
.btn--lg{height:38px;padding:0 16px;font-size:14px;}
.btn--sm{height:26px;padding:0 9px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.fld{display:flex;flex-direction:column;gap:5px;}
.fld > label{font-size:12.5px;font-weight:700;color:var(--ink-2);}
.fld input,.fld select,.fld textarea{
  height:34px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--panel);font-size:13.5px;width:100%;
}
.fld textarea{height:auto;padding:8px 10px;min-height:72px;resize:vertical;line-height:1.6;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px var(--navy-soft);}
.fld small{font-size:12px;color:var(--ink-3);}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:3px;
  font-size:11.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--wait{background:var(--panel-3);color:var(--ink-2);}
.pill--run {background:var(--navy-soft);color:var(--navy);}
.pill--ok  {background:var(--ok-soft);color:var(--ok);}
.pill--no  {background:var(--seal-soft);color:var(--seal);}
.pill--pay {background:var(--pay-soft);color:var(--pay);}
.pill--draft{background:var(--panel-3);color:var(--ink-3);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);}
.note{
  display:flex;gap:9px;padding:11px 13px;border-radius:var(--r-lg);
  background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.65;
}
.note svg{flex:none;margin-top:2px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--warn{background:var(--warn-soft);border-color:#EFD79E;}
.note--warn svg{color:var(--warn);}
.note--no{background:var(--seal-soft);border-color:#EFC3BE;}
.note--no svg{color:var(--seal);}

/* ============================================================
   윗줄 · 내비
   ============================================================ */
.top{
  position:sticky;top:0;z-index:40;height:var(--top);flex:none;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.mk{display:flex;align-items:center;gap:9px;flex:none;}
.mk__i{
  width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid var(--seal);color:var(--seal);font-size:11px;font-weight:800;transform:rotate(-8deg);
}
.mk__t{font-size:15px;font-weight:800;letter-spacing:-.04em;}
.mk__c{font-size:12px;color:var(--ink-3);font-weight:600;padding-left:9px;margin-left:2px;border-left:1px solid var(--line-2);}
.top__sp{flex:1;}
.srch{
  width:210px;height:31px;display:flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel-2);color:var(--ink-3);
}
.srch input{border:0;background:none;outline:none;font-size:12.5px;width:100%;padding:0;height:auto;}
@media (max-width:900px){.srch{display:none;}}

/* 역할 전환기 — 이 데모의 축 */
.who{position:relative;}
.who__b{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 7px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:100px;background:var(--panel);box-shadow:var(--sh-sm);
}
.who__b:hover{border-color:var(--ink-3);}
.who__av{
  width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;
}
.who__n{font-size:12.5px;font-weight:700;line-height:1.15;text-align:left;}
.who__n span{display:block;font-size:11px;color:var(--ink-3);font-weight:600;}
.who__m{
  position:absolute;right:0;top:40px;width:266px;z-index:60;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
  padding:5px;
}
.who__h{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:8px 9px 6px;letter-spacing:.02em;}
.who__i{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:var(--r);
  border:0;background:none;cursor:pointer;text-align:left;
}
.who__i:hover{background:var(--panel-2);}
.who__i[aria-current="true"]{background:var(--navy-soft);}
.who__i div{flex:1;min-width:0;}
.who__i b{display:block;font-size:13px;font-weight:700;}
.who__i span{display:block;font-size:11.5px;color:var(--ink-3);}
.who__i em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy);background:var(--navy-soft);border-radius:3px;padding:1px 6px;}
.who__f{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:8px 9px 4px;border-top:1px solid var(--line);margin-top:4px;}

.nav{
  position:sticky;top:var(--top);z-index:39;height:var(--nav);flex:none;
  display:flex;align-items:stretch;gap:1px;padding:0 12px;overflow-x:auto;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.nav::-webkit-scrollbar{height:0;}
.nav button{
  position:relative;border:0;background:none;cursor:pointer;padding:0 12px;white-space:nowrap;
  font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:-.016em;
  display:flex;align-items:center;gap:7px;
}
.nav button:hover{color:var(--ink);}
.nav button[aria-current="true"]{color:var(--navy);font-weight:700;}
.nav button[aria-current="true"]::after{
  content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--navy);
}
.nav em{
  font-style:normal;font-size:11px;font-weight:700;line-height:1;
  background:var(--seal);color:#fff;border-radius:100px;padding:2px 6px;
}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px;}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;}
.hd h1{font-size:20px;font-weight:800;letter-spacing:-.036em;}
.hd p{font-size:12.5px;color:var(--ink-3);}
.hd__sp{flex:1;}

/* ============================================================
   목록
   ============================================================ */
.tabs{display:flex;gap:3px;padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;}
.tabs button{
  height:29px;padding:0 12px;border:0;border-radius:5px;background:transparent;cursor:pointer;

.sheet__b{padding:16px 18px;display:flex;flex-direction:column;gap:16px;}
.sec__l{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;margin-bottom:7px;}

/* 결재란 — 종이 양식을 그대로 옮겼다 */
.appr{display:grid;border:1px solid var(--ink-3);border-right:0;background:var(--panel);}

.stamp{

.lines{width:100%;border-collapse:collapse;font-size:12.5px;}

}
.lines td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}

.hist__r:last-child::before{display:none;}
.hist__d{width:11px;height:11px;border-radius:50%;flex:none;margin-top:4px;background:var(--line-2);z-index:1;box-shadow:0 0 0 3px var(--panel);}
.hist__r[data-k="ok"] .hist__d{background:var(--ok);}

.hist__b{flex:1;min-width:0;}
.hist__b b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.016em;}
.hist__b span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.55;}
.hist__b em{font-style:normal;display:block;font-size:12px;color:var(--ink-2);margin-top:3px;
  background:var(--panel-2);border-left:2px solid var(--line-2);padding:4px 8px;border-radius:0 3px 3px 0;}

/* ============================================================
   결재선 규칙
   ============================================================ */
.rule{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
.rule:last-child{border-bottom:0;}
.rule__k{width:190px;flex:none;font-size:13px;font-weight:700;}

.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;}

  display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:100px;
  background:var(--navy-soft);color:var(--navy);font-size:12px;font-weight:700;
}
.chain i{color:var(--ink-3);font-style:normal;font-size:12px;}
.chain span[data-x="true"]{background:var(--panel-3);color:var(--ink-3);text-decoration:line-through;}

/* ============================================================
   감사 로그
   ============================================================ */
.log{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);}

  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:8px 10px;

}

.log__d code{font-family:var(--m);font-size:11.5px;background:var(--panel-2);border-radius:3px;padding:1px 5px;}
.diff{color:var(--ink-3);}
.diff b{color:var(--ink);font-weight:600;}

/* ============================================================
   엑셀 이관
   ============================================================ */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.steps div{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-3);}
.steps i{
  width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;
  font-size:11.5px;background:var(--panel-3);color:var(--ink-3);
}
.steps div[data-on="true"]{color:var(--ink);}
.steps div[data-on="true"] i{background:var(--navy);color:#fff;}
.steps div[data-done="true"] i{background:var(--ok);color:#fff;}
.steps u{width:26px;height:1.5px;background:var(--line-2);text-decoration:none;}

.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:var(--panel-2);
  padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:11px;
}

.drop b{font-size:14.5px;font-weight:700;}
.drop p{font-size:12.5px;color:var(--ink-3);line-height:1.7;}
.file{

  border-radius:var(--r-lg);background:var(--panel);
}
.file__i{width:32px;height:32px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none;}
.file b{display:block;font-size:13px;font-weight:700;}
.file span{display:block;font-size:11.5px;color:var(--ink-3);}

.map{width:100%;border-collapse:collapse;font-size:12.5px;}
.map th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:8px 10px;background:var(--panel-2);border-bottom:1px solid var(--line-2);}
.map td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.map__x{font-family:var(--m);font-size:12px;background:var(--panel-2);border-radius:3px;padding:2px 7px;}
.map__g{font-size:11px;font-weight:700;color:var(--ok);}
.map__g[data-low="true"]{color:var(--warn);}

.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

.chk div{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:12px 14px;}
.chk b{display:block;font-size:22px;font-weight:800;letter-spacing:-.04em;}
.chk span{font-size:12px;color:var(--ink-3);font-weight:600;}
.chk div[data-t="no"] b{color:var(--seal);}
.chk div[data-t="ok"] b{color:var(--ok);}
.bad{width:100%;border-collapse:collapse;font-size:12.5px;}
.bad th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:7px 10px;background:var(--panel-2);border-bottom:1px solid var(--line-2);}

.bad td.w{color:var(--ink-2);}

/* ============================================================
   옮기기 전 · 후
   ============================================================ */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:820px){.ba{grid-template-columns:1fr;}}
.ba__c{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;}
.ba__h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
.ba__c[data-k="old"] .ba__h{background:var(--seal-soft);color:var(--seal);}

.ba__b{padding:6px 0;}
.ba__s{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);}
.ba__s:last-child{border-bottom:0;}
.ba__s i{
  width:19px;height:19px;border-radius:50%;flex:none;margin-top:1px;display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:700;background:var(--panel-3);color:var(--ink-2);
}
.ba__s b{display:block;font-size:12.5px;font-weight:700;}
.ba__s span{display:block;font-size:12px;color:var(--ink-3);line-height:1.6;}
.xls{font-family:var(--m);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--ink-2);}
.cut{display:flex;flex-direction:column;}
.cut div{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.cut div:last-child{border-bottom:0;}
.cut b{flex:none;width:150px;font-size:12.5px;font-weight:700;}
.cut span{font-size:12.5px;color:var(--ink-2);line-height:1.65;}

/* ============================================================
   덮개
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(25,28,34,.42);border:0;width:100%;}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:71;

  background:var(--panel);border-radius:12px;box-shadow:var(--sh-lg);padding:20px;
}

.modal p{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.7;}

.modal__l i[data-t="ok"]{background:var(--ok-soft);color:var(--ok);}
.modal__l i[data-t="no"]{background:var(--panel-3);color:var(--ink-3);}
.modal__l b{font-weight:600;}
.modal__l span{margin-left:auto;color:var(--ink-3);font-size:11.5px;text-align:right;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:#fff;border-radius:7px;padding:10px 16px;
  font-size:13px;font-weight:600;box-shadow:var(--sh-lg);max-width:calc(100vw - 32px);
}

/* 데모임을 밝히는 띠 */
.demo{
  display:flex;align-items:center;gap:9px;padding:8px 14px;

}

.demo__sp{flex:1;}

     내비 — 보이는 메뉴부터 역할이 정한다
     ============================================================ -->
<nav class="nav">
  <template x-for="m in menu" :key="m.id">
    <button :aria-current="view===m.id || (view==='doc' && m.id==='inbox') || (view==='new' && m.id==='inbox')"
            @click="go(m.id)" x-show="can(m.perm)">
      <span x-text="m.name"></span>
      <em x-show="m.id==='inbox' && myTurnDocs.length" x-text="myTurnDocs.length"></em>
    </button>
  </template>
</nav>

<main class="wrap">

  <!-- ============================================================
       1. 결재함
       ============================================================ -->
  <template x-if="view==='inbox'">
    <div>
      <div class="hd">
        <h1>결재함</h1>
        <p x-text="'볼 수 있는 문서 ' + scopeDocs.length + '건'"></p>
        <span class="hd__sp"></span>
      </div>

      <div class="bar">
        <div class="tabs" role="tablist">
          <button role="tab" :aria-selected="box==='turn'" @click="box='turn';sel=[]">
            내가 결재할 것 <em x-text="myTurnDocs.length"></em>
          </button>
          <button role="tab" :aria-selected="box==='mine'" @click="box='mine';sel=[]">
            내가 올린 것 <em x-text="mineDocs.length"></em>
          </button>
          <button role="tab" :aria-selected="box==='all'" @click="box='all';sel=[]" x-show="can('doc.readAll') || can('doc.readTeam')">
            <span x-text="can('doc.readAll') ? '전체' : '우리 팀'"></span> <em x-text="scopeDocs.length"></em>
          </button>
        </div>
        <span class="bar__sp"></span>
        <select class="sel" x-model="fState" aria-label="상태">
          <option value="">상태 전체</option>
          <option value="draft">임시저장</option>
          <option value="run">진행 중</option>
          <option value="ok">승인</option>
          <option value="no">반려</option>
          <option value="pay">지급완료</option>
        </select>
        <select class="sel" x-model="fCat" aria-label="계정">
          <option value="">계정 전체</option>
          <option>접대비</option>
          <option>복리후생비</option>
          <option>여비교통비</option>
          <option>차량유지비</option>
          <option>소모품비</option>
          <option>수선비</option>
          <option>지급수수료</option>
          <option>광고선전비</option>
        </select>
      </div>

      <table class="tbl">
        <thead>
          <tr>
            <th style="width:34px" x-show="canBulk">
              <button class="ck" :data-on="allSel" :data-half="sel.length && !allSel" @click="toggleAll()" aria-label="모두 선택">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="sel.length && !allSel ? 'M5 12h14' : 'M4 12.5l5.5 5.5L20 6.5'"/></svg>
              </button>
            </th>
            <th class="nw hide-sm" style="width:118px">문서번호</th>
            <th>제목</th>
            <th class="nw" style="width:96px">상신자</th>
            <th class="nw hide-md" style="width:82px">계정</th>
            <th class="r nw" style="width:104px">금액</th>
            <th class="c nw hide-md" style="width:96px">결재선</th>
            <th class="nw" style="width:88px">상태</th>
            <th class="nw hide-sm" style="width:92px">상신일</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="d in listed" :key="d.id">
            <tr :data-sel="sel.indexOf(d.id) >= 0" @click="open(d)">
              <td x-show="canBulk" @click.stop>
                <button class="ck" :data-on="sel.indexOf(d.id) >= 0" @click="pick(d.id)" :aria-label="d.id + ' 선택'">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
                </button>
              </td>
              <td class="tbl__id mono hide-sm" x-text="d.id"></td>
              <td>
                <span class="tbl__t" x-text="d.title"></span>
                <span class="tbl__id mono only-sm" style="display:none" x-text="' ' + d.id.slice(4)"></span>
                <span class="tbl__mine" x-show="d.owner === me.id">내 문서</span>
                <span class="tbl__turn" x-show="isMyTurn(d)">내 차례</span>
              </td>
              <td class="nw" x-text="userName(d.owner)"></td>
              <td class="nw hide-md" x-text="d.cat"></td>
              <td class="r num nw" x-text="won(total(d))"></td>
              <td class="c nw hide-md" x-html="dots(d)"></td>
              <td class="nw"><span class="pill" :class="'pill--' + stateOf(d).k"><i></i><span x-text="stateOf(d).t"></span></span></td>
              <td class="tbl__id mono hide-sm" x-text="d.at.slice(5)"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p class="tbl__none" x-show="!listed.length" x-text="emptyText"></p>

      <div class="bulk" x-show="sel.length" x-transition>
        <b x-text="sel.length + '건 선택'"></b>
        <span class="bulk__sp"></span>
        <button class="btn btn--sm" @click="sel=[]">선택 해제</button>
        <button class="btn btn--sm btn--ok" @click="askBulk()">일괄 승인</button>
      </div>

      <div class="note" style="margin-top:14px" x-show="!can('doc.approve')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
        <div><b x-text="roles[me.role].label"></b> 은(는) 결재 권한이 없습니다. 올린 문서와 그 진행 상황만 봅니다.
          오른쪽 위에서 <b>팀장</b> 이나 <b>경영지원</b> 으로 바꾸면 같은 목록에 선택칸과 일괄 승인이 생깁니다.</div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       2. 문서
       ============================================================ -->
  <template x-if="view==='doc' && cur">
    <div>
      <div class="hd">
        <button class="btn btn--gh" @click="go('inbox')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          결재함
        </button>
        <span class="hd__sp"></span>
        <span class="pill" :class="'pill--' + stateOf(cur).k"><i></i><span x-text="stateOf(cur).t"></span></span>
      </div>

      <div class="doc">
        <div class="sheet">
          <div class="sheet__h">
            <h2 x-text="cur.title"></h2>
            <div class="sheet__m">
              <span>문서번호 <b class="mono" x-text="cur.id"></b></span>
              <span>상신자 <b x-text="userName(cur.owner) + ' · ' + userTeam(cur.owner)"></b></span>
              <span>상신일 <b class="mono" x-text="cur.at"></b></span>
              <span>계정 <b x-text="cur.cat"></b></span>
            </div>
          </div>

          <div class="sheet__b">
            <div>
              <p class="sec__l">결재란</p>
              <div class="appr" :style="'grid-template-columns:repeat(' + (cur.line.length + 1) + ',1fr)'">
                <div class="appr__c">
                  <div class="appr__h">신청</div>
                  <div class="appr__b">
                    <span class="stamp" x-text="userName(cur.owner)"></span>
                    <span class="appr__n" x-text="userName(cur.owner)"></span>
                  </div>
                </div>
                <template x-for="(s,i) in cur.line" :key="i">
                  <div class="appr__c">
                    <div class="appr__h" x-text="roles[s.role].label"></div>
                    <div class="appr__b">
                      <template x-if="s.state==='ok'">
                        <span class="stamp" x-text="userName(s.user)"></span>
                      </template>
                      <template x-if="s.state==='no'">
                        <span class="stamp stamp--sq">반려</span>
                      </template>
                      <template x-if="s.state==='skip'">
                        <span class="stamp stamp--wait">본인<br>건너뜀</span>
                      </template>
                      <template x-if="s.state==='wait'">
                        <span class="stamp stamp--wait" :class="turnIndex(cur)===i ? 'stamp--turn' : ''"
                              x-text="turnIndex(cur)===i ? '결재 대기' : '이후'"></span>
                      </template>
                      <span class="appr__n" x-text="userName(s.user) + (s.at ? ' · ' + s.at.slice(5,10) : '')"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <div>
              <p class="sec__l">지출 내역</p>
              <table class="lines">
                <thead>
                  <tr><th style="width:88px">일자</th><th>사용처</th><th class="r" style="width:110px">금액</th><th style="width:74px">증빙</th></tr>
                </thead>
                <tbody>
                  <template x-for="(it,i) in cur.items" :key="i">
                    <tr>
                      <td class="mono" x-text="it.d"></td>
                      <td><b style="font-weight:600" x-text="it.n"></b><small x-show="it.m" x-text="it.m"></small></td>
                      <td class="r num" x-text="won(it.a)"></td>
                      <td x-text="it.e || '카드'"></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot>
                  <tr><td colspan="2">합계</td><td class="r num" x-text="won(total(cur))"></td><td></td></tr>
                </tfoot>
              </table>
            </div>

            <div x-show="cur.att && cur.att.length">
              <p class="sec__l">첨부</p>
              <div class="att">
                <template x-for="a in (cur.att || [])" :key="a">
                  <span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5"/><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/></svg>
                    <span x-text="a"></span>
                  </span>
                </template>
              </div>
            </div>

            <div class="note" x-show="stateOf(cur).k==='no'">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
              <div><b>반려된 문서입니다.</b> 고쳐서 다시 올리면 새 문서번호가 붙고, 이 문서는 이력으로 남습니다.</div>
            </div>
          </div>
        </div>

        <aside class="side">
          <div class="side__c">
            <h3>내가 할 수 있는 것</h3>
            <div class="acts">
              <template x-if="isMyTurn(cur)">
                <button class="btn btn--ok btn--lg" @click="approve(cur)">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
                  승인
                </button>
              </template>
              <template x-if="isMyTurn(cur)">
                <button class="btn btn--no btn--lg" @click="openReject(cur)">반려</button>
              </template>
              <template x-if="canRecall(cur)">
                <button class="btn btn--lg" @click="ask={k:'recall'}">회수</button>
              </template>
              <template x-if="canPay(cur)">
                <button class="btn btn--pri btn--lg" @click="pay(cur)">지급 처리</button>
              </template>
              <template x-if="cur.draft && cur.owner === me.id">
                <button class="btn btn--pri btn--lg" @click="resubmit(cur)">상신하기</button>
              </template>
              <template x-if="!isMyTurn(cur) && !canRecall(cur) && !canPay(cur) && !(cur.draft && cur.owner === me.id)">
                <p style="font-size:12.5px;color:var(--ink-3);line-height:1.7" x-text="whyNothing(cur)"></p>
              </template>
            </div>
          </div>

          <div class="side__c">
            <h3>결재 이력</h3>
            <div class="hist">
              <template x-for="h in cur.hist" :key="h.id">
                <div class="hist__r" :data-k="h.k">
                  <span class="hist__d"></span>
                  <div class="hist__b">
                    <b x-text="h.who + ' · ' + h.act"></b>
                    <span x-text="h.t + (h.ip ? ' · ' + h.ip : '')"></span>
                    <em x-show="h.memo" x-text="h.memo"></em>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="side__c" x-show="can('audit.read')">
            <h3>이 문서의 결재선</h3>
            <p style="font-size:12.5px;color:var(--ink-2);line-height:1.7" x-text="lineWhy(cur)"></p>
            <p style="font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:8px">
              결재선은 <b>상신하는 순간</b> 굳습니다. 나중에 규칙을 바꿔도 이미 올라간 문서는 그대로 갑니다.
            </p>
          </div>
        </aside>
      </div>
    </div>
  </template>

  <!-- ============================================================
       3. 새 지출결의 — 결재선이 금액을 따라 움직인다
       ============================================================ -->
  <template x-if="view==='new'">
    <div>
      <div class="hd">
        <button class="btn btn--gh" @click="go('inbox')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          결재함
        </button>
        <span class="hd__sp"></span>
      </div>

      <div class="doc">
        <div class="sheet">
          <div class="sheet__h"><h2>지출결의 올리기</h2>
            <div class="sheet__m"><span>상신자 <b x-text="me.name + ' · ' + me.team"></b></span></div>
          </div>
          <div class="sheet__b">
            <div style="display:grid;grid-template-columns:1fr 180px;gap:12px">
              <div class="fld"><label for="nt">제목</label>
                <input id="nt" x-model="nd.title" placeholder="8월 거래처 접대비"></div>
              <div class="fld"><label for="nc">계정</label>
                <select id="nc" x-model="nd.cat">
                  <option>접대비</option>
                  <option>복리후생비</option>
                  <option>여비교통비</option>
                  <option>차량유지비</option>
                  <option>소모품비</option>
                  <option>수선비</option>
                  <option>지급수수료</option>
                  <option>광고선전비</option>
                </select></div>
            </div>

            <div>
              <p class="sec__l">지출 내역</p>
              <table class="lines">
                <thead><tr><th style="width:120px">일자</th><th>사용처</th><th class="r" style="width:130px">금액</th><th style="width:40px"></th></tr></thead>
                <tbody>
                  <template x-for="(it,i) in nd.items" :key="i">
                    <tr>
                      <td><input class="inp" type="date" x-model="nd.items[i].d" aria-label="일자"></td>
                      <td><input class="inp" x-model="nd.items[i].n" placeholder="상호" aria-label="사용처"></td>
                      <td><input class="inp" style="text-align:right" type="number" min="0" step="1000" x-model.number="nd.items[i].a" aria-label="금액"></td>
                      <td><button class="btn btn--gh btn--sm" @click="nd.items.splice(i,1)" x-show="nd.items.length>1" aria-label="줄 빼기">✕</button></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot><tr><td colspan="2">합계</td><td class="r num" x-text="won(ndTotal)"></td><td></td></tr></tfoot>
              </table>
              <button class="btn btn--sm" style="margin-top:8px" @click="nd.items.push({d:today,n:'',a:0})">+ 줄 추가</button>
            </div>

            <p class="err" x-show="ndErr" style="font-size:12.5px;color:var(--seal);font-weight:600" x-text="ndErr"></p>

            <div style="display:flex;gap:8px">
              <button class="btn btn--pri btn--lg" @click="submit()">상신</button>
              <button class="btn btn--lg" @click="saveDraft()">임시저장</button>
            </div>
          </div>
        </div>

        <aside class="side">
          <div class="side__c">
            <h3>이 문서가 탈 결재선</h3>
            <div class="chain" style="margin-bottom:10px">
              <span x-text="me.name + ' (신청)'"></span>
              <template x-for="(s,i) in ndLine" :key="i">
                <span style="display:contents">
                  <i>›</i>
                  <span :data-x="s.state==='skip'" x-text="userName(s.user) + ' (' + roles[s.role].label + ')'"></span>
                </span>
              </template>
            </div>
            <p style="font-size:12.5px;color:var(--ink-2);line-height:1.7" x-text="lineWhyFor(ndTotal, nd.cat, ndLine)"></p>
            <p style="font-size:11.5px;color:var(--ink-3);line-height:1.65;margin-top:9px">
              금액을 바꾸면 결재선이 바로 다시 그려집니다. 사람이 고르지 않으니 "이번엔 팀장만 받고 넘어가자" 가 생기지 않습니다.
            </p>
          </div>
        </aside>
      </div>
    </div>
  </template>

  <!-- ============================================================
       4. 결재선 규칙
       ============================================================ -->
  <template x-if="view==='rules'">
    <div>
      <div class="hd">
        <h1>결재선 규칙</h1>
        <p>금액과 계정이 결재선을 정합니다</p>
        <span class="hd__sp"></span>
        <span class="pill" x-show="!can('rule.write')">읽기 전용</span>
      </div>

      <div class="note" style="margin-bottom:14px" x-show="!can('rule.write')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        <div>규칙을 고칠 수 있는 사람은 <b>대표</b> 뿐입니다. 결재선을 아무나 바꿀 수 있으면 결재선이 있으나 마나 하기 때문입니다.</div>
      </div>

      <div class="card">
        <template x-for="(r,i) in rules" :key="i">
          <div class="rule">
            <div class="rule__k">
              <span x-text="ruleLabel(i)"></span>
              <span x-show="can('rule.write') && i < rules.length - 1" style="margin-top:4px;display:flex;align-items:center;gap:6px">
                <input class="inp" style="width:112px;height:27px;text-align:right" type="number" min="0" step="100000"
                       x-model.number="rules[i].max" @change="normalizeRules()"
                       :aria-label="'구간 ' + (i+1) + ' 상한'">
                <span style="font-size:11px;color:var(--ink-3)">원 미만</span>
              </span>
            </div>
            <div class="chain">
              <span>신청자</span>
              <template x-for="k in r.steps" :key="k">
                <span style="display:contents"><i>›</i><span x-text="roles[k].label"></span></span>
              </template>
            </div>
          </div>
        </template>
      </div>

      <h2 style="font-size:15px;font-weight:800;margin:22px 0 9px">예외</h2>
      <div class="card">
        <div class="rule">
          <div class="rule__k">접대비<span>금액과 상관없이</span></div>
          <div class="chain">
            <span>신청자</span><i>›</i><span>팀장</span><i>›</i><span>경영지원</span><i>›</i><span>대표</span>
          </div>
        </div>
        <div class="rule">
          <div class="rule__k">본인 결재 금지<span>결재선에 자기가 있으면</span></div>
          <div class="chain">
            <span data-x="true">본인</span><i>건너뛰고 다음 사람에게</i>
          </div>
        </div>
      </div>

      <div class="note" style="margin-top:14px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>

          <div class="note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
            <div>실제 이관에서는 <b>지난 3년치</b> 를 한 번에 받습니다. 파일마다 열 이름이 다르고 중간에 양식이 바뀌어 있어서,
              이 세 단계를 파일 수만큼 반복하게 됩니다. 그래서 매핑을 저장해 두고 다음 파일에 다시 씁니다.</div>
          </div>
        </div>

      <template x-if="imp.step===2">

                        <option value="team">부서</option>

                      </select>

                </template>
              </tbody>
            </table>
          </div>

          <div class="note note--warn" x-show="!mapOk">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4.5M12 17h.01"/><path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>

          <div style="display:flex;gap:8px">
            <button class="btn btn--pri btn--lg" @click="runCheck()" :disabled="!mapOk">검사하기</button>
            <button class="btn btn--lg" @click="imp.step=1">뒤로</button>
          </div>
        </div>
      </template>

      <template x-if="imp.step===3">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="chk">

          <div class="card" style="overflow:hidden">
            <table class="bad">
              <thead><tr><th style="width:64px">행</th><th style="width:130px">열</th><th style="width:190px">값</th><th>왜 걸렸나</th></tr></thead>
              <tbody>
                <template x-for="b in imp.bad" :key="b.r">
                  <tr>
                    <td class="n" x-text="b.r + '행'"></td>
                    <td x-text="b.c"></td>
                    <td><span class="v" style="padding:2px 6px" x-text="b.v"></span></td>
                    <td class="w" x-text="b.w"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
            <div>고쳐서 넣어 드리지 않습니다. <b>추측해서 채운 값</b> 이 나중에 숫자를 틀리게 만들기 때문입니다.
              걸린 행만 따로 내려받아 고친 뒤 다시 올리시면 됩니다.</div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn--pri btn--lg" @click="doImport()" :disabled="imp.done"
                    x-text="imp.done ? '가져왔습니다' : ((imp.rows - imp.bad.length) + '행 가져오기')"></button>
            <button class="btn btn--lg" @click="toast('걸린 ' + imp.bad.length + '행만 담은 엑셀을 내려받습니다 (데모에서는 만들지 않습니다)')">

        </div>
      </template>
    </div>
  </template>

  <!-- ============================================================

  <template x-if="view==='before'">
    <div>
      <div class="hd"><h1>옮기기 전</h1><p>새 기능을 넣기 전에 지금 어떻게 일하는지부터 적었습니다</p></div>

      <div class="ba">
        <div class="ba__c" data-k="old">
          <div class="ba__h">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>

          </div>

            <div class="ba__s"><i>3</i><div><b>"ㅇㅋ" 가 결재다</b>
              <span>승인 시각도, 승인한 사람도 기록이 아니라 대화다. 반려 사유는 말로 하고 사라진다.</span></div></div>

          </div>
        </div>

        <div class="ba__c" data-k="new">
          <div class="ba__h">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
            옮긴 뒤 (STAMP)
          </div>
          <div class="ba__b">
            <div class="ba__s"><i>1</i><div><b>양식이 화면이다</b>
              <span>찾을 파일이 없다. 계정을 고르면 필요한 칸만 남는다.</span></div></div>
            <div class="ba__s"><i>2</i><div><b>결재선은 금액이 정한다</b>
              <span>사람이 고르지 않는다. 300만원을 넘기면 대표가 자동으로 붙는다. 빼려면 규칙을 바꿔야 한다.</span></div></div>
            <div class="ba__s"><i>3</i><div><b>승인이 상태다</b>
              <span>누가 언제 눌렀는지가 문서에 남는다. 반려는 사유 없이는 눌리지 않는다.</span></div></div>

        다 넣으면 아무도 안 씁니다. 두 달 써 보고 정말 필요하면 그때 넣습니다.

      <div class="card" style="padding:4px 14px">
        <div class="cut">
          <div><b>전자세금계산서 연동</b><span>국세청 연동은 계정 발급부터 오래 걸립니다. 먼저 결재가 돌아가는지부터 봅니다.</span></div>
          <div><b>모바일 앱</b><span>현장에서 올릴 일이 드뭅니다. 웹을 휴대폰 크기에 맞추는 것으로 먼저 갑니다.</span></div>
          <div><b>부서별 예산 대비 집행률</b><span>예산 자체가 엑셀에 있습니다. 지출이 쌓이기 전에는 볼 것이 없습니다.</span></div>
          <div><b>결재선 직접 지정</b><span>넣는 순간 규칙이 무의미해집니다. 예외가 정말 필요하면 규칙에 조건으로 넣습니다.</span></div>
          <div><b>메신저 알림</b><span>먼저 메일로 보냅니다. 사내 메신저를 무엇으로 쓸지 아직 안 정해졌습니다.</span></div>

<template x-if="ask">
  <div>
    <button class="scrim" @click="ask=null" aria-label="닫기"></button>
    <div class="modal" role="dialog" aria-modal="true">

      <template x-if="ask.k==='reject'">
        <div>
          <h3>반려합니다</h3>
          <p>사유는 신청자에게 그대로 보입니다. 비워 두면 반려할 수 없습니다.</p>
          <div class="fld" style="margin-top:14px">
            <label for="rj">반려 사유</label>
            <textarea id="rj" x-model="rejMemo" placeholder="영수증이 빠졌습니다. 카드 전표 첨부해서 다시 올려 주세요."></textarea>
          </div>
          <div class="modal__f">
            <button class="btn" @click="ask=null">취소</button>
            <button class="btn btn--no" @click="reject()" :disabled="!rejMemo.trim()">반려</button>
          </div>
        </div>
      </template>

      <template x-if="ask.k==='recall'">
        <div>
          <h3>문서를 회수합니다</h3>
          <p>아직 아무도 결재하지 않은 문서만 회수할 수 있습니다. 회수하면 임시저장으로 돌아가고, 회수한 사실은 기록에 남습니다.</p>
          <div class="modal__f">
            <button class="btn" @click="ask=null">취소</button>
            <button class="btn btn--pri" @click="recall()">회수</button>
          </div>
        </div>
      </template>

      <template x-if="ask.k==='bulk'">
        <div>
          <h3 x-text="'선택한 ' + sel.length + '건을 승인합니다'"></h3>
          <p>지금 내 차례인 것만 승인됩니다. 나머지는 왜 안 되는지 아래에 적었습니다.</p>
          <div class="modal__l">
            <template x-for="b in bulkPlan" :key="b.id">
              <div>
                <i :data-t="b.ok ? 'ok' : 'no'" x-text="b.ok ? '승인' : '안 됨'"></i>
                <b class="mono" style="font-size:11.5px" x-text="b.id"></b>
                <b x-text="b.title"></b>
                <span x-text="b.why"></span>
              </div>
            </template>
          </div>
          <div class="modal__f">
            <button class="btn" @click="ask=null">취소</button>
            <button class="btn btn--ok" @click="bulkApprove()" :disabled="!bulkPlan.filter(b => b.ok).length"
                    x-text="bulkPlan.filter(b => b.ok).length + '건 승인'"></button>
          </div>
        </div>
      </template>

    </div>
  </div>
</template>

<div class="toast" x-show="msgOn" x-transition x-text="msg"></div>
</div>

<script>
/* ============================================================
   STAMP — 상태와 동작
   서버가 없으므로 모든 것이 이 안에서 돈다.

   두 가지가 이 데모의 뼈대다.
   1) 권한은 화면을 숨기는 것이 아니라 동작을 막는 것이다. 그래서
      can() 하나로 메뉴 · 선택칸 · 단추 · 일괄 처리가 모두 결정된다.
   2) 결재선은 사람이 고르지 않는다. 금액과 계정이 정하고,
      상신하는 순간 문서에 새겨진다. 규칙을 나중에 바꿔도 옛 문서는 그대로다.
   ============================================================ */
function p2(n){ return n < 10 ? "0" + n : "" + n; }
function isoOf(d){ return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }

        mk("EXP-2026-0141", 5, "가을 산업전 부스 임차료", "지급수수료", "2026-08-25",
           [{d:"2026-08-25", n:"코엑스 전시사업부", a:4400000, m:"3부스 · 3일"}],
           [{i:0, s:"ok", t:"2026-08-25 16:40"}],
           {att:["임차계약서.pdf", "견적서_코엑스.pdf"]}),

        mk("EXP-2026-0140", 6, "창고 지게차 정기점검", "수선비", "2026-08-24",
           [{d:"2026-08-24", n:"대한중장비", a:264000, m:"2호기 반기 점검"}],
           [{i:0, s:"ok", t:"2026-08-24 11:02"}]),

        mk("EXP-2026-0139", 1, "영업용 차량 주유", "차량유지비", "2026-08-27",
           [{d:"2026-08-20", n:"SK 연희주유소", a:94200, m:""},
            {d:"2026-08-26", n:"GS 홍은주유소", a:93200, m:""}],
           []),

        mk("EXP-2026-0138", 5, "고객사 명절 선물", "접대비", "2026-08-20",
           [{d:"2026-08-19", n:"한우담 선물세트", a:1320000, m:"거래처 12곳"}],
           [{i:0, s:"ok", t:"2026-08-20 13:22"}, {i:1, s:"ok", t:"2026-08-21 09:05"}]),

        mk("EXP-2026-0137", 6, "지게차 배터리 교체", "수선비", "2026-08-18",

           [{i:0, s:"ok", t:"2026-08-18 15:31"},
            {i:1, s:"no", t:"2026-08-19 10:12", memo:"견적서가 한 곳뿐입니다. 두 곳 더 받아서 다시 올려 주세요."}]),

        mk("EXP-2026-0136", 2, "영업2팀 8월 회식", "복리후생비", "2026-08-14",
           [{d:"2026-08-13", n:"청기와숯불", a:640000, m:"팀원 8인"}],
           [{i:1, s:"ok", t:"2026-08-14 17:20"}],
           {paid:true, paidAt:"2026-08-20 10:00"}),

        mk("EXP-2026-0135", 1, "사무용품 구매", "소모품비", "2026-08-11",
           [{d:"2026-08-11", n:"오피스넥스", a:96000, m:"토너 · A4 · 파일철"}],
           [{i:0, s:"ok", t:"2026-08-11 14:08"}],
           {paid:true, paidAt:"2026-08-20 10:00"}),

        mk("EXP-2026-0134", 3, "4대보험 정산 수수료", "지급수수료", "2026-08-08",
           [{d:"2026-08-08", n:"노무법인 한결", a:220000, m:"7월분 정산"}],
           [])
      ];

      /* 감사 로그는 문서 이력에서 거꾸로 만든다 */
      var ips = {1:"10.0.2.14", 2:"10.0.2.31", 3:"10.0.1.7", 4:"10.0.1.2", 5:"10.0.2.19", 6:"10.0.4.6", 7:"10.0.2.30", 8:"10.0.4.2"};
      var rows = [];
      this.docs.forEach(function(d){
        if(d.draft) return;
        var okN = 0, okTotal = d.line.filter(function(x){ return x.state !== "skip"; }).length;
        d.hist.forEach(function(h){
          var u = self.users.filter(function(x){ return x.name === h.who; })[0], detail;
          if(h.k === "up"){
            detail = "결재선 " + self.chainText(d.line) + " 로 상신";
          }else if(h.k === "ok"){
            okN++;
            detail = (okN === okTotal)
              ? "마지막 결재 — 상태 <code>진행</code> → <code>승인</code>"
              : "단계 " + okN + "/" + okTotal + " · 상태 <code>" + (okN === 1 ? "대기" : "진행") + "</code> → <code>진행</code>";
          }else if(h.k === "no"){
            detail = "사유: " + (h.memo || "");

            detail = "상태 <code>승인</code> → <code>지급완료</code> · " + self.won(self.sum(d.items));

            k:(h.k === "up" ? "run" : (h.k === "ok" ? "ok" : (h.k === "no" ? "no" : "pay"))),

    /* ============================================================
       셈
       ============================================================ */
    can(p){ if(!p) return true; return this.roles[this.me.role].perms.indexOf(p) >= 0; },
    userOf(id){ return this.users.filter(function(u){ return u.id === id; })[0] || null; },
    userName(id){ var u = this.userOf(id); return u ? u.name : "—"; },
    userTeam(id){ var u = this.userOf(id); return u ? u.team : ""; },
    managerOf(team){ return this.users.filter(function(u){ return u.role === "manager" && u.team === team; })[0] || null; },
    userByRole(r){ return this.users.filter(function(u){ return u.role === r; })[0] || null; },
    sum(items){ return items.reduce(function(a, i){ return a + (+i.a || 0); }, 0); },
    total(d){ return this.sum(d.items); },
    won(n){ return "₩" + (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); },

    /* --- 결재선 --- */
    lineRoles(amount, cat){
      if(cat === "접대비") return ["manager", "finance", "ceo"];
      for(var i = 0; i < this.rules.length; i++){
        var r = this.rules[i];
        if(r.max == null || amount < r.max) return r.steps.slice();
      }
      return this.rules[this.rules.length - 1].steps.slice();
    },
    buildLine(ownerId, amount, cat){
      var owner = this.userOf(ownerId), self = this, out = [];
      this.lineRoles(amount, cat).forEach(function(k){
        var u = (k === "manager") ? self.managerOf(owner.team) : self.userByRole(k);
        if(!u) return;                                  /* 그 자리에 사람이 없으면 단계가 빠진다 */
        out.push({ role:k, user:u.id, state:(u.id === ownerId ? "skip" : "wait"), at:null, memo:"" });
      });
      /* 남는 결재자가 없으면 대표가 본다 */
      if(!out.filter(function(s){ return s.state === "wait"; }).length){
        var ceo = this.userByRole("ceo");
        if(ceo && ceo.id !== ownerId && !out.filter(function(s){ return s.user === ceo.id; }).length){
          out.push({ role:"ceo", user:ceo.id, state:"wait", at:null, memo:"" });
        }
      }
      return out;
    },
    chainText(line){
      var self = this;
      return line.map(function(s){ return self.userName(s.user); }).join(" › ");
    },
    turnIndex(d){
      if(d.draft) return -1;
      for(var i = 0; i < d.line.length; i++){
        if(d.line[i].state === "no") return -1;
        if(d.line[i].state === "wait") return i;
      }
      return -1;
    },
    isMyTurn(d){
      var i = this.turnIndex(d);
      return i >= 0 && d.line[i].user === this.me.id && this.can("doc.approve");
    },
    isApproved(d){
      if(d.draft) return false;
      return !d.line.filter(function(s){ return s.state === "wait" || s.state === "no"; }).length;
    },
    stateOf(d){
      if(d.draft) return { k:"draft", t:"임시저장" };
      if(d.line.filter(function(s){ return s.state === "no"; }).length) return { k:"no", t:"반려" };
      if(d.paid) return { k:"pay", t:"지급완료" };
      if(this.isApproved(d)) return { k:"ok", t:"승인" };
      if(d.line.filter(function(s){ return s.state === "ok"; }).length) return { k:"run", t:"진행 중" };
      return { k:"wait", t:"결재 대기" };
    },
    dots(d){
      return d.line.map(function(s){
        var c = s.state === "ok" ? "#1E7A4C" : (s.state === "no" ? "#BE3A31" : "#D2CEC3");
        var fill = (s.state === "ok" || s.state === "no") ? c : "transparent";
        var o = s.state === "skip" ? ";opacity:.4" : "";
        return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 2px;'
             + 'background:' + fill + ';box-shadow:inset 0 0 0 1.5px ' + c + o + '"></span>';
      }).join("");
    },
    lineWhy(d){ return this.lineWhyFor(this.total(d), d.cat, d.line); },
    lineWhyFor(amount, cat, line){
      var head;
      if(cat === "접대비") head = "접대비는 금액과 상관없이 대표까지 갑니다.";
      else{
        var i = 0;
        for(; i < this.rules.length; i++){ if(this.rules[i].max == null || amount < this.rules[i].max) break; }
        head = this.won(amount) + " — " + this.ruleLabel(i) + " 구간입니다.";
      }
      var skipped = (line || []).filter(function(s){ return s.state === "skip"; });
      if(skipped.length) head += " 본인이 결재선에 있어 그 단계는 건너뜁니다.";
      return head;
    },
    ruleLabel(i){
      var lo = i === 0 ? 0 : this.rules[i - 1].max;
      var hi = this.rules[i].max;
      if(hi == null) return this.won(lo) + " 이상";
      if(!lo) return this.won(hi) + " 미만";
      return this.won(lo) + " 이상 " + this.won(hi) + " 미만";
    },
    normalizeRules(){
      for(var i = 1; i < this.rules.length - 1; i++){
        if(this.rules[i].max <= this.rules[i - 1].max) this.rules[i].max = this.rules[i - 1].max + 100000;
      }
      this.log("규칙 변경", "구간 상한을 고쳤습니다 · " + this.rules.map(function(r){ return r.max == null ? "이상" : r.max; }).join(" / "), "wait", "");
      this.toast("규칙을 바꿨습니다. 이미 올라간 문서는 그대로입니다");
    },

    /* --- 목록 --- */
    get mineDocs(){ var m = this.me.id; return this.docs.filter(function(d){ return d.owner === m; }); },
    get myTurnDocs(){ var self = this; return this.docs.filter(function(d){ return self.isMyTurn(d); }); },
    get scopeDocs(){
      var self = this;
      if(this.can("doc.readAll")) return this.docs.slice();
      if(this.can("doc.readTeam")){
        return this.docs.filter(function(d){ return self.userTeam(d.owner) === self.me.team || d.owner === self.me.id; });
      }
      return this.mineDocs;
    },
    get listed(){
      var base = this.box === "turn" ? this.myTurnDocs : (this.box === "mine" ? this.mineDocs : this.scopeDocs);
      var q = this.q.trim().toLowerCase(), self = this;
      return base.filter(function(d){
        if(q && (d.id + " " + d.title + " " + self.userName(d.owner)).toLowerCase().indexOf(q) < 0) return false;
        if(self.fState && self.stateOf(d).k !== self.fState) return false;
        if(self.fCat && d.cat !== self.fCat) return false;
        return true;
      }).sort(function(a, b){ return a.at < b.at ? 1 : -1; });
    },
    get emptyText(){
      if(this.q || this.fState || this.fCat) return "조건에 맞는 문서가 없습니다.";
      if(this.box === "turn") return this.can("doc.approve")
        ? "지금 결재할 문서가 없습니다."
        : roleNoApprove(this.roles[this.me.role].label);
      if(this.box === "mine") return "올린 문서가 없습니다. 위의 [지출결의 올리기] 로 하나 만들어 보세요.";
      return "볼 수 있는 문서가 없습니다.";
    },
    get canBulk(){ return this.can("doc.bulk") && this.box !== "mine"; },
    get allSel(){ return this.listed.length > 0 && this.sel.length === this.listed.length; },
    turnCount(u){
      var self = this, n = 0;
      if(this.roles[u.role].perms.indexOf("doc.approve") < 0) return 0;
      this.docs.forEach(function(d){
        var i = self.turnIndex(d);
        if(i >= 0 && d.line[i].user === u.id) n++;
      });
      return n;
    },

    /* --- 새 문서 --- */
    get ndTotal(){ return this.sum(this.nd.items); },
    get ndLine(){ return this.buildLine(this.me.id, this.ndTotal, this.nd.cat); },

    /* --- 이관 --- */
    get mapOk(){
      var need = ["date", "vendor", "amount"], got = this.imp.cols.map(function(c){ return c.to; });
      return need.every(function(k){ return got.indexOf(k) >= 0; });
    },
    get auditList(){
      var f = this.fAct;
      return f ? this.audit.filter(function(a){ return a.act === f; }) : this.audit;
    },

    /* ============================================================
       동작
       ============================================================ */
    toast(m){ this.msg = m; this.msgOn = true; clearTimeout(this._mt); this._mt = setTimeout(() => { this.msgOn = false; }, 3000); },
    log(act, detail, k, doc){
      var d = new Date();
      this.audit.unshift({
        id:++this.seq, t:isoOf(d) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()),
        who:this.me.name, act:act, k:k || "run", doc:doc || "", detail:detail,
        ip:"10.0.9." + (this.me.id + 10)
      });
    },
    stampNow(){ var d = new Date(); return isoOf(d) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); },
    closeAll(){ this.ask = null; this.whoOpen = false; },

    setMe(u){
      this.me = u; this.whoOpen = false; this.sel = [];
      if(!this.can("doc.approve")) this.box = "mine";
      else if(this.box === "mine") this.box = "turn";
      var v = this.view, self = this;
      var m = this.menu.filter(function(x){ return x.id === v; })[0];
      if(m && !this.can(m.perm)) this.view = "inbox";
      if(this.view === "doc" && this.cur && !this.canSee(this.cur)){
        this.view = "inbox"; this.cur = null;
        this.toast(u.name + " 은(는) 그 문서를 볼 수 없어 결재함으로 돌아왔습니다");
        return;
      }
      this.toast(u.name + " (" + this.roles[u.role].label + ") 으로 봅니다");
    },
    canSee(d){
      if(d.owner === this.me.id) return true;
      if(this.can("doc.readAll")) return true;
      if(this.can("doc.readTeam") && this.userTeam(d.owner) === this.me.team) return true;
      return this.isMyTurn(d);
    },
    go(v){ this.view = v; this.sel = []; if(v !== "doc") this.cur = null; },
    open(d){
      this.cur = d; this.view = "doc";
      if(d.owner !== this.me.id && this.can("doc.readAll") && !this._seen[d.id]){
        this._seen[d.id] = 1;
        this.log("열람", "문서를 열어 봤습니다", "draft", d.id);
      }
    },
    openNew(){
      this.nd = { title:"", cat:"접대비", items:[{ d:this.today, n:"", a:0 }] };
      this.ndErr = ""; this.view = "new";
    },

    /* --- 결재 --- */
    approve(d){
      var i = this.turnIndex(d);
      if(i < 0 || d.line[i].user !== this.me.id) return;
      d.line[i].state = "ok"; d.line[i].at = this.stampNow();
      d.hist.push({ id:++this.seq, k:"ok", who:this.me.name, act:"승인", t:this.stampNow(), memo:"" });
      this.log("승인", this.isApproved(d) ? "마지막 결재 — 상태 <code>진행</code> → <code>승인</code>"
                                          : "상태 <code>대기</code> → <code>진행</code>", "ok", d.id);
      this.toast(this.isApproved(d) ? d.id + " 결재가 끝났습니다" : d.id + " 를 승인했습니다");
    },
    openReject(d){ this.rejMemo = ""; this.ask = { k:"reject" }; },
    reject(){
      var d = this.cur, i = this.turnIndex(d);
      if(i < 0) return;
      d.line[i].state = "no"; d.line[i].at = this.stampNow(); d.line[i].memo = this.rejMemo.trim();
      d.hist.push({ id:++this.seq, k:"no", who:this.me.name, act:"반려", t:this.stampNow(), memo:this.rejMemo.trim() });
      this.log("반려", "사유: " + this.rejMemo.trim(), "no", d.id);
      this.ask = null;
      this.toast(d.id + " 를 반려했습니다");
    },
    canRecall(d){
      if(!d || d.owner !== this.me.id || d.draft || d.paid) return false;
      return !d.line.filter(function(s){ return s.state === "ok" || s.state === "no"; }).length;
    },
    recall(){
      var d = this.cur;
      d.draft = true;
      d.line.forEach(function(s){ if(s.state === "ok") { s.state = "wait"; s.at = null; } });
      d.hist.push({ id:++this.seq, k:"wait", who:this.me.name, act:"회수", t:this.stampNow(), memo:"" });
      this.log("회수", "상태 <code>대기</code> → <code>임시저장</code>", "wait", d.id);
      this.ask = null;
      this.toast("회수했습니다. 고쳐서 다시 올릴 수 있습니다");
    },
    canPay(d){ return !!d && this.can("doc.pay") && this.isApproved(d) && !d.paid && !d.draft; },
    pay(d){
      d.paid = true;
      d.hist.push({ id:++this.seq, k:"pay", who:this.me.name, act:"지급 처리", t:this.stampNow(), memo:"" });
      this.log("지급", "상태 <code>승인</code> → <code>지급완료</code> · " + this.won(this.total(d)), "pay", d.id);
      this.toast(this.won(this.total(d)) + " 을 지급 처리했습니다");
    },
    resubmit(d){
      d.draft = false;
      d.hist.push({ id:++this.seq, k:"up", who:this.me.name, act:"상신", t:this.stampNow(), memo:"" });
      this.log("상신", "결재선 " + this.chainText(d.line) + " 로 상신", "run", d.id);
      this.toast(d.id + " 을 상신했습니다");
    },
    whyNothing(d){
      if(!this.can("doc.approve")) return "결재 권한이 없습니다. 올라간 뒤의 진행 상황만 볼 수 있습니다.";
      if(d.draft) return "임시저장 상태입니다. 올린 사람만 상신할 수 있습니다.";
      var st = this.stateOf(d);
      if(st.k === "no") return "반려된 문서입니다. 되돌릴 수 없고, 고쳐서 새로 올려야 합니다.";
      if(st.k === "pay") return "지급까지 끝난 문서입니다.";
      if(st.k === "ok") return "결재가 끝났습니다. 지급 처리는 경영지원이 합니다.";
      var i = this.turnIndex(d);
      if(i >= 0){
        var s = d.line[i];
        if(s.user === this.me.id) return "";
        return "지금은 " + this.userName(s.user) + " (" + this.roles[s.role].label + ") 차례입니다.";
      }
      return "지금 할 수 있는 것이 없습니다.";
    },

    /* --- 선택과 일괄 --- */
    pick(id){ var i = this.sel.indexOf(id); if(i >= 0) this.sel.splice(i, 1); else this.sel.push(id); },
    toggleAll(){ this.sel = this.allSel ? [] : this.listed.map(function(d){ return d.id; }); },
    askBulk(){ this.ask = { k:"bulk" }; },
    get bulkPlan(){
      var self = this;
      return this.sel.map(function(id){
        var d = self.docs.filter(function(x){ return x.id === id; })[0];
        if(!d) return { id:id, title:"", ok:false, why:"없는 문서" };
        var st = self.stateOf(d), row = { id:d.id, title:d.title, ok:false, why:"" };
        if(d.draft){ row.why = "아직 상신되지 않았습니다"; return row; }
        if(st.k === "no"){ row.why = "이미 반려된 문서입니다"; return row; }
        if(st.k === "ok" || st.k === "pay"){ row.why = "이미 결재가 끝났습니다"; return row; }
        if(d.owner === self.me.id){ row.why = "본인 문서는 결재할 수 없습니다"; return row; }
        var i = self.turnIndex(d);
        if(i < 0 || d.line[i].user !== self.me.id){
          row.why = "아직 " + self.userName(d.line[Math.max(0, i)].user) + " 차례입니다";
          return row;
        }
        row.ok = true; row.why = self.won(self.total(d));
        return row;
      });
    },
    bulkApprove(){
      var self = this, done = 0;
      this.bulkPlan.forEach(function(b){
        if(!b.ok) return;
        var d = self.docs.filter(function(x){ return x.id === b.id; })[0];
        self.approve(d); done++;
      });
      this.ask = null; this.sel = [];
      this.toast(done + "건을 승인했습니다");
    },

    /* --- 상신 --- */
    submit(){
      this.ndErr = "";
      if(!this.nd.title.trim()){ this.ndErr = "제목을 적어 주세요."; return; }
      var items = this.nd.items.filter(function(i){ return i.n && +i.a > 0; });
      if(!items.length){ this.ndErr = "사용처와 금액이 있는 줄이 한 줄은 있어야 합니다."; return; }
      var d = this.makeDoc(items, false);
      this.log("상신", "결재선 " + this.chainText(d.line) + " 로 상신 · " + this.won(this.total(d)), "run", d.id);
      this.open(d);
      this.toast(d.id + " 을 상신했습니다");
    },
    saveDraft(){
      this.ndErr = "";
      if(!this.nd.title.trim()){ this.ndErr = "제목을 적어 주세요."; return; }
      var d = this.makeDoc(this.nd.items.slice(), true);
      this.open(d);
      this.toast("임시저장했습니다");
    },
    makeDoc(items, draft){
      var id = "EXP-2026-0" + (this.nextNo++);
      var d = {
        id:id, owner:this.me.id, title:this.nd.title.trim(), cat:this.nd.cat,
        at:this.today, items:items.map(function(i){ return { d:i.d, n:i.n, a:+i.a || 0, m:"" }; }),
        draft:!!draft, paid:false, att:[], line:[], hist:[]
      };
      d.line = this.buildLine(this.me.id, this.sum(d.items), d.cat);
      d.hist.push({ id:++this.seq, k:"up", who:this.me.name, act:(draft ? "임시저장" : "상신"), t:this.stampNow(), memo:"" });
      this.docs.unshift(d);
      return d;
    },

    /* --- 엑셀 이관 --- */
    runCheck(){
      this.imp.bad = [
        {r:14,  c:"금액(원)", v:"1,250,000원",  w:"숫자 뒤에 글자가 붙어 있습니다"},
        {r:27,  c:"일자",     v:"8/3",          w:"연도가 없습니다"},
        {r:33,  c:"일자",     v:"2026.08.05",   w:"같은 열에 형식이 세 가지 섞여 있습니다"},
        {r:41,  c:"일자",     v:"05-08-2026",   w:"일과 월 중 무엇이 먼저인지 알 수 없습니다"},
        {r:58,  c:"팀",       v:"영업2",        w:"없는 부서입니다 (영업2팀 인가요?)"},
        {r:71,  c:"금액(원)", v:"(빈 칸)",      w:"꼭 있어야 하는 값입니다"},
        {r:92,  c:"사용처",   v:"(빈 칸)",      w:"꼭 있어야 하는 값입니다"},
        {r:103, c:"전체",     v:"104행과 같음",  w:"같은 내용이 두 번 들어 있습니다"},
        {r:117, c:"금액(원)", v:"-40,000",      w:"음수입니다. 환불이면 따로 표시해야 합니다"}
      ];
      this.imp.step = 3;
      this.log("이관", "검사 결과 " + (this.imp.rows - this.imp.bad.length) + "행 통과 · " + this.imp.bad.length + "행 보류", "run", "");
    },
    doImport(){
      this.imp.done = true;
      var n = this.imp.rows - this.imp.bad.length;
      this.log("이관", "<code>" + this.imp.file + "</code> 에서 " + n + "행을 지출 내역으로 가져왔습니다", "run", "");
      this.toast(n + "행을 가져왔습니다. 걸린 " + this.imp.bad.length + "행은 그대로 두었습니다");
    }
  };
}
function roleNoApprove(label){
  return label + " 은(는) 결재 권한이 없습니다.\n오른쪽 위에서 팀장이나 경영지원으로 바꿔 보세요.";
}
