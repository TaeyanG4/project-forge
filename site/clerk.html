/* ============================================================
   CLERK — 한결세무회계 매입 증빙 분류 에이전트
   반복 업무 에이전트 데모.

   색을 두 갈래로 나눴다. 주황은 에이전트가 한 일, 남색은 사람이 한 일.
   화면 어디를 봐도 누가 결정했는지 구분되게 하려는 것이다.

   하고 싶은 말 세 가지.
   1) 다 맡기지 않는다. 업무를 조각내고 조각마다 따로 정한다.
   2) 자동으로 넘길 기준을 숫자로 못박고, 그 기준을 올리면
      사람 손이 얼마나 줄고 틀린 게 얼마나 새는지 같이 보여준다.
   3) 사람이 고친 것은 그냥 고치고 끝내지 않는다. 어디로 가는지까지 만든다.
   ============================================================ */
:root{
  --bg:#F3F2EF;
  --panel:#FFFFFF;
  --panel-2:#FAF9F6;
  --panel-3:#EFEDE8;
  --line:#E3E0D9;
  --line-2:#CDC8BE;

  --ink:#17161A;
  --ink-2:#565350;
  --ink-3:#8B8681;

  --bot:#C2571F;   --bot-soft:#FBEEE5;   /* 에이전트가 한 것 */
  --you:#1F3A6E;   --you-soft:#E8EDF7;   /* 사람이 한 것 */
  --ok:#2E7D52;    --ok-soft:#E4F1EA;
  --warn:#9A6B08;  --warn-soft:#FAF0DA;
  --bad:#B3261E;   --bad-soft:#FBE8E6;

  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;}

html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.65;letter-spacing:-.013em;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
[x-cloak]{display:none !important;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.35;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--bot);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.04em;}

/* ---------- 조각 ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:33px;padding:0 13px;border-radius:7px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:-.016em;line-height:1;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  transition:background .14s,border-color .14s,color .14s;
}
.b:hover{background:var(--panel-2);border-color:var(--ink-3);}
.b--y{background:var(--you);border-color:var(--you);color:#fff;font-weight:700;}
.b--y:hover{background:#2A4A85;border-color:#2A4A85;}
.b--o{background:var(--bot);border-color:var(--bot);color:#fff;font-weight:700;}
.b--o:hover{background:#D66528;border-color:#D66528;}
.b--g{background:transparent;border-color:transparent;color:var(--ink-2);}
.b--g:hover{background:var(--panel-3);color:var(--ink);}
.b--sm{height:28px;padding:0 10px;font-size:12px;}
.b[disabled]{opacity:.4;cursor:not-allowed;}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--panel-3);color:var(--ink-2);
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill--bot{background:var(--bot-soft);color:var(--bot);}
.pill--you{background:var(--you-soft);color:var(--you);}
.pill--ok{background:var(--ok-soft);color:var(--ok);}
.pill--warn{background:var(--warn-soft);color:var(--warn);}
.pill--bad{background:var(--bad-soft);color:var(--bad);}
.pill--idle{background:var(--panel-3);color:var(--ink-3);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;}
.note{
  display:flex;gap:10px;padding:13px 15px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.75;
}
.note svg{flex:none;margin-top:3px;color:var(--ink-3);}
.note b{color:var(--ink);}
.note--bot{background:var(--bot-soft);border-color:#EFCDBB;}
.note--bot svg{color:var(--bot);}
.note--you{background:var(--you-soft);border-color:#BFCDE7;}
.note--you svg{color:var(--you);}
.note--warn{background:var(--warn-soft);border-color:#E9D4A2;}
.note--warn svg{color:var(--warn);}
.note--bad{background:var(--bad-soft);border-color:#EFC5C1;}
.note--bad svg{color:var(--bad);}
.note--ok{background:var(--ok-soft);border-color:#B9DCC8;}
.note--ok svg{color:var(--ok);}

/* ============================================================
   틀
   ============================================================ */
.app{display:flex;flex-direction:column;min-height:100dvh;}
.demo{
  flex:none;display:flex;align-items:center;gap:9px;padding:8px 20px;
  background:var(--ink);color:#B9B4AE;font-size:12px;font-weight:600;
}
.demo b{color:#fff;}
.demo .sp{flex:1;}
.demo a{color:#B9B4AE;text-decoration:underline;text-underline-offset:2px;}
.demo a:hover{color:#F0A277;}
@media (max-width:760px){.demo span.hideS{display:none;}}

.top{
  flex:none;display:flex;align-items:center;gap:13px;height:54px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.mk{display:flex;align-items:center;gap:9px;flex:none;}
.mk__i{
  width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--bot);color:#fff;
}
.mk__t{font-size:15.5px;font-weight:800;letter-spacing:-.05em;}

      <div x-show="gate >= 95">

        나머지 <b x-text="humanN + '건'"></b> 은 사람이 봅니다. <b>안전하지만, 이 정도면 자동화를 한 이유가 줄어듭니다.</b>

        <b x-text="humanN + '건'"></b> 을 사람에게 올립니다. 새어 나갈 오류는 <b x-text="errN.toFixed(1) + '건'"></b> 입니다.
        <b>이 숫자를 모른 채 자동화율만 올리는 것이 사고의 시작입니다.</b>

        기준을 <b x-text="gate + '%'"></b> 까지 내렸습니다. 사람 손은 줄지만 <b x-text="errN.toFixed(1) + '건'"></b> 이
        확인 없이 장부로 넘어갑니다. <b>부가세 신고에서 걸리면 가산세는 사무소가 냅니다.</b>

          <template x-for="dc in shown" :key="dc.id">

              <span class="row__i"></span>
              <span class="row__t">
                <b x-text="dc.vendor"></b>
                <span x-text="dc.date + ' · ' + dc.kind"></span>
                <span style="margin-top:4px">
                  <span class="pill" :class="badge(dc).c" x-text="badge(dc).t"></span>
                </span>
              </span>
              <span class="row__r">
                <b x-text="won(dc.total)"></b>

                  <i><s :data-low="dc.conf * 100 < gate" :style="'width:' + Math.round(dc.conf * 100) + '%'"></s></i>

          <b style="color:var(--ink)">기준을 넘지 못한 것은 주황이 아니라 노랑</b>으로 칠해 사람이 볼 것임을 표시합니다.

              <h4><span style="margin:0;font-family:var(--f);color:var(--ink)" x-text="doc && doc.kind"></span>
                <span x-text="doc && doc.no"></span></h4>
              <div :class="doc && doc.failed ? 'blur' : ''">
                <dl>
                  <dt>공급자</dt><dd x-text="doc && doc.vendor"></dd>
                  <dt>사업자번호</dt><dd x-text="doc && doc.biz"></dd>
                  <dt>거래일</dt><dd x-text="doc && doc.date"></dd>
                  <dt>품목</dt><dd x-text="doc && doc.item"></dd>
                  <dt>공급가액</dt><dd x-text="doc && won(doc.supply)"></dd>
                  <dt>부가세</dt><dd x-text="doc && won(doc.vat)"></dd>

                <dl class="tot"><dt>합계</dt><dd x-text="doc && won(doc.total)"></dd></dl>
              </div>
              <p style="text-align:center;margin-top:12px;color:var(--bad);font-weight:700" x-show="doc && doc.failed">
                글자를 읽지 못했습니다</p>
            </div>
            <p style="font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin-bottom:7px">뽑아낸 것</p>
            <div class="fields">
              <template x-for="f in (doc ? doc.fields : [])" :key="f.k">
                <div class="field" :data-low="f.c < 0.9">
                  <span x-text="f.k"></span><b x-text="f.v"></b><u x-text="Math.round(f.c * 100) + '%'"></u>
                </div>
              </template>
            </div>
          </div>

          <!-- 오른쪽: 판단과 결정 -->
          <div>
            <div class="pick" x-show="doc && !doc.failed">
              <div class="pick__h">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/><circle cx="12" cy="12" r="3.4"/></svg>
                <b>에이전트의 제안</b>
                <span class="sp"></span>
                <span class="pill pill--idle mono" x-text="'claude · ' + (doc && doc.ms) + 'ms'"></span>
              </div>
              <div class="pick__m">
                <b x-text="doc && doc.guess"></b>
                <span class="pill" :class="doc && doc.deduct ? 'pill--ok' : 'pill--warn'"
                      x-text="doc && (doc.deduct ? '부가세 공제 가능' : '부가세 불공제')"></span>
                <span class="sp"></span>
                <span class="conf">
                  <i style="width:66px"><s :data-low="doc && doc.conf * 100 < gate" :style="'width:' + Math.round((doc ? doc.conf : 0) * 100) + '%'"></s></i>
                  <b style="font-size:13px" x-text="Math.round((doc ? doc.conf : 0) * 100) + '%'"></b>
                </span>
              </div>
              <div class="bars">
                <template x-for="a in (doc ? doc.alt : [])" :key="a.n">
                  <div class="brow">
                    <span x-text="a.n"></span>
                    <i><s :style="'width:' + Math.round(a.p * 100) + '%'"></s></i>
                    <b x-text="Math.round(a.p * 100) + '%'"></b>
                  </div>
                </template>
              </div>
            </div>

            <div class="why">
              <div class="why__h">왜 이렇게 봤나</div>
              <template x-for="(w, wi) in (doc ? doc.why : [])" :key="wi">
                <div class="wrow">
                  <i :data-t="w.t" x-text="w.t==='rule' ? '규칙' : (w.t==='tool' ? '도구' : (w.t==='past' ? '이력' : '주의'))"></i>
                  <div x-html="w.m"></div>
                </div>
              </template>
            </div>

            <!-- 사람이 결정하는 자리 -->
            <div class="gav" x-show="doc && st(doc)==='wait'">
              <div class="gav__h">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
                <b>여기서부터 사람</b>
                <span class="sp"></span>
                <span class="pill pill--you" x-text="doc && doc.guard ? '기준과 무관하게 사람이 봅니다' : '신뢰도가 기준에 못 미칩니다'"></span>
              </div>
              <div class="gav__b">
                <select class="sel" x-model="edit">
                  <option value="">그대로 승인</option>
                  <template x-for="a in accts" :key="a">
                    <option :value="a" x-text="a + ' 로 바꿔 승인'"></option>
                  </template>
                </select>
                <span class="sp"></span>
                <button class="b b--sm" @click="reject(doc)">거래처에 되묻기</button>
                <button class="b b--y" @click="approve(doc)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
                  <span x-text="edit ? '고쳐서 승인' : '승인'"></span>
                </button>
              </div>
            </div>

            <div class="card done" x-show="doc && st(doc)==='auto'">
              <span class="pill pill--bot"><i></i>자동</span>
              <div>신뢰도가 기준 <b x-text="gate + '%'"></b> 를 넘겨 <b>사람 확인 없이 장부로 넘어갑니다.</b>
                넘어간 뒤에도 되돌릴 수 있고, 그 기록은 남습니다.</div>
            </div>
            <div class="card done" x-show="doc && ['ok','fixed','back'].indexOf(st(doc)) >= 0">
              <span class="pill" :class="doc && st(doc)==='back' ? 'pill--warn' : 'pill--you'"><i></i>
                <span x-text="doc && (st(doc)==='back' ? '되물음' : '사람이 확인')"></span></span>
              <div x-text="doc && doc.msg"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template x-if="view==='flow'">
  <div class="wrap">
    <div class="hd">
      <h2>에이전트가 하는 일</h2>
      <p>증빙 한 장이 장부에 들어가기까지 지나는 일곱 단계</p>
      <span class="sp"></span>
      <span class="pill pill--idle mono">평균 8.4초 · 건당 ₩41</span>
    </div>

    <div class="note note--bot" style="margin-bottom:16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
      <div>모델에게 "알아서 잘 해 줘" 라고 시키지 않습니다. <b>단계를 쪼개고, 단계마다 무엇을 받아 무엇을 내놓을지 못박습니다.</b>
        쪼개 두면 어디서 틀렸는지 알 수 있고, 틀린 단계만 고칠 수 있습니다.
        여섯 번째 단계에서 사람에게 넘길지 말지가 갈립니다.</div>
    </div>

    <div class="steps">
      <div class="step">
        <span class="step__n">1</span>
        <div class="step__c">
          <div class="step__t"><b>받기</b><span class="pill pill--bot">자동</span><span class="sp"></span>
            <span class="pill pill--idle mono">평균 0.3초</span></div>
          <p class="step__d">거래처가 보내는 경로가 세 갈래입니다 — 메일 첨부, 카톡 사진, 사무실 스캐너.
            <b>사람에게 한 곳으로 보내 달라고 하지 않았습니다.</b> 그렇게 부탁하면 결국 안 지켜지고,
            안 지킨 건이 조용히 빠집니다.</p>
          <span class="tool"><i></i>mail.fetch</span><span class="tool"><i></i>kakao.files</span><span class="tool"><i></i>scanner.watch</span>
        </div>
      </div>

      <div class="step">
        <span class="step__n">2</span>
        <div class="step__c">
          <div class="step__t"><b>읽기</b><span class="pill pill--bot">자동</span><span class="sp"></span>
            <span class="pill pill--idle mono">평균 1.9초</span></div>
          <p class="step__d">이미지에서 글자와 표를 뽑습니다. <b>여기서 실패하는 건이 전체의 3.1%</b> 입니다 —
            사진이 흐리거나, 반이 잘렸거나, 영수증이 접혀 있습니다.
            실패하면 모델에게 억지로 추측시키지 않고 그대로 사람에게 올립니다.</p>
          <span class="tool"><i></i>ocr.read</span><span class="tool"><i></i>table.detect</span>
        </div>
      </div>

      <div class="step">
        <span class="step__n">3</span>
        <div class="step__c">
          <div class="step__t"><b>뽑기</b><span class="pill pill--bot">자동</span><span class="sp"></span>
            <span class="pill pill--idle mono">평균 2.2초</span></div>
          <p class="step__d">공급자·사업자번호·일자·금액·품목을 정해진 모양으로 받습니다.
            <b>모델이 아무 모양이나 뱉지 못하게 스키마로 먼저 막습니다.</b>
            그리고 값마다 얼마나 확신하는지를 같이 받습니다 — 이게 없으면 어느 칸을 봐야 할지 모릅니다.</p>
          <div class="code"><div class="code__h"><span class="code__f">extract/schema.ts</span><span class="sp"></span><span class="code__y">구조 강제</span></div><pre class="code__b"><span><i class="c">// extract/schema.ts — 모델이 아무 모양이나 뱉지 못하게 먼저 막는다</i></span><span><i class="k">export</i> <i class="k">const</i> Slip = z.object({</span><span>  kind:     z.<i class="k">enum</i>([<i class="s">&quot;세금계산서&quot;</i>, <i class="s">&quot;카드전표&quot;</i>, <i class="s">&quot;영수증&quot;</i>]),</span><span>  vendor:   z.string().min(<i class="n">1</i>),</span><span>  bizNo:    z.string().regex(/^\d{<i class="n">3</i>}-\d{<i class="n">2</i>}-\d{<i class="n">5</i>}$/),</span><span>  date:     z.string().date(),</span><span>  item:     z.string(),</span><span>  supply:   z.number().int().nonnegative(),</span><span>  vat:      z.number().int().nonnegative(),</span><span>  total:    z.number().int().positive(),</span><span>  <i class="c">// 값마다 얼마나 확신하는지 같이 받는다. 이게 없으면 어디를 봐야 할지 모른다.</i></span><span>  fieldConfidence: z.record(z.number().min(<i class="n">0</i>).max(<i class="n">1</i>)),</span><span>});</span><span>&nbsp;</span><span><i class="c">// 스키마를 못 맞추면 두 번까지 다시 시킨다. 세 번째는 사람에게 올린다.</i></span><span><i class="k">const</i> slip = <i class="k">await</i> callWithSchema(Slip, prompt, { retries: <i class="n">2</i> });</span><span><i class="k">if</i> (!slip.ok) <i class="k">return</i> toHuman(doc, <i class="s">&quot;구조를 못 맞춤: &quot;</i> + slip.error);</span><span>&nbsp;</span><span><i class="c">// 합계가 안 맞으면 모델이 뭐라 하든 사람에게 올린다</i></span><span><i class="k">if</i> (slip.data.supply + slip.data.vat !== slip.data.total) {</span><span>  <i class="k">return</i> toHuman(doc, <i class="s">&quot;공급가액 + 부가세 ≠ 합계&quot;</i>);</span><span>}</span></pre></div>
        </div>
      </div>

      <div class="step">
        <span class="step__n">4</span>
        <div class="step__c">
          <div class="step__t"><b>확인</b><span class="pill pill--bot">자동</span><span class="sp"></span>
            <span class="pill pill--idle mono">평균 0.9초</span></div>
          <p class="step__d">모델에게 묻지 않아도 되는 것은 묻지 않습니다.
            사업자번호가 실재하는지, 휴폐업은 아닌지, 같은 승인번호가 이미 들어와 있는지는
            <b>조회하면 답이 나오는 일</b>입니다. LLM 을 쓸 자리가 아닙니다.</p>
          <span class="tool"><i></i>biz.lookup</span><span class="tool"><i></i>dup.check</span><span class="tool"><i></i>vendor.rules</span>
        </div>
      </div>

      <div class="step">
        <span class="step__n">5</span>
        <div class="step__c">
          <div class="step__t"><b>분류</b><span class="pill pill--bot">자동</span><span class="sp"></span>
            <span class="pill pill--idle mono">평균 3.0초</span></div>
          <p class="step__d">여기가 사람의 판단을 넘기는 자리입니다. 과거에 이 거래처가 같은 공급자를 어떻게 처리했는지
            5건을 찾아 함께 넣습니다. <b>"알아서 판단해" 가 아니라 "이 사무소가 해 온 대로 판단해" 입니다.</b></p>
          <span class="tool"><i></i>history.search</span><span class="tool"><i></i>claude.messages</span>
          <div class="code"><div class="code__h"><span class="code__f">classify.prompt.md</span><span class="sp"></span><span class="code__y">프롬프트</span></div><pre class="code__b"><span><i class="c"># 지시</i></span><span>너는 세무사무소의 매입 증빙을 계정과목으로 분류한다.</span><span>확신이 없으면 억지로 고르지 말고 confidence 를 낮게 매겨라.</span><span>낮게 매긴 건은 사람이 본다. 틀리게 확신하는 것보다 낫다.</span><span>&nbsp;</span><span><i class="c"># 입력</i></span><span>증빙: <i class="s">{{slip}}</i></span><span>거래처가 이 공급자와 예전에 한 거래 5건: <i class="s">{{history}}</i></span><span>사무소가 이 거래처에 적용해 온 <i class="k">규칙</i>: <i class="s">{{rules}}</i></span><span>&nbsp;</span><span><i class="c"># 규칙</i></span><span>- 접대비 / 기업업무추진비로 볼 여지가 있으면 confidence 를 <i class="n">0.8</i> 아래로 둔다.</span><span>- 간이영수증, 면세사업자, 비영업용 승용차 관련은 부가세 불공제로 표시한다.</span><span>- 과거 5건 중 3건 이상이 같은 계정과목이면 그것을 우선한다. 다르면 이유를 적는다.</span><span>- 품목이 여러 개면 금액이 가장 큰 품목으로 판단하고, 나머지를 note 에 남긴다.</span><span>&nbsp;</span><span><i class="c"># 출력</i></span><span>{ &quot;account&quot;: &quot;...&quot;, &quot;confidence&quot;: <i class="n">0.0</i>~<i class="n">1.0</i>, &quot;deductible&quot;: true|false,</span><span>  &quot;alternatives&quot;: [{ &quot;account&quot;: &quot;...&quot;, &quot;p&quot;: <i class="n">0.0</i>~<i class="n">1.0</i> }],</span><span>  &quot;reasons&quot;: [&quot;...&quot;], &quot;note&quot;: &quot;...&quot; }</span></pre></div>
        </div>
      </div>

      <div class="step" data-who="you">
        <span class="step__n">6</span>
        <div class="step__c">
          <div class="step__t"><b>갈림</b><span class="pill pill--you">여기서 사람이 갈립니다</span><span class="sp"></span>
            <span class="pill pill--idle mono">0.0초</span></div>
          <p class="step__d">신뢰도가 기준을 넘고, 가드레일에 하나도 안 걸리면 자동으로 넘어갑니다.
            <b>가드레일은 신뢰도와 무관합니다</b> — 접대비나 100만원 초과는 모델이 99% 확신해도 사람이 봅니다.
            틀렸을 때 드는 비용이 다르기 때문입니다.</p>
          <div class="code"><div class="code__h"><span class="code__f">route.ts</span><span class="sp"></span><span class="code__y">갈림길</span></div><pre class="code__b"><span><i class="c">// route.ts — 자동으로 넘길지 사람에게 올릴지 정하는 곳</i></span><span><i class="k">const</i> GUARDS = [</span><span>  { when: (d) =&gt; d.account === <i class="s">&quot;접대비&quot;</i>,        why: <i class="s">&quot;불공제 판단이 걸려 있음&quot;</i> },</span><span>  { when: (d) =&gt; d.total &gt; <i class="n">1_000_000</i>,           why: <i class="s">&quot;금액이 큼&quot;</i> },</span><span>  { when: (d) =&gt; d.vendorIsNew,                 why: <i class="s">&quot;처음 보는 거래처&quot;</i> },</span><span>  { when: (d) =&gt; d.duplicateOf != <i class="k">null</i>,         why: <i class="s">&quot;중복 의심&quot;</i> },</span><span>  { when: (d) =&gt; !d.deductible,                 why: <i class="s">&quot;부가세 불공제 판단&quot;</i> },</span><span>];</span><span>&nbsp;</span><span><i class="k">export</i> <i class="k">function</i> route(d, gate) {</span><span>  <i class="c">// 신뢰도가 아무리 높아도 이 목록에 걸리면 사람이 본다</i></span><span>  <i class="k">const</i> hit = GUARDS.find((g) =&gt; g.when(d));</span><span>  <i class="k">if</i> (hit) <i class="k">return</i> { to: <i class="s">&quot;human&quot;</i>, why: hit.why, guard: <i class="k">true</i> };</span><span>&nbsp;</span><span>  <i class="k">if</i> (d.confidence * <i class="n">100</i> &lt; gate) <i class="k">return</i> { to: <i class="s">&quot;human&quot;</i>, why: <i class="s">&quot;신뢰도 미달&quot;</i> };</span><span>&nbsp;</span><span>  <i class="k">return</i> { to: <i class="s">&quot;auto&quot;</i> };   <i class="c">// 넘긴 뒤에도 되돌릴 수 있고, 기록은 남는다</i></span><span>}</span></pre></div>
        </div>
      </div>

    st(dc){
      if(dc.done) return dc.done;
      if(dc.failed) return "wait";
      if(dc.guard) return "wait";

    badge(dc){

      if(s === "fixed") return { t:"고쳐서 승인", c:"pill--you" };
      if(s === "back") return { t:"거래처에 되물음", c:"pill--warn" };
      if(dc.failed) return { t:"읽기 실패", c:"pill--bad" };
      if(dc.guard) return { t:dc.guard, c:"pill--warn" };
      if(s === "auto") return { t:"자동 승인", c:"pill--bot" };
      return { t:"신뢰도 미달", c:"pill--warn" };
    },

    get autoN(){ var self = this; return this.docs.filter(function(d){ return self.st(d) === "auto"; }).length; },

    get doneN(){ return this.docs.filter(function(d){ return d.done; }).length; },
    /* 자동으로 넘긴 것들의 (1 − 신뢰도) 를 더하고, 한 달치로 늘려 본다.

    get shown(){
      var self = this;

      if(this.tab === "auto") return this.docs.filter(function(d){ return self.st(d) === "auto"; });
      if(this.tab === "done") return this.docs.filter(function(d){ return d.done; });
      return this.docs;
    },
    get doc(){
      var self = this;

    get scopeN(){

    },

    /* ── 동작 ─────────────────────────────────────────────── */

    toast(m){

    approve(dc){
      if(this.edit && this.edit !== dc.guess){
        var was = dc.guess;
        dc.guess = this.edit;
        dc.done = "fixed";
        dc.msg = "박선주 세무사가 " + was + " → " + this.edit + " 로 고쳐 승인했습니다. "

        this._id += 1;
        this.fixes.unshift({ id:100 + this._id, from:was, to:this.edit,
                             why:dc.vendor + " · 오늘 사람이 고침", act:"규칙" });
        this.toast("고쳐서 승인했습니다 — 수정 내역이 규칙 후보로 넘어갔습니다");
      }else{
        dc.done = "ok";
        dc.msg = "박선주 세무사가 그대로 승인했습니다. 장부에 전기되었고, 근거와 승인자가 함께 남았습니다.";
        this.toast("승인했습니다 · " + dc.vendor + " · " + dc.guess);
      }
      this.edit = "";
      this.nextWaiting(dc.id);
    },
    reject(dc){
      dc.done = "back";
      dc.msg = "거래처에 되물었습니다 — \"이 건이 어떤 자리였는지 알려 주세요\". "
             + "답이 오면 다시 이 목록에 올라옵니다. 봇이 아니라 사람 이름으로 물었습니다.";
      this.edit = "";
      this.toast("거래처에 되물었습니다 — 답이 오면 다시 올라옵니다");
      this.nextWaiting(dc.id);
    }
  };
};
